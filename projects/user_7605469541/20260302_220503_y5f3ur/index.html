
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>نُور | رفيقك القرآني</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg: #0F172A; --surface: #1E293B; --surface-2: #334155;
    --primary: #D4AF37; --accent: #10B981; --text: #F8FAFC; --text-muted: #94A3B8;
    --glass: rgba(30, 41, 59, 0.7); --border: rgba(255,255,255,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Readex Pro', sans-serif; }
body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

.app-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.header { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
.header-info h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
.header-info p { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

.btn-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }

.view-container { flex: 1; overflow-y: auto; padding-bottom: 120px; scroll-behavior: smooth; }
.fade-in { animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.hero-card { margin: 10px 24px 24px; background: linear-gradient(135deg, #D4AF37 0%, #B49025 100%); border-radius: 24px; padding: 24px; color: #000; position: relative; }
.hero-btn { padding: 10px 20px; background: #000; color: #fff; border-radius: 30px; border:none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; }

.grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 24px; margin-bottom: 30px; }
.menu-item { background: var(--surface); padding: 20px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; }
.menu-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 10px; }
.mi-quran .menu-icon { background: rgba(212, 175, 55, 0.15); color: var(--primary); }
.mi-azkar .menu-icon { background: rgba(16, 185, 129, 0.15); color: var(--accent); }
.mi-radio .menu-icon { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
.mi-tasbih .menu-icon { background: rgba(59, 130, 246, 0.15); color: #3B82F6; }

.section-head { padding: 0 24px 15px; display: flex; justify-content: space-between; align-items: center; }
.scroll-h { display: flex; overflow-x: auto; gap: 15px; padding: 0 24px 10px; }
.reciter-pill { min-width: 90px; text-align: center; cursor: pointer; }
.reciter-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--surface-2); margin-bottom: 8px; }

.list-v { padding: 0 24px; display: flex; flex-direction: column; gap: 10px; }
.track-row { display: flex; align-items: center; gap: 15px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 16px; cursor: pointer; }
.track-idx { width: 35px; height: 35px; background: var(--surface); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

.mini-player { position: fixed; bottom: 20px; left: 15px; right: 15px; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 20px; padding: 12px; display: flex; align-items: center; gap: 12px; z-index: 90; transform: translateY(200%); transition: 0.4s; }
.mini-player.show { transform: translateY(0); }
.mp-img { width: 45px; height: 45px; border-radius: 10px; }
.mp-info { flex: 1; overflow: hidden; }
.mp-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--primary); color: #000; cursor: pointer; }

.full-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 100; transform: translateY(100%); transition: 0.4s; display: flex; flex-direction: column; }
.full-overlay.active { transform: translateY(0); }
.fo-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.fo-art-box { width: 250px; height: 250px; border-radius: 50%; border: 5px solid var(--surface-2); margin-bottom: 30px; overflow: hidden; }
.fo-art { width: 100%; height: 100%; object-fit: cover; }
.fo-controls { padding: 40px; }

.azkar-card { background: var(--surface); border-radius: 20px; padding: 20px; margin: 0 24px 15px; text-align: center; border: 1px solid var(--border); }
.azkar-count { display: inline-block; margin-top: 15px; padding: 5px 15px; background: var(--accent); color: #fff; border-radius: 15px; }
.done-zkr { opacity: 0.4; filter: grayscale(1); }

.back-btn { position: absolute; top: 20px; right: 24px; z-index: 60; width: 40px; height: 40px; background: var(--surface); border-radius: 50%; display: none; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div class="app-wrapper">
    <div class="header">
        <div class="header-info">
            <p><i class="fas fa-moon"></i> <span id="hijri">جاري التحميل...</span></p>
            <h1>نُور</h1>
        </div>
        <div class="btn-icon" onclick="toggleSearch()"><i class="fas fa-search"></i></div>
    </div>
    
    <div class="back-btn" id="global-back" onclick="goHome()"><i class="fas fa-arrow-right"></i></div>

    <div class="view-container" id="main-view">
        <div id="v-home" class="fade-in">
            <div class="hero-card">
                <h2>أرح قلبك</h2>
                <p>"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ"</p>
                <button class="hero-btn" onclick="playRandom()"><i class="fas fa-play"></i> تشغيل عشوائي</button>
            </div>

            <div class="grid-menu">
                <div class="menu-item mi-quran" onclick="loadReciters()">
                    <div class="menu-icon"><i class="fas fa-book-open"></i></div>
                    <h3>المصحف</h3>
                </div>
                <div class="menu-item mi-azkar" onclick="loadAzkarCat()">
                    <div class="menu-icon"><i class="fas fa-hands-praying"></i></div>
                    <h3>الأذكار</h3>
                </div>
                <div class="menu-item mi-radio" onclick="loadRadios()">
                    <div class="menu-icon"><i class="fas fa-broadcast-tower"></i></div>
                    <h3>الإذاعة</h3>
                </div>
                <div class="menu-item mi-tasbih" onclick="openTasbih()">
                    <div class="menu-icon"><i class="fas fa-fingerprint"></i></div>
                    <h3>السبحة</h3>
                </div>
            </div>

            <div class="section-head"><h3>قراء مختارون</h3></div>
            <div class="scroll-h" id="top-reciters"></div>
        </div>

        <div id="v-list" class="fade-in" style="display:none">
            <div class="section-head"><h3 id="list-title">القائمة</h3></div>
            <div class="list-v" id="list-container"></div>
        </div>

        <div id="v-azkar" class="fade-in" style="display:none"></div>

        <div id="v-tasbih" class="fade-in" style="display:none; text-align: center; padding-top: 50px;">
            <div style="font-size: 5rem; margin-bottom: 20px;" id="ts-val">0</div>
            <button class="hero-btn" onclick="tsCount()" style="padding: 40px; border-radius: 50%; width: 150px; height: 150px; font-size: 2rem;">اضغط</button>
            <br><br>
            <button onclick="tsReset()" style="color: var(--text-muted); background: none; border: none;">تصفير العداد</button>
        </div>
    </div>
</div>

<div class="mini-player" id="mp" onclick="openFull()">
    <img src="" class="mp-img" id="mp-img">
    <div class="mp-info">
        <div id="mp-t" style="font-size: 0.9rem; font-weight: 600;"></div>
        <div id="mp-a" style="font-size: 0.7rem; color: var(--text-muted);"></div>
    </div>
    <button class="mp-btn" id="mp-btn" onclick="event.stopPropagation(); togglePlay()"><i class="fas fa-play"></i></button>
</div>

<div class="full-overlay" id="fo">
    <div style="padding: 20px;" onclick="closeFull()"><i class="fas fa-chevron-down"></i></div>
    <div class="fo-content">
        <div class="fo-art-box"><img src="" class="fo-art" id="fo-art"></div>
        <h2 id="fo-t"></h2>
        <p id="fo-a" style="color: var(--text-muted);"></p>
    </div>
    <div class="fo-controls">
        <div style="display: flex; justify-content: space-around; align-items: center;">
            <button onclick="prev()" style="background:none; border:none; color:#fff; font-size:1.5rem;"><i class="fas fa-step-forward"></i></button>
            <button onclick="togglePlay()" id="fo-play-main" style="width:70px; height:70px; border-radius:50%; background:var(--primary); border:none; font-size:2rem;"><i class="fas fa-play"></i></button>
            <button onclick="next()" style="background:none; border:none; color:#fff; font-size:1.5rem;"><i class="fas fa-step-backward"></i></button>
        </div>
    </div>
</div>

<audio id="audio"></audio>

<script>
const S = { reciters: [], surahs: [], radios: [], playlist: [], idx: 0, ts: 0 };
const AZKAR_DATA = {
    morning: [{t: "أصبحنا وأصبح الملك لله والحمد لله", c: 1}, {t: "اللهم بك أصبحنا وبك أمسينا", c: 1}, {t: "سبحان الله وبحمده", c: 100}],
    evening: [{t: "أمسينا وأمسى الملك لله والحمد لله", c: 1}, {t: "أعوذ بكلمات الله التامات من شر ما خلق", c: 3}],
    sleep: [{t: "باسمك اللهم أموت وأحيا", c: 1}, {t: "آية الكرسي", c: 1}]
};

const DOM = id => document.getElementById(id);
const aud = DOM('audio');

window.onload = async () => {
    DOM('hijri').innerText = new Intl.DateTimeFormat('ar-TN-u-ca-islamic', {day:'numeric', month:'long'}).format(new Date());
    await initData();
    renderHome();
};

async function initData() {
    try {
        const [r1, r2, r3] = await Promise.all([
            fetch('https://www.mp3quran.net/api/v3/reciters?language=ar'),
            fetch('https://www.mp3quran.net/api/v3/suwar?language=ar'),
            fetch('https://www.mp3quran.net/api/v3/radios?language=ar')
        ]);
        S.reciters = (await r1.json()).reciters;
        S.surahs = (await r2.json()).suwar;
        S.radios = (await r3.json()).radios;
    } catch(e) { console.error('API Error'); }
}

function renderHome() {
    const c = DOM('top-reciters');
    S.reciters.slice(0, 10).forEach(r => {
        c.innerHTML += `<div class="reciter-pill" onclick="openReciter('${r.id}')">
            <img src="https://nwes.serv00.net/m.jpeg" class="reciter-img">
            <div style="font-size:0.7rem">${r.name}</div>
        </div>`;
    });
}

function switchView(v) {
    ['v-home','v-list','v-azkar','v-tasbih'].forEach(id => DOM(id).style.display = 'none');
    DOM(v).style.display = 'block';
    DOM('global-back').style.display = (v === 'v-home' ? 'none' : 'flex');
}

function goHome() { switchView('v-home'); }

function loadReciters() {
    switchView('v-list'); DOM('list-title').innerText = "القراء";
    const c = DOM('list-container'); c.innerHTML = '';
    S.reciters.forEach(r => {
        c.innerHTML += `<div class="track-row" onclick="openReciter('${r.id}')"><div class="track-idx">🎙️</div><div>${r.name}</div></div>`;
    });
}

function openReciter(id) {
    const r = S.reciters.find(x => x.id == id);
    switchView('v-list'); DOM('list-title').innerText = r.name;
    const srv = r.moshaf[0].server;
    const list = r.moshaf[0].surah_list.split(',');
    S.playlist = list.map(sid => {
        const s = S.surahs.find(x => x.id == sid);
        return { title: s?s.name:sid, artist: r.name, url: `${srv}${String(sid).padStart(3,'0')}.mp3`, img: 'https://nwes.serv00.net/m.jpeg' };
    });
    const c = DOM('list-container'); c.innerHTML = '';
    S.playlist.forEach((t, i) => {
        c.innerHTML += `<div class="track-row" onclick="play(${i})"><div class="track-idx">${i+1}</div><div>${t.title}</div></div>`;
    });
}

function loadRadios() {
    switchView('v-list'); DOM('list-title').innerText = "الإذاعات";
    const c = DOM('list-container'); c.innerHTML = '';
    S.radios.slice(0,20).forEach((r, i) => {
        c.innerHTML += `<div class="track-row" onclick="playRadio('${r.url}','${r.name}')"><div class="track-idx">📻</div><div>${r.name}</div></div>`;
    });
}

function playRadio(url, name) {
    S.playlist = [{title: name, artist: 'بث مباشر', url: url, img: 'https://nwes.serv00.net/m.jpeg'}];
    play(0);
}

function loadAzkarCat() {
    switchView('v-list'); DOM('list-title').innerText = "الأذكار";
    const c = DOM('list-container'); c.innerHTML = `
        <div class="track-row" onclick="openAzkar('morning')">أذكار الصباح</div>
        <div class="track-row" onclick="openAzkar('evening')">أذكار المساء</div>
        <div class="track-row" onclick="openAzkar('sleep')">أذكار النوم</div>
    `;
}

function openAzkar(type) {
    switchView('v-azkar');
    const c = DOM('v-azkar'); c.innerHTML = '';
    AZKAR_DATA[type].forEach((z, i) => {
        c.innerHTML += `<div class="azkar-card" id="z-${i}" onclick="countZikr(${i})">
            <div>${z.t}</div>
            <div class="azkar-count" id="zc-${i}">${z.c}</div>
        </div>`;
    });
}

function countZikr(i) {
    const el = DOM(`zc-${i}`);
    let cur = parseInt(el.innerText);
    if(cur > 1) el.innerText = cur - 1;
    else { el.innerText = "✓"; DOM(`z-${i}`).classList.add('done-zkr'); }
    if(navigator.vibrate) navigator.vibrate(40);
}

function openTasbih() { switchView('v-tasbih'); }
function tsCount() { S.ts++; DOM('ts-val').innerText = S.ts; if(navigator.vibrate) navigator.vibrate(50); }
function tsReset() { S.ts=0; DOM('ts-val').innerText = 0; }

function play(i) {
    S.idx = i; const t = S.playlist[i];
    aud.src = t.url; aud.play();
    DOM('mp-t').innerText = DOM('fo-t').innerText = t.title;
    DOM('mp-a').innerText = DOM('fo-a').innerText = t.artist;
    DOM('mp-img').src = DOM('fo-art').src = t.img;
    DOM('mp').classList.add('show');
    updIcons(true);
}

function togglePlay() {
    if(aud.paused) { aud.play(); updIcons(true); } else { aud.pause(); updIcons(false); }
}

function updIcons(p) {
    const icon = p ? 'fa-pause' : 'fa-play';
    DOM('mp-btn').innerHTML = `<i class="fas ${icon}"></i>`;
    DOM('fo-play-main').innerHTML = `<i class="fas ${icon}"></i>`;
}

function next() { if(S.idx < S.playlist.length-1) play(S.idx+1); }
function prev() { if(S.idx > 0) play(S.idx-1); }

function openFull() { DOM('fo').classList.add('active'); }
function closeFull() { DOM('fo').classList.remove('active'); }

function toggleSearch() {
    const k = prompt('ابحث عن قارئ:');
    if(k) {
        switchView('v-list'); DOM('list-title').innerText = `بحث: ${k}`;
        const c = DOM('list-container'); c.innerHTML = '';
        S.reciters.filter(r=>r.name.includes(k)).forEach(r => {
            c.innerHTML += `<div class="track-row" onclick="openReciter('${r.id}')"><div>${r.name}</div></div>`;
        });
    }
}

function playRandom() {
    const r = S.reciters[Math.floor(Math.random() * S.reciters.length)];
    openReciter(r.id);
    setTimeout(() => play(0), 1000);
}
</script>
</body>
</html>
