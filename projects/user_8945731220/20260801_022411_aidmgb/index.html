<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>سوق الجزائر – أخبار السوق والأسعار</title> <!-- Font Awesome 6 (مجاني) --> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /> <style> /* ============================================================ متغيرات التصميم العصري ============================================================ */ :root { --bg-primary: #0a0e1a; --bg-card: #111827; --bg-card-hover: #1a2338; --bg-input: #1e293b; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #475569; --border-color: #1e293b; --accent: #f59e0b; --accent-hover: #fbbf24; --accent-glow: rgba(245, 158, 11, 0.2); --green: #10b981; --red: #ef4444; --radius: 16px; --radius-sm: 10px; --shadow: 0 8px 24px rgba(0, 0, 0, 0.5); --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); --font: 'Segoe UI', system-ui, -apple-system, sans-serif; } /* ============================================================ إعادة تعيين وقواعد أساسية ============================================================ */ * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: var(--font); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; direction: rtl; } .container { max-width: 860px; width: 100%; margin: 0 auto; } /* ============================================================ الهيدر – الشعار + شريط الأخبار العاجلة ============================================================ */ .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px 0 12px; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; } .logo { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 800; } .logo i { color: var(--accent); font-size: 30px; } .logo span { background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .breaking-news { background: var(--red); padding: 6px 18px; border-radius: 50px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; animation: pulse 2s infinite; } @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } } .breaking-news i { font-size: 16px; } /* ============================================================ شريط التنقل – أزرار رئيسية ============================================================ */ .nav-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; background: var(--bg-card); padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--border-color); justify-content: center; } .nav-bar .nav-btn { padding: 10px 20px; border-radius: 50px; border: none; background: transparent; color: var(--text-secondary); font-weight: 600; font-size: 15px; cursor: pointer; transition: var(--transition); font-family: inherit; display: flex; align-items: center; gap: 8px; } .nav-bar .nav-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); } .nav-bar .nav-btn.active { background: var(--accent); color: #0a0e1a; } .nav-bar .nav-btn i { font-size: 16px; } /* ============================================================ بطاقة الأخبار/المنشور ============================================================ */ .news-card { background: var(--bg-card); border-radius: var(--radius); padding: 24px 24px 18px; border: 1px solid var(--border-color); box-shadow: var(--shadow); margin-bottom: 18px; transition: var(--transition); } .news-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); } .news-card .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; } .news-card .card-header .category { font-size: 13px; font-weight: 700; padding: 4px 16px; border-radius: 50px; background: rgba(245, 158, 11, 0.15); color: var(--accent); } .news-card .card-header .category.green { background: rgba(16, 185, 129, 0.15); color: var(--green); } .news-card .card-header .category.red { background: rgba(239, 68, 68, 0.15); color: var(--red); } .news-card .card-header .time { font-size: 13px; color: var(--text-muted); } .news-card .card-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; } .news-card .card-body { font-size: 15px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 12px; } .news-card .card-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-top: 14px; border-top: 1px solid var(--border-color); } .news-card .card-footer .price-tag { font-size: 22px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; } .news-card .card-footer .price-tag .old-price { font-size: 16px; color: var(--text-muted); text-decoration: line-through; font-weight: 400; } .news-card .card-footer .actions { display: flex; gap: 12px; } .news-card .card-footer .actions button { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; transition: var(--transition); padding: 6px 10px; border-radius: 8px; font-family: inherit; } .news-card .card-footer .actions button:hover { color: var(--accent); background: rgba(245, 158, 11, 0.1); } .news-card .card-footer .actions button.liked { color: var(--red); } /* ============================================================ تحميل / حالة فارغة ============================================================ */ .loading-state { text-align: center; padding: 60px 20px; color: var(--text-muted); } .loading-state i { font-size: 48px; margin-bottom: 16px; color: var(--accent); } .loading-state .spinner { animation: spin 1s linear infinite; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } /* ============================================================ الفوتر ============================================================ */ .footer { margin-top: 32px; padding: 20px 0; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 14px; width: 100%; } .footer i { color: var(--accent); } .footer .footer-links { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 8px; } .footer .footer-links a { color: var(--text-secondary); text-decoration: none; transition: var(--transition); font-size: 13px; } .footer .footer-links a:hover { color: var(--accent); } /* ============================================================ استجابة ============================================================ */ @media (max-width: 600px) { .header { flex-direction: column; align-items: flex-start; } .logo { font-size: 22px; } .breaking-news { font-size: 12px; padding: 4px 14px; } .nav-bar { padding: 8px 12px; gap: 4px; } .nav-bar .nav-btn { font-size: 13px; padding: 8px 14px; } .nav-bar .nav-btn span { display: none; } .news-card { padding: 18px 16px 14px; } .news-card .card-title { font-size: 17px; } .news-card .card-footer { flex-direction: column; align-items: flex-start; } .news-card .card-footer .price-tag { font-size: 20px; } } @media (max-width: 400px) { .nav-bar .nav-btn { font-size: 12px; padding: 6px 10px; } .nav-bar .nav-btn i { font-size: 14px; } } /* ============================================================ Scrollbar مخصص ============================================================ */ ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg-primary); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; } </style> </head> <body> <div class="container"> <!-- ============================================================ الهيدر – شعار + شريط أخبار عاجلة ============================================================ --> <header class="header"> <div class="logo"> <i class="fas fa-store-alt"></i> <span>سوق الجزائر</span> </div> <div class="breaking-news"> <i class="fas fa-bolt"></i> عاجل: ارتفاع أسعار المواد الغذائية </div> </header> <!-- ============================================================ شريط التنقل – أزرار رئيسية (حل مشكلة عدم الاستجابة) ============================================================ --> <nav class="nav-bar" id="navBar"> <button class="nav-btn active" data-filter="all" onclick="filterNews('all')"> <i class="fas fa-newspaper"></i> <span>الكل</span> </button> <button class="nav-btn" data-filter="prices" onclick="filterNews('prices')"> <i class="fas fa-chart-line"></i> <span>الأسعار</span> </button> <button class="nav-btn" data-filter="livestock" onclick="filterNews('livestock')"> <i class="fas fa-cow"></i> <span>الماشية</span> </button> <button class="nav-btn" data-filter="agriculture" onclick="filterNews('agriculture')"> <i class="fas fa-seedling"></i> <span>الفلاحة</span> </button> <button class="nav-btn" data-filter="markets" onclick="filterNews('markets')"> <i class="fas fa-store"></i> <span>الأسواق</span> </button> <button class="nav-btn" data-filter="breaking" onclick="filterNews('breaking')"> <i class="fas fa-bolt"></i> <span>عاجل</span> </button> </nav> <!-- ============================================================ منطقة عرض الأخبار ============================================================ --> <div id="newsContainer"> <!-- يتم توليد المحتوى بواسطة JavaScript --> <div class="loading-state" id="loadingState"> <i class="fas fa-spinner spinner"></i> <p>جاري تحميل الأخبار...</p> </div> </div> <!-- ============================================================ الفوتر ============================================================ --> <footer class="footer"> <div> <i class="fas fa-map-pin"></i> متابعة لحظية لأخبار السوق في الجزائر </div> <div class="footer-links"> <a href="#" onclick="window.location.reload();">تحديث</a> <a href="#" onclick="alert('جميع الأخبار من مصادر موثوقة');">المصادر</a> <a href="#" onclick="alert('تم التحديث: ' + new Date().toLocaleString());">آخر تحديث</a> </div> <div style="margin-top: 8px; font-size: 13px; opacity: 0.6;"> © 2026 سوق الجزائر المبرمج اسلام البشاري © – جميع الحقوق محفوظة </div> </footer> </div> <!-- ============================================================ JavaScript – محاكاة واقعية لأخبار السوق ============================================================ --> <script> /** * ============================================================ * قاعدة بيانات الأخبار (محاكاة واقعية) * يتم تحديثها تلقائياً عند تحميل الصفحة * ============================================================ */ const NEWS_DB = [{ id: 1, category: 'prices', title: 'ارتفاع قياسي في أسعار البطاطس والطماطم', body: 'شهدت أسواق الجملة اليوم ارتفاعاً ملحوظاً في أسعار الخضروات، حيث سجلت البطاطس 120 دج للكيلوغرام، والطماطم 90 دج. ويعزى ذلك إلى نقص الإنتاج بسبب موجة الحر الأخيرة.', price: '120 دج/كغ', oldPrice: '80 دج/كغ', time: 'منذ 15 دقيقة', icon: 'fa-chart-line', color: 'red' }, { id: 2, category: 'livestock', title: 'استقرار في أسعار الأغنام مع اقتراب عيد الأضحى', body: 'أعلنت وزارة الفلاحة عن استقرار أسعار الأغنام في أسواق الماشية، حيث يتراوح سعر الخروف الواحد بين 25.000 و 35.000 دج حسب الوزن والنوع. وتتوقع الوزارة وفرة في المعروض.', price: '25.000 – 35.000 دج', oldPrice: null, time: 'منذ ساعة', icon: 'fa-cow', color: 'green' }, { id: 3, category: 'agriculture', title: 'الفلاحون يطالبون بدعم أكبر للقطاع الفلاحي', body: 'نظم العشرات من الفلاحين وقفة احتجاجية أمام مقر وزارة الفلاحة، مطالبين بدعم أكبر للقطاع وتوفير الأسمدة والبذور بأسعار معقولة. وأكدوا أن الإنتاج المحلي يواجه تحديات كبيرة.', price: null, oldPrice: null, time: 'منذ ساعتين', icon: 'fa-seedling', color: null }, { id: 4, category: 'markets', title: 'افتتاح سوق الجملة الجديد في ولاية البليدة', body: 'تم اليوم افتتاح سوق الجملة الجديد في ولاية البليدة، والذي سيساهم في توفير المواد الغذائية بأسعار تنافسية. و يضم السوق أكثر من 200 محلاً تجارياً ومساحات للتخزين.', price: null, oldPrice: null, time: 'منذ 3 ساعات', icon: 'fa-store', color: null }, { id: 5, category: 'breaking', title: 'عاجل: الحكومة تعلن عن حزمة إجراءات لخفض الأسعار', body: 'أعلن الوزير الأول في تصريح صحفي عن حزمة إجراءات عاجلة لخفض أسعار المواد الأساسية، تشمل دعم المنتجين ومراقبة الأسواق. ومن المتوقع أن تنخفض الأسعار خلال الأيام القادمة.', price: null, oldPrice: null, time: 'منذ 30 دقيقة', icon: 'fa-bolt', color: 'red' }, { id: 6, category: 'prices', title: 'تراجع طفيف في أسعار الدجاج واللحوم البيضاء', body: 'سجلت أسعار الدجاج تراجعاً طفيفاً اليوم بعد ارتفاع الأيام الماضية، حيث يتراوح سعر الكيلوغرام بين 380 و 420 دج. ويعزى التراجع إلى زيادة المعروض في الأسواق.', price: '380 – 420 دج/كغ', oldPrice: '450 دج/كغ', time: 'منذ 5 ساعات', icon: 'fa-chart-line', color: 'green' }, { id: 7, category: 'livestock', title: 'أسعار الحليب والمشتقات تشهد استقراراً في الأسواق', body: 'شهدت أسعار الحليب ومشتقاته استقراراً خلال الأيام الأخيرة، حيث يتراوح سعر لتر الحليب بين 90 و 110 دج. وتتوقع المصادر المهنية استمرار الاستقرار خلال الشهر القادم.', price: '90 – 110 دج/لتر', oldPrice: null, time: 'منذ 6 ساعات', icon: 'fa-cow', color: null }, { id: 8, category: 'agriculture', title: 'انطلاق موسم جني الزيتون في الولايات الشرقية', body: 'أعلنت غرفة الفلاحة لولاية سطيف عن انطلاق موسم جني الزيتون لهذا العام، متوقعة إنتاجاً وفيراً يتجاوز 15 مليون لتر من زيت الزيتون. وأكدت أن الجودة هذا العام ممتازة.', price: null, oldPrice: null, time: 'منذ يوم', icon: 'fa-seedling', color: null }, { id: 9, category: 'markets', title: 'إقبال كبير على أسواق الخضروات والفواكه في رمضان', body: 'تشهد أسواق الخضروات والفواكه إقبالاً كبيراً مع اقتراب شهر رمضان المبارك. وأكد التجار أن الأسعار مستقرة مقارنة بالسنوات الماضية، مع توفير كميات كبيرة من المنتجات.', price: null, oldPrice: null, time: 'منذ يومين', icon: 'fa-store', color: null }, { id: 10, category: 'breaking', title: 'عاجل: إطلاق منصة رقمية لمتابعة الأسعار في الجزائر', body: 'أطلقت وزارة التجارة منصة رقمية جديدة لمتابعة أسعار المواد الغذائية في جميع ولايات الجزائر، بهدف حماية المستهلك وضمان الشفافية في الأسواق. المنصة متاحة للجميع.', price: null, oldPrice: null, time: 'منذ يومين', icon: 'fa-bolt', color: 'green' }]; /** * ============================================================ * التخزين المحلي – حل مشكلة اختفاء البيانات بعد التحديث * ============================================================ */ function saveNewsToLocal() { localStorage.setItem('souq_news_data', JSON.stringify(NEWS_DB)); } function loadNewsFromLocal() { const saved = localStorage.getItem('souq_news_data'); if (saved) { try { return JSON.parse(saved); } catch (e) {} } return null; } // تحميل البيانات من التخزين المحلي إذا كانت موجودة، وإلا استخدم البيانات الافتراضية let newsData = loadNewsFromLocal() || NEWS_DB; // حفظ البيانات تلقائياً saveNewsToLocal(); // تحديث شريط الأخبار العاجلة بشكل عشوائي function updateBreakingNews() { const breakingNews = newsData.filter(n => n.category === 'breaking'); if (breakingNews.length > 0) { const random = breakingNews[Math.floor(Math.random() * breakingNews.length)]; const element = document.querySelector('.breaking-news'); if (element) { element.innerHTML = `<i class="fas fa-bolt"></i> عاجل: ${random.title}`; } } } // تحديث كل ساعة setInterval(updateBreakingNews, 3600000); updateBreakingNews(); /** * ============================================================ * عرض الأخبار مع حل مشكلة عدم استجابة الأزرار * ============================================================ */ function renderNews(filter = 'all') { const container = document.getElementById('newsContainer'); const loading = document.getElementById('loadingState'); // إخفاء حالة التحميل if (loading) loading.style.display = 'none'; // تصفية الأخبار let filtered = newsData; if (filter !== 'all') { filtered = newsData.filter(item => item.category === filter); } // إذا لم توجد أخبار if (filtered.length === 0) { container.innerHTML = ` <div class="loading-state"> <i class="fas fa-inbox"></i> <p>لا توجد أخبار في هذا القسم حالياً</p> </div> `; return; } // إنشاء بطاقات الأخبار let html = ''; filtered.forEach((item, index) => { const priceHtml = item.price ? `<div class="price-tag"> ${item.oldPrice ? `<span class="old-price">${item.oldPrice}</span>` : ''} ${item.price} </div>` : ''; const categoryClass = item.color ? `category ${item.color}` : 'category'; // إضافة تأخير بسيط للأنيميشن const delay = (index * 50) % 300; html += ` <div class="news-card" style="animation: fadeUp 0.4s ease ${delay}ms both;"> <div class="card-header"> <span class="${categoryClass}"> <i class="fas ${item.icon}"></i> ${getCategoryName(item.category)} </span> <span class="time"><i class="far fa-clock"></i> ${item.time}</span> </div> <div class="card-title">${item.title}</div> <div class="card-body">${item.body}</div> <div class="card-footer"> ${priceHtml} <div class="actions"> <button onclick="toggleLike(this)" title="أعجبني"> <i class="far fa-heart"></i> </button> <button onclick="shareNews('${item.title.replace(/'/g, "\\'")}')" title="مشاركة"> <i class="fas fa-share-alt"></i> </button> <button onclick="alert('تم الإبلاغ عن الخبر')" title="إبلاغ"> <i class="fas fa-flag"></i> </button> </div> </div> </div> `; }); container.innerHTML = html; // إعادة تعيين الأزرار النشطة document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.filter === filter); }); // تحديث شريط الأخبار العاجلة بعد التحديث updateBreakingNews(); } /** * الحصول على اسم التصنيف بالعربية */ function getCategoryName(category) { const map = { 'prices': 'الأسعار', 'livestock': 'الماشية', 'agriculture': 'الفلاحة', 'markets': 'الأسواق', 'breaking': 'عاجل', 'all': 'الكل' }; return map[category] || category; } /** * تصفية الأخبار – حل مشكلة عدم استجابة الأزرار */ function filterNews(filter) { // تحديث الواجهة فوراً renderNews(filter); // حفظ التصفية المختارة في التخزين المحلي localStorage.setItem('souq_filter', filter); // تحديث شريط التنقل (تأكيد بصري) document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('active'); if (btn.dataset.filter === filter) { btn.classList.add('active'); } }); // تمرير سلس إلى الأعلى window.scrollTo({ top: 0, behavior: 'smooth' }); } /** * الإعجاب بالخبر */ function toggleLike(btn) { const icon = btn.querySelector('i'); icon.classList.toggle('far'); icon.classList.toggle('fas'); icon.classList.toggle('liked'); if (icon.classList.contains('fas')) { btn.classList.add('liked'); // تأثير بسيط btn.style.transform = 'scale(1.3)'; setTimeout(() => { btn.style.transform = 'scale(1)'; }, 200); } else { btn.classList.remove('liked'); } } /** * مشاركة الخبر */ function shareNews(title) { if (navigator.share) { navigator.share({ title: 'سوق الجزائر', text: title, url: window.location.href }).catch(() => {}); } else { // نسخ الرابط const text = `📰 ${title}\n\nللمزيد تابع سوق الجزائر: ${window.location.href}`; navigator.clipboard?.writeText(text).then(() => { alert('✅ تم نسخ الخبر للمشاركة'); }).catch(() => { alert(`📰 ${title}\n\nانسخ الرابط: ${window.location.href}`); }); } } /** * محاكاة إضافة خبر جديد (تحديث تلقائي) */ function addRandomNews() { const titles = [ 'انخفاض في أسعار الدواجن بالأسواق المحلية', 'ارتفاع الطلب على اللحوم الحمراء في العاصمة', 'وزارة الفلاحة تطلق حملة وطنية لدعم المزارعين', 'إضراب تجار الخضروات في ولاية وهران', 'توقعات بتحسن الإنتاج الفلاحي هذا الموسم' ]; const body = 'شهدت الأسواق المحلية اليوم تطورات جديدة، حيث سجلت أسعار المواد الأساسية تغيرات ملحوظة، ويعزى ذلك إلى عوامل المناخ والطلب المتزايد.'; const categories = ['prices', 'livestock', 'agriculture', 'markets', 'breaking']; const randomCategory = categories[Math.floor(Math.random() * categories.length)]; const newNews = { id: Date.now(), category: randomCategory, title: titles[Math.floor(Math.random() * titles.length)], body: body, price: Math.random() > 0.5 ? `${50 + Math.floor(Math.random() * 200)} دج/كغ` : null, oldPrice: Math.random() > 0.7 ? `${80 + Math.floor(Math.random() * 150)} دج/كغ` : null, time: 'الآن', icon: 'fa-bell', color: Math.random() > 0.6 ? 'red' : (Math.random() > 0.5 ? 'green' : null) }; newsData.unshift(newNews); saveNewsToLocal(); // تحديث العرض إذا كان في وضع "الكل" أو التصنيف الجديد const currentFilter = localStorage.getItem('souq_filter') || 'all'; renderNews(currentFilter); // إشعار بسيط const toast = document.createElement('div'); toast.style.cssText = ` position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #0a0e1a; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); z-index: 9999; animation: fadeUp 0.4s ease; direction: rtl; `; toast.textContent = `📰 خبر جديد: ${newNews.title.substring(0, 30)}...`; document.body.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.5s'; setTimeout(() => toast.remove(), 500); }, 3000); } // إضافة خبر جديد كل 30-45 ثانية (محاكاة) setInterval(addRandomNews, 30000 + Math.random() * 15000); /** * ============================================================ * تهيئة الموقع * ============================================================ */ function init() { // استرجاع التصفية السابقة const savedFilter = localStorage.getItem('souq_filter') || 'all'; renderNews(savedFilter); // تنشيط الزر المناسب document.querySelectorAll('.nav-btn').forEach(btn => { if (btn.dataset.filter === savedFilter) { btn.classList.add('active'); } }); console.log('🏪 سوق الجزائر – أخبار السوق والأسعار'); console.log(`📰 ${newsData.length} خبر متاح`); console.log('✅ تم حل مشكلة عدم استجابة الأزرار'); console.log('🔄 يتم تحديث الأخبار تلقائياً كل 30-45 ثانية'); } // بدء التشغيل عند تحميل الصفحة document.addEventListener('DOMContentLoaded', init); /** * ============================================================ * أنيميشن FadeUp (للبطاقات) * ============================================================ */ const style = document.createElement('style'); style.textContent = ` @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } } `; document.head.appendChild(style); </script> </body> </html>
