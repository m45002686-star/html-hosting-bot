<!DOCTYPE html> <html dir="rtl" lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>تزويد الباقات | 『 𝗠𝗥 』𝗬𝗢𝗨𝗦𝗘𝗙 𝗝𝗢𝗢</title> <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"> <style> :root { --primary-grad: linear-gradient(135deg, #FF007A 0%, #9600FF 100%); --accent-yellow: #FFD600; --bg-grad: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%); --card-bg: rgba(255, 255, 255, 0.92); --success-color: #00E676; --danger-color: #FF1744; --warning-color: #FF9100; } * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: all 0.3s ease; } body { background: var(--bg-grad); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; } .container { background: var(--card-bg); backdrop-filter: blur(15px); border-radius: 28px; padding: 35px 30px; max-width: 500px; width: 100%; box-shadow: 0 20px 50px rgba(255, 0, 122, 0.2), 0 0 20px rgba(255, 255, 255, 0.8); border: 2px solid rgba(255, 255, 255, 0.8); text-align: center; position: relative; } h1 { color: #2D0C57; font-weight: 900; font-size: 28px; margin: 0 0 5px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.05); } .subtitle { color: #6C5CE7; font-weight: 700; font-size: 15px; margin-bottom: 25px; } .form-group { margin-bottom: 20px; text-align: right; } label { display: block; font-weight: 700; margin-bottom: 8px; color: #2D0C57; font-size: 15px; } input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 14px 18px; border: 2px solid #E0E0E0; border-radius: 14px; font-size: 16px; background: #FFFFFF; color: #333; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); } input:focus { border-color: #FF007A; box-shadow: 0 0 12px rgba(255, 0, 122, 0.3); } button { background: var(--primary-grad); color: white; border: none; padding: 16px; font-size: 18px; font-weight: 700; border-radius: 14px; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 8px 25px rgba(255, 0, 122, 0.4); } button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 0, 122, 0.6); } button:disabled { background: #CCC; cursor: not-allowed; transform: none; box-shadow: none; } .result-box { margin-top: 25px; padding: 20px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 8px 20px rgba(0,0,0,0.06); display: none; animation: fadeIn 0.5s ease-in-out forwards; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } .result-box.show { display: block; } .banner-status { padding: 15px; border-radius: 12px; font-weight: 700; font-size: 16px; margin-bottom: 15px; text-align: center; } .banner-success { background: #E8F5E9; color: #2E7D32; border: 2px solid var(--success-color); } .banner-warning { background: #FFF3E0; color: #E65100; border: 2px solid var(--warning-color); } .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; } .stat-card { background: #F8F9FA; padding: 10px; border-radius: 10px; text-align: center; } .stat-card .num { font-weight: 900; font-size: 18px; } .stat-card .label { font-size: 12px; color: #666; } .error-msg { background: #FFEBEE; color: var(--danger-color); padding: 12px; border-radius: 12px; margin-top: 15px; font-weight: 700; border: 1px solid var(--danger-color); display: none; } .error-msg.show { display: block; } .loader { display: none; margin: 20px auto; border: 5px solid #F3F3F3; border-top: 5px solid #FF007A; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; } .loader.show { display: block; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } .developer-badge { margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.08); font-size: 14px; font-weight: 900; color: #2D0C57; letter-spacing: 1px; } .developer-badge span { background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } </style> </head> <body> <div class="container"> <h1>⚡ تزويد باقات فودافون</h1> <div class="subtitle">أداة زيادة أيام الباقة الفائقة ✨</div> <form id="mainForm" method="POST" action="tazweed-ayam-flex.html"> <div class="form-group"> <label for="number">📱 رقم الهاتف</label> <input type="text" id="number" name="number" placeholder="010XXXXXXXX" required> </div> <div class="form-group"> <label for="password">🔒 كلمة المرور</label> <input type="password" id="password" name="password" placeholder="كلمة مرور حساب Ana Vodafone" required> </div> <div class="form-group"> <label for="num_requests">🚀 عدد المحاولات (الافتراضي 10)</label> <input type="number" id="num_requests" name="num_requests" value="10" min="1" max="50"> </div> <button type="submit" id="submitBtn">بدء عملية التزويد ✨</button> </form> <div class="loader" id="loader"></div> <div class="error-msg" id="errorMsg"></div> <div class="result-box" id="resultBox"> <div id="statusBanner" class="banner-status"></div> <div class="stats-grid"> <div class="stat-card"> <div class="num" style="color: var(--success-color);" id="successCount">0</div> <div class="label">نجاح</div> </div> <div class="stat-card"> <div class="num" style="color: var(--warning-color);" id="alreadyCount">0</div> <div class="label">مُستخدم سابقاً</div> </div> <div class="stat-card"> <div class="num" style="color: var(--danger-color);" id="failedCount">0</div> <div class="label">فشل</div> </div> </div> </div> <div class="developer-badge"> تطوير بواسطة: <span>『 𝗠𝗥 』𝗬𝗢𝗨𝗦𝗘𝗙 𝗝𝗢𝗢</span> 🚀 </div> </div> <script> document.getElementById('mainForm').addEventListener('submit', function() { document.getElementById('loader').classList.add('show'); document.getElementById('submitBtn').disabled = true; document.getElementById('resultBox').classList.remove('show'); document.getElementById('errorMsg').classList.remove('show'); }); </script> </body> </html>
