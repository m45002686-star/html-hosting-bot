<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <title>كروت فكة جوو الحاكم</title> <style> body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; } .cyber-card { background: #0a0a0a; border: 2px solid #00ff41; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px #00ff4133; max-width: 500px; margin: auto; } h1 { text-align: center; text-shadow: 0 0 10px #00ff41; font-size: 25px; border-bottom: 2px solid #00ff41; padding-bottom: 10px; } input, select { width: 100%; background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 12px; margin: 10px 0; border-radius: 5px; } button { width: 100%; background: #00ff41; color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 18px; } button:hover { background: #fff; box-shadow: 0 0 15px #fff; } .footer { text-align: center; margin-top: 20px; color: #fff; border-top: 1px solid #333; padding-top: 10px; } </style> </head> <body> <div class="cyber-card"> <h1>⚡ موقع كروت فكة جوو الحاكم ⚡</h1> <label>اختر الكارت:</label> <select id="product"></select> <input type="text" id="receiver" placeholder="رقم المستلم (010xxxxxx)"> <input type="password" id="pin" placeholder="الرقم السري (6 أرقام)" maxlength="6"> <button onclick="sendOrder()">شحن الكارت الآن 🚀</button> <div id="status"></div> </div> <div class="footer">تواصل مع المطور: 01143317801</div> <script> const products = ["Fakka_2.5_Unite", "Fakka_4.25_Unite", "Fakka_5_Unite", "Mared_10_Minuts"]; // كمل القائمة const select = document.getElementById('product'); products.forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`); function sendOrder() { document.getElementById('status').innerText = "🔄 جاري المعالجة في سيرفر الجو الحاكم..."; // هنا بيتم الربط مع كود البايثون اللي هيشتغل على السيرفر } </script> </body> </html>
