<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>زخرفة الأسماء</title> <style> body{ margin:0; font-family:Arial,sans-serif; background:linear-gradient(135deg,#111,#222,#000); color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; } .box{ width:90%; max-width:600px; background:#1d1d1d; padding:20px; border-radius:15px; box-shadow:0 0 20px #000; } h1{text-align:center;} input{ width:100%; padding:12px; font-size:18px; border:none; border-radius:10px; margin-top:10px; } button{ width:100%; margin-top:15px; padding:12px; font-size:18px; border:none; border-radius:10px; background:#00b894; color:white; cursor:pointer; } .result{ background:#333; padding:10px; margin-top:10px; border-radius:10px; cursor:pointer; } .result:hover{ background:#444; } </style> </head> <body> <div class="box"> <h1>✨ زخرفة الأسماء ✨</h1> <input id="name" placeholder="اكتب اسمك..."> <button onclick="decorate()">زخرفة</button> <div id="results"></div> </div> <script> function decorate(){ let n=document.getElementById("name").value.trim(); if(n==""){ alert("اكتب اسم أولاً"); return; } let list=[ "★"+n+"★", "✿"+n+"✿", "꧁"+n+"꧂", "『"+n+"』", "๖"+n+"๖", "♛"+n+"♛", "✧"+n+"✧", "◥"+n+"◤", "☬"+n+"☬", "彡"+n+"彡", "⚡"+n+"⚡", "♥"+n+"♥", "☾"+n+"☽", "༒"+n+"༒", "✪"+n+"✪", "𖤍"+n+"𖤍", "ꨄ"+n+"ꨄ", "✰"+n+"✰", "⫷"+n+"⫸", "⟦"+n+"⟧" ]; let html=""; list.forEach(function(item){ html+=`<div class="result" onclick="copyText('${item}')">${item}</div>`; }); document.getElementById("results").innerHTML=html; } function copyText(text){ navigator.clipboard.writeText(text); alert("تم النسخ: "+text); } </script> </body> </html>
