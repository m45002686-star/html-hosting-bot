<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>مانو ستور</title> <style> :root{ --bg:#0f1115; --card:#1a1d23; --text:#f2f2f2; --muted:#a8a8a8; --accent:#ffb23f; --danger:#ff4d4d; } *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif} body{background:var(--bg);color:var(--text)} header{background:var(--card);padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2d33} header h1{color:var(--accent)} .btn{background:var(--accent);border:none;color:#111;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:bold} .btn-ghost{background:transparent;border:1px solid var(--muted);color:var(--text)} .btn-danger{background:var(--danger);color:#fff;border:none} .container{display:flex;gap:20px;padding:30px 5%} .filters{width:240px;background:var(--card);padding:15px;border-radius:12px;height:fit-content} .filters input,.filters select{width:100%;padding:8px;margin:8px 0;background:#111;border:1px solid #2a2d33;border-radius:8px;color:var(--text)} .products{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px} .card{background:var(--card);border-radius:12px;overflow:hidden;transition:0.2s} .card:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(255,178,63,0.15)} .card img{width:100%;height:280px;object-fit:cover} .card-body{padding:12px} .price{color:var(--accent);font-weight:bold;font-size:18px} .cart-panel,.admin-panel{position:fixed;right:-420px;top:0;width:380px;height:100%;background:var(--card);box-shadow:-2px 0 15px rgba(0,0,0,0.3);transition:0.3s;padding:20px;overflow-y:auto;z-index:20} .cart-panel.open,.admin-panel.open{right:0} .cart-item,.order-item{display:flex;justify-content:space-between;margin-bottom:10px;border-bottom:1px solid #2a2d33;padding-bottom:8px} input,textarea,select{width:100%;padding:8px;margin:6px 0;background:#111;border:1px solid #2a2d33;border-radius:8px;color:var(--text)} .tabs{display:flex;gap:10px;margin-bottom:15px} .tab{flex:1;padding:8px;text-align:center;background:#111;border-radius:8px;cursor:pointer} .tab.active{background:var(--accent);color:#111} @media(max-width:800px){.container{flex-direction:column}.filters{width:100%}} </style> </head> <body> <header> <h1>MANO STORE</h1> <div> <button class="btn-ghost" onclick="toggleAdmin()">لوحة التحكم</button> <button class="btn" onclick="toggleCart()">السلة <span id="cart-count">0</span></button> </div> </header> <div class="container"> <div class="filters"> <h3>فلترة</h3> <select id="category" onchange="applyFilter()"> <option value="all">كل الفئات</option> <option value="tshirt">تيشيرت</option> <option value="hoodie">هودي</option> <option value="pants">بنطلون</option> </select> <input type="number" id="max-price" placeholder="أقصى سعر" oninput="applyFilter()"> </div> <div class="products" id="products"></div> </div> <div class="cart-panel" id="cart"> <h3>سلة المشتريات</h3> <div id="cart-items"></div> <h4 id="total">الإجمالي: 0 جنيه</h4> <input id="customer-name" placeholder="الاسم الثلاثي"> <input id="customer-phone" placeholder="رقم الهاتف"> <input id="customer-address" placeholder="العنوان بالتفصيل"> <button class="btn" style="width:100%;margin-top:10px" onclick="placeOrder()">تأكيد الطلب - دفع عند الاستلام</button> </div> <div class="admin-panel" id="admin"> <h3>لوحة التحكم</h3> <div class="tabs"> <div class="tab active" onclick="switchTab('products-tab')">المنتجات</div> <div class="tab" onclick="switchTab('orders-tab')">الطلبات</div> </div> <div id="products-tab"> <h4>إضافة منتج جديد</h4> <input id="p-name" placeholder="اسم المنتج"> <input id="p-price" type="number" placeholder="السعر"> <select id="p-cat"> <option value="tshirt">تيشيرت</option> <option value="hoodie">هودي</option> <option value="pants">بنطلون</option> </select> <input id="p-img" placeholder="رابط الصورة"> <button class="btn" onclick="addProduct()">إضافة</button> <hr style="margin:15px 0;border-color:#2a2d33"> <div id="admin-products"></div> </div> <div id="orders-tab" style="display:none"> <h4>الطلبات الجديدة</h4> <div id="orders-list"></div> </div> </div> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; // 1. حط كونفيج Firebase بتاعك هنا const firebaseConfig = { apiKey: "AIzaSyBSdZ0hKgav9hNqLhic1Ionn8fRMjeNuz0", authDomain: "mano-store-ed592.firebaseapp.com", databaseURL: "https://mano-store-ed592-default-rtdb.firebaseio.com", projectId: "mano-store-ed592", storageBucket: "mano-store-ed592.firebasestorage.app", messagingSenderId: "510875497712", appId: "1:510875497712:web:ff676a16a0d486f3973e35", measurementId: "G-B9ZJMZXPFH" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); // 2. حط بيانات التليجرام هنا const TELEGRAM_TOKEN = "8883097783:AAEnuD9g18Vrany0owDQ9S1nQxcrkfgKmpc"; const TELEGRAM_CHAT_ID = "8232334193"; let products = []; let cart = JSON.parse(localStorage.getItem('mano_cart')) || []; // جلب المنتجات مباشر من Firebase onSnapshot(collection(db, "products"), (snapshot) => { products = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})); renderProducts(); renderAdminProducts(); }); // جلب الطلبات مباشر من Firebase onSnapshot(query(collection(db, "orders"), orderBy("date", "desc")), (snapshot) => { const orders = snapshot.docs.map(doc => doc.data()); renderOrders(orders); }); function renderProducts(list=products){ const container = document.getElementById('products'); container.innerHTML = ""; if(list.length === 0){ container.innerHTML = "<p style='color:var(--muted)'>مفيش منتجات لسه</p>"; return; } list.forEach(p=>{ container.innerHTML += ` <div class="card"> <img src="${p.img}" alt="${p.name}"> <div class="card-body"> <h4>${p.name}</h4> <p class="price">${p.price} جنيه</p> <button class="btn" style="width:100%;margin-top:8px" onclick="addToCart('${p.id}')">أضف للسلة</button> </div> </div> `; }); } window.addToCart = function(id){ const item = products.find(p=>p.id===id); if(!item) return; const exists = cart.find(c=>c.id===id); if(exists) exists.qty++; else cart.push({...item,qty:1}); localStorage.setItem('mano_cart',JSON.stringify(cart)); updateCart(); } function updateCart(){ document.getElementById('cart-count').innerText = cart.reduce((a,b)=>a+b.qty,0); const items = document.getElementById('cart-items'); items.innerHTML = ""; let total = 0; cart.forEach(c=>{ total += c.price*c.qty; items.innerHTML += `<div class="cart-item"><span>${c.name} x${c.qty}</span><span>${c.price*c.qty} جنيه</span></div>`; }); document.getElementById('total').innerText = `الإجمالي: ${total} جنيه`; } window.toggleCart = ()=>document.getElementById('cart').classList.toggle('open') window.toggleAdmin = ()=>document.getElementById('admin').classList.toggle('open') window.applyFilter = function(){ const cat = document.getElementById('category').value; const max = document.getElementById('max-price').value; let filtered = products; if(cat!=="all") filtered = filtered.filter(p=>p.cat===cat); if(max) filtered = filtered.filter(p=>p.price<=max); renderProducts(filtered); } window.addProduct = async function(){ const name=document.getElementById('p-name').value.trim(); const price=document.getElementById('p-price').value; const cat=document.getElementById('p-cat').value; const img=document.getElementById('p-img').value.trim(); if(!name||!price||!img){alert("املأ كل البيانات");return;} try{ await addDoc(collection(db, "products"), {name,price:+price,cat,img}); document.getElementById('p-name').value=""; document.getElementById('p-price').value=""; document.getElementById('p-img').value=""; }catch(e){alert("حصل خطأ: "+e.message)} } window.deleteProduct = async function(id){ if(confirm("متأكد عايز تحذف المنتج؟")){ await deleteDoc(doc(db, "products", id)); } } window.placeOrder = async function(){ const name=document.getElementById('customer-name').value.trim(); const phone=document.getElementById('customer-phone').value.trim(); const address=document.getElementById('customer-address').value.trim(); if(!name||!phone||!address){alert("اكمل بياناتك");return;} if(cart.length===0){alert("السلة فاضية");return;} const order = { customer:{name,phone,address}, items:[...cart], total:cart.reduce((a,b)=>a+b.price*b.qty,0), date: new Date().toISOString() }; try{ await addDoc(collection(db, "orders"), order); // إرسال إشعار تليجرام let msg = `<b>🔔 طلب جديد من مانو ستور</b>\n`; msg += `<b>العميل:</b> ${name}\n`; msg += `<b>الهاتف:</b> ${phone}\n`; msg += `<b>العنوان:</b> ${address}\n`; msg += `<b>الإجمالي:</b> ${order.total} جنيه\n`; msg += `<b>المنتجات:</b>\n`; cart.forEach(item => { msg += `- ${item.name} x${item.qty} = ${item.price * item.qty} جنيه\n`; }); await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: "HTML" }) }); cart=[];localStorage.setItem('mano_cart',JSON.stringify(cart)); updateCart();toggleCart(); alert("تم استلام طلبك! هنكلمك خلال 24 ساعة لتأكيد الشحن"); }catch(e){alert("حصل خطأ في إرسال الطلب: "+e.message)} } window.renderOrders = function(orders){ const div=document.getElementById('orders-list'); div.innerHTML=""; if(orders.length === 0){ div.innerHTML = "<p style='color:var(--muted)'>مفيش طلبات لسه</p>"; return; } orders.forEach(o=>{ div.innerHTML+=`<div class="order-item" style="flex-direction:column;gap:5px"> <b>${o.customer.name} - ${o.customer.phone}</b> <span style="color:var(--muted)">${o.customer.address}</span> <span><b>الإجمالي:</b> ${o.total} جنيه</span> <span style="color:var(--muted);font-size:12px">${new Date(o.date).toLocaleString('ar-EG')}</span> </div>`; }); } window.renderAdminProducts = function(){ const div=document.getElementById('admin-products'); div.innerHTML=""; if(products.length === 0){ div.innerHTML = "<p style='color:var(--muted)'>مفيش منتجات</p>"; return; } products.forEach(p=>{ div.innerHTML+=`<div class="cart-item"><span>${p.name} - ${p.price} جنيه</span> <button class="btn-danger" onclick="deleteProduct('${p.id}')">حذف</button></div>`; }); } window.switchTab = function(tab){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); event.target.classList.add('active'); document.getElementById('products-tab').style.display=tab==='products-tab'?'block':'none'; document.getElementById('orders-tab').style.display=tab==='orders-tab'?'block':'none'; } updateCart(); </script> </body> </html>
