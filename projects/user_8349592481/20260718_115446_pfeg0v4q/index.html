<!DOCTYPE html> <html dir="rtl" lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>موقع تشفير يوسف</title> <style> body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'Cairo', system-ui, sans-serif; } #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 0; } .ui { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; min-height: 100vh; backdrop-filter: blur(3px); pointer-events: none; } .card { pointer-events: auto; width: 90%; max-width: 550px; background: rgba(8, 12, 18, 0.7); backdrop-filter: blur(20px); border-radius: 56px; padding: 30px 26px 40px; border: 1px solid rgba(255, 215, 140, 0.3); box-shadow: 0 25px 45px rgba(0,0,0,0.6); } h1 { text-align: center; font-size: 2rem; margin: 0 0 15px 0; color: #ffefcf; font-weight: 800; text-shadow: 0 0 12px rgba(0,0,0,0.6); } .mode-tabs { display: flex; gap: 12px; background: rgba(0, 0, 0, 0.45); padding: 6px; border-radius: 100px; margin-bottom: 28px; } .mode-btn { flex: 1; text-align: center; background: transparent; border: none; padding: 10px 6px; font-size: 1rem; font-weight: bold; border-radius: 60px; cursor: pointer; color: #eeddbb; transition: 0.2s; } .mode-btn.active { background: #f5bc5e; color: #12100c; box-shadow: 0 2px 8px black; } textarea { width: 100%; padding: 16px 20px; font-size: 1.2rem; border-radius: 36px; border: none; background: rgba(20, 20, 20, 0.9); color: #f7eedb; font-family: 'Courier New', monospace; resize: vertical; box-sizing: border-box; outline: none; direction: ltr; text-align: left; } .convert-btn { width: 100%; background: radial-gradient(circle at 30% 10%, #f5cd7a, #e09d32); border: none; padding: 16px; font-size: 1.4rem; font-weight: bold; color: #1f2c1d; border-radius: 60px; margin: 24px 0 16px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.4); transition: transform 0.08s linear; } .convert-btn:active { transform: scale(0.96); } .result-area { background: rgba(0, 0, 0, 0.65); border-radius: 36px; padding: 16px; } .result-header { display: flex; justify-content: space-between; margin-bottom: 8px; color: #eecd9f; font-size: 0.75rem; font-weight: bold; } .result-text { background: #0a0c0a; color: #fff2df; padding: 16px 18px; border-radius: 28px; font-family: monospace; font-size: 1.2rem; word-break: break-word; white-space: pre-wrap; direction: ltr; text-align: left; max-height: 210px; overflow-y: auto; } .copy-btn { background: #3a4d44; border: none; padding: 4px 14px; border-radius: 40px; color: white; cursor: pointer; font-size: 0.7rem; } </style> </head> <body> <canvas id="canvas-bg"></canvas> <div class="ui"> <div class="card"> <h1>🗝️ خلوة التشفير</h1> <div class="mode-tabs"> <button id="encModeBtn" class="mode-btn active">🔐 نص عادي ← مشفر</button> <button id="decModeBtn" class="mode-btn">🔓 مشفر ← نص عادي</button> </div> <textarea id="inputBox" rows="3" placeholder="اكتب هنا ..."></textarea> <button id="actionBtn" class="convert-btn">⚡ حول ⚡</button> <div class="result-area"> <div class="result-header"> <span>✦ النتيجة ✦</span> <button id="copyResultBtn" class="copy-btn">📋 نسخ</button> </div> <div id="outputDiv" class="result-text">...</div> </div> </div> </div> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script> const encryptMap = new Map([ ['ا','5'],['أ','5'],['إ','5'],['آ','5'], ['ب','H'],['ت','9'],['ث','K'],['ج','2'],['ح','W'],['خ','4'], ['د','L'],['ذ','7'],['ر','M'],['ز','1'],['س','V'],['ش','8'], ['ص','B'],['ض','3'],['ط','N'],['ظ','6'],['ع','P'],['غ','F'], ['ف','D'],['ق','0'],['ك','J'],['ل','C'],['م','G'],['ن','Y'], ['ه','R'],['ة','R'],['و','T'],['ي','Z'],['ى','Z'] ]); const decryptMap = new Map(); for (let [arabic, code] of encryptMap.entries()) { if (!decryptMap.has(code) || arabic === 'ا') { decryptMap.set(code, arabic); } } decryptMap.set('5','ا'); decryptMap.set('H','ب'); decryptMap.set('9','ت'); decryptMap.set('K','ث'); decryptMap.set('2','ج'); decryptMap.set('W','ح'); decryptMap.set('4','خ'); decryptMap.set('L','د'); decryptMap.set('7','ذ'); decryptMap.set('M','ر'); decryptMap.set('1','ز'); decryptMap.set('V','س'); decryptMap.set('8','ش'); decryptMap.set('B','ص'); decryptMap.set('3','ض'); decryptMap.set('N','ط'); decryptMap.set('6','ظ'); decryptMap.set('P','ع'); decryptMap.set('F','غ'); decryptMap.set('D','ف'); decryptMap.set('0','ق'); decryptMap.set('J','ك'); decryptMap.set('C','ل'); decryptMap.set('G','م'); decryptMap.set('Y','ن'); decryptMap.set('R','ه'); decryptMap.set('T','و'); decryptMap.set('Z','ي'); function encryptText(plain) { let result = ""; for (let ch of plain) { const isArabic = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(ch); if (isArabic && encryptMap.has(ch)) { result += encryptMap.get(ch); } else { result += ch; } } return result; } function decryptText(cipher) { let result = ""; for (let sym of cipher) { if (decryptMap.has(sym)) { result += decryptMap.get(sym); } else { result += sym; } } return result; } let currentMode = "encrypt"; const inputArea = document.getElementById("inputBox"); const outputDiv = document.getElementById("outputDiv"); const encBtn = document.getElementById("encModeBtn"); const decBtn = document.getElementById("decModeBtn"); const actionButton = document.getElementById("actionBtn"); const copyBtn = document.getElementById("copyResultBtn"); function updateModeUI() { if (currentMode === "encrypt") { encBtn.classList.add("active"); decBtn.classList.remove("active"); inputArea.placeholder = "📝 نص عادي .. مرحبا يا صديق"; actionButton.innerHTML = "🔒 شفر → نص مشفر 🔒"; } else { encBtn.classList.remove("active"); decBtn.classList.add("active"); inputArea.placeholder = "🔑 نص مشفر .. مثال: 5 M 8 G 9"; actionButton.innerHTML = "🔓 فك → نص عادي 🔓"; } outputDiv.innerText = "..."; } function convert() { let raw = inputArea.value; if (raw.trim() === "") { outputDiv.innerText = "✖️"; return; } let result; if (currentMode === "encrypt") { result = encryptText(raw); } else { result = decryptText(raw); inputArea.value = ""; } if (result === "") result = "[فارغ]"; outputDiv.innerText = result; } encBtn.addEventListener("click", () => { if (currentMode === "encrypt") return; currentMode = "encrypt"; updateModeUI(); }); decBtn.addEventListener("click", () => { if (currentMode === "decrypt") return; currentMode = "decrypt"; updateModeUI(); }); actionButton.addEventListener("click", convert); copyBtn.addEventListener("click", () => { let text = outputDiv.innerText; if (!text || text === "..." || text === "✖️") return; navigator.clipboard.writeText(text); }); updateModeUI(); const canvas = document.getElementById("canvas-bg"); const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050b15); const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.z = 3.2; const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio); const cloudGeo = new THREE.SphereGeometry(1.8, 64, 64); const cloudMat = new THREE.MeshPhongMaterial({ color: 0x88aaff, emissive: 0x112244, transparent: true, opacity: 0.2 }); const cloudSphere = new THREE.Mesh(cloudGeo, cloudMat); scene.add(cloudSphere); const innerGlow = new THREE.Mesh(new THREE.SphereGeometry(1.2, 48, 48), new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x442200, roughness: 0.3, metalness: 0.8 })); scene.add(innerGlow); const particlesCount = 1800; const particlesGeo = new THREE.BufferGeometry(); const posArray = new Float32Array(particlesCount * 3); for (let i = 0; i < particlesCount; i++) { posArray[i*3] = (Math.random() - 0.5) * 180; posArray[i*3+1] = (Math.random() - 0.5) * 100; posArray[i*3+2] = (Math.random() - 0.5) * 70 - 35; } particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3)); const particlesMat = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.1, transparent: true }); const starField = new THREE.Points(particlesGeo, particlesMat); scene.add(starField); const ambient = new THREE.AmbientLight(0x224466); scene.add(ambient); const mainLight = new THREE.PointLight(0xffaa88, 0.9); mainLight.position.set(2, 3, 5); scene.add(mainLight); const backLight = new THREE.PointLight(0x88aaff, 0.5); backLight.position.set(-2, -1, -4); scene.add(backLight); let rotAngle = 0; function animate() { requestAnimationFrame(animate); rotAngle += 0.004; cloudSphere.rotation.y = rotAngle * 0.6; cloudSphere.rotation.x = rotAngle * 0.2; innerGlow.rotation.y = rotAngle; innerGlow.rotation.x = rotAngle * 0.5; starField.rotation.y = rotAngle * 0.03; starField.rotation.x = rotAngle * 0.01; renderer.render(scene, camera); } animate(); window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }); </script> </body> </html>
