<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <title>موقع زخرفة - الجو الحاكم</title> <style> /* ستايل الهكر */ body { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-shadow: 0 0 5px #0f0; } h1 { font-size: 3rem; border-bottom: 2px solid #0f0; padding-bottom: 10px; } .container { background: rgba(0, 20, 0, 0.8); padding: 30px; border: 1px solid #0f0; border-radius: 10px; box-shadow: 0 0 20px #0f0; text-align: center; width: 80%; max-width: 500px; } input { width: 90%; padding: 10px; background: #000; border: 1px solid #0f0; color: #0f0; margin-bottom: 20px; text-align: center; } button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; transition: 0.3s; } button:hover { background: #fff; box-shadow: 0 0 15px #fff; } #result { margin-top: 20px; font-size: 1.5rem; word-break: break-all; } </style> </head> <body> <div class="container"> <h1>مرحباً بك في موقع زخرفة الجو الحاكم</h1> <p>> النظام جاهز للزخرفة...</p> <input type="text" id="inputText" placeholder="أدخل النص هنا..."> <br> <button onclick="decorate()">زخرفة النص الآن</button> <div id="result"></div> </div> <script> function decorate() { let text = document.getElementById("inputText").value; let symbols = ["★", "⚡", "♛", "⚔", "☠", "✪"]; let decorated = text.split("").map(char => symbols[Math.floor(Math.random() * symbols.length)] + char).join(""); document.getElementById("result").innerText = "النتيجة: " + decorated + " ♛"; } </script> </body> </html>
