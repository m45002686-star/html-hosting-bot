<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#2f2f2f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:400px;
    height:600px;
    background:#1e1e1e;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.chat-box{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.message{
    padding:10px 15px;
    margin-bottom:10px;
    border-radius:18px;
    max-width:75%;
    word-wrap:break-word;
}

.user{
    background:#007bff;
    color:white;
    align-self:flex-end;
}

.ai{
    background:#444;
    color:white;
    align-self:flex-start;
}

.input-area{
    display:flex;
    padding:10px;
    background:#2a2a2a;
}

input{
    flex:1;
    padding:10px;
    border-radius:20px;
    border:none;
    outline:none;
    background:#3a3a3a;
    color:white;
}

button{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    margin-left:10px;
    cursor:pointer;
    font-size:18px;
}

.send-btn{
    background:#007bff;
    color:white;
}

.mic-btn{
    background:#555;
    color:white;
}
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <button class="mic-btn">🎤</button>
        <input type="text" id="messageInput" placeholder="اكتب رسالتك...">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>

const API_KEY = "YOUR_API_KEY"; // ضع مفتاحك هنا

async function sendMessage() {
    const input = document.getElementById("messageInput");
    const chatBox = document.getElementById("chatBox");
    const message = input.value.trim();
    if(!message) return;

    addMessage(message,"user");
    input.value = "";

    addMessage("جاري الكتابة...","ai");

    const response = await fetch("https://api.openai.com/v1/chat/completions",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + API_KEY
        },
        body:JSON.stringify({
            model:"gpt-4o-mini",
            messages:[
                {role:"system", content:"أنت مساعد ذكي."},
                {role:"user", content:message}
            ]
        })
    });

    const data = await response.json();

    document.querySelector(".ai:last-child").remove();

    addMessage(data.choices[0].message.content,"ai");
}

function addMessage(text,type){
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.classList.add("message",type);
    msg.innerText = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
