<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>كوكو - المنصة التعليمية</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', 'Segoe UI', sans-serif; } body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 1200px; margin: 0 auto; } /* بطاقات وبوكسات */ .card { background: white; border-radius: 20px; padding: 30px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); } h1 { color: #764ba2; margin-bottom: 20px; text-align: center; } h2 { color: #667eea; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; } /* أزرار */ .btn { padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; transition: 0.3s; margin: 5px; } .btn-primary { background: #667eea; color: white; } .btn-primary:hover { background: #5a67d8; } .btn-success { background: #48bb78; color: white; } .btn-danger { background: #f56565; color: white; } .btn-warning { background: #ed8936; color: white; } input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; } /* قائمة الفيديو والصورة */ .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; } .content-item { background: #f7f7f7; border-radius: 15px; overflow: hidden; padding: 15px; text-align: center; } .content-item video, .content-item img { width: 100%; max-height: 200px; border-radius: 10px; } .content-item a { display: inline-block; margin-top: 10px; color: #667eea; text-decoration: none; } /* نافذة رمز الاشتراك */ .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; } .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; } /* رسائل */ .message { padding: 10px; border-radius: 10px; margin: 10px 0; } .error { background: #fed7d7; color: #c53030; } .success { background: #c6f6d5; color: #22543d; } /* تبويبات */ .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; } .tab { padding: 10px 20px; background: #e2e8f0; border-radius: 10px; cursor: pointer; } .tab.active { background: #667eea; color: white; } .tab-content { display: none; } .tab-content.active { display: block; } /* رأس الموقع */ .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 15px; margin-bottom: 20px; } .logo { font-size: 28px; font-weight: bold; color: #764ba2; } @media (max-width: 768px) { .content-grid { grid-template-columns: 1fr; } .header { flex-direction: column; gap: 10px; } } </style> </head> <body> <div class="container" id="app"></div> <script> // ----------------------------- بيانات التخزين (محاكاة قاعدة البيانات) ----------------------------- let users = JSON.parse(localStorage.getItem('users')) || [ { id: 1, username: 'plmoknijb', password: 'plmoknijb', type: 'admin', subscriptionCode: null } ]; let contents = JSON.parse(localStorage.getItem('contents')) || []; // { id, title, type, fileData, fileName, mimeType } let currentUser = null; // حفظ البيانات function saveData() { localStorage.setItem('users', JSON.stringify(users)); localStorage.setItem('contents', JSON.stringify(contents)); } // رفع ملف (تخزين كـ Base64) function uploadFile(file, title, type) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = function(e) { const newContent = { id: Date.now(), title: title, type: type, // 'video', 'image', 'pdf' fileData: e.target.result, fileName: file.name, mimeType: file.type }; contents.push(newContent); saveData(); resolve(newContent); }; reader.onerror = reject; reader.readAsDataURL(file); }); } // التحقق من رمز الاشتراك function checkSubscriptionCode(code) { // يمكن تغيير الرمز العام هنا أو تخصيصه لكل مستخدم const validCode = 'COCO2025'; return code === validCode; } // عرض الصفحة الرئيسية حسب نوع المستخدم function render() { const app = document.getElementById('app'); if (!currentUser) { renderLoginPage(app); } else if (currentUser.type === 'admin') { renderAdminDashboard(app); } else { renderUserDashboard(app); } } // صفحة تسجيل الدخول والتسجيل function renderLoginPage(app) { app.innerHTML = ` <div class="card"> <h1>🍫 منصة كوكو التعليمية</h1> <div class="tabs"> <div class="tab active" onclick="switchTab('login')">دخول</div> <div class="tab" onclick="switchTab('register')">تسجيل جديد</div> </div> <div id="loginTab" class="tab-content active"> <h2>دخول</h2> <input type="text" id="loginUsername" placeholder="اسم المستخدم"> <input type="password" id="loginPassword" placeholder="كلمة المرور"> <button class="btn btn-primary" onclick="handleLogin()">دخول</button> </div> <div id="registerTab" class="tab-content"> <h2>تسجيل حساب جديد</h2> <input type="text" id="regUsername" placeholder="اسم المستخدم"> <input type="password" id="regPassword" placeholder="كلمة المرور"> <button class="btn btn-success" onclick="handleRegister()">تسجيل</button> </div> </div> `; } // لوحة تحكم المشرف function renderAdminDashboard(app) { const userCount = users.filter(u => u.type === 'user').length; const videoCount = contents.filter(c => c.type === 'video').length; const imageCount = contents.filter(c => c.type === 'image').length; const pdfCount = contents.filter(c => c.type === 'pdf').length; app.innerHTML = ` <div class="header"> <div class="logo">🍫 كوكو - المشرف</div> <button class="btn btn-danger" onclick="logout()">تسجيل خروج</button> </div> <div class="card"> <h2>📊 لوحة التحكم</h2> <p>👥 عدد المستخدمين: ${userCount}</p> <p>🎬 عدد الفيديوهات: ${videoCount}</p> <p>🖼️ عدد الصور: ${imageCount}</p> <p>📄 عدد ملفات PDF: ${pdfCount}</p> </div> <div class="card"> <h2>📤 رفع محتوى جديد</h2> <select id="contentType"> <option value="video">فيديو</option> <option value="image">صورة</option> <option value="pdf">PDF</option> </select> <input type="text" id="contentTitle" placeholder="عنوان المحتوى"> <input type="file" id="contentFile" accept=""> <button class="btn btn-primary" onclick="handleUpload()">رفع</button> </div> <div class="card"> <h2>📂 المحتوى المرفوع</h2> <div id="contentListAdmin"></div> </div> `; renderContentListAdmin(); } function renderContentListAdmin() { const container = document.getElementById('contentListAdmin'); if (!container) return; if (contents.length === 0) { container.innerHTML = '<p>لا يوجد محتوى حتى الآن</p>'; return; } let html = '<div class="content-grid">'; contents.forEach(c => { html += ` <div class="content-item"> ${c.type === 'video' ? `<video controls src="${c.fileData}"></video>` : ''} ${c.type === 'image' ? `<img src="${c.fileData}" alt="${c.title}">` : ''} ${c.type === 'pdf' ? `<a href="${c.fileData}" target="_blank">📄 ${c.fileName}</a>` : ''} <h3>${c.title}</h3> <button class="btn btn-danger" onclick="deleteContent(${c.id})">حذف</button> </div> `; }); html += '</div>'; container.innerHTML = html; } // لوحة المستخدم العادي function renderUserDashboard(app) { app.innerHTML = ` <div class="header"> <div class="logo">🍫 كوكو - مرحباً ${currentUser.username}</div> <button class="btn btn-danger" onclick="logout()">تسجيل خروج</button> </div> <div class="card" id="subscriptionCard"> <h2>🔐 رمز الاشتراك</h2> <input type="text" id="subCode" placeholder="أدخل رمز الاشتراك"> <button class="btn btn-primary" onclick="verifySubscription()">تأكيد</button> </div> <div class="card" id="userContentCard" style="display:none;"> <h2>📚 المحتوى التعليمي</h2> <div id="userContentList"></div> </div> `; // إذا كان المستخدم قد أدخل الرمز من قبل if (currentUser.subscriptionVerified) { document.getElementById('subscriptionCard').style.display = 'none'; document.getElementById('userContentCard').style.display = 'block'; renderUserContent(); } } function renderUserContent() { const container = document.getElementById('userContentList'); if (!container) return; if (contents.length === 0) { container.innerHTML = '<p>⚠️ لا يوجد محتوى متاح حالياً</p>'; return; } let html = '<div class="content-grid">'; contents.forEach(c => { html += ` <div class="content-item"> ${c.type === 'video' ? `<video controls src="${c.fileData}"></video>` : ''} ${c.type === 'image' ? `<img src="${c.fileData}" alt="${c.title}">` : ''} ${c.type === 'pdf' ? `<a href="${c.fileData}" target="_blank">📄 ${c.fileName}</a>` : ''} <h3>${c.title}</h3> </div> `; }); html += '</div>'; container.innerHTML = html; } // دوال التحكم window.handleLogin = function() { const username = document.getElementById('loginUsername').value; const password = document.getElementById('loginPassword').value; const user = users.find(u => u.username === username && u.password === password); if (user) { currentUser = { ...user, subscriptionVerified: false }; render(); } else { alert('خطأ في اسم المستخدم أو كلمة المرور'); } }; window.handleRegister = function() { const username = document.getElementById('regUsername').value; const password = document.getElementById('regPassword').value; if (users.find(u => u.username === username)) { alert('اسم المستخدم موجود مسبقاً'); return; } const newUser = { id: Date.now(), username: username, password: password, type: 'user', subscriptionCode: null }; users.push(newUser); saveData(); alert('تم التسجيل بنجاح، يمكنك الدخول الآن'); switchTab('login'); }; window.handleUpload = async function() { const type = document.getElementById('contentType').value; const title = document.getElementById('contentTitle').value; const fileInput = document.getElementById('contentFile'); if (!title || !fileInput.files[0]) { alert('يرجى إدخال عنوان واختيار ملف'); return; } const file = fileInput.files[0]; let expectedType = ''; if (type === 'video' && !file.type.startsWith('video/')) expectedType = 'فيديو'; else if (type === 'image' && !file.type.startsWith('image/')) expectedType = 'صورة'; else if (type === 'pdf' && file.type !== 'application/pdf') expectedType = 'PDF'; if (expectedType) { alert(`يرجى رفع ملف من نوع ${expectedType}`); return; } await uploadFile(file, title, type); alert('تم الرفع بنجاح'); document.getElementById('contentTitle').value = ''; document.getElementById('contentFile').value = ''; renderAdminDashboard(document.getElementById('app')); }; window.deleteContent = function(id) { if (confirm('هل أنت متأكد من حذف هذا المحتوى؟')) { contents = contents.filter(c => c.id !== id); saveData(); renderAdminDashboard(document.getElementById('app')); } }; window.verifySubscription = function() { const code = document.getElementById('subCode').value; if (checkSubscriptionCode(code)) { currentUser.subscriptionVerified = true; document.getElementById('subscriptionCard').style.display = 'none'; document.getElementById('userContentCard').style.display = 'block'; renderUserContent(); } else { alert('رمز الاشتراك غير صحيح'); } }; window.logout = function() { currentUser = null; render(); }; window.switchTab = function(tab) { const loginTab = document.getElementById('loginTab'); const registerTab = document.getElementById('registerTab'); const tabs = document.querySelectorAll('.tab'); if (tab === 'login') { loginTab.classList.add('active'); registerTab.classList.remove('active'); tabs[0].classList.add('active'); tabs[1].classList.remove('active'); } else { loginTab.classList.remove('active'); registerTab.classList.add('active'); tabs[0].classList.remove('active'); tabs[1].classList.add('active'); } }; // تحديث حقل accept حسب نوع المحتوى (في وضع المشرف بعد التحميل) function updateAcceptField() { const typeSelect = document.getElementById('contentType'); const fileInput = document.getElementById('contentFile'); if (typeSelect && fileInput) { const type = typeSelect.value; if (type === 'video') fileInput.accept = 'video/*'; else if (type === 'image') fileInput.accept = 'image/*'; else if (type === 'pdf') fileInput.accept = 'application/pdf'; } } // إعادة ربط الأحداث بعد كل رندر (لأن innerHTML يزيل المستمعين) const originalRender = render; render = function() { originalRender(); setTimeout(() => { const typeSelect = document.getElementById('contentType'); if (typeSelect) { typeSelect.addEventListener('change', updateAcceptField); updateAcceptField(); } }, 50); }; render(); </script> </body> </html>
