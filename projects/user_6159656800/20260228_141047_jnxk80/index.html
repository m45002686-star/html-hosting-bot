    @keyframes flicker {
      0% { opacity: 1; text-shadow: 0 0 5px rgba(255,0,0,0.5); }

      50% { opacity: 1; text-shadow: 0 0 5px rgba(255,0,0,0.5); }
      75% { opacity: 0.9; text-shadow: 0 0 20px rgba(255,0,0,0.9); }
      100% { opacity: 1; text-shadow: 0 0 5px rgba(255,0,0,0.5); }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }

      0%, 100% { transform: translateX(0); }

    @keyframes pulse-glow {

<script>
  const default_theme = "system";
  const force_theme_mode = null;

  function getThemeFromLocalStorage() {

    if (force_theme_mode) {
      return force_theme_mode;
    }

    // if user already changed the theme, use it
    if (window.localStorage.getItem('theme')) {
      return window.localStorage.getItem('theme')
    }

    let theme = default_theme === 'system' ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' :
        'light') :
      default_theme;

    // else, return default theme
    return theme;
  }

  function setThemeToLocalStorage(value) {
    window.localStorage.setItem('theme', value)
  }

  const setTheme = (theme) => {
    theme ??= getThemeFromLocalStorage();
    if (theme === 'dark') document.documentElement.classList.add('dark');
  };
  setTheme();

  <script>
    // تأثيرات الرعب الإضافية
    document.addEventListener('DOMContentLoaded', function() {
      // صوت الرعب المخيف (اختياري - يتطلب ملف صوتي)
      // يمكن إضافة صوت عند الخطأ
      
      // تأثير flicker عشوائي للعناصر
      setInterval(() => {
        if (Math.random() > 0.7) {
          document.body.style.filter = 'brightness(1.2) contrast(1.1)';
          setTimeout(() => {
            document.body.style.filter = 'none';
          }, 100);
        }
      }, 5000);

      // إضافة كلاس الخطأ للحقول الفارغة بشكل مخيف
      const inputs = document.querySelectorAll('input:invalid');
      inputs.forEach(input => {
        input.addEventListener('invalid', function(e) {
          this.classList.add('input-error');
        });
      });

      // تأثير عند تحريك الماوس
      document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.99) { // 1% chance
          const ghost = document.createElement('div');
          ghost.className = 'floating-ghost';
          ghost.style.left = e.clientX + 'px';
          ghost.style.top = e.clientY + 'px';
          ghost.style.fontSize = '2rem';
          ghost.style.opacity = '0.2';
          ghost.textContent = '👁️';
          ghost.style.animation = 'none';
          document.body.appendChild(ghost);
          setTimeout(() => ghost.remove(), 1000);
        }
      });
    });

    
      </script>
