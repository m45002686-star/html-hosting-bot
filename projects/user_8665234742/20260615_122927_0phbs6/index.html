<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <title>مترجم الجو الحاكم</title> <style> body { background-color: #050505; color: #00f2ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; } .container { background: #0a0a0a; padding: 20px; border: 2px solid #00f2ff; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; } textarea { width: 90%; height: 80px; background: #000; border: 1px solid #00f2ff; color: #fff; padding: 10px; margin-bottom: 10px; } iframe { width: 100%; height: 200px; border: 1px solid #00f2ff; background: #fff; margin-top: 10px; } .footer { margin-top: 20px; color: #00f2ff; } </style> </head> <body> <div class="container"> <h1>مترجم الجو الحاكم</h1> <textarea id="textInput" placeholder="اكتب النص هنا..."></textarea> <button onclick="loadTranslate()">ترجمة الآن ⚡</button> <!-- هنا هيظهر المترجم جوا موقعك --> <iframe id="transFrame" src="about:blank"></iframe> </div> <div class="footer">للتواصل مع المطور: 01143317801</div> <script> function loadTranslate() { let text = document.getElementById("textInput").value; let frame = document.getElementById("transFrame"); // رابط جوجل مترجم المباشر frame.src = "https://translate.google.com/m?sl=auto&tl=en&q=" + encodeURIComponent(text); } </script> </body> </html>
