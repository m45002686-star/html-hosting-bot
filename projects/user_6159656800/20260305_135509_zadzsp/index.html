<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال إذاعة - Telegram Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .bot-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #0088cc;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }
        
        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
            resize: vertical;
        }
        
        input[type="text"]:focus, textarea:focus {
            border-color: #0088cc;
            outline: none;
        }
        
        textarea {
            min-height: 200px;
            font-family: inherit;
        }
        
        .char-counter {
            text-align: left;
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }
        
        .message-type {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .type-option {
            flex: 1;
            text-align: center;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .type-option:hover {
            background-color: #f5f5f5;
        }
        
        .type-option.active {
            background-color: #0088cc;
            color: white;
            border-color: #0088cc;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .send-btn {
            background-color: #0088cc;
            color: white;
        }
        
        .send-btn:hover {
            background-color: #006699;
            transform: translateY(-2px);
        }
        
        .send-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .clear-btn {
            background-color: #f0f0f0;
            color: #333;
        }
        
        .clear-btn:hover {
            background-color: #e0e0e0;
        }
        
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0088cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .result-header {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .result-details {
            font-size: 14px;
            line-height: 1.6;
        }
        
        .progress-container {
            margin-top: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background-color: #0088cc;
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .message-preview {
            margin-top: 15px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border-right: 4px solid #0088cc;
            display: none;
        }
        
        .preview-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .message-type {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="bot-icon">🤖</div>
            <h1>إرسال إذاعة عبر Telegram Bot</h1>
            <p>أرسل رسالة إلى جميع مستخدمي البوت</p>
        </div>
        
        <div class="form-group">
            <label for="botToken">توكن البوت (Bot Token):</label>
            <input type="text" id="botToken" placeholder="أدخل توكن البوت الخاص بك (مثل: 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11)" />
        </div>
        
        <div class="form-group">
            <label>نوع الرسالة:</label>
            <div class="message-type">
                <div class="type-option active" data-type="text">📝 نص</div>
                <div class="type-option" data-type="html">📄 HTML</div>
                <div class="type-option" data-type="markdown">🔤 Markdown</div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="message">الرسالة:</label>
            <textarea id="message" placeholder="اكتب الرسالة التي تريد إرسالها إلى جميع المستخدمين..."></textarea>
            <div class="char-counter">عدد الأحرف: <span id="charCount">0</span></div>
        </div>
        
        <div class="message-preview" id="messagePreview">
            <div class="preview-title">معاينة الرسالة:</div>
            <div id="previewContent"></div>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText"></div>
        
        <div class="button-group">
            <button class="send-btn" id="sendBtn">
                <span>إرسال الإذاعة</span>
                <div class="loader" id="loader"></div>
            </button>
            <button class="clear-btn" id="clearBtn">مسح النموذج</button>
        </div>
        
        <div class="result-container" id="resultContainer"></div>
        
        <div class="footer">
            <p>⚠️ تأكد من صحة التوكن قبل الإرسال</p>
            <p>سيتم إرسال الرسالة إلى جميع مستخدمي البوت تدريجيًا</p>
        </div>
    </div>

    <script>
        // عناصر DOM
        const botTokenInput = document.getElementById('botToken');
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('resultContainer');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const messagePreview = document.getElementById('messagePreview');
        const previewContent = document.getElementById('previewContent');
        const typeOptions = document.querySelectorAll('.type-option');
        
        // متغيرات
        let messageType = 'text';
        let chatIds = [];
        let isSending = false;
        
        // تحديث عداد الأحرف
        messageInput.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;
            
            // تحديث المعاينة
            updatePreview();
            
            // إظهار/إخفاء المعاينة
            if (count > 0) {
                messagePreview.style.display = 'block';
            } else {
                messagePreview.style.display = 'none';
            }
        });
        
        // تغيير نوع الرسالة
        typeOptions.forEach(option => {
            option.addEventListener('click', function() {
                // إزالة النشط من جميع الخيارات
                typeOptions.forEach(opt => opt.classList.remove('active'));
                // إضافة النشط للخيار المحدد
                this.classList.add('active');
                // تحديث نوع الرسالة
                messageType = this.dataset.type;
                // تحديث المعاينة
                updatePreview();
            });
        });
        
        // تحديث معاينة الرسالة
        function updatePreview() {
            const message = messageInput.value;
            
            if (messageType === 'html') {
                previewContent.innerHTML = message;
            } else if (messageType === 'markdown') {
                // تحويل بسيط لـ Markdown
                let html = message
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code>$1</code>')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
                    .replace(/\n/g, '<br>');
                previewContent.innerHTML = html;
            } else {
                previewContent.textContent = message;
            }
        }
        
        // زر المسح
        clearBtn.addEventListener('click', function() {
            botTokenInput.value = '';
            messageInput.value = '';
            charCount.textContent = '0';
            resultContainer.style.display = 'none';
            messagePreview.style.display = 'none';
            progressContainer.style.display = 'none';
        });
        
        // زر الإرسال
        sendBtn.addEventListener('click', async function() {
            if (isSending) return;
            
            const token = botTokenInput.value.trim();
            const message = messageInput.value.trim();
            
            // التحقق من المدخلات
            if (!token) {
                showResult('error', 'خطأ', 'يرجى إدخال توكن البوت');
                return;
            }
            
            if (!message) {
                showResult('error', 'خطأ', 'يرجى إدخال الرسالة');
                return;
            }
            
            // بدء عملية الإرسال
            isSending = true;
            sendBtn.disabled = true;
            loader.style.display = 'block';
            resultContainer.style.display = 'none';
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.textContent = 'جاري تجهيز الإرسال...';
            
            try {
                // الحصول على قائمة معرفات الدردشة (المستخدمين)
                chatIds = await getChatIds(token);
                
                if (chatIds.length === 0) {
                    showResult('error', 'خطأ', 'لم يتم العثور على أي مستخدمين في البوت');
                    return;
                }
                
                progressText.textContent = `تم العثور على ${chatIds.length} مستخدم، جاري الإرسال...`;
                
                // إرسال الرسالة إلى جميع المستخدمين
                const results = await sendBroadcast(token, message, chatIds);
                
                // حساب الإحصائيات
                const successful = results.filter(r => r.success).length;
                const failed = results.filter(r => !r.success).length;
                
                // إظهار النتائج
                showResult(
                    'success', 
                    'تم الإرسال بنجاح', 
                    `تم إرسال الرسالة إلى ${successful} من ${chatIds.length} مستخدم<br>
                    <strong>النجاح:</strong> ${successful}<br>
                    <strong>الفشل:</strong> ${failed}<br><br>
                    <small>${failed > 0 ? 'قد يكون الفشل بسبب حظر المستخدم للبوت أو مشاكل في الشبكة' : ''}</small>`
                );
                
            } catch (error) {
                showResult('error', 'خطأ', error.message);
            } finally {
                // إعادة تعيين الحالة
                isSending = false;
                sendBtn.disabled = false;
                loader.style.display = 'none';
                progressContainer.style.display = 'none';
            }
        });
        
        // الحصول على معرفات جميع الدردشات (المستخدمين)
        async function getChatIds(token) {
            showResult('info', 'جاري التحميل', 'جاري الحصول على قائمة المستخدمين...');
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/getUpdates?limit=1000&offset=0`);
                const data = await response.json();
                
                if (!data.ok) {
                    throw new Error(data.description || 'خطأ في الاتصال بالبوت');
                }
                
                // استخراج معرفات الدردشة الفريدة
                const chatIdsSet = new Set();
                
                if (data.result && data.result.length > 0) {
                    data.result.forEach(update => {
                        if (update.message && update.message.chat && update.message.chat.id) {
                            chatIdsSet.add(update.message.chat.id);
                        }
                    });
                }
                
                return Array.from(chatIdsSet);
            } catch (error) {
                throw new Error(`فشل في الحصول على المستخدمين: ${error.message}`);
            }
        }
        
        // إرسال الرسالة إلى جميع المستخدمين
        async function sendBroadcast(token, message, chatIds) {
            const results = [];
            const total = chatIds.length;
            
            for (let i = 0; i < total; i++) {
                const chatId = chatIds[i];
                
                try {
                    // تحديث شريط التقدم
                    const progress = Math.round(((i + 1) / total) * 100);
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `جاري الإرسال... ${i + 1}/${total} (${progress}%)`;
                    
                    // إعداد البيانات بناءً على نوع الرسالة
                    const payload = {
                        chat_id: chatId,
                        text: message,
                        parse_mode: messageType === 'text' ? undefined : messageType.toUpperCase()
                    };
                    
                    // إرسال الرسالة
                    const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    results.push({
                        chatId: chatId,
                        success: data.ok,
                        error: data.description || null
                    });
                    
                    // تأخير بسيط لتجنب حظر من قبل Telegram
                    await new Promise(resolve => setTimeout(resolve, 100));
                    
                } catch (error) {
                    results.push({
                        chatId: chatId,
                        success: false,
                        error: error.message
                    });
                }
            }
            
            return results;
        }
        
        // إظهار النتائج
        function showResult(type, title, message) {
            resultContainer.className = `result-container ${type}`;
            resultContainer.innerHTML = `
                <div class="result-header">${title}</div>
                <div class="result-details">${message}</div>
            `;
            resultContainer.style.display = 'block';
        }
        
        // إضافة تأثيرات عند التحميل
        document.addEventListener('DOMContentLoaded', function() {
            // إضافة نص مثال
            messageInput.placeholder = `مثال: 
مرحباً أعزائي المستخدمين! 👋

نود إعلامكم بأنه سيتم إجراء صيانة للنظام يوم الجمعة القادم.

يرجى حفظ الرسائل المهمة قبل هذا التاريخ.

شكراً لتفهمكم! ❤️

- فريق الدعم`;

            // تحديث المعاينة عند التحميل
            updatePreview();
        });
    </script>
</body>
</html>
