<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>محلل البلاغات - تشارلي</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: linear-gradient(145deg, #0d0d0d 0%, #1a1a1a 100%); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; } .card { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 48px; padding: 40px 35px; max-width: 760px; width: 100%; box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 215, 0, 0.15); border: 1px solid rgba(255, 215, 0, 0.1); transition: 0.3s; } h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.5px; background: linear-gradient(135deg, #f7e05e, #f9b81b); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; } .subhead { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #333; padding-bottom: 18px; margin-bottom: 28px; flex-wrap: wrap; } .subhead span { color: #aaa; font-size: 0.95rem; background: #252525; padding: 5px 16px; border-radius: 40px; border: 1px solid #3a3a3a; } .subhead .dev { color: #f7b731; font-weight: 600; letter-spacing: 0.3px; } .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; } .input-group label { color: #ddd; font-weight: 500; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; } .input-group label i { color: #f9b81b; } .input-row { display: flex; gap: 12px; flex-wrap: wrap; } .input-row input { flex: 2; min-width: 200px; padding: 16px 22px; border-radius: 60px; border: 1px solid #3a3a3a; background: #111; color: #f0f0f0; font-size: 1.05rem; outline: none; transition: 0.25s; font-weight: 400; } .input-row input:focus { border-color: #f9b81b; box-shadow: 0 0 0 3px rgba(249, 184, 27, 0.15); background: #181818; } .input-row input::placeholder { color: #5a5a5a; font-weight: 300; } .input-row button { flex: 0.8; min-width: 120px; padding: 16px 24px; border-radius: 60px; border: none; background: linear-gradient(135deg, #f7d44a, #f5a623); color: #0d0d0d; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 14px rgba(245, 166, 35, 0.25); letter-spacing: 0.3px; } .input-row button:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(245, 166, 35, 0.4); background: linear-gradient(135deg, #fadf5e, #f6b02a); } .input-row button:active { transform: scale(0.96); } .result-area { background: #0f0f0f; border-radius: 32px; padding: 22px 25px; border: 1px solid #2a2a2a; margin-top: 12px; min-height: 260px; transition: 0.2s; } .result-header { display: flex; justify-content: space-between; color: #8a8a8a; font-size: 0.9rem; border-bottom: 1px solid #232323; padding-bottom: 14px; margin-bottom: 18px; } .result-header .badge { background: #1e1e1e; padding: 3px 16px; border-radius: 40px; color: #f9b81b; border: 1px solid #3a3a3a; font-size: 0.8rem; } #violationsList { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; } #violationsList li { background: #181818; padding: 14px 20px; border-radius: 40px; border-right: 4px solid #f9b81b; color: #eaeaea; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 1px solid #252525; border-right-width: 5px; } #violationsList li .severity { font-size: 0.75rem; padding: 4px 14px; border-radius: 40px; background: #2a2a2a; color: #bbb; } .severity.high { background: #5f1a1a; color: #ff7a7a; border: 1px solid #a33; } .severity.medium { background: #5f4a1a; color: #f7c35a; border: 1px solid #a77a2a; } .severity.low { background: #1a3a2a; color: #7acf9a; border: 1px solid #2a7a4a; } .empty-state { color: #5a5a5a; text-align: center; padding: 40px 10px; font-size: 1.05rem; } .empty-state i { font-size: 2.2rem; display: block; margin-bottom: 14px; color: #3a3a3a; } .footer-note { margin-top: 20px; font-size: 0.8rem; color: #4a4a4a; text-align: left; border-top: 1px solid #1f1f1f; padding-top: 18px; display: flex; justify-content: space-between; } .footer-note .highlight { color: #f9b81b; } .username-highlight { color: #f9b81b; font-weight: 500; } @media (max-width: 500px) { .card { padding: 28px 18px; } h1 { font-size: 1.8rem; } .input-row input { min-width: 150px; } } </style> </head> <body> <div class="card"> <h1>⚡ محلل البلاغات</h1> <div class="subhead"> <span>📋 تحليل الحساب</span> <span class="dev">👤 rrruuy</span> </div> <div class="input-group"> <label><i>🔍</i> أدخل يوزر الحساب</label> <div class="input-row"> <input type="text" id="usernameInput" placeholder="مثال: instagram_user" value="tcharlie"> <button id="analyzeBtn">تحليل</button> </div> </div> <div class="result-area" id="resultArea"> <div class="result-header"> <span>🚨 المخالفات المكتشفة</span> <span class="badge" id="violationCount">0</span> </div> <ul id="violationsList"> <li class="empty-state"> <i>📭</i> أدخل يوزر واضغط تحليل </li> </ul> </div> <div class="footer-note"> <span>🛡️ <span class="highlight">تشارلي</span> · محلل انتهاكات إنستا</span> <span>⚙️ v2.0</span> </div> </div> <script> (function() { // -------------------------------------------------------------- // قاعدة بيانات المخالفات (جميع مخالفات إنستا) // كل مخالفة مع تصنيف الجدية (عالية / متوسطة / منخفضة) // -------------------------------------------------------------- const VIOLATIONS_DB = [ { id: 1, name: 'نشر محتوى عنيف أو خطير', severity: 'high' }, { id: 2, name: 'التحريض على الكراهية', severity: 'high' }, { id: 3, name: 'مضايقة أو تنمر', severity: 'high' }, { id: 4, name: 'انتحال شخصية', severity: 'high' }, { id: 5, name: 'نشر معلومات شخصية (doxxing)', severity: 'high' }, { id: 6, name: 'انتهاك حقوق الملكية الفكرية', severity: 'high' }, { id: 7, name: 'نشاط غير قانوني', severity: 'high' }, { id: 8, name: 'إساءة استخدام التقارير', severity: 'medium' }, { id: 9, name: 'بريد عشوائي أو سبام', severity: 'medium' }, { id: 10, name: 'نشر محتوى مضلل', severity: 'medium' }, { id: 11, name: 'انتهاك سياسة العلامات التجارية', severity: 'medium' }, { id: 12, name: 'نشر محتوى جنسي صريح', severity: 'high' }, { id: 13, name: 'استهداف الفئات الضعيفة', severity: 'high' }, { id: 14, name: 'انتهاك خصوصية القاصرين', severity: 'high' }, { id: 15, name: 'الترويج للمخدرات', severity: 'high' }, { id: 16, name: 'الترويج للأسلحة', severity: 'high' }, { id: 17, name: 'نشر محتوى يتضمن إيذاء الذات', severity: 'high' }, { id: 18, name: 'انتهاك حقوق الصورة', severity: 'medium' }, { id: 19, name: 'إساءة استخدام الميزات (بوتات)', severity: 'medium' }, { id: 20, name: 'نشر إعلانات غير مرغوب فيها', severity: 'low' }, { id: 21, name: 'تكرار المنشورات', severity: 'low' }, { id: 22, name: 'استخدام هاشتاجات مضللة', severity: 'low' }, { id: 23, name: 'انتحال هوية علامة تجارية', severity: 'medium' }, { id: 24, name: 'نشر محتوى صادم بدون تحذير', severity: 'medium' }, { id: 25, name: 'انتهاك سياسة المجتمع', severity: 'medium' }, { id: 26, name: 'التلاعب بالتفاعل (شراء متابعين)', severity: 'high' }, { id: 27, name: 'انتهاك حقوق النشر', severity: 'high' }, { id: 28, name: 'نشر فيروسات أو روابط ضارة', severity: 'high' }, { id: 29, name: 'التحرش الجنسي', severity: 'high' }, { id: 30, name: 'نشر معلومات خاطئة عن الصحة', severity: 'medium' } ]; // دالة تحاكي تحليل الحساب بناءً على اليوزر // كل يوزر يعطى مجموعة مختلفة من المخالفات (لكن ثابتة لتكون متوقعة) // لكننا سنستخدم خوارزمية بسيطة تعتمد على username لاختيار مخالفات function analyzeAccount(username) { if (!username || username.trim() === '') { return []; } const clean = username.trim().toLowerCase(); // نستخدم مجموع أحرف اليوزر لتوليد عدد ثابت من المخالفات (بين 3 و 7) let hash = 0; for (let i = 0; i < clean.length; i++) { hash = ((hash << 5) - hash) + clean.charCodeAt(i); hash |= 0; // تحويل إلى 32-bit } // نأخذ القيمة المطلقة const seed = Math.abs(hash); // نحدد عدد المخالفات بناءً على seed (ما بين 3 و 7) const count = 3 + (seed % 5); // 3-7 // نختار مخالفات فريدة باستخدام المؤشرات المعتمدة على seed const indices = new Set(); let attempts = 0; while (indices.size < count && attempts < 100) { const idx = (seed + attempts * 7 + indices.size * 13) % VIOLATIONS_DB.length; indices.add(idx); attempts++; } // تحويل إلى مصفوفة من المخالفات const selected = Array.from(indices).map(idx => VIOLATIONS_DB[idx]); // إعادة ترتيب عشوائي محدد (حسب seed) return selected.sort((a, b) => { const orderA = (seed + a.id * 3) % 10; const orderB = (seed + b.id * 3) % 10; return orderA - orderB; }); } // عناصر DOM const usernameInput = document.getElementById('usernameInput'); const analyzeBtn = document.getElementById('analyzeBtn'); const violationsList = document.getElementById('violationsList'); const violationCountSpan = document.getElementById('violationCount'); // دالة عرض النتائج function renderViolations(username) { const cleanUser = username.trim(); if (cleanUser === '') { violationsList.innerHTML = ` <li class="empty-state"> <i>⚠️</i> الرجاء إدخال يوزر صحيح </li> `; violationCountSpan.textContent = '0'; return; } const violations = analyzeAccount(cleanUser); if (!violations || violations.length === 0) { violationsList.innerHTML = ` <li class="empty-state"> <i>✅</i> لا توجد مخالفات مكتشفة للحساب </li> `; violationCountSpan.textContent = '0'; return; } // بناء القائمة let html = ''; violations.forEach(v => { const severityClass = v.severity || 'low'; // ترجمة التصنيف للعرض let severityLabel = ''; if (severityClass === 'high') severityLabel = '🔴 عالية'; else if (severityClass === 'medium') severityLabel = '🟠 متوسطة'; else severityLabel = '🟢 منخفضة'; html += ` <li> <span>${v.name}</span> <span class="severity ${severityClass}">${severityLabel}</span> </li> `; }); violationsList.innerHTML = html; violationCountSpan.textContent = violations.length; } // معالج النقر على زر التحليل function handleAnalyze() { const username = usernameInput.value; renderViolations(username); } // معالج الضغط على Enter usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleAnalyze(); } }); analyzeBtn.addEventListener('click', handleAnalyze); // تحليل تلقائي عند التحميل (لليوزر الافتراضي "tcharlie") window.addEventListener('DOMContentLoaded', () => { // تعيين يوزر افتراضي usernameInput.value = 'tcharlie'; // تحليل تلقائي renderViolations('tcharlie'); }); // إضافة ديناميكية: إذا تغير اليوزر بشكل يدوي يمكن الضغط على Enter أو الزر // (تم بالفعل) // إظهار اسم المطور في الواجهة // موجود بالفعل في الـ HTML // التأكد من أن كل شيء يعمل بشكل صحيح console.log('🔍 محلل البلاغات - تشارلي | مطور: rrruuy'); })(); </script> </body> </html>
