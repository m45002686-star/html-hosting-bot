<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>📞 موقع الأرقام الوهمية</title> <script src="https://telegram.org/js/telegram-web-app.js"></script> <style> /* تصميم فخم وأنيق */ body { font-family: 'Droid Arabic Kufi', sans-serif; background: #111111; color: #EFEFEF; padding: 20px; margin: 0; text-align: right; background-image: linear-gradient(to bottom, #111111 0%, #222222 100%); } .container { max-width: 600px; margin: 0 auto; } .header { text-align: center; margin-bottom: 30px; padding: 20px 0; border-bottom: 1px solid #333333; } .logo { width: 150px; height: 150px; border-radius: 50%; border: 5px solid #00BFFF; /* أزرق سماوي */ object-fit: cover; margin-bottom: 15px; box-shadow: 0 0 20px rgba(0, 191, 255, 0.5); /* دوران بطيء ومؤثر بصرياً */ animation: spin 8s linear infinite, glow 1.5s infinite alternate; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } @keyframes glow { from { box-shadow: 0 0 10px rgba(0, 191, 255, 0.5); } to { box-shadow: 0 0 30px rgba(0, 191, 255, 0.8); } } h2 { color: #00BFFF; font-size: 28px; margin: 10px 0 5px; } .footer-note { text-align: center; font-size: 14px; color: #888888; margin-top: 20px; } /* قائمة الدول والأرقام */ .country-selector, .number-list { padding: 15px; background: #2a2a2a; border-radius: 10px; margin-bottom: 20px; } .country-button, .number-item { display: block; width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 6px; background-color: #3d3d3d; color: #FFFFFF; cursor: pointer; transition: background 0.3s; text-align: right; font-size: 16px; } .country-button:hover, .number-item:hover { background: #004c66; /* ظل أزرق أغمق */ } /* واجهة عرض الرقم والأكواد */ #number-view { display: none; /* يتم إخفاؤه في البداية */ } .selected-number-display { padding: 15px; background: #00BFFF; /* شريط الرقم بلون مميز */ color: #000000; font-size: 24px; font-weight: bold; text-align: center; border-radius: 8px; margin-bottom: 15px; } .copy-button { width: 100%; padding: 15px; background-color: #4CAF50; /* أخضر للنسخ */ color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; margin-bottom: 15px; } .copy-button:hover { background-color: #45a049; } .refresh-button { width: 100%; padding: 15px; background-color: #FF8C00; /* برتقالي للتحديث */ color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; margin-bottom: 15px; } .refresh-button:hover { background-color: #e07b00; } /* مربع الأكواد */ .codes-box { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #00BFFF; min-height: 150px; } .code-line { padding: 8px; border-bottom: 1px dashed #333333; font-size: 15px; } /* زر العودة */ .back-button { background: #888888; color: #000000; padding: 10px; border-radius: 8px; margin-top: 20px; cursor: pointer; text-align: center; } </style> </head> <body> <div class="container"> <div class="header"> <img src="https://ftyffp.serv00.net/mohmmad/my_klash_logo.png" alt="Klash Logo" class="logo"> <h2>مرحباً بكم في موقع الأرقام الوهمية</h2> <p style="color: #AAAAAA;">اختر الدولة للحصول على رقم مؤقت واستقبال الأكواد.</p> </div> <div id="country-selection"> <h3>🌐 قم الآن باختيار إحدى الدول:</h3> <div class="country-selector"> <button class="country-button" data-key="YE" onclick="loadNumbers('YE')"> 🇾🇪 اليمن +967 </button> <button class="country-button" data-key="SA" onclick="loadNumbers('SA')"> 🇸🇦 السعودية +966 </button> <button class="country-button" data-key="AE" onclick="loadNumbers('AE')"> 🇦🇪 الإمارات +971 </button> <button class="country-button" data-key="KW" onclick="loadNumbers('KW')"> 🇰🇼 الكويت +965 </button> <button class="country-button" data-key="BH" onclick="loadNumbers('BH')"> 🇧🇭 البحرين +973 </button> <button class="country-button" data-key="SY" onclick="loadNumbers('SY')"> 🇸🇾 سوريا +963 </button> <button class="country-button" data-key="IL" onclick="loadNumbers('IL')"> 🇮🇱 فلسطين المحتلة (إسرائيل) +972 </button> <button class="country-button" data-key="US" onclick="loadNumbers('US')"> 🇺🇸 أمريكا +1 </button> <button class="country-button" data-key="TR" onclick="loadNumbers('TR')"> 🇹🇷 تركيا +90 </button> <button class="country-button" data-key="UK" onclick="loadNumbers('UK')"> 🇬🇧 المملكة المتحدة +44 </button> <button class="country-button" data-key="DE" onclick="loadNumbers('DE')"> 🇩🇪 ألمانيا +49 </button> <button class="country-button" data-key="FR" onclick="loadNumbers('FR')"> 🇫🇷 فرنسا +33 </button> <button class="country-button" data-key="CA" onclick="loadNumbers('CA')"> 🇨🇦 كندا +1 </button> </div> </div> <div id="number-list-view" style="display: none;"> <div id="number-list-container" class="number-list"> </div> <button class="back-button" onclick="showCountrySelection()">🔙 العودة لاختيار الدولة</button> </div> <div id="number-view"> <h3 id="current-number-display" class="selected-number-display">الرقم المختار: +XXX XXXXXXX</h3> <button class="copy-button" onclick="copyNumber()">📋 نسخ الرقم</button> <button class="refresh-button" onclick="refreshCodes()">🔄 تحديث الأكواد</button> <div id="codes-container"> </div> <button class="back-button" onclick="showNumberList()">🔙 العودة لقائمة الأرقام</button> </div> <div class="footer-note"> حقوق المطور كلاشنكوف </div> </div> <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <script> // تهيئة Web App عند التحميل if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.setHeaderColor('#00BFFF'); Telegram.WebApp.setBackgroundColor('#111111'); } let currentSelectedNumber = ''; let currentCountryKey = ''; function showCountrySelection() { $('#country-selection').show(); $('#number-list-view').hide(); $('#number-view').hide(); } function showNumberList() { $('#country-selection').hide(); $('#number-list-view').show(); $('#number-view').hide(); } function loadNumbers(countryKey) { currentCountryKey = countryKey; $.ajax({ type: 'POST', url: window.location.href, data: { action: 'get_numbers', country_key: countryKey }, dataType: 'json', success: function(response) { if (response.success) { $('#number-list-container').html(response.html); showNumberList(); } else { if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.showAlert('❌ ' + response.message); } else { alert('❌ ' + response.message); } } }, error: function() { if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.showAlert('❌ خطأ في تحميل الأرقام.'); } else { alert('❌ خطأ في تحميل الأرقام.'); } } }); } function openNumberPage(number) { currentSelectedNumber = number; $('#current-number-display').text('الرقم المختار: ' + number); $('#country-selection').hide(); $('#number-list-view').hide(); $('#number-view').show(); refreshCodes(); // عرض الأكواد فور فتح الرقم } function refreshCodes() { if (currentSelectedNumber === '') return; $('#codes-container').html('<p style="text-align: center; color: #00BFFF;">جاري تحديث الأكواد... ⏳</p>'); $.ajax({ type: 'POST', url: window.location.href, data: { action: 'get_codes', selected_number: currentSelectedNumber }, dataType: 'json', success: function(response) { if (response.success) { $('#codes-container').html(response.html); } else { $('#codes-container').html('<p style="text-align: center; color: red;">❌ فشل في جلب الأكواد.</p>'); } }, error: function() { $('#codes-container').html('<p style="text-align: center; color: red;">❌ خطأ في الاتصال بالخادم لجلب الأكواد.</p>'); } }); } function copyNumber() { if (currentSelectedNumber === '') return; const tempInput = document.createElement("textarea"); tempInput.value = currentSelectedNumber; document.body.appendChild(tempInput); tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput); if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.showAlert('✅ تم نسخ الرقم: ' + currentSelectedNumber); } else { alert('✅ تم نسخ الرقم: ' + currentSelectedNumber); } } $(document).ready(function() { showCountrySelection(); // ابدأ بصفحة اختيار الدولة }); </script> </body> </html>
