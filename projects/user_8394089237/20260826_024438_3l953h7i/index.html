{ color: #777; font-size: 13px; } /* شبكة الصور التجريبية */ .grid-title { font-size: 14px; color: #888; margin-bottom: 12px; text-align: right; } .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .grid img { width: 100%; height: 95px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 1px solid #222; transition: 0.2s; } .grid img:active { transform: scale(0.95); } </style> </head> <body> <!-- 1. شاشة التحميل --> <div id="loading-screen"> <div class="logo-box">Remini</div> <div class="spinner"></div> </div> <!-- 2. الواجهة الرئيسية --> <div id="main-content"> <div class="header-title">✨ Remini Pro Editor</div> <!-- زر رفع الصورة من المعرض --> <input type="file" id="fileInput" accept="image/*" style="display: none;"> <div class="upload-card" onclick="document.getElementById('fileInput').click()"> <div class="upload-icon">☁️</div> <h3>اختر صورة للتعديل</h3> <p>اضغط هنا لرفع صورتك مباشرة من معرض الهاتف</p> </div> <div class="grid-title">أو اختر صورة تجريبية للتجربة السريعة:</div> <div class="grid"> <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb" onclick="selectPreset(this)"> <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d" onclick="selectPreset(this)"> <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9" onclick="selectPreset(this)"> </div> </div> <script> const tg = window.Telegram.WebApp; tg.expand(); // جعل التطبيق يفتح بملء الشاشة // إخفاء شاشة التحميل بعد 1.5 ثانية بسلاسة setTimeout(() => { const loader = document.getElementById('loading-screen'); loader.style.opacity = '0'; setTimeout(() => { loader.style.display = 'none'; document.getElementById('main-content').style.display = 'block'; }, 400); }, 1500); // عند اختيار صورة من المعرض document.getElementById('fileInput').addEventListener('change', function(event) { const file = event.target.files[0]; if (file) { // إرسال البيانات للبوت وإغلاق الـ Mini App tg.sendData(JSON.stringify({ action: "upload", name: file.name })); tg.close(); } }); // عند اختيار صورة جاهزة function selectPreset(imgElement) { tg.sendData(JSON.stringify({ action: "preset", url: imgElement.src })); tg.close(); } </script> </body> </html>
