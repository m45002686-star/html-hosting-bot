
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBR SITE DANCE PLAYER</title>
    <style>
        :root {
            --fire-color: #ff4500;
            --lava-gradient: linear-gradient(180deg, #ff8c00, #ff4500, #8b0000);
            --dark-bg: #0a0a0a;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at center, #2c0a00 0%, #0a0a0a 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.2; z-index: -1;
        }

        header { 
            text-align: center; 
            padding: 50px 0; 
        }

        .fire-frame {
            display: inline-block;
            padding: 15px 45px;
            border: 3px solid #e23e00; 
            position: relative;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(226, 62, 0, 0.4);
            background: rgba(0, 0, 0, 0.6);
        }

        .fire-frame::after {
            content: "";
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border: 1px solid #ff8c00;
            border-radius: 16px;
            opacity: 0.5;
        }

        h1 {
            font-size: 2.8rem; 
            margin: 0; 
            letter-spacing: 4px; 
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 1px 1px 2px #000, 0 0 8px rgba(255, 69, 0, 0.6); 
        }

        .container {
            max-width: 900px; margin: 0 auto;
            background: rgba(20, 20, 20, 0.95); padding: 30px;
            border: 2px solid #ff4500; border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 69, 0, 0.3);
        }

        .input-group { margin-bottom: 25px; }

        label { display: block; margin-bottom: 12px; color: #ffa500; font-weight: bold; font-size: 1.1rem; }

        input {
            width: 100%; padding: 15px; background: #151515; border: 1px solid #444;
            color: #fff; border-radius: 10px; font-size: 1.1rem; box-sizing: border-box;
            outline: none; transition: 0.3s; border-left: 5px solid #ff4500;
        }

        input:focus { border-color: #ff8c00; box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); }

        .id-container { display: flex; gap: 10px; margin-bottom: 10px; }

        .btn-add {
            background: #ff4500; border: none; color: white; padding: 0 20px;
            border-radius: 10px; cursor: pointer; font-size: 1.8rem;
            display: flex; align-items: center; justify-content: center;
        }

        .emotes-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px; margin-top: 20px;
        }

        .emote-card {
            background: #1a1a1a; border: 2px solid #333; border-radius: 12px;
            padding: 8px; cursor: pointer; transition: 0.4s; text-align: center;
        }

        .emote-card:hover {
            border-color: #ff4500; transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.5);
        }

        .emote-card img { width: 100%; height: auto; border-radius: 8px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1a1a1a; padding: 40px; border-radius: 25px; border: 4px solid #ff4500;
            text-align: center; box-shadow: 0 0 60px #ff4500;
        }

        .modal-content h2 { color: #ff4500; font-size: 3rem; margin: 0; }

        .modal-content p { color: #ff8c00; margin-top: 15px; font-weight: bold; }

        .btn-close {
            margin-top: 25px; background: #fff; border: none; padding: 12px 40px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="fire-frame">
            <h1>𝐖𝐄𝐋𝐂𝐎𝐌𝐄 𝐒𝐁𝐑 𝐖𝐄𝐁</h1>
        </div>
    </header>

            <input type="text" id="teamCode" placeholder="𝐄𝐗 : 𝟒𝟎𝟒𝟔𝟒𝟓𝟓">
        </div>

        <div class="input-group">
            <label>𝐄𝐍𝐓𝐄𝐑 𝐈𝐃 𝐏𝐋𝐀𝐘𝐄𝐑</label>
            <div id="idInputs">
                <div class="id-container">
                    <input type="text" class="player-id" placeholder="𝐄𝐗 : 𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖">
                    <button class="btn-add" onclick="addNewIdInput()">+</button>
                </div>
            </div>
        </div>

        <p style="text-align: center; color: #ff8c00;">𝐒𝐄𝐋𝐄𝐂𝐓 𝐄𝐌𝐎𝐓𝐄 𝐓𝐎 𝐀𝐂𝐓𝐈𝐕𝐀𝐓𝐄 𝐃𝐈𝐑𝐄𝐂𝐓𝐋𝐘</p>
        <div class="emotes-grid" id="emotesGrid"></div>
    </div>

            card.className = 'emote-card';
            card.innerHTML = `<img src="https://cdn.jsdelivr.net/gh/ShahGCreator/icon@main/PNG/${id}.png" loading="lazy">`;

        function addNewIdInput() {
            const container = document.getElementById('idInputs');
            if(container.getElementsByClassName('id-container').length < 5) {
                const div = document.createElement('div');
                div.className = 'id-container';
                div.innerHTML = `<input type="text" class="player-id" placeholder="Enter Player ID">`;
                container.appendChild(div);
            }
        }

        function sendDance(emoteId) {
            const tc = document.getElementById('teamCode').value;
            const ids = Array.from(document.getElementsByClassName('player-id')).map(i => i.value);
            if(!tc || !ids[0]) { alert("Please enter Team Code and Player ID first!"); return; }

            ids.forEach((id, index) => { if(id) url += `&uid${index+1}=${id}`; });

            fetch(url, { mode: 'no-cors' }).catch(() => {});
