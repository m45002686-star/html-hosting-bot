<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>مواقيت الصلاة - Alsohagy</title> <!-- Google Fonts --> <link rel="preconnect" href="https://fonts.googleapis.com" /> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" /> <style> /* ===== RESET & BASE ===== */ * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Tajawal', sans-serif; background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #e8e0d4; position: relative; } /* خلفية زخرفية إسلامية */ body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 50%), radial-gradient(circle at 80% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 50%), repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(212, 175, 55, 0.02) 40px, rgba(212, 175, 55, 0.02) 41px); pointer-events: none; z-index: 0; } /* ===== CONTAINER ===== */ .container { position: relative; z-index: 1; width: 100%; max-width: 820px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius: 48px; border: 1px solid rgba(212, 175, 55, 0.25); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(212, 175, 55, 0.15); padding: 40px 35px 30px; transition: all 0.3s ease; } /* ===== HEADER ===== */ .header { text-align: center; margin-bottom: 32px; position: relative; } .header .logo { font-family: 'Amiri', serif; font-size: 2.6rem; font-weight: 700; color: #d4af37; letter-spacing: 2px; text-shadow: 0 2px 20px rgba(212, 175, 55, 0.25); position: relative; display: inline-block; } .header .logo::after { content: '✦'; font-size: 1.2rem; color: #d4af37; margin-right: 12px; opacity: 0.6; } .header .logo::before { content: '✦'; font-size: 1.2rem; color: #d4af37; margin-left: 12px; opacity: 0.6; } .header .subtitle { font-size: 0.95rem; font-weight: 300; color: #b8ad9a; margin-top: 6px; letter-spacing: 3px; } .header .divider { width: 80px; height: 2px; background: linear-gradient(90deg, transparent, #d4af37, transparent); margin: 12px auto 0; border-radius: 4px; } /* ===== DATE & LOCATION ===== */ .info-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.25); border-radius: 60px; padding: 10px 22px; margin-bottom: 28px; border: 1px solid rgba(212, 175, 55, 0.10); gap: 12px; } .info-bar .date-box { display: flex; align-items: center; gap: 14px; font-size: 0.95rem; } .info-bar .date-box .gregorian { color: #c9bfae; font-weight: 300; } .info-bar .date-box .hijri { color: #d4af37; font-weight: 500; background: rgba(212, 175, 55, 0.12); padding: 2px 14px; border-radius: 30px; font-size: 0.9rem; } .info-bar .location-box { display: flex; align-items: center; gap: 10px; } .info-bar .location-box .city-label { color: #b8ad9a; font-size: 0.85rem; } .info-bar .location-box .city-name { color: #d4af37; font-weight: 500; font-size: 1.05rem; } /* ===== SEARCH ===== */ .search-area { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; } .search-area input { flex: 1; min-width: 180px; padding: 14px 22px; border-radius: 60px; border: 1px solid rgba(212, 175, 55, 0.20); background: rgba(255, 255, 255, 0.06); color: #e8e0d4; font-size: 1rem; font-family: 'Tajawal', sans-serif; outline: none; transition: all 0.3s ease; backdrop-filter: blur(4px); } .search-area input::placeholder { color: #8a7e6a; font-weight: 300; } .search-area input:focus { border-color: #d4af37; background: rgba(255, 255, 255, 0.10); box-shadow: 0 0 25px rgba(212, 175, 55, 0.08); } .search-area button { padding: 14px 34px; border-radius: 60px; border: none; background: linear-gradient(135deg, #d4af37, #b8942e); color: #0b1a2e; font-weight: 700; font-size: 1rem; font-family: 'Tajawal', sans-serif; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; white-space: nowrap; } .search-area button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.25); } .search-area button:active { transform: scale(0.97); } /* ===== PRAYER TIMES GRID ===== */ .prayer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; margin-bottom: 30px; } .prayer-card { background: rgba(255, 255, 255, 0.04); border-radius: 24px; padding: 20px 12px 18px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; position: relative; overflow: hidden; } .prayer-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #d4af37, transparent); opacity: 0; transition: opacity 0.3s ease; } .prayer-card:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-4px); border-color: rgba(212, 175, 55, 0.15); } .prayer-card:hover::before { opacity: 1; } .prayer-card .prayer-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; opacity: 0.7; } .prayer-card .prayer-name { font-size: 1rem; font-weight: 500; color: #d4af37; margin-bottom: 4px; } .prayer-card .prayer-time { font-size: 1.5rem; font-weight: 700; font-family: 'Amiri', serif; color: #f0ebe0; letter-spacing: 1px; direction: ltr; } .prayer-card.active { background: rgba(212, 175, 55, 0.12); border-color: rgba(212, 175, 55, 0.30); box-shadow: 0 0 40px rgba(212, 175, 55, 0.05); } .prayer-card.active .prayer-name { color: #f5d76e; } .prayer-card.active .prayer-time { color: #f5d76e; } .prayer-card.active::before { opacity: 1; } /* ===== NEXT PRAYER ===== */ .next-prayer { text-align: center; background: rgba(212, 175, 55, 0.07); border-radius: 60px; padding: 16px 24px; border: 1px solid rgba(212, 175, 55, 0.12); margin-bottom: 28px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 16px 28px; } .next-prayer .label { font-size: 1rem; color: #b8ad9a; font-weight: 300; } .next-prayer .prayer-name { font-size: 1.3rem; font-weight: 700; color: #d4af37; } .next-prayer .countdown { font-size: 1.6rem; font-weight: 700; font-family: 'Amiri', serif; color: #f0ebe0; background: rgba(0, 0, 0, 0.25); padding: 4px 24px; border-radius: 40px; letter-spacing: 2px; direction: ltr; min-width: 120px; display: inline-block; } .next-prayer .countdown.warning { color: #f1c40f; animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } } /* ===== FOOTER ===== */ .footer { text-align: center; padding-top: 22px; margin-top: 10px; border-top: 1px solid rgba(212, 175, 55, 0.08); font-size: 0.85rem; color: #8a7e6a; letter-spacing: 1px; } .footer .rights { font-weight: 500; color: #b8ad9a; } .footer .rights span { color: #d4af37; font-family: 'Amiri', serif; font-size: 1rem; } .footer .small-note { font-size: 0.7rem; margin-top: 4px; opacity: 0.5; } /* ===== LOADING ===== */ .loading { text-align: center; padding: 30px 0; color: #b8ad9a; font-weight: 300; } .loading .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.15); border-top: 3px solid #d4af37; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 12px; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } /* ===== ERROR ===== */ .error-msg { text-align: center; color: #e74c3c; background: rgba(231, 76, 60, 0.10); padding: 14px 20px; border-radius: 16px; border: 1px solid rgba(231, 76, 60, 0.15); margin-bottom: 20px; font-weight: 300; } /* ===== RESPONSIVE ===== */ @media (max-width: 640px) { .container { padding: 24px 16px 20px; border-radius: 32px; } .header .logo { font-size: 2rem; } .header .logo::before, .header .logo::after { font-size: 0.9rem; margin: 0 6px; } .info-bar { flex-direction: column; align-items: stretch; text-align: center; padding: 14px 16px; border-radius: 30px; } .info-bar .date-box { justify-content: center; flex-wrap: wrap; } .info-bar .location-box { justify-content: center; } .search-area { flex-direction: column; } .search-area input { min-width: unset; width: 100%; } .search-area button { justify-content: center; width: 100%; } .prayer-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } .prayer-card { padding: 14px 6px 12px; } .prayer-card .prayer-time { font-size: 1.2rem; } .next-prayer { flex-direction: column; gap: 10px; padding: 18px 16px; border-radius: 30px; } .next-prayer .countdown { font-size: 1.4rem; min-width: 100px; } } @media (max-width: 400px) { .prayer-grid { grid-template-columns: repeat(2, 1fr); } .header .logo { font-size: 1.6rem; } } </style> </head> <body> <div class="container" id="app"> <!-- ===== HEADER ===== --> <div class="header"> <div class="logo">مواقيت الصلاة</div> <div class="subtitle">أوقات الصلاة حسب التوقيت المحلي</div> <div class="divider"></div> </div> <!-- ===== INFO BAR ===== --> <div class="info-bar" id="infoBar"> <div class="date-box"> <span class="gregorian" id="gregorianDate">--</span> <span class="hijri" id="hijriDate">--</span> </div> <div class="location-box"> <span class="city-label">📍</span> <span class="city-name" id="cityName">القاهرة</span> </div> </div> <!-- ===== SEARCH ===== --> <div class="search-area"> <input type="text" id="cityInput" placeholder="ابحث عن مدينة ..." value="القاهرة" /> <button id="searchBtn">🔍 بحث</button> </div> <!-- ===== ERROR ===== --> <div id="errorContainer"></div> <!-- ===== PRAYER GRID ===== --> <div id="prayerGrid" class="prayer-grid"> <!-- يتم تعبئتها بواسطة JavaScript --> </div> <!-- ===== NEXT PRAYER ===== --> <div class="next-prayer" id="nextPrayer"> <span class="label">الصلاة القادمة</span> <span class="prayer-name" id="nextPrayerName">--</span> <span class="countdown" id="countdownTimer">--:--:--</span> </div> <!-- ===== FOOTER ===== --> <div class="footer"> <div class="rights">جميع الحقوق محفوظة &copy; <span>Alsohagy</span> 2026</div> <div class="small-note">مواقيت الصلاة مبنية على الحسابات الفلكية</div> </div> </div> <script> // ============================================================ // Alsohagy – Prayer Times App // جميع الحقوق محفوظة © Alsohagy // ============================================================ (function() { 'use strict'; // ---- DOM refs ---- const cityInput = document.getElementById('cityInput'); const searchBtn = document.getElementById('searchBtn'); const cityNameEl = document.getElementById('cityName'); const gregorianEl = document.getElementById('gregorianDate'); const hijriEl = document.getElementById('hijriDate'); const prayerGrid = document.getElementById('prayerGrid'); const nextPrayerName = document.getElementById('nextPrayerName'); const countdownTimer = document.getElementById('countdownTimer'); const errorContainer = document.getElementById('errorContainer'); // ---- State ---- let currentCity = 'القاهرة'; let prayerTimes = null; // { Fajr, Dhuhr, Asr, Maghrib, Isha } let nextPrayerId = null; // 'Fajr' | 'Dhuhr' | ... let countdownInterval = null; let isFetching = false; // ---- Prayer order (for determining "next") ---- const PRAYER_ORDER = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha']; const PRAYER_NAMES_AR = { Fajr: 'الفجر', Dhuhr: 'الظهر', Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء' }; const PRAYER_ICONS = { Fajr: '🌙', Dhuhr: '☀️', Asr: '🌤️', Maghrib: '🌅', Isha: '🌙' }; // ---- Helpers ---- function formatTime(timeStr) { // timeStr: "12:34" or "12:34:56" const parts = timeStr.split(':'); return parts.length >= 2 ? parts[0] + ':' + parts[1] : timeStr; } function to24h(timeStr) { // Convert "12:34 (AM/PM)" or "12:34" to 24h minutes // We'll assume the API returns 24h format, but just in case. const clean = timeStr.replace(/\s*(AM|PM)\s*/i, '').trim(); const parts = clean.split(':'); if (parts.length < 2) return 0; let h = parseInt(parts[0], 10); const m = parseInt(parts[1], 10) || 0; const isPM = /PM/i.test(timeStr); if (isPM && h < 12) h += 12; if (!isPM && h === 12) h = 0; return h * 60 + m; } function getTimeInMinutes(timeStr) { // Accept "HH:MM" or "HH:MM:SS" const parts = timeStr.split(':'); if (parts.length < 2) return 0; const h = parseInt(parts[0], 10) || 0; const m = parseInt(parts[1], 10) || 0; return h * 60 + m; } function minutesToTime(min) { const h = Math.floor(min / 60); const m = Math.floor(min % 60); return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); } function getCurrentMinutes() { const now = new Date(); return now.getHours() * 60 + now.getMinutes(); } // ---- Fetch prayer times from Aladhan API ---- async function fetchPrayerTimes(city) { if (isFetching) return; isFetching = true; showLoading(); try { // Use Aladhan API (timingsByCity) const url = `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=EG&method=5`; const response = await fetch(url); if (!response.ok) throw new Error('فشل الاتصال بالخادم'); const data = await response.json(); if (data.code !== 200 || !data.data) { throw new Error(data.status || 'خطأ في البيانات'); } const timings = data.data.timings; const date = data.data.date; // Extract prayer times const prayers = { Fajr: timings.Fajr, Dhuhr: timings.Dhuhr, Asr: timings.Asr, Maghrib: timings.Maghrib, Isha: timings.Isha }; // Hijri & Gregorian const greg = date.gregorian; const hijri = date.hijri; return { city: city, prayers: prayers, gregorian: greg.date, hijri: hijri.day + ' ' + hijri.month.en + ' ' + hijri.year, readableDate: greg.weekday.en + ', ' + greg.date, }; } catch (err) { throw new Error(err.message || 'حدث خطأ غير متوقع'); } finally { isFetching = false; } } // ---- Render UI ---- function render(data) { const { city, prayers, gregorian, hijri } = data; // Update city & date cityNameEl.textContent = city; gregorianEl.textContent = gregorian; hijriEl.textContent = '🕌 ' + hijri; // Store prayers prayerTimes = prayers; // Build grid let html = ''; for (const key of PRAYER_ORDER) { const time = prayers[key] || '--:--'; const nameAr = PRAYER_NAMES_AR[key] || key; const icon = PRAYER_ICONS[key] || '🕌'; const formatted = formatTime(time); html += ` <div class="prayer-card" data-prayer="${key}"> <span class="prayer-icon">${icon}</span> <div class="prayer-name">${nameAr}</div> <div class="prayer-time">${formatted}</div> </div> `; } prayerGrid.innerHTML = html; // Determine next prayer & start countdown determineNextPrayer(prayers); startCountdown(); // Clear any error errorContainer.innerHTML = ''; } function showLoading() { prayerGrid.innerHTML = ` <div class="loading" style="grid-column:1/-1;"> <div class="spinner"></div> <div>جاري تحميل المواقيت ...</div> </div> `; nextPrayerName.textContent = '--'; countdownTimer.textContent = '--:--:--'; } function showError(msg) { errorContainer.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`; prayerGrid.innerHTML = ` <div style="grid-column:1/-1; text-align:center; padding:30px 0; color:#8a7e6a;"> لا توجد بيانات لعرضها </div> `; nextPrayerName.textContent = '--'; countdownTimer.textContent = '--:--:--'; if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; } } // ---- Determine next prayer ---- function determineNextPrayer(prayers) { const now = getCurrentMinutes(); let next = null; let nextTimeMin = Infinity; for (const key of PRAYER_ORDER) { const t = prayers[key]; if (!t) continue; const min = getTimeInMinutes(t); // إذا كان الوقت لا يزال في المستقبل (أو نفس الدقيقة) if (min > now) { if (min < nextTimeMin) { nextTimeMin = min; next = key; } } } // إذا لم نجد صلاة في المستقبل → أول صلاة في الغد (الفجر) if (!next) { // نأخذ الفجر كأول صلاة في اليوم التالي const fajrMin = getTimeInMinutes(prayers.Fajr || '00:00'); // ولكن نعرضها كـ "الفجر" مع احتساب الوقت المتبقي حتى الفجر غداً next = 'Fajr'; // نحتاج لحساب الوقت المتبقي بشكل خاص: (24h - now) + fajrMin const remainingToday = 1440 - now; const totalRemaining = remainingToday + fajrMin; // سنتعامل معه في countdown window._nextIsTomorrow = true; window._tomorrowFajrMin = fajrMin; } else { window._nextIsTomorrow = false; } nextPrayerId = next; const nameAr = PRAYER_NAMES_AR[next] || next; nextPrayerName.textContent = nameAr; // Highlight active card document.querySelectorAll('.prayer-card').forEach(el => { el.classList.remove('active'); if (el.dataset.prayer === next) { el.classList.add('active'); } }); } // ---- Countdown ---- function startCountdown() { if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; } function update() { if (!prayerTimes || !nextPrayerId) { countdownTimer.textContent = '--:--:--'; return; } const now = getCurrentMinutes(); const prayerTimeStr = prayerTimes[nextPrayerId]; if (!prayerTimeStr) { countdownTimer.textContent = '--:--:--'; return; } let targetMin = getTimeInMinutes(prayerTimeStr); // إذا كانت الصلاة في الغد (تم تحديدها سابقاً) if (window._nextIsTomorrow) { // targetMin هو وقت الفجر، نحتاج إلى إضافة 24h const fajrMin = window._tomorrowFajrMin || targetMin; // الوقت المتبقي = (1440 - now) + fajrMin let diff = (1440 - now) + fajrMin; if (diff < 0) diff = 0; if (diff > 1440) diff = 1440; // حد أقصى updateCountdownDisplay(diff); return; } let diff = targetMin - now; if (diff < 0) { // إذا فاتت الصلاة، نعيد تحديد التالي determineNextPrayer(prayerTimes); // نستدعي التحديث مجدداً بعد إعادة التحديد setTimeout(update, 100); return; } updateCountdownDisplay(diff); } function updateCountdownDisplay(diffMinutes) { if (diffMinutes < 0) diffMinutes = 0; const totalSec = Math.floor(diffMinutes * 60); const h = Math.floor(totalSec / 3600); const m = Math.floor((totalSec % 3600) / 60); const s = totalSec % 60; const str = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); countdownTimer.textContent = str; // تحذير إذا كان الوقت أقل من 15 دقيقة if (diffMinutes < 15 && diffMinutes > 0) { countdownTimer.classList.add('warning'); } else { countdownTimer.classList.remove('warning'); } // إذا انتهى الوقت، نحدّث if (diffMinutes <= 0) { // إعادة تحديد الصلاة القادمة if (prayerTimes) { determineNextPrayer(prayerTimes); // تحديث بعد 1 ثانية setTimeout(() => { if (countdownInterval) update(); }, 1000); } } } // تحديث كل ثانية update(); countdownInterval = setInterval(update, 1000); } // ---- Main load function ---- async function loadCity(city) { if (!city || city.trim() === '') { showError('الرجاء إدخال اسم مدينة'); return; } city = city.trim(); try { const data = await fetchPrayerTimes(city); currentCity = city; render(data); } catch (err) { showError(err.message || 'تعذر الحصول على المواقيت. تأكد من اسم المدينة.'); } } // ---- Event listeners ---- searchBtn.addEventListener('click', function() { const val = cityInput.value.trim(); if (val) { loadCity(val); } else { showError('الرجاء إدخال اسم مدينة'); } }); cityInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { searchBtn.click(); } }); // ---- Init ---- // تحميل المدينة الافتراضية (القاهرة) loadCity('القاهرة'); // ---- حفظ الحقوق ---- console.log('© Alsohagy - جميع الحقوق محفوظة'); })(); </script> </body> </html>
