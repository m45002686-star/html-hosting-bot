<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>CYBER ARENA - ONLINE FIX</title> <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet"> <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script> <style> :root { --neon: #00f2ff; --warn: #ff4757; --accent: #1e90ff; --gold: #ffce00; } * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; touch-action: none; } body { background: #0c0c0e; color: white; width: 100vw; height: 100vh; overflow: hidden; } #lobby { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle, #1a1a2e, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; } .menu-card { background: rgba(20, 20, 30, 0.95); padding: 25px; border-radius: 25px; border: 2px solid var(--neon); width: 90%; max-width: 450px; text-align: center; } .id-box { background: #000; padding: 15px; border-radius: 12px; color: var(--gold); font-size: 14px; margin: 15px 0; border: 1px dashed var(--gold); font-family: monospace; word-break: break-all; cursor: pointer; } .skin-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; } .skin-item { height: 40px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; } .skin-item.active { border-color: white; transform: scale(1.1); box-shadow: 0 0 10px white; } #game-view { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; } .hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; } .bar { width: 140px; height: 12px; background: #333; border: 1px solid #fff; border-radius: 10px; overflow: hidden; margin-top: 5px; } .fill { height: 100%; transition: 0.2s; } .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; } .btn-move { width: 75px; height: 75px; background: rgba(255,255,255,0.1); border: 2px solid var(--neon); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; } .btn-fire { width: 110px; height: 110px; background: var(--warn); border: 2px solid white; border-radius: 50%; color: white; font-weight: 900; display: flex; align-items: center; justify-content: center; } </style> </head> <body> <div id="lobby"> <div class="menu-card"> <h1 style="color:var(--neon)">ميدان التحدي أونلاين</h1> <p style="font-size:11px; color:#888;">اضغط على المعرف لنسخه:</p> <div class="id-box" id="my-id" onclick="copyId()">جاري استخراج المعرف...</div> <div class="skin-selector" id="skins"> <div class="skin-item active" style="background:var(--neon)" onclick="selectSkin(0, '#00f2ff', 'rect')"></div> <div class="skin-item" style="background:var(--gold)" onclick="selectSkin(1, '#ffce00', 'circle')"></div> <div class="skin-item" style="background:#2ed573" onclick="selectSkin(2, '#2ed573', 'tri')"></div> <div class="skin-item" style="background:#ff4757" onclick="selectSkin(3, '#ff4757', 'diamond')"></div> </div> <input type="text" id="peer-id-input" placeholder="ألصق ID صديقك هنا..." style="width:100%; padding:14px; border-radius:10px; border:none; background:#222; color:white; margin-bottom:10px; text-align:center;"> <button onclick="connectToPeer()" style="width:100%; padding:15px; background:var(--accent); border:none; color:white; border-radius:10px; font-weight:bold;">إرسال طلب قتال ⚔️</button> </div> </div> <div id="game-view"> <div class="hud"> <div>أنت<div class="bar"><div id="hp1" class="fill" style="width:100%; background:var(--neon);"></div></div></div> <div>الخصم<div class="bar"><div id="hp2" class="fill" style="width:100%; background:var(--warn);"></div></div></div> </div> <canvas id="gameCanvas"></canvas> <div class="controls"> <div style="display:flex; gap:10px;"> <div class="btn-move" ontouchstart="move(-35)">◀</div> <div class="btn-move" ontouchstart="move(35)">▶</div> </div> <div class="btn-fire" ontouchstart="fire()">إطلاق</div> </div> </div> <script> let peer, conn, myId; let mySkin = { color: '#00f2ff', type: 'rect' }; let enemySkin = { color: '#ff4757', type: 'rect' }; let p1 = { x: 50, y: 0 }, p2 = { x: 0, y: 0 }; let bullets = [], hp1 = 100, hp2 = 100, isGaming = false; // إعداد الاتصال مع خوادم جوجل لتسهيل الربط peer = new Peer({ config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } }); peer.on('open', id => { myId = id; document.getElementById('my-id').innerText = id; }); peer.on('error', err => { alert("خطأ في الاتصال: " + err.type); console.error(err); }); // استقبال الطلبات peer.on('connection', c => { if(confirm("وصلتك دعوة قتال! هل تقبل التحدي؟")) { conn = c; setupConnection(); } }); function connectToPeer() { const targetId = document.getElementById('peer-id-input').value.trim(); if(!targetId) return alert("يرجى إدخال ID الصديق"); conn = peer.connect(targetId); setupConnection(); } function setupConnection() { conn.on('open', () => { conn.send({ type: 'init', skin: mySkin }); startGame(); }); conn.on('data', data => { if(data.type === 'init') { enemySkin = data.skin; conn.send({ type: 'init-reply', skin: mySkin }); startGame(); } if(data.type === 'init-reply') enemySkin = data.skin; if(data.type === 'm') p2.x = window.innerWidth - data.x - 50; if(data.type === 'f') bullets.push({ x: p2.x + 25, y: p2.y + 40, mine: false }); if(data.type === 'h') { hp1 -= 10; document.getElementById('hp1').style.width = hp1 + "%"; if(hp1 <= 0) alert("خسرت المعركة!"); } }); } function selectSkin(idx, color, type) { mySkin = { color, type }; document.querySelectorAll('.skin-item').forEach((el, i) => el.classList.toggle('active', i === idx)); } function copyId() { navigator.clipboard.writeText(myId); alert("تم نسخ المعرف بنجاح!"); } function startGame() { document.getElementById('lobby').style.display = 'none'; document.getElementById('game-view').style.display = 'block'; p1.y = window.innerHeight - 180; p2.y = window.innerHeight - 180; isGaming = true; setInterval(() => { if(conn && conn.open) conn.send({ type: 'm', x: p1.x }); }, 45); requestAnimationFrame(draw); } function move(d) { if(p1.x + d > 0 && p1.x + d < window.innerWidth - 60) p1.x += d; } function fire() { bullets.push({ x: p1.x + 25, y: p1.y + 40, mine: true }); conn.send({ type: 'f' }); } function draw() { if(!isGaming) return; const ctx = document.getElementById('gameCanvas').getContext('2d'); ctx.canvas.width = window.innerWidth; ctx.canvas.height = window.innerHeight; ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height); // رسم اللاعبين [ {p:p1, s:mySkin}, {p:p2, s:enemySkin} ].forEach(obj => { ctx.fillStyle = obj.s.color; if(obj.s.type === 'rect') ctx.fillRect(obj.p.x, obj.p.y, 50, 80); else { ctx.beginPath(); ctx.arc(obj.p.x+25, obj.p.y+40, 30, 0, Math.PI*2); ctx.fill(); } }); // الرصاص bullets.forEach((b, i) => { b.y -= (b.mine ? 12 : -12); ctx.fillStyle = b.mine ? 'white' : 'red'; ctx.fillRect(b.x-2, b.y, 4, 15); if(b.mine && b.y < p2.y+80 && b.y > p2.y && Math.abs(b.x - (p2.x+25)) < 25) { hp2 -= 10; document.getElementById('hp2').style.width = hp2+"%"; conn.send({ type: 'h' }); bullets.splice(i,1); if(hp2 <= 0) alert("فوز ساحق!"); } }); requestAnimationFrame(draw); } </script> </body> </html>
