<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire & Ice Hosting</title>
    <style>
        /* ديزاين */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0000 0%, #00001a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* ديزاين*/
        .mega-container {
            width: 80%;
            max-width: 900px;
            min-height: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 4px solid;
            border-image: linear-gradient(to right, #ff4500, #00eeff) 1;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, #ff4500, #00eeff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        /* تنسيق المدخلات */
        input[type="text"], input[type="number"] {
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1.2rem;
            text-align: center;
        }

        button {
            padding: 15px 50px;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: linear-gradient(45deg, #ff4500, #00eeff);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }

        /* page 2*/
        #upload-section {
            display: none;
        }

        .drop-zone {
            width: 100%;
            height: 200px;
            border: 2px dashed #00eeff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            cursor: pointer;
        }

        .loading-bar {
            width: 0%;
            height: 10px;
            background: #ff4500;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="mega-container" id="main-box">
        <div id="setup-section">
            <h1>HOST SITE WEB</h1>
            <label>DONNER NOM DE PROJET</label>
            <input type="text" id="proj-name" placeholder="اسم مشروعك هنا...">
            
            <div style="margin-top: 20px;">
                <p>أثبت أنك لست روبوت: <span id="num1"></span> + <span id="num2"></span> = ؟</p>
                <input type="number" id="captcha-answer" placeholder="النتيجة">
            </div>
            
            <button onclick="goToUpload()">SEND</button>
        </div>

        <div id="upload-section">
            <h1>رفع الملفات</h1>
            <p>مشروعك: <span id="display-name" style="color: #00eeff;"></span></p>
            
            <div class="drop-zone" onclick="document.getElementById('file-input').click()">
         ضع ملف HTML
                <input type="file" id="file-input" style="display:none" accept=".html" onchange="startUpload()">
            </div>

            <div id="status-msg"></div>
            <div class="loading-bar" id="progress"></div>
            <div id="link-result" style="margin-top: 20px; font-weight: bold; color: #adff2f;"></div>
        </div>
    </div>

    <script>
        // توليد أرقام  للـ Captcha
        const n1 = Math.floor(Math.random() * 10) + 1;
        const n2 = Math.floor(Math.random() * 10) + 1;
        document.getElementById('num1').innerText = n1;
        document.getElementById('num2').innerText = n2;

        function goToUpload() {
            const name = document.getElementById('proj-name').value;
            const answer = document.getElementById('captcha-answer').value;

            if (name === "" || answer == "") {
                alert("الرجاء ملء كافة البيانات");
                return;
            }

            if (parseInt(answer) === (n1 + n2)) {
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('upload-section').style.display = 'block';
                document.getElementById('display-name').innerText = name;
            } else {
                alert("الإجابة خاطئة! هل أنت روبوت؟");
            }
        }

        function startUpload() {
            const status = document.getElementById('status-msg');
            const progress = document.getElementById('progress');
            const linkResult = document.getElementById('link-result');
            
            status.innerText = " انتضر قليلا";
            
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    status.innerText = "تم الرفع بنجاح!";
                    const randomID = Math.random().toString(36).substring(7);
                    linkResult.innerHTML = `رابط موقعك جاهز: <br> <a href="#" style="color:yellow">https://fire-ice.host/${randomID}/index.html</a>`;
                } else {
                    width += 5;
                    progress.style.width = width + '%';
                }
            }, 100);
        }
    </script>
</body>
</html>
