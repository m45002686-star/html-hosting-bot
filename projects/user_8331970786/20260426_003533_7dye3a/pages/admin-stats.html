<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإحصائيات المتقدمة - BAMA TECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .stats-container {
            max-width: 1000px;
            margin: 80px auto 20px;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }
        .stat-value {
            font-size: 48px;
            font-weight: 800;
            color: #00adb5;
        }
        .chart-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-crown"></i><span>BAMA <span class="tech">TECH</span></span></div>
            <div class="nav-links">
                <a href="feed.html"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="admin-dashboard.html"><i class="fas fa-shield-alt"></i> لوحة التحكم</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </div>
        </div>
    </nav>

    <div class="stats-container">
        <h2><i class="fas fa-chart-line"></i> الإحصائيات المتقدمة</h2>
        
        <div class="stats-grid" id="mainStats"></div>
        
        <div class="chart-container">
            <h3>📅 النشاط اليومي</h3>
            <div id="dailyActivity"></div>
        </div>
        
        <div class="chart-container">
            <h3>👑 ترتيب المستخدمين حسب النشاط</h3>
            <div id="topUsers"></div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        let currentUser = getUserById(currentUserId);
        if(!currentUser || (!currentUser.isAdmin && !currentUser.isOwner)) window.location.href = 'feed.html';
        
        function renderStats() {
            let stats = getStats();
            document.getElementById('mainStats').innerHTML = `
                <div class="stat-box"><div class="stat-value">${stats.totalUsers}</div><div>إجمالي المستخدمين</div></div>
                <div class="stat-box"><div class="stat-value">${stats.totalAdmins}</div><div>الإدمن</div></div>
                <div class="stat-box"><div class="stat-value">${stats.totalPosts}</div><div>المنشورات</div></div>
                <div class="stat-box"><div class="stat-value">${stats.totalLikes}</div><div>الإعجابات</div></div>
                <div class="stat-box"><div class="stat-value">${stats.totalComments}</div><div>التعليقات</div></div>
                <div class="stat-box"><div class="stat-value">${stats.totalMessages}</div><div>الرسائل الخاصة</div></div>
                <div class="stat-box"><div class="stat-value">${stats.verifiedUsers}</div><div>الموثقين ✅</div></div>
                <div class="stat-box"><div class="stat-value">${stats.verifiedPlusUsers}</div><div>VERIFIED+ ✨</div></div>
            `;
            
            // النشاط اليومي
            let today = new Date().toDateString();
            let todayPosts = posts.filter(p => new Date(p.timestamp).toDateString() === today).length;
            let todayComments = posts.reduce((sum, p) => sum + p.comments.filter(c => new Date(c.timestamp).toDateString() === today).length, 0);
            document.getElementById('dailyActivity').innerHTML = `
                <div style="display:flex; gap:20px;">
                    <div><strong>📝 منشورات اليوم:</strong> ${todayPosts}</div>
                    <div><strong>💬 تعليقات اليوم:</strong> ${todayComments}</div>
                    <div><strong>❤️ إعجابات اليوم:</strong> ${posts.reduce((sum, p) => sum + p.likes.filter(l => {
                        let likeTime = localStorage.getItem(`like_time_${p.id}_${l}`);
                        return likeTime && new Date(parseInt(likeTime)).toDateString() === today;
                    }).length, 0)}</div>
                </div>
            `;
            
            // ترتيب المستخدمين
            let userActivity = users.filter(u => !u.isAdmin && !u.isOwner).map(u => ({
                ...u,
                postCount: posts.filter(p => p.userId === u.id).length,
                likeCount: posts.reduce((sum, p) => sum + (p.likes.includes(u.id) ? 1 : 0), 0)
            })).sort((a,b) => b.postCount - a.postCount).slice(0, 10);
            
            document.getElementById('topUsers').innerHTML = userActivity.map((u, i) => `
                <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #e2e8f0;">
                    <span>${i+1}. ${u.name}</span>
                    <span>📝 ${u.postCount} منشور | ❤️ ${u.likeCount} إعجاب</span>
                </div>
            `).join('');
        }
        
        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
        
        renderStats();
    </script>
</body>
</html>
