span:nth-child(1) { right: 9px; height: 10px; } .mark span:nth-child(2) { right: 15px; height: 14px; } .mark span:nth-child(3) { right: 21px; height: 9px; } .brand-copy { min-width: 0; } .brand-name { display: block; color: var(--ivory); font-family: Georgia, "Times New Roman", serif; font-size: 1.18rem; letter-spacing: 0.04em; line-height: 1; } .brand-subtitle { display: block; margin-top: 5px; color: var(--muted); font-size: 0.72rem; } .sound-state { display: flex; align-items: center; gap: 7px; color: var(--gold); font-size: 0.73rem; white-space: nowrap; } .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(224, 185, 104, 0.14); } .instruction { overflow: hidden; position: relative; padding: 17px 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(37, 30, 36, 0.78); box-shadow: 0 18px 42px rgba(0, 0, 0, 0.16); } .instruction::after { content: ""; position: absolute; width: 160px; height: 160px; left: -65px; top: -90px; border: 1px solid rgba(224, 185, 104, 0.16); border-radius: 50%; } .eyebrow { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; margin: 0 0 8px; color: var(--gold); font-size: 0.75rem; font-weight: 700; } .eyebrow::before { content: "♪"; font-size: 1rem; } h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(1.22rem, 4.8vw, 1.55rem); font-weight: 700; line-height: 1.35; } .instruction p { position: relative; z-index: 1; margin: 6px 0 0; color: var(--muted); font-size: 0.83rem; line-height: 1.6; } .controls { display: grid; grid-template-columns: 1.05fr 1fr 1.12fr; gap: 8px; } .control { min-height: 67px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255, 255, 255, 0.045); } .control-label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 0.66rem; } .octave-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; direction: ltr; } .round-butto ientation: landscape) and (max-height: 600px) { html, body { height: 100%; overflow: hidden; } .app { width: 100%; height: 100dvh; min-height: 0; max-width: none; padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); gap: 5px; } .topbar { min-height: 28px; padding-inline: 7px; } .mark { width: 26px; height: 26px; } .mark::before { width: 13px; height: 13px; top: 3px; left: 4px; box-shadow: 5px 0 0 var(--ink); } .mark span { bottom: 4px; width: 2px; } .mark span:nth-child(1) { right: 6px; height: 6px; } .mark span:nth-child(2) { right: 10px; height: 8px; } .mark span:nth-child(3) { right: 14px; height: 5px; } .brand { gap: 6px; } .brand-name { font-size: 0.92rem; } .brand-subtitle, .sound-state, .instruction, .controls, .now-playing, .footer-note { display: none; } .piano-frame { min-height: 0; flex: 1; padding: 6px; border-radius: 10px; } .piano { height: 100%; min-height: 0; border-width: 4px; border-radius: 6px; } .white-key { padding-bottom: 9px; border-bottom-width: 5px; } .black-key { height: 58%; padding-bottom: 6px; } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; scroll-behavior: auto !important; } } </style> </head> <body> <div class="rotate-notice" role="status" aria-live="polite"> <div class="rotate-card"> <div class="rotate-phone" aria-hidden="true"></div> <h2>دوّر هاتفك أفقيًا</h2> </div> </div> <main class="app"> <header class="topbar"> <div class="brand" aria-label="Piano Studio"> <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div> <div class="brand-copy"> <strong class="brand-name">Piano Studio</strong> <span class="brand-subtitle">بيانو اللمس</span> </div> </div> <div class="sound-state" aria-live="polite"><span class="state-dot"></span><span id="soundState">جاهز للعزف</span></div> </header> <section class="instruction" aria-labelledby="mainTitle"> <div class="eyebrow">العزف المباشر</div> <h1 id="mainTitle">المس المفاتيح واترك أصابعك تعزف.</h1> <p>يمكنك عزف أكثر من نغمة في الوقت نفسه، والتنقل بالإصبع بين المفاتيح.</p> </section> <section class="controls" aria-label="إعدادات البيانو"> <div class="control"> <span class="control-label">الأوكتاف</span> <div class="octave-row"> <button class="round-button" id="octaveDown" type="button" aria-label="خفض الأوكتاف">−</button> <output id="octaveDisplay" aria-label="الأوكتاف الحالي">4</output> <button class="round-button" id="octaveUp" type="button" aria-label="رفع الأوكتاف">+</button> </div> </div> <label class="control"> <span class="control-label">نوع الصوت</span> <span class="instrument-wrap"> <select class="instrument-select" id="instrument" aria-label="نوع صوت الآلة"> <option value="grand">بيانو كلاسيكي</option> <option value="electric">بيانو كهربائي</option> <option value="organ">أورغن ناعم</option> </select> </span> </label> <label class="control"> <span class="control-label">مستوى الصوت</span> <span class="volume-row"><span class="volume-icon" aria-hidden="true">◖</span><input id="volume" type="range" min="0" max="100" value="72" aria-label="مستوى الصوت" /></span> </label> </section> <div class="now-playing" aria-live="polite"> <span id="hintText">اضغط على أي مفتاح لتفعيل الصوت</span> <strong id="noteReadout">—</strong> </div> <section class="piano-frame" aria-label="لوحة مفاتيح البيانو"> <div class="piano" id="piano" role="application" aria-label="بيانو تفاعلي باللمس"></div> </section> <div class="footer-note">يدعم اللمس المتعدد · يعمل أيضًا بلوحة مفاتيح الكمبيوتر</div> </main> <script> (() => { const whiteKeys = [ { note: "C", arabic: "دو", semitone: 0, key: "a" }, { note: "D", arabic: "ري", semitone: 2, key: "s" }, { note: "E", arabic: "مي", semitone: 4, key: "d" }, { note: "F", arabic: "فا", semitone: 5, key: "f" }, { note: "G", arabic: "صول", semitone: 7, key: "g" }, { note: "A", arabic: "لا", semitone: 9, key: "h" }, { note: "B", arabic: "سي", semitone: 11, key: "j" }, { note: "C", arabic: "دو", semitone: 12, key: "k" }, { note: "D", arabic: "ري", semitone: 14, key: "l" }, { note: "E", arabic: "مي", semitone: 16, key: ";" } ]; const blackKeys = [ { note: "C♯", arabic: "دو♯", semitone: 1, key: "w", position: 9.9 }, { note: "D♯", arabic: "ري♯", semitone: 3, key: "e", position: 19.9 }, { note: "F♯", arabic: "فا♯", semitone: 6, key: "t", position: 39.9 }, { note: "G♯", arabic: "صول♯", semitone: 8, key: "y", position: 49.9 }, { note: "A♯", arabic: "لا♯", semitone: 10, key: "u", position: 59.9 }, { note: "C♯", arabic: "دو♯", semitone: 13, key: "o", position: 79.9 }, { note: "D♯", arabic: "ري♯", semitone: 15, key: "p", position: 89.9 } ]; const piano = document.getElementById("piano"); const octaveDisplay = document.getElementById("octaveDisplay"); const octaveDown = document.getElementById("octaveDown"); const octaveUp = document.getElementById("octaveUp"); const volume = document.getElementById("volume"); const instrument = document.getElementById("instrument"); const soundState = document.getElementById("soundState"); const hintText = document.getElementById("hintText"); const noteReadout = document.getElementById("noteReadout"); let currentOctave = 4; let audioContext; let masterGain; const activeVoices = new Map(); const pointerNotes = new Map(); const keyboardNotes = new Set(); const keyElements = new Map(); const pressedCounts = new Map(); const allKeys = [ ...whiteKeys.map((item, index) => ({ ...item, id: `white-${index}`, kind: "white" })), ...blackKeys.map((item, index) => ({ ...item, id: `black-${index}`, kind: "black" })) ]; function renderKeys() { piano.innerHTML = ""; keyElements.clear(); allKeys.forEach((item) => { const key = document.createElement("button"); key.type = "button"; key.className = `piano-key ${item.kind}-key`; key.dataset.noteId = item.id; key.setAttribute("aria-label", `${item.arabic} ${getOctaveForNote(item.semitone)}`); key.innerHTML = `<span class="note-name">${item.note}</span><span class="keyboard-letter">${item.key.toUpperCase()}</span>`; if (item.kind === "black") key.style.left = `${item.position}%`; piano.appendChild(key); keyElements.set(item.id, key); }); } function getOctaveForNote(semitone) { return currentOctave + Math.floor(semitone / 12); } function midiFor(item) { return (currentOctave + 1) * 12 + item.semitone; } function frequencyFor(item) { return 440 * Math.pow(2, (midiFor(item) - 69) / 12); } function ensureAudio() { if (!audioContext) { audioContext = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" }); masterGain = audioContext.createGain(); masterGain.gain.value = Number(volume.value) / 100; masterGain.connect(audioContext.destination); } if (audioContext.state === "suspended") audioContext.resume(); soundState.textContent = "الصوت مفعل"; hintText.textContent = "المس أكثر من مفتاح لعزف نغمة مركبة"; } function instrumentRecipe() { const mode = instrument.value; if (mode === "electric") return { main: "sine", second: "square", secondGain: 0.11, filter: 2300, release: 0.22 }; if (mode === "organ") return { main: "sine", second: "sine", secondGain: 0.22, filter: 3600, release: 0.35 }; return { main: "triangle", second: "sine", secondGain: 0.16, filter: 3900, release: 0.19 }; } function itemById(id) { return allKeys.find((item) => item.id === id); } function updateReadout() { const names = [...activeVoices.values()].map((voice) => voice.displayName); noteReadout.textContent = names.length ? names.join(" · ") : "—"; } function startNote(noteId, voiceId = noteId) { if (activeVoices.has(voiceId)) return; const item = itemById(noteId); if (!item) return; ensureAudio(); const now = audioContext.currentTime; const recipe = instrumentRecipe(); const noteGain = audioContext.createGain(); const filter = audioContext.createBiquadFilter(); const mainOscillator = audioContext.createOscillator(); const secondOscillator = audioContext.createOscillator(); const secondGain = audioContext.createGain(); const frequency = frequencyFor(item); mainOscillator.type = recipe.main; secondOscillator.type = recipe.second; mainOscillator.frequency.setValueAtTime(frequency, now); secondOscillator.frequency.setValueAtTime(frequency * 2, now); secondOscillator.detune.setValueAtTime(instrument.value === "electric" ? 7 : 2, now); secondGain.gain.setValueAtTime(recipe.secondGain, now); filter.type = "lowpass"; filter.frequency.setValueAtTime(recipe.filter, now); filter.Q.setValueAtTime(1.2, now); noteGain.gain.setValueAtTime(0.0001, now); noteGain.gain.exponentialRampToValueAtTime(0.54, now + 0.002); noteGain.gain.exponentialRampToValueAtTime(instrument.value === "organ" ? 0.42 : 0.25, now + 0.31); mainOscillator.connect(noteGain); secondOscillator.connect(secondGain); secondGain.connect(noteGain); noteGain.connect(filter); filter.connect(masterGain); mainOscillator.start(now); secondOscillator.start(now); const displayName = `${item.note}${getOctaveForNote(item.semitone)}`; activeVoices.set(voiceId, { noteId, mainOscillator, secondOscillator, noteGain, recipe, displayName }); pressedCounts.set(noteId, (pressedCounts.get(noteId) || 0) + 1); keyElements.get(noteId)?.classList.add("pressed"); keyElements.get(noteId)?.setAttribute("aria-pressed", "true"); updateReadout(); } function stopNote(voiceId) { const voice = activeVoices.get(voiceId); if (!voice || !audioContext) return; const now = audioContext.currentTime; voice.noteGain.gain.cancelScheduledValues(now); voice.noteGain.gain.setTargetAtTime(0.0001, now, voice.recipe.release); voice.mainOscillator.stop(now + voice.recipe.release * 7); voice.secondOscillator.stop(now + voice.recipe.release * 7); activeVoices.delete(voiceId); const remainingPresses = Math.max(0, (pressedCounts.get(voice.noteId) || 1) - 1); if (remainingPresses) { pressedCounts.set(voice.noteId, remainingPresses); } else { pressedCounts.delete(voice.noteId); keyElements.get(voice.noteId)?.classList.remove("pressed"); keyElements.get(voice.noteId)?.setAttribute("aria-pressed", "false"); } updateReadout(); } function stopAllNotes() { [...activeVoices.keys()].forEach(stopNote); pointerNotes.clear(); keyboardNotes.clear(); } function changeOctave(step) { const next = Math.min(6, Math.max(2, currentOctave + step)); if (next === currentOctave) return; stopAllNotes(); currentOctave = next; octaveDisplay.value = currentOctave; octaveDisplay.textContent = currentOctave; renderKeys(); hintText.textContent = `أوكتاف ${currentOctave} — المس المفاتيح للعزف`; } function getNoteFromPoint(x, y) { const element = document.elementFromPoint(x, y); return element?.closest?.(".piano-key")?.dataset.noteId || null; } function beginPointer(event) { const noteId = getNoteFromPoint(event.clientX, event.clientY); if (!noteId) return; event.preventDefault(); requestImmersiveMode(); try { piano.setPointerCapture(event.pointerId); } catch (_) { } const voiceId = `touch-${event.pointerId}`; pointerNotes.set(event.pointerId, { noteId, voiceId }); startNote(noteId, voiceId); } function movePointer(event) { if (!pointerNotes.has(event.pointerId)) return; event.preventDefault(); const previous = pointerNotes.get(event.pointerId); const next = getNoteFromPoint(event.clientX, event.clientY); if (next && next !== previous.noteId) { stopNote(previous.voiceId); const voiceId = `touch-${event.pointerId}`; pointerNotes.set(event.pointerId, { noteId: next, voiceId }); startNote(next, voiceId); } } function endPointer(event) { const noteId = pointerNotes.get(event.pointerId); if (!noteId) return; event.preventDefault(); pointerNotes.delete(event.pointerId); if (piano.hasPointerCapture?.(event.pointerId)) piano.releasePointerCapture(event.pointerId); stopNote(noteId.voiceId); } function requestImmersiveMode() { if (window.innerWidth <= window.innerHeight) return; if (document.documentElement.requestFullscreen && !document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); } if (screen.orientation?.lock) screen.orientation.lock("landscape").catch(() => {}); } function noteForKeyboardKey(key) { return allKeys.find((item) => item.key === key.toLowerCase())?.id; } piano.addEventListener("pointerdown", beginPointer); piano.addEventListener("pointermove", movePointer, { passive: false }); piano.addEventListener("pointerup", endPointer, { passive: false }); piano.addEventListener("pointercancel", endPointer, { passive: false }); window.addEventListener("keydown", (event) => { if (event.repeat || event.target.matches("select, input")) return; const noteId = noteForKeyboardKey(event.key); if (!noteId || keyboardNotes.has(noteId)) return; event.preventDefault(); keyboardNotes.add(noteId); startNote(noteId, `keyboard-${noteId}`); }); window.addEventListener("keyup", (event) => { const noteId = noteForKeyboardKey(event.key); if (!noteId || !keyboardNotes.has(noteId)) return; keyboardNotes.delete(noteId); stopNote(`keyboard-${noteId}`); }); octaveDown.addEventListener("click", () => changeOctave(-1)); octaveUp.addEventListener("click", () => changeOctave(1)); volume.addEventListener("input", () => { if (masterGain && audioContext) masterGain.gain.setTargetAtTime(Number(volume.value) / 100, audioContext.currentTime, 0.02); }); instrument.addEventListener("change", () => { hintText.textContent = `تم اختيار ${instrument.options[instrument.selectedIndex].text}`; }); window.addEventListener("blur", stopAllNotes); document.addEventListener("visibilitychange", () => { if (document.hidden) stopAllNotes(); }); renderKeys(); })(); </script> </body> </html>
