<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title><a href="status.html">حالة السيرفر</ - ZIAD HOST</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tajawal}
body{background:#0f172a;color:#fff}
header{background:#1e293b;padding:15px 50px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold;color:#667eea}
nav a{color:#cbd5e1;text-decoration:none;margin:0 15px}
.section{padding:60px 20px;max-width:1100px;margin:auto}
h2{text-align:center;color:#667eea;margin-bottom:40px;font-size:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:#1e293b;padding:25px;border-radius:15px}
.card h3{margin-bottom:15px;color:#e2e8f0}
.stat{font-size:36px;font-weight:bold;color:#667eea}
.label{color:#94a3b8;font-size:14px;margin-top:5px}
canvas{margin-top:15px}
.uptime{background:#166534;color:#bbf7d0;padding:8px 15px;border-radius:20px;display:inline-block;font-size:14px}
</style>
</head>
<body>

<header>
<div class="logo">ZIAD HOST</div>
<nav>
<a href="index.html">الرئيسية</a>
<a href="upload.html">رفع البوت</a>
<a href="dashboard.html">لوحة التحكم</a>
<a href="support.html">الدعم</a>
</nav>
</header>

<section class="section">
<h2>حالة السيرفر المباشرة</h2>

<div class="grid">
<div class="card">
<h3>حالة النظام</h3>
<span class="uptime">● جميع الأنظمة تعمل</span>
<p style="margin-top:15px;color:#94a3b8">آخر فحص: <span id="time"></span></p>
</div>

<div class="card">
<h3>استهلاك الرام</h3>
<div class="stat"><span id="ram">0</span>%</div>
<div class="label">من 64GB متاحة</div>
<canvas id="ramChart" height="100"></canvas>
</div>

<div class="card">
<h3>استهلاك المعالج CPU</h3>
<div class="stat"><span id="cpu">0</span>%</div>
<div class="label">8 أنوية</div>
<canvas id="cpuChart" height="100"></canvas>
</div>

<div class="card">
<h3>عدد البوتات الشغالة</h3>
<div class="stat"><span id="bots">0</span></div>
<div class="label">بوت نشط الآن</div>
<canvas id="botsChart" height="100"></canvas>
</div>
</div>
</section>

<script>
// تحديث الوقت
document.getElementById('time').textContent = new Date().toLocaleTimeString('ar');

// أرقام وهمية تتغير كل 3 ثواني عشان التجربة
function random(min,max){return Math.floor(Math.random()*(max-min+1))+min}

// رسم الرام
const ramCtx = document.getElementById('ramChart');
const ramChart = new Chart(ramCtx, {
type: 'line',
data: {
labels: ['1', '2', '3', '4', '5', '6'],
datasets: [{
label: 'الرام %',
data: [45, 48, 46, 50, 47, 49],
borderColor: '#667eea',
backgroundColor: 'rgba(102, 126, 234, 0.2)',
tension: 0.4,
fill: true
}]
},
options: {plugins:{legend:{display:false}},scales:{y:{max:100}}}
});

// رسم الـ CPU
const cpuCtx = document.getElementById('cpuChart');
const cpuChart = new Chart(cpuCtx, {
type: 'line',
data: {
labels: ['1', '2', '3', '4', '5', '6'],
datasets: [{
label: 'CPU %',
data: [32, 35, 30, 38, 33, 36],
borderColor: '#10b981',
backgroundColor: 'rgba(16, 185, 129, 0.2)',
tension: 0.4,
fill: true
}]
},
options: {plugins:{legend:{display:false}},scales:{y:{max:100}}}
});

// رسم البوتات
const botsCtx = document.getElementById('botsChart');
const botsChart = new Chart(botsCtx, {
type: 'bar',
data: {
labels: ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],
datasets: [{
label: 'بوتات',
data: [120, 135, 128, 142, 150, 148, 155],
backgroundColor: '#f59e0b',
borderRadius: 8
}]
},
options: {plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
});

// تحديث الأرقام كل 3 ثواني
setInterval(()=>{
const ram = random(45, 55);
const cpu = random(30, 40);
const bots = random(140, 160);

document.getElementById('ram').textContent = ram;
document.getElementById('cpu').textContent = cpu;
document.getElementById('bots').textContent = bots;

// حدث الرسم
ramChart.data.datasets[0].data.shift();
ramChart.data.datasets[0].data.push(ram);
ramChart.update();

cpuChart.data.datasets[0].data.shift();
cpuChart.data.datasets[0].data.push(cpu);
cpuChart.update();

}, 3000);
</script>
</body>
</html>
