<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي - BAMA TECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 80px auto 20px;
            padding: 0 20px;
        }
        .profile-header {
            background: white;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #00adb5, #4facfe);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            border: 4px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .badges-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 25px 0;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
        }
        .edit-profile-btn {
            background: linear-gradient(135deg, #00adb5, #4facfe);
            color: white;
            padding: 10px 25px;
            border-radius: 40px;
            text-decoration: none;
            display: inline-block;
        }
        .profile-posts h3 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <span>BAMA <span class="tech">TECH</span></span>
            </div>
            <div class="nav-links">
                <a href="feed.html"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="profile.html" class="active"><i class="fas fa-user"></i> ملفي</a>
                <a href="messages.html"><i class="fas fa-envelope"></i> الرسائل</a>
                <a href="notifications.html"><i class="fas fa-bell"></i> الإشعارات</a>
                <a href="contests.html"><i class="fas fa-trophy"></i> المسابقات</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </div>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header" id="profileHeader"></div>
        <div class="profile-posts">
            <h3><i class="fas fa-newspaper"></i> منشوراتي</h3>
            <div id="userPosts"></div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        let currentUser = getUserById(currentUserId);
        if(!currentUser) window.location.href = 'login.html';
        
        function renderProfile() {
            let badges = getUserBadges(currentUser);
            let userPosts = posts.filter(p => p.userId === currentUserId).sort((a,b) => b.timestamp - a.timestamp);
            
            document.getElementById('profileHeader').innerHTML = `
                <div class="profile-avatar">${currentUser.avatar ? `<img src="${currentUser.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` : currentUser.name.charAt(0)}</div>
                <h2>${currentUser.name}</h2>
                <div>@${currentUser.username}</div>
                <div class="badges-container">${badges}</div>
                <p style="color:#64748b; max-width:400px; margin:0 auto;">${currentUser.bio || 'مرحباً، أنا في BAMA TECH'}</p>
                <div class="profile-stats">
                    <div class="stat"><div class="stat-number">${userPosts.length}</div><div>منشور</div></div>
                    <div class="stat"><div class="stat-number">${posts.reduce((sum, p) => sum + (p.likes.includes(currentUserId) ? 1 : 0), 0)}</div><div>إعجاب</div></div>
                    <div class="stat"><div class="stat-number">${currentUser.createdAt ? 'جديد' : 'عضو'}</div><div>تاريخ الانضمام</div></div>
                </div>
                <a href="edit-profile.html" class="edit-profile-btn"><i class="fas fa-edit"></i> تعديل الملف الشخصي</a>
            `;
            
            if(userPosts.length === 0) {
                document.getElementById('userPosts').innerHTML = '<div class="empty-state"><i class="fas fa-newspaper"></i><p>لا توجد منشورات بعد</p></div>';
            } else {
                document.getElementById('userPosts').innerHTML = userPosts.map(post => `
                    <div class="post-card">
                        <div class="post-content">${post.content}</div>
                        ${post.image ? `<img src="${post.image}" style="max-width:100%; border-radius:12px; margin-top:10px;">` : ''}
                        <div class="post-stats">
                            <span><i class="fas fa-heart"></i> ${post.likes.length}</span>
                            <span><i class="fas fa-comment"></i> ${post.comments.length}</span>
                            <span><i class="far fa-clock"></i> ${new Date(post.timestamp).toLocaleString()}</span>
                        </div>
                        <button class="action-btn delete-btn" onclick="deleteThisPost(${post.id})"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                `).join('');
            }
        }
        
        window.deleteThisPost = (postId) => {
            if(deletePost(postId)) renderProfile();
        };
        
        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
        renderProfile();
    </script>
</body>
</html>
