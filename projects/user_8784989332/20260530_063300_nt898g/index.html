<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"> <title>BABA A Z A F | Ultra Animated Bloody Red Analyzer</title> <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Creepster&family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet"> <style> * { margin: 0; padding: 0; box-sizing: border-box; } :root { --primary: #8b0000; --secondary: #4a0000; --accent: #ff0000; --neon-red: #ff3131; --dark-bg: #000000; --darker-bg: #050000; --text-primary: #ffcccc; --text-secondary: #ff6666; --grid-color: rgba(139, 0, 0, 0.15); } html { scroll-behavior: smooth; } body { background: #000; font-family: 'Orbitron', 'Cairo', sans-serif; color: var(--text-primary); overflow-x: hidden; position: relative; } /* Animated Grid Background */ body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(0deg, var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 50px 50px; animation: gridMove 20s linear infinite; pointer-events: none; z-index: 1; } /* Blood Plasma Effect */ body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 50%, rgba(139, 0, 0, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(74, 0, 0, 0.3) 0%, transparent 50%), radial-gradient(circle at 50% 20%, rgba(255, 0, 0, 0.15) 0%, transparent 50%); animation: bloodFlow 8s ease-in-out infinite; pointer-events: none; z-index: 0; filter: blur(40px); } @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(50px); } } @keyframes bloodFlow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } } @keyframes bloodyGlow { 0%, 100% { text-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary); box-shadow: 0 0 10px var(--primary); } 50% { text-shadow: 0 0 30px var(--accent), 0 0 50px var(--primary); box-shadow: 0 0 30px var(--accent); } } @keyframes flicker { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; } 20%, 24%, 55% { opacity: 0.3; } } @keyframes drip { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } } @keyframes slideInDown { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } } @keyframes slideInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } } @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } } @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } } @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 10px var(--primary); } 50% { box-shadow: 0 0 40px var(--accent); } } @keyframes blood-drip-1 { 0% { transform: translateY(-100px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } } @keyframes blood-drip-2 { 0% { transform: translateY(-150px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } } @keyframes blood-drip-3 { 0% { transform: translateY(-80px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } } @keyframes neon-flicker { 0%, 100% { color: var(--accent); text-shadow: 0 0 10px var(--accent); } 50% { color: #ff6666; text-shadow: 0 0 5px #ff6666; } } .container { max-width: 1400px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; } /* Blood Drip Elements */ .blood-drip { position: fixed; width: 3px; height: 20px; background: linear-gradient(to bottom, var(--accent), var(--primary)); pointer-events: none; z-index: 5; border-radius: 50%; } .drip-1 { left: 10%; animation: blood-drip-1 4s infinite; } .drip-2 { left: 25%; animation: blood-drip-2 5s infinite 1s; } .drip-3 { left: 40%; animation: blood-drip-3 4.5s infinite 0.5s; } .drip-4 { left: 60%; animation: blood-drip-1 5s infinite 1.5s; } .drip-5 { left: 75%; animation: blood-drip-2 4.2s infinite 0.8s; } .drip-6 { left: 90%; animation: blood-drip-3 4.8s infinite 1.2s; } /* Auth Screen */ .auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(30px); display: flex; justify-content: center; align-items: center; z-index: 9999; animation: fadeIn 0.5s ease; } .auth-box { background: linear-gradient(135deg, #000 0%, #1a0000 100%); border: 3px solid var(--primary); border-radius: 50px; padding: 60px 50px; text-align: center; max-width: 500px; position: relative; z-index: 2; animation: slideInDown 0.8s ease, glow-pulse 2s ease-in-out infinite; box-shadow: 0 0 50px var(--primary); } .auth-logo { font-family: 'Nosifer', cursive; font-size: 4rem; color: var(--accent); margin-bottom: 20px; animation: pulse 1.5s ease-in-out infinite, rotate 3s linear infinite; filter: drop-shadow(0 0 10px var(--accent)); } .auth-box h1 { color: var(--accent); font-size: 2.8rem; margin-bottom: 10px; font-weight: 900; letter-spacing: 3px; animation: bloodyGlow 1.5s ease-in-out infinite, neon-flicker 0.3s infinite; font-family: 'Creepster', cursive; } .auth-box .subtitle { color: var(--text-secondary); font-size: 1.3rem; margin-bottom: 30px; font-weight: 700; letter-spacing: 2px; animation: flicker 3s infinite; } .auth-box input { width: 100%; background: rgba(0, 0, 0, 0.9); border: 2px solid var(--primary); padding: 18px 20px; color: var(--accent); font-size: 1.1rem; border-radius: 40px; font-family: 'Space Mono', monospace; outline: none; transition: all 0.3s ease; letter-spacing: 2px; text-align: center; animation: glow-pulse 2s ease-in-out infinite; } .auth-box input:focus { border-color: var(--accent); box-shadow: 0 0 30px var(--accent), inset 0 0 10px rgba(255, 0, 0, 0.2); animation: shake 0.2s infinite; } .auth-box button { width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: 2px solid var(--accent); padding: 15px 30px; font-size: 1.1rem; font-weight: 700; border-radius: 40px; cursor: pointer; transition: all 0.3s ease; letter-spacing: 2px; font-family: 'Orbitron', monospace; text-transform: uppercase; margin-top: 20px; animation: glow-pulse 2s ease-in-out infinite; } .auth-box button:hover { transform: scale(1.1); box-shadow: 0 0 40px var(--accent); animation: shake 0.1s infinite; } .auth-error { color: var(--accent); margin-top: 15px; font-size: 1rem; font-weight: 600; animation: flicker 0.5s infinite; } /* Main Content */ .main-content { display: none; } /* Header */ .header { text-align: center; padding: 50px 30px; margin-bottom: 40px; animation: slideInDown 1s ease; position: relative; } .header::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 80%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: pulse 2s ease-in-out infinite; } .header h1 { color: var(--accent); font-size: 3.5rem; margin-bottom: 10px; font-weight: 900; letter-spacing: 3px; animation: bloodyGlow 1.5s ease-in-out infinite, neon-flicker 0.3s infinite; font-family: 'Creepster', cursive; filter: drop-shadow(0 0 20px var(--accent)); } .header .tagline { color: var(--text-secondary); font-size: 1.3rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 15px; animation: flicker 2s infinite; } .header .developer { color: var(--primary); font-size: 1.1rem; font-weight: 600; font-family: 'Nosifer', cursive; animation: pulse 2s ease-in-out infinite; } /* Control Panel */ .control-panel { background: linear-gradient(135deg, #000 0%, #1a0000 100%); border: 2px solid var(--primary); border-radius: 30px; padding: 30px; margin-bottom: 30px; animation: slideInUp 1.2s ease, glow-pulse 2s ease-in-out infinite; box-shadow: 0 0 30px rgba(139, 0, 0, 0.3); position: relative; overflow: hidden; } .control-panel::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 0%, transparent 70%); animation: rotate 8s linear infinite; pointer-events: none; } .panel-title { color: var(--accent); font-size: 1.5rem; margin-bottom: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; animation: neon-flicker 0.4s infinite; position: relative; z-index: 1; } .input-section { display: grid; grid-template-columns: 1fr auto; gap: 15px; margin-bottom: 20px; position: relative; z-index: 1; } .input-section textarea { background: rgba(0, 0, 0, 0.9); border: 2px solid var(--primary); padding: 20px; color: var(--accent); font-family: 'Space Mono', monospace; font-size: 1rem; border-radius: 15px; resize: vertical; min-height: 150px; transition: all 0.3s ease; animation: glow-pulse 2s ease-in-out infinite; } .input-section textarea:focus { border-color: var(--accent); box-shadow: 0 0 30px var(--accent), inset 0 0 10px rgba(255, 0, 0, 0.2); outline: none; animation: shake 0.1s infinite; } .button-group { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; } .btn { padding: 15px 25px; border: 2px solid var(--primary); background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-radius: 15px; cursor: pointer; font-weight: 700; transition: all 0.3s ease; font-family: 'Orbitron', monospace; text-transform: uppercase; letter-spacing: 1px; animation: glow-pulse 2s ease-in-out infinite; } .btn:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--accent); animation: shake 0.1s infinite; } .btn:active { transform: scale(0.95); } /* Stats Dashboard */ .stats-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; } .stat-card { background: rgba(139, 0, 0, 0.1); border: 2px solid var(--primary); border-radius: 15px; padding: 20px; text-align: center; animation: slideInUp 1.3s ease, glow-pulse 2s ease-in-out infinite; position: relative; overflow: hidden; } .stat-card::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 0%, transparent 70%); animation: rotate 6s linear infinite; pointer-events: none; } .stat-label { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; position: relative; z-index: 1; } .stat-value { color: var(--accent); font-size: 2rem; font-weight: 900; font-family: 'Orbitron', monospace; animation: pulse 1s ease-in-out infinite; position: relative; z-index: 1; } /* Results Section */ .results-section { background: linear-gradient(135deg, #000 0%, #1a0000 100%); border: 2px solid var(--primary); border-radius: 30px; padding: 30px; animation: slideInUp 1.4s ease, glow-pulse 2s ease-in-out infinite; box-shadow: 0 0 30px rgba(139, 0, 0, 0.3); position: relative; overflow: hidden; } .results-section::before { content: ""; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 0%, transparent 70%); animation: rotate 10s linear infinite reverse; pointer-events: none; } .results-title { color: var(--accent); font-size: 1.5rem; margin-bottom: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; animation: neon-flicker 0.4s infinite; position: relative; z-index: 1; } .result-card { background: rgba(139, 0, 0, 0.05); border: 2px solid var(--primary); border-radius: 15px; padding: 20px; margin-bottom: 15px; transition: all 0.3s ease; animation: slideInUp 0.5s ease, glow-pulse 2s ease-in-out infinite; position: relative; z-index: 1; } .result-card:hover { border-color: var(--accent); box-shadow: 0 0 30px var(--accent); transform: translateX(-10px); animation: shake 0.1s infinite; } .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--primary); } .result-nid { color: var(--accent); font-family: 'Space Mono', monospace; font-size: 1.1rem; font-weight: 700; animation: neon-flicker 0.3s infinite; } .result-status { padding: 5px 15px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; animation: pulse 1s ease-in-out infinite; } .status-valid { background: rgba(139, 0, 0, 0.3); color: var(--accent); border: 1px solid var(--accent); } .result-data { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; font-size: 0.95rem; } .data-item { background: rgba(0, 0, 0, 0.5); padding: 12px; border-radius: 10px; border-left: 3px solid var(--primary); animation: slideInUp 0.6s ease; } .data-label { color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; margin-bottom: 5px; } .data-value { color: var(--accent); font-weight: 700; font-family: 'Space Mono', monospace; animation: neon-flicker 0.3s infinite; } /* Footer */ footer { text-align: center; margin-top: 60px; padding: 30px; border-top: 2px solid var(--primary); color: var(--text-secondary); animation: slideInUp 1.5s ease; position: relative; } .footer-text { font-family: 'Nosifer', cursive; font-size: 1.3rem; color: var(--accent); margin-bottom: 10px; animation: bloodyGlow 1.5s ease-in-out infinite; } @media (max-width: 768px) { .input-section { grid-template-columns: 1fr; } .header h1 { font-size: 2.5rem; } .auth-box { padding: 40px 30px; } } </style> </head> <body> <!-- Blood Drip Effects --> <div class="blood-drip drip-1"></div> <div class="blood-drip drip-2"></div> <div class="blood-drip drip-3"></div> <div class="blood-drip drip-4"></div> <div class="blood-drip drip-5"></div> <div class="blood-drip drip-6"></div> <!-- Auth Screen --> <div class="auth-screen" id="authScreen"> <div class="auth-box"> <div class="auth-logo">🩸</div> <h1>BABA A Z A F</h1> <div class="subtitle">BLOODY RED ANALYZER</div> <input type="password" id="passInput" placeholder="ENTER ACCESS KEY" autocomplete="off"> <button id="unlockBtn">UNLOCK SYSTEM</button> <div class="auth-error" id="errorMsg"></div> </div> </div> <!-- Main Content --> <div class="main-content" id="mainContent"> <div class="container"> <div class="header"> <h1>NID ANALYZER</h1> <div class="tagline">EGYPTIAN NATIONAL ID DECODER</div> <div class="developer">Powered by BABA A Z A F</div> </div> <div class="control-panel"> <div class="panel-title">📝 INPUT PANEL</div> <div class="input-section"> <textarea id="nidInput" placeholder="Enter Egyptian National IDs (14 digits each)&#10;One ID per line..."></textarea> <div class="button-group"> <button class="btn" id="analyzeBtn">🔍 ANALYZE</button> <button class="btn" id="exportBtn">📊 EXPORT</button> <button class="btn" id="clearBtn">🗑️ CLEAR</button> </div> </div> </div> <div class="stats-dashboard" id="statsDashboard" style="display: none;"> <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="totalStat">0</div></div> <div class="stat-card"><div class="stat-label">Valid</div><div class="stat-value" id="validStat">0</div></div> <div class="stat-card"><div class="stat-label">Invalid</div><div class="stat-value" id="invalidStat">0</div></div> <div class="stat-card"><div class="stat-label">Success</div><div class="stat-value" id="successStat">0%</div></div> </div> <div class="results-section"> <div class="results-title">📊 ANALYSIS RESULTS</div> <div id="resultsArea"> <div style="text-align: center; padding: 40px; color: var(--text-secondary); animation: flicker 2s infinite;">WAITING FOR INPUT...</div> </div> </div> <footer> <div class="footer-text">🔥 BABA A Z A F 🔥</div> <div style="animation: flicker 2s infinite;">All Rights Reserved © 2024</div> </footer> </div> </div> <script> const CONFIG = { AUTH_KEY: "Azafone" }; let appState = { results: [], stats: { total: 0, valid: 0, invalid: 0 } }; // Keyboard support document.getElementById('passInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') authenticate(); }); document.getElementById('unlockBtn').addEventListener('click', authenticate); function authenticate() { if (document.getElementById('passInput').value === CONFIG.AUTH_KEY) { document.getElementById('authScreen').style.display = 'none'; document.getElementById('mainContent').style.display = 'block'; } else { document.getElementById('errorMsg').innerText = '❌ ACCESS DENIED'; document.getElementById('passInput').value = ''; } } const GOVERNORATES = { '01': 'القاهرة', '02': 'الإسكندرية', '03': 'بورسعيد', '04': 'السويس', '11': 'دمياط', '12': 'الدقهلية', '13': 'الشرقية', '14': 'القليوبية', '15': 'كفر الشيخ', '16': 'الغربية', '17': 'المنوفية', '18': 'البحيرة', '19': 'الإسماعيلية', '21': 'الجيزة', '22': 'بني سويف', '23': 'الفيوم', '24': 'المنيا', '25': 'أسيوط', '26': 'سوهاج', '27': 'قنا', '28': 'الأقصر', '29': 'أسوان', '31': 'البحر الأحمر', '32': 'الوادي الجديد', '33': 'مطروح', '34': 'شمال سيناء', '35': 'جنوب سيناء', '88': 'خارج الجمهورية' }; function analyzeNID(nid) { nid = nid.trim(); if (nid.length !== 14 || !/^\d+$/.test(nid)) return { valid: false, error: 'Invalid Format' }; try { const century = nid[0]; const birthYear = nid.substring(1, 3); const birthMonth = nid.substring(3, 5); const birthDay = nid.substring(5, 7); const govCode = nid.substring(7, 9); const gender = parseInt(nid[13]) % 2 === 0 ? 'Female' : 'Male'; let fullYear = (century === '2' ? 1900 : 2000) + parseInt(birthYear); return { valid: true, nid: nid, birthDate: `${birthDay}/${birthMonth}/${fullYear}`, governorate: GOVERNORATES[govCode] || 'Unknown', gender: gender, serial: nid.substring(9, 13) }; } catch (e) { return { valid: false, error: 'Error' }; } } document.getElementById('analyzeBtn').addEventListener('click', () => { const lines = document.getElementById('nidInput').value.split('\n').filter(l => l.trim()); let html = ''; appState.stats = { total: 0, valid: 0, invalid: 0 }; lines.forEach((nid, idx) => { const res = analyzeNID(nid); appState.stats.total++; if (res.valid) { appState.stats.valid++; html += `<div class="result-card" style="animation-delay: ${idx * 0.1}s;"><div class="result-header"><div class="result-nid">🩸 ${res.nid}</div><div class="result-status status-valid">✓ VALID</div></div><div class="result-data"><div class="data-item"><div class="data-label">Birth</div><div class="data-value">${res.birthDate}</div></div><div class="data-item"><div class="data-label">Gender</div><div class="data-value">${res.gender}</div></div><div class="data-item"><div class="data-label">Gov</div><div class="data-value">${res.governorate}</div></div><div class="data-item"><div class="data-label">Serial</div><div class="data-value">${res.serial}</div></div></div></div>`; } else { appState.stats.invalid++; html += `<div class="result-card" style="animation-delay: ${idx * 0.1}s;"><div class="result-header"><div class="result-nid">❌ ${nid}</div><div class="result-status">INVALID</div></div></div>`; } }); document.getElementById('resultsArea').innerHTML = html; document.getElementById('totalStat').innerText = appState.stats.total; document.getElementById('validStat').innerText = appState.stats.valid; document.getElementById('invalidStat').innerText = appState.stats.invalid; document.getElementById('successStat').innerText = Math.round((appState.stats.valid/appState.stats.total)*100) + '%'; document.getElementById('statsDashboard').style.display = 'grid'; }); document.getElementById('clearBtn').addEventListener('click', () => { document.getElementById('nidInput').value = ''; document.getElementById('resultsArea').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary); animation: flicker 2s infinite;">WAITING FOR INPUT...</div>'; document.getElementById('statsDashboard').style.display = 'none'; }); document.getElementById('exportBtn').addEventListener('click', () => { if (appState.stats.total === 0) { alert('No results to export'); return; } let csv = 'NID,Status,Birth Date,Gender,Governorate,Serial\n'; document.querySelectorAll('.result-card').forEach(card => { const nid = card.querySelector('.result-nid').innerText.replace('🩸 ', '').replace('❌ ', ''); const status = card.querySelector('.result-status').innerText; const values = Array.from(card.querySelectorAll('.data-value')).map(v => v.innerText); csv += `${nid},${status},${values.join(',')}\n`; }); const blob = new Blob([csv], { type: 'text/csv' }); const url = window.URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `NID_Analysis_${new Date().getTime()}.csv`; a.click(); }); document.getElementById('nidInput').addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') { document.getElementById('analyzeBtn').click(); } }); </script> </body> </html>
