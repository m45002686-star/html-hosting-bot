<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين - BAMA TECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-table-container {
            max-width: 1200px;
            margin: 80px auto 20px;
            padding: 20px;
        }
        .admin-table {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
        }
        .admin-table th, .admin-table td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }
        .admin-table th {
            background: #f8fafc;
            font-weight: 600;
        }
        .action-buttons button {
            padding: 5px 10px;
            margin: 0 3px;
            font-size: 12px;
        }
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-crown"></i><span>BAMA <span class="tech">TECH</span></span></div>
            <div class="nav-links">
                <a href="feed.html"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="admin-dashboard.html"><i class="fas fa-shield-alt"></i> لوحة التحكم</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </div>
        </div>
    </nav>

    <div class="admin-table-container">
        <h2><i class="fas fa-users"></i> إدارة المستخدمين</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="بحث بالاسم أو اسم المستخدم...">
        </div>
        <div class="admin-table">
            <table style="width:100%">
                <thead>
                    <tr><th>المستخدم</th><th>اسم المستخدم</th><th>الحالة</th><th>الشارات</th><th>إجراءات</th></tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        let currentUser = getUserById(currentUserId);
        if(!currentUser || (!currentUser.isAdmin && !currentUser.isOwner)) {
            window.location.href = 'feed.html';
        }
        
        function renderUsersTable(searchTerm = '') {
            let regularUsers = users.filter(u => !u.isOwner && !u.isAdmin);
            if(searchTerm) {
                regularUsers = regularUsers.filter(u => u.name.includes(searchTerm) || u.username.includes(searchTerm));
            }
            
            let html = regularUsers.map(u => `
                <tr>
                    <td><strong>${u.name}</strong></td>
                    <td>@${u.username}</td>
                    <td>${u.banned ? '<span style="color:#ef4444;">محظور</span>' : '<span style="color:#10b981;">نشط</span>'}</td>
                    <td>${getUserBadges(u)}</td>
                    <td class="action-buttons">
                        <button onclick="verifyUserPrompt(${u.id})" style="background:#3b82f6;">${u.verified ? 'إلغاء التوثيق' : 'توثيق'}</button>
                        <button onclick="grantVerifiedPlusPrompt(${u.id})" style="background:#f59e0b;">${u.verifiedPlus ? 'سحب VERIFIED+' : 'VERIFIED+'}</button>
                        <button onclick="banUserPrompt(${u.id})" style="background:#ef4444;">${u.banned ? 'إلغاء الحظر' : 'حظر'}</button>
                        <button onclick="deleteUserPrompt(${u.id})" style="background:#dc2626;">حذف</button>
                    </td>
                </tr>
            `).join('');
            
            if(regularUsers.length === 0) {
                html = '<tr><td colspan="5" style="text-align:center;">لا يوجد مستخدمين</td></tr>';
            }
            document.getElementById('usersTableBody').innerHTML = html;
        }
        
        window.verifyUserPrompt = (id) => { verifyUser(id); renderUsersTable(document.getElementById('searchInput').value); };
        window.grantVerifiedPlusPrompt = (id) => { grantVerifiedPlus(id); renderUsersTable(document.getElementById('searchInput').value); };
        window.banUserPrompt = (id) => { banUser(id); renderUsersTable(document.getElementById('searchInput').value); };
        window.deleteUserPrompt = (id) => {
            if(confirm('هل أنت متأكد من حذف هذا المستخدم نهائياً؟')) {
                users = users.filter(u => u.id !== id);
                posts = posts.filter(p => p.userId !== id);
                saveData();
                renderUsersTable(document.getElementById('searchInput').value);
            }
        };
        
        document.getElementById('searchInput').addEventListener('input', (e) => renderUsersTable(e.target.value));
        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
        
        renderUsersTable();
    </script>
</body>
</html>
