<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>عارض مواقع متعدد</title> <style> body{ margin:0; background:#111827; font-family:Tahoma, Arial, sans-serif; } .top{ display:flex; gap:10px; padding:10px; background:#1f2937; position:sticky; top:0; z-index:1000; } input{ flex:1; padding:12px; border:none; border-radius:8px; outline:none; } button{ padding:12px 20px; border:none; border-radius:8px; cursor:pointer; } .frames{ display:flex; flex-direction:column; } iframe{ width:100%; height:100vh; border:none; background:white; display:block; } </style> </head> <body> <div class="top"> <input id="url" type="text" placeholder="أدخل رابط الموقع"> <button onclick="loadSite()">عرض</button> </div> <div class="frames"> <iframe id="viewer1"></iframe> <iframe id="viewer2"></iframe> <iframe id="viewer3"></iframe> <iframe id="viewer4"></iframe> <iframe id="viewer5"></iframe> <iframe id="viewer6"></iframe> <iframe id="viewer7"></iframe> <iframe id="viewer8"></iframe> <iframe id="viewer9"></iframe> <iframe id="viewer10"></iframe> <iframe id="viewer11"></iframe> <iframe id="viewer12"></iframe> <iframe id="viewer13"></iframe> <iframe id="viewer14"></iframe> <iframe id="viewer15"></iframe> <iframe id="viewer16"></iframe> </div> <script> function loadSite(){ let url = document.getElementById("url").value.trim(); if(!url){ alert("أدخل رابطاً"); return; } if( !url.startsWith("http://") && !url.startsWith("https://") ){ url = "https://" + url; } for(let i=1;i<=11;i++){ document.getElementById("viewer"+i).src = url; } } </script> </body> </html>
