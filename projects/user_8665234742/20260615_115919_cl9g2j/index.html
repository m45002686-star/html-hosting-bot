<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <title>مترجم الجو الحاكم - نظام التشفير</title> <style> body { background-color: #050505; color: #00f2ff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; } .container { background: linear-gradient(145deg, #0a0a0a, #1a1a1a); padding: 40px; border: 2px solid #00f2ff; border-radius: 20px; box-shadow: 0 0 30px #00f2ff55; text-align: center; width: 90%; max-width: 600px; } h1 { color: #fff; text-shadow: 0 0 10px #00f2ff; margin-bottom: 20px; font-size: 2rem; } textarea { width: 90%; height: 120px; background: #000; border: 1px solid #00f2ff; color: #fff; padding: 15px; border-radius: 10px; font-size: 1.2rem; resize: none; margin-bottom: 20px; outline: none; } button { background: #00f2ff; color: #000; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.4s; } button:hover { background: #fff; box-shadow: 0 0 20px #fff; transform: scale(1.05); } #result { margin-top: 30px; padding: 20px; border-top: 1px dashed #00f2ff; font-size: 1.5rem; color: #fff; min-height: 50px; } .footer { margin-top: auto; padding: 20px; color: #555; font-size: 0.9rem; } .footer span { color: #00f2ff; font-weight: bold; } </style> </head> <body> <div class="container"> <h1>نظام ترجمة الجو الحاكم</h1> <textarea id="textInput" placeholder="اكتب النص هنا للترجمة..."></textarea> <button onclick="translateText()">ترجمة ⚡</button> <div id="result">النتيجة ستظهر هنا...</div> </div> <div class="footer">للتواصل مع الإدارة: <span>01143317801</span></div> <script> async function translateText() { let text = document.getElementById("textInput").value; let resultDiv = document.getElementById("result"); resultDiv.innerText = "جاري الاتصال بالسيرفر..."; // نستخدم API ترجمة جوجل المجاني let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURI(text)}`; try { let response = await fetch(url); let data = await response.json(); resultDiv.innerText = data[0][0][0]; } catch (error) { resultDiv.innerText = "خطأ في الاتصال، حاول مرة أخرى."; } } </script> </body> </html>
