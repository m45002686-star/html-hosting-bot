<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اااا | عمر هوست</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .project-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin: 30px 0;
        }
        .project-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .btn {
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: white;
            color: #333;
            border: 2px solid #667eea;
        }
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        .url-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            border: 1px dashed #667eea;
        }
        .copy-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.2rem;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">عمر هوست ✨</div>
        
        <div class="project-card">
            <div class="project-name">📁 اااا</div>
            <div>🆔 20260215 | ⏰ 2026-02-15 02:09</div>
        </div>
        
        <div class="buttons">
            <a href="https://raw.githack.com/m45002686-star/html-hosting-bot/main/projects/user_8278813398/20260215_020928_1knd3f/" class="btn btn-primary" target="_blank">🌐 زيارة الموقع</a>
            <a href="https://raw.githack.com/m45002686-star/html-hosting-bot/main/projects/user_8278813398/20260215_020928_1knd3f/" class="btn btn-secondary" target="_blank">🔗 الرابط المباشر</a>
        </div>
        
        <div class="url-box">
            <span id="customUrl">https://omar-host.vercel.app/project-20260215</span>
            <button class="copy-btn" onclick="copyUrl()">📋</button>
        </div>
        
        <div class="footer">
            <p>تم الاستضافة عبر <a href="https://t.me/RLH55">@OmarHostBot</a></p>
            <p>✨ حماية AI - روابط أنيقة - استضافة احترافية ✨</p>
        </div>
    </div>
    <script>
        function copyUrl() {
            var url = document.getElementById('customUrl').innerText;
            navigator.clipboard.writeText(url);
            var btn = document.querySelector('.copy-btn');
            btn.innerText = '✅';
            setTimeout(() => btn.innerText = '📋', 2000);
        }
    </script>
</body>
</html>
