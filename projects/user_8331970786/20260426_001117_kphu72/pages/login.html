<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - BAMA TECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0f1c, #0f172a, #1e293b);
            padding: 80px 20px;
        }
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: fadeInUp 0.5s ease;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h2 {
            font-size: 28px;
            color: #1e293b;
        }
        .auth-header p {
            color: #64748b;
            margin-top: 8px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00adb5;
            box-shadow: 0 0 0 3px rgba(0,173,181,0.1);
        }
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .remember-forgot a {
            color: #00adb5;
            text-decoration: none;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00adb5, #4facfe);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,173,181,0.3);
        }
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .auth-footer a {
            color: #00adb5;
            text-decoration: none;
            font-weight: 600;
        }
        .demo-accounts {
            margin-top: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }
        .demo-accounts p {
            font-size: 13px;
            margin: 5px 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-crown" style="font-size: 50px; color: #fbbf24;"></i>
                <h2>مرحباً بعودتك</h2>
                <p>سجل دخولك إلى BAMA TECH</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox"> تذكرني
                    </label>
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="auth-btn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>
            
            <div class="demo-accounts">
                <p><i class="fas fa-info-circle"></i> معلومات:</p>
                <p>يمكنك استخدام حساب اذا كان لديك</p>
                <p>🛡️اذا لم يكن لديك حساب يمكنك صناعه بنفسك</p>
                <p>المطور (تليجرام) : @VY،_CB</p>
            </div>
            
            <div class="auth-footer">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>
    
    <script src="../js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            
            let user = loginUser(username, password);
            if(user) {
                setTimeout(() => {
                    window.location.href = 'feed.html';
                }, 500);
            }
        });
    </script>
</body>
</html>
