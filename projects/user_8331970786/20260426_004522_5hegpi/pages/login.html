<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - BAMA TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0f1c, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: fadeInUp 0.5s ease;
        }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header i { font-size: 50px; color: #fbbf24; }
        .auth-header h2 { font-size: 28px; color: #1e293b; margin-top: 10px; }
        .auth-header p { color: #64748b; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
        }
        .input-group input:focus { outline: none; border-color: #00adb5; }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00adb5, #4facfe);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-footer { text-align: center; margin-top: 25px; }
        .auth-footer a { color: #00adb5; text-decoration: none; }
        .error-message {
            background: #fee2e2;
            color: #ef4444;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-crown"></i>
            <h2>مرحباً بعودتك</h2>
            <p>سجل دخولك إلى BAMA TECH</p>
        </div>
        
        <div class="error-message" id="errorMsg"></div>
        
        <form id="loginForm">
            <div class="input-group">
                <label><i class="fas fa-user"></i> اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="input-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="auth-btn">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
        </form>
        
        <div class="auth-footer">
            ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        // تهيئة البيانات الافتراضية
        if (!localStorage.getItem('bamatech_users_final')) {
            let users = [
                { id: 1, username: 'owner', name: 'مالك المنصة', password: 'owner123', isOwner: true, isAdmin: true, verified: true, verifiedPlus: true, bio: '👑 مؤسس BAMA TECH', avatar: '', banned: false },
                { id: 2, username: 'admin1', name: 'أمير الإدمن', password: 'admin123', isOwner: false, isAdmin: true, verified: true, verifiedPlus: true, bio: 'مدير عام', avatar: '', banned: false },
                { id: 3, username: 'sarah', name: 'سارة', password: '123', isOwner: false, isAdmin: false, verified: false, verifiedPlus: false, bio: 'مرحباً أنا جديدة', avatar: '', banned: false }
            ];
            localStorage.setItem('bamatech_users_final', JSON.stringify(users));
        }
        
        if (!localStorage.getItem('bamatech_posts_final')) {
            let posts = [
                { id: 1, userId: 1, content: 'مرحباً بكم في منصة BAMA TECH 👑', image: '', timestamp: Date.now(), likes: [], comments: [] }
            ];
            localStorage.setItem('bamatech_posts_final', JSON.stringify(posts));
        }
        
        // التحقق من تسجيل الدخول الحالي
        let currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            let user = JSON.parse(currentUser);
            if (!user.banned) {
                window.location.href = 'feed.html';
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let username = document.getElementById('username').value.trim();
            let password = document.getElementById('password').value;
            let errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';
            
            let users = JSON.parse(localStorage.getItem('bamatech_users_final'));
            let user = users.find(u => u.username === username && u.password === password);
            
            if (user && !user.banned) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'feed.html';
            } else if (user && user.banned) {
                errorMsg.innerHTML = '❌ هذا الحساب محظور';
                errorMsg.style.display = 'block';
            } else {
                errorMsg.innerHTML = '❌ اسم المستخدم أو كلمة المرور غير صحيحة';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
