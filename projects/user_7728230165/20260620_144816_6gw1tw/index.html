<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>🏪 سوق NFTs</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #ffffff; padding: 16px 16px 80px 16px; min-height: 100vh; } .header { background: linear-gradient(135deg, #7c3aed, #a78bfa); border-radius: 20px; padding: 24px 20px; margin-bottom: 20px; } .header h1 { font-size: 22px; font-weight: 700; } .header p { font-size: 14px; opacity: 0.8; } .header .stats { display: flex; gap: 20px; margin-top: 12px; font-size: 13px; } .header .stats span { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; } /* ===== معلومات المستخدم ===== */ .user-info { background: #1a1a2e; border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a2a4a; display: flex; align-items: center; gap: 14px; } .user-info .avatar { width: 48px; height: 48px; border-radius: 50%; background: #2a2a4a; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; } .user-info .user-details { flex: 1; } .user-info .user-details .name { font-weight: 600; font-size: 16px; } .user-info .user-details .username { font-size: 13px; color: #888; } .user-info .user-details .id { font-size: 11px; color: #555; } .login-btn { background: #7c3aed; border: none; color: white; padding: 8px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; } .login-btn:hover { background: #6d28d9; } .search-box { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 14px; padding: 12px 16px; width: 100%; color: #fff; font-size: 15px; margin-bottom: 16px; } .search-box:focus { border-color: #7c3aed; outline: none; } .search-box::placeholder { color: #666; } .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; } .tab { background: #1a1a2e; padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; color: #888; border: 1px solid transparent; white-space: nowrap; } .tab.active { background: #7c3aed; color: #fff; border-color: #7c3aed; } .tab:hover { background: #2a2a4a; } .sell-btn { background: linear-gradient(135deg, #10b981, #059669); border: none; color: white; padding: 14px 24px; border-radius: 14px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 16px; } .sell-btn:hover { transform: scale(1.02); } .nft-card { background: #1a1a2e; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; border: 1px solid #2a2a4a; } .nft-card .icon { width: 48px; height: 48px; border-radius: 12px; background: #2a2a4a; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; } .nft-card .info { flex: 1; } .nft-card .info .name { font-weight: 600; font-size: 15px; } .nft-card .info .seller { font-size: 12px; color: #888; } .nft-card .price-section { text-align: right; } .nft-card .price-section .price { font-weight: 700; color: #a78bfa; font-size: 16px; } .nft-card .price-section .rarity { font-size: 11px; padding: 2px 10px; border-radius: 12px; background: #2a2a4a; display: inline-block; margin-top: 4px; } .rarity-common { color: #9ca3af; } .rarity-uncommon { color: #34d399; } .rarity-rare { color: #60a5fa; } .rarity-epic { color: #a78bfa; } .rarity-legendary { color: #fbbf24; } .rarity-mythic { color: #f472b6; } .buy-btn { background: #7c3aed; border: none; color: white; padding: 6px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; } .buy-btn:hover { background: #6d28d9; } .buy-btn.sold { background: #374151; cursor: not-allowed; } .empty-state { text-align: center; padding: 40px 20px; color: #666; } .empty-state .emoji { font-size: 48px; } .empty-state h3 { color: #fff; } .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f1a; border-top: 1px solid #1a1a2e; display: flex; justify-content: space-around; padding: 10px 0 12px 0; z-index: 100; } .bottom-nav .nav-item { text-align: center; font-size: 10px; color: #666; cursor: pointer; background: transparent; border: none; padding: 4px 12px; } .bottom-nav .nav-item .icon { font-size: 22px; display: block; } .bottom-nav .nav-item.active { color: #a78bfa; } .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; } .modal-overlay.show { display: flex; } .modal { background: #1a1a2e; border-radius: 24px; padding: 28px; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; } .modal h2 { font-size: 20px; margin-bottom: 16px; text-align: center; } .modal input, .modal select, .modal textarea { background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 12px; padding: 12px 16px; width: 100%; color: white; font-size: 14px; margin-bottom: 12px; } .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #7c3aed; outline: none; } .modal textarea { min-height: 60px; resize: vertical; } .modal .modal-actions { display: flex; gap: 10px; } .modal .modal-actions button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; } .modal .modal-actions .confirm-btn { background: #7c3aed; color: white; } .modal .modal-actions .confirm-btn:hover { background: #6d28d9; } .modal .modal-actions .cancel-btn { background: #2a2a4a; color: #888; } .modal .modal-actions .cancel-btn:hover { background: #3a3a5a; } .wallet-section { background: #1a1a2e; border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a2a4a; } .wallet-section .label { font-size: 13px; color: #888; } .wallet-section .address { font-family: monospace; font-size: 14px; color: #a78bfa; word-break: break-all; } .wallet-section .balance { font-size: 20px; font-weight: 700; color: #10b981; } .wallet-btn { background: #2a2a4a; border: none; color: white; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; margin-top: 8px; } .wallet-btn:hover { background: #3a3a5a; } .wallet-btn.primary { background: #7c3aed; } .wallet-btn.primary:hover { background: #6d28d9; } .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1a1a2e; border: 1px solid #2a2a4a; padding: 12px 24px; border-radius: 14px; font-size: 14px; color: #fff; z-index: 300; display: none; text-align: center; } .toast.show { display: block; animation: slideUp 0.3s ease; } .toast.success { border-color: #10b981; } .toast.error { border-color: #ef4444; } .toast.info { border-color: #3b82f6; } @keyframes slideUp { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } } .loading { text-align: center; padding: 40px; color: #666; } .loading .spinner { width: 40px; height: 40px; border: 3px solid #2a2a4a; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; } @keyframes spin { to { transform: rotate(360deg); } } .open-bot-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; color: white; padding: 12px 20px; border-radius: 14px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; margin-bottom: 16px; } .open-bot-btn:hover { transform: scale(1.02); } .refresh-btn { background: #2a2a4a; border: none; color: white; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; margin-bottom: 16px; width: 100%; } .refresh-btn:hover { background: #3a3a5a; } @media (max-width: 480px) { body { padding: 12px 12px 70px 12px; } .header { padding: 18px 16px; } .header h1 { font-size: 18px; } .nft-card { padding: 12px; } } </style> </head> <body> <!-- ===== الهيدر ===== --> <div class="header"> <h1>🏪 سوق NFTs</h1> <p>بيع وشراء NFTs مع تحويل الملكية</p> <div class="stats"> <span id="totalItems">0 NFT</span> <span id="totalUsers">0 مستخدم</span> </div> </div> <!-- ===== معلومات المستخدم ===== --> <div class="user-info" id="userInfo"> <div class="avatar" id="userAvatar">👤</div> <div class="user-details"> <div class="name" id="userName">زائر</div> <div class="username" id="userUsername">غير مسجل دخول</div> <div class="id" id="userId">---</div> </div> <button class="login-btn" id="loginBtn" onclick="loginWithTelegram()">🔑 تسجيل الدخول</button> </div> <!-- ===== زر فتح البوت ===== --> <button class="open-bot-btn" onclick="openBot()">🤖 افتح البوت</button> <button class="refresh-btn" onclick="loadNFTs()">🔄 تحديث البيانات</button> <!-- ===== المحفظة ===== --> <div class="wallet-section"> <div class="label">🔗 محفظة TON</div> <div class="address" id="walletAddress">غير مرتبطة</div> <div class="balance" id="walletBalance">0 TON</div> <button class="wallet-btn primary" onclick="connectWallet()">🔗 ربط المحفظة</button> <button class="wallet-btn" onclick="refreshBalance()" style="margin-left:8px;">🔄 تحديث</button> </div> <!-- ===== البحث ===== --> <input class="search-box" id="searchInput" placeholder="🔍 ابحث عن NFT..." oninput="filterItems()"> <!-- ===== الأقسام ===== --> <div class="tabs" id="tabs"> <div class="tab active" data-tab="all" onclick="switchTab('all')">🎁 الكل</div> <div class="tab" data-tab="common" onclick="switchTab('common')">🎁 عادي</div> <div class="tab" data-tab="uncommon" onclick="switchTab('uncommon')">🎀 نادر</div> <div class="tab" data-tab="rare" onclick="switchTab('rare')">🌟 مميز</div> <div class="tab" data-tab="epic" onclick="switchTab('epic')">✨ ملحمي</div> <div class="tab" data-tab="legendary" onclick="switchTab('legendary')">👑 أسطوري</div> </div> <!-- ===== زر عرض NFT ===== --> <button class="sell-btn" onclick="openSellModal()">➕ عرض NFT للبيع</button> <!-- ===== قائمة NFTs ===== --> <div id="itemsContainer"> <div class="loading"> <div class="spinner"></div> <p>جاري التحميل...</p> </div> </div> <!-- ===== القائمة السفلية ===== --> <div class="bottom-nav"> <button class="nav-item active" onclick="switchNav('market')"><span class="icon">🏪</span>السوق</button> <button class="nav-item" onclick="switchNav('myitems')"><span class="icon">🎁</span>NFTs الخاصة بي</button> <button class="nav-item" onclick="switchNav('profile')"><span class="icon">👤</span>حسابي</button> <button class="nav-item" onclick="switchNav('tasks')"><span class="icon">📋</span>مهامي</button> </div> <!-- ===== مودال عرض NFT ===== --> <div class="modal-overlay" id="sellModal"> <div class="modal"> <h2>➕ عرض NFT للبيع</h2> <input type="text" id="itemName" placeholder="اسم NFT"> <input type="number" id="itemPrice" placeholder="السعر بـ TON" step="0.01"> <select id="itemRarity"> <option value="common">🎁 عادي</option> <option value="uncommon">🎀 غير عادي</option> <option value="rare">🌟 نادر</option> <option value="epic">✨ ملحمي</option> <option value="legendary">👑 أسطوري</option> <option value="mythic">💫 خرافي</option> </select> <textarea id="itemDescription" placeholder="وصف NFT (اختياري)"></textarea> <input type="text" id="nftLink" placeholder="رابط NFT"> <div class="modal-actions"> <button class="cancel-btn" onclick="closeSellModal()">إلغاء</button> <button class="confirm-btn" onclick="submitItem()">نشر للبيع</button> </div> </div> </div> <!-- ===== مودال ربط المحفظة ===== --> <div class="modal-overlay" id="walletModal"> <div class="modal"> <h2>🔗 ربط محفظة TON</h2> <p style="color:#888;font-size:14px;margin-bottom:16px;">أدخل عنوان محفظة TON</p> <input id="walletInput" placeholder="UQ... أو EQ..." style="background:#0f0f1a;border:1px solid #2a2a4a;border-radius:12px;padding:12px 16px;width:100%;color:white;font-size:14px;margin-bottom:12px;"> <div class="modal-actions"> <button class="cancel-btn" onclick="closeWalletModal()">إلغاء</button> <button class="confirm-btn" onclick="saveWallet()">ربط المحفظة</button> </div> </div> </div> <!-- ===== تنبيه ===== --> <div class="toast" id="toast"></div> <script> // ============================================================ // الإعدادات // ============================================================ const BOT_TOKEN = '7129063969:AAF7TkJ4UctGhBh-fC62y7HtNR7RyVvATqM'; const BOT_USERNAME = 'Y6GBot'; const BOT_API = `https://api.telegram.org/bot${BOT_TOKEN}`; const TELEGRAM = window.Telegram?.WebApp; // ============================================================ // متغيرات المستخدم // ============================================================ let currentUser = null; let allItems = []; let currentTab = 'all'; let userWallet = null; let userBalance = 0; let lastUpdateId = 0; // ============================================================ // ربط حساب تليجرام // ============================================================ function updateUserUI() { if (currentUser) { document.getElementById('userName').textContent = currentUser.first_name || currentUser.username || 'مستخدم'; document.getElementById('userUsername').textContent = currentUser.username ? `@${currentUser.username}` : 'لا يوجد يوزر'; document.getElementById('userId').textContent = `ID: ${currentUser.id}`; document.getElementById('userAvatar').textContent = currentUser.first_name ? currentUser.first_name[0] : '👤'; document.getElementById('loginBtn').textContent = '✅ متصل'; document.getElementById('loginBtn').style.background = '#10b981'; document.getElementById('loginBtn').onclick = null; } } function loginWithTelegram() { if (TELEGRAM) { // إذا كان داخل التطبيق، نطلب البيانات TELEGRAM.ready(); currentUser = TELEGRAM.initDataUnsafe?.user; if (currentUser) { localStorage.setItem('telegram_user', JSON.stringify(currentUser)); updateUserUI(); showToast('✅ تم تسجيل الدخول بنجاح!', 'success'); loadNFTs(); return; } } // إذا لم يعمل، نفتح البوت لتسجيل الدخول showToast('📱 يرجى فتح الموقع من داخل البوت', 'info'); openBot(); } // ============================================================ // فتح البوت // ============================================================ function openBot() { if (TELEGRAM) { try { TELEGRAM.openTelegramLink(`https://t.me/${BOT_USERNAME}`); } catch(e) { window.open(`https://t.me/${BOT_USERNAME}`, '_blank'); } } else { window.open(`https://t.me/${BOT_USERNAME}`, '_blank'); } } // ============================================================ // تهيئة التطبيق // ============================================================ document.addEventListener('DOMContentLoaded', function() { // محاولة جلب المستخدم من تليجرام if (TELEGRAM) { TELEGRAM.ready(); currentUser = TELEGRAM.initDataUnsafe?.user; if (currentUser) { localStorage.setItem('telegram_user', JSON.stringify(currentUser)); } TELEGRAM.expand(); } // إذا لم يتم التعرف على المستخدم، نحاول من localStorage if (!currentUser) { const savedUser = localStorage.getItem('telegram_user'); if (savedUser) { try { currentUser = JSON.parse(savedUser); } catch(e) {} } } // إذا ما زال null، نعرض زر تسجيل الدخول if (!currentUser) { // نعرض مستخدم زائر مؤقت currentUser = { id: Date.now(), username: 'زائر', first_name: 'زائر' }; // لكن نترك زر تسجيل الدخول ظاهراً } updateUserUI(); loadSavedWallet(); loadNFTs(); document.getElementById('searchInput').addEventListener('input', filterItems); }); // ============================================================ // تحميل NFTs من قاعدة البيانات // ============================================================ function loadNFTs() { showToast('📡 جاري التحميل...', 'info'); if (!currentUser || currentUser.username === 'زائر') { showToast('⚠️ يرجى تسجيل الدخول أولاً', 'error'); loadLocalItems(); return; } fetch(`${BOT_API}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: currentUser.id, text: '/get_nfts_real' }) }) .then(() => { setTimeout(() => { fetch(`${BOT_API}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`) .then(res => res.json()) .then(data => { if (data.ok && data.result) { for (let update of data.result) { if (update.update_id > lastUpdateId) { lastUpdateId = update.update_id; } if (update.message && update.message.text && update.message.text.startsWith('/nft_data ')) { try { const jsonStr = update.message.text.replace('/nft_data ', ''); const nfts = JSON.parse(jsonStr); allItems = nfts; renderItems(); updateStats(); showToast(`✅ تم تحميل ${allItems.length} NFT`, 'success'); return; } catch(e) {} } } } if (allItems.length === 0) { showToast('📭 لا توجد NFTs', 'info'); loadLocalItems(); } }) .catch(() => { loadLocalItems(); }); }, 3000); }) .catch(() => { loadLocalItems(); }); } // ============================================================ // تحميل بيانات محلية (احتياطي) // ============================================================ function loadLocalItems() { const saved = localStorage.getItem('market_nfts'); if (saved) { try { allItems = JSON.parse(saved); renderItems(); updateStats(); showToast('📁 تم تحميل البيانات المحلية', 'info'); return; } catch(e) {} } allItems = []; renderItems(); updateStats(); } // ============================================================ // إدارة المحفظة // ============================================================ function loadSavedWallet() { const saved = localStorage.getItem('ton_wallet'); if (saved) { try { const data = JSON.parse(saved); userWallet = data.address; document.getElementById('walletAddress').textContent = data.address; document.getElementById('walletAddress').style.color = '#10b981'; refreshBalance(); } catch(e) {} } } function connectWallet() { if (!currentUser || currentUser.username === 'زائر') { showToast('⚠️ يرجى تسجيل الدخول أولاً!', 'error'); loginWithTelegram(); return; } document.getElementById('walletModal').classList.add('show'); document.getElementById('walletInput').value = userWallet || ''; document.getElementById('walletInput').focus(); } function closeWalletModal() { document.getElementById('walletModal').classList.remove('show'); } function saveWallet() { const address = document.getElementById('walletInput').value.trim(); if (!address || !address.match(/^[UQEQ][A-Za-z0-9_-]{47,48}$/)) { showToast('❌ عنوان غير صحيح!', 'error'); return; } userWallet = address; localStorage.setItem('ton_wallet', JSON.stringify({ address: address })); document.getElementById('walletAddress').textContent = address; document.getElementById('walletAddress').style.color = '#10b981'; if (currentUser && currentUser.id) { fetch(`${BOT_API}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: currentUser.id, text: `/set_wallet ${address}` }) }); } closeWalletModal(); refreshBalance(); showToast('✅ تم ربط المحفظة!', 'success'); } function refreshBalance() { if (!userWallet) { showToast('⚠️ يرجى ربط المحفظة أولاً', 'error'); return; } fetch(`https://toncenter.com/api/v2/getAddressBalance?address=${userWallet}`) .then(res => res.json()) .then(data => { if (data.ok && data.result) { userBalance = parseInt(data.result) / 1e9; document.getElementById('walletBalance').textContent = userBalance.toFixed(2) + ' TON'; } }) .catch(() => { userBalance = 0; document.getElementById('walletBalance').textContent = '0 TON'; }); } // ============================================================ // عرض NFTs // ============================================================ function updateStats() { const available = allItems.filter(i => !i.sold).length; document.getElementById('totalItems').textContent = available + ' NFT'; document.getElementById('totalUsers').textContent = currentUser?.id ? '1 مستخدم' : '0 مستخدم'; } function renderItems() { const container = document.getElementById('itemsContainer'); const search = document.getElementById('searchInput').value.toLowerCase(); let filtered = allItems.filter(item => { if (currentTab !== 'all' && item.rarity !== currentTab) return false; if (search && !item.name.toLowerCase().includes(search)) return false; return true; }); if (filtered.length === 0) { container.innerHTML = ` <div class="empty-state"> <div class="emoji">🔍</div> <h3>لا توجد NFTs</h3> <p>اضغط "تحديث البيانات"</p> </div> `; return; } let html = ''; filtered.forEach(item => { const emoji = getRarityEmoji(item.rarity); const rarityClass = 'rarity-' + item.rarity; const priceDisplay = item.price ? `${item.price} TON` : 'مجاني'; const isSold = item.sold || false; const link = item.link || ''; html += ` <div class="nft-card" style="${isSold ? 'opacity:0.6;border-color:#ef4444;' : ''}"> <div class="icon">${emoji}</div> <div class="info"> <div class="name">${item.name} ${isSold ? '❌ مباع' : ''}</div> <div class="seller">👤 ${item.seller || 'مجهول'}</div> ${link ? `<a href="${link}" target="_blank" style="color:#a78bfa;font-size:12px;">🔗 عرض</a>` : ''} </div> <div class="price-section"> <div class="price">${priceDisplay}</div> <div class="rarity ${rarityClass}">${item.rarity}</div> ${!isSold ? `<button class="buy-btn" onclick="buyItem('${item.id}')">🛒 شراء</button>` : `<button class="buy-btn sold" disabled>مباع</button>`} </div> </div> `; }); container.innerHTML = html; } // ============================================================ // الشراء // ============================================================ function buyItem(itemId) { if (!currentUser || currentUser.username === 'زائر') { showToast('⚠️ يرجى تسجيل الدخول أولاً!', 'error'); loginWithTelegram(); return; } const item = allItems.find(i => i.id === itemId); if (!item || item.sold) { showToast('❌ غير متاح', 'error'); return; } if (!userWallet) { showToast('⚠️ اربط المحفظة أولاً!', 'error'); connectWallet(); return; } if (userBalance < item.price) { showToast(`❌ رصيد غير كافٍ!`, 'error'); return; } if (!confirm(`شراء ${item.name} بـ ${item.price} TON؟`)) return; showToast('⏳ جاري الشراء...', 'info'); if (currentUser) { fetch(`${BOT_API}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: currentUser.id, text: `/buy_nft ${itemId}` }) }); } setTimeout(() => { userBalance -= item.price; document.getElementById('walletBalance').textContent = userBalance.toFixed(2) + ' TON'; item.sold = true; localStorage.setItem('market_nfts', JSON.stringify(allItems)); renderItems(); updateStats(); showToast(`✅ تم شراء ${item.name}!`, 'success'); }, 1500); } // ============================================================ // عرض NFT جديد // ============================================================ function openSellModal() { if (!currentUser || currentUser.username === 'زائر') { showToast('⚠️ يرجى تسجيل الدخول أولاً!', 'error'); loginWithTelegram(); return; } if (!userWallet) { showToast('⚠️ اربط المحفظة أولاً!', 'error'); connectWallet(); return; } document.getElementById('sellModal').classList.add('show'); document.getElementById('itemName').value = ''; document.getElementById('itemPrice').value = ''; document.getElementById('itemDescription').value = ''; document.getElementById('nftLink').value = ''; document.getElementById('itemName').focus(); } function closeSellModal() { document.getElementById('sellModal').classList.remove('show'); } function submitItem() { const name = document.getElementById('itemName').value.trim(); const price = parseFloat(document.getElementById('itemPrice').value); const rarity = document.getElementById('itemRarity').value; const description = document.getElementById('itemDescription').value.trim(); const link = document.getElementById('nftLink').value.trim(); if (!name) { showToast('❌ أدخل اسم NFT', 'error'); return; } if (isNaN(price) || price <= 0) { showToast('❌ أدخل سعر صحيح', 'error'); return; } const newItem = { id: 'nft_' + Date.now(), name: name, price: price, rarity: rarity, description: description, link: link, seller: currentUser?.username || currentUser?.first_name || 'مجهول', seller_id: currentUser?.id || 'مجهول', sold: false, date_added: new Date().toISOString() }; if (currentUser) { fetch(`${BOT_API}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: currentUser.id, text: `/add_nft_from_web ${JSON.stringify(newItem)}` }) }); } allItems.unshift(newItem); localStorage.setItem('market_nfts', JSON.stringify(allItems)); closeSellModal(); renderItems(); updateStats(); showToast(`✅ تم نشر ${name}!`, 'success'); setTimeout(() => { loadNFTs(); }, 3000); } // ============================================================ // دوال مساعدة // ============================================================ function getRarityEmoji(rarity) { const emojis = { 'common': '🎁', 'uncommon': '🎀', 'rare': '🌟', 'epic': '✨', 'legendary': '👑', 'mythic': '💫' }; return emojis[rarity] || '🎁'; } function switchTab(tab) { currentTab = tab; document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelector(`.tab[data-tab="${tab}"]`)?.classList.add('active'); renderItems(); } function filterItems() { renderItems(); } function switchNav(page) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.querySelector(`.nav-item[onclick*="${page}"]`)?.classList.add('active'); if (page === 'market') { renderItems(); } else if (page === 'myitems') { const myItems = allItems.filter(i => i.seller_id === String(currentUser?.id)); showToast(`🎁 لديك ${myItems.length} NFT`, 'info'); } else if (page === 'profile') { showToast(`👤 ${currentUser?.first_name || 'زائر'}\n🆔 ${currentUser?.id || '---'}\n💰 ${userBalance.toFixed(2)} TON`, 'info'); } else if (page === 'tasks') { showToast('📋 اربط محفظتك\nاعرض NFT\nاشتري NFT', 'info'); } } function showToast(message, type = 'info') { const toast = document.getElementById('toast'); toast.textContent = message; toast.className = 'toast show ' + type; clearTimeout(toast._timeout); toast._timeout = setTimeout(() => { toast.classList.remove('show'); }, 4000); } document.getElementById('sellModal').addEventListener('click', function(e) { if (e.target === this) closeSellModal(); }); document.getElementById('walletModal').addEventListener('click', function(e) { if (e.target === this) closeWalletModal(); }); document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeSellModal(); closeWalletModal(); } }); </script> </body> </html>
