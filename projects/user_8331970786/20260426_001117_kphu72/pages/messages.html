<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثات - BAMA TECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .messages-container {
            display: flex;
            max-width: 1200px;
            margin: 80px auto 20px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: calc(100vh - 100px);
        }
        .chat-list {
            width: 320px;
            border-left: 1px solid #e2e8f0;
            overflow-y: auto;
        }
        .chat-list-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px solid #f1f5f9;
        }
        .chat-item:hover, .chat-item.active {
            background: #f1f5f9;
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00adb5, #4facfe);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
        }
        .chat-info {
            flex: 1;
        }
        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .chat-last-msg {
            font-size: 12px;
            color: #64748b;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 14px;
        }
        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #00adb5, #4facfe);
            color: white;
            border-bottom-left-radius: 4px;
        }
        .message.received {
            align-self: flex-start;
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-right-radius: 4px;
        }
        .message-time {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
        }
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
        }
        .empty-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-crown"></i><span>BAMA <span class="tech">TECH</span></span></div>
            <div class="nav-links">
                <a href="feed.html"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="profile.html"><i class="fas fa-user"></i> ملفي</a>
                <a href="messages.html" class="active"><i class="fas fa-envelope"></i> الرسائل</a>
                <a href="notifications.html"><i class="fas fa-bell"></i> الإشعارات</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </div>
        </div>
    </nav>

    <div class="messages-container">
        <div class="chat-list">
            <div class="chat-list-header">
                <h3><i class="fas fa-comments"></i> المحادثات</h3>
            </div>
            <div id="chatList"></div>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="empty-chat">
                <i class="fas fa-comment-dots" style="font-size: 48px; margin-bottom: 10px;"></i>
                <p>اختر محادثة لبدء المراسلة</p>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        let currentUser = getUserById(currentUserId);
        if(!currentUser) window.location.href = 'login.html';
        
        let activeChatUserId = null;
        
        function getConversationList() {
            let otherUsersIds = new Set();
            messages.forEach(m => {
                if(m.from === currentUserId) otherUsersIds.add(m.to);
                if(m.to === currentUserId) otherUsersIds.add(m.from);
            });
            
            let recentUsers = Array.from(otherUsersIds).map(id => getUserById(parseInt(id))).filter(u => u);
            
            recentUsers.sort((a,b) => {
                let lastMsgA = messages.filter(m => (m.from === a.id && m.to === currentUserId) || (m.from === currentUserId && m.to === a.id)).pop();
                let lastMsgB = messages.filter(m => (m.from === b.id && m.to === currentUserId) || (m.from === currentUserId && m.to === b.id)).pop();
                return (lastMsgB?.timestamp || 0) - (lastMsgA?.timestamp || 0);
            });
            
            return recentUsers;
        }
        
        function renderChatList() {
            let conversations = getConversationList();
            let html = conversations.map(u => `
                <div class="chat-item" onclick="openChat(${u.id})">
                    <div class="chat-avatar">${u.name.charAt(0)}</div>
                    <div class="chat-info">
                        <div class="chat-name">${u.name} ${u.verifiedPlus ? '✨' : (u.verified ? '✅' : '')}</div>
                        <div class="chat-last-msg">@${u.username}</div>
                    </div>
                </div>
            `).join('');
            
            if(conversations.length === 0) {
                html = '<div style="padding:20px; text-align:center; color:#94a3b8;">لا توجد محادثات بعد</div>';
            }
            document.getElementById('chatList').innerHTML = html;
        }
        
        function openChat(userId) {
            activeChatUserId = userId;
            let otherUser = getUserById(userId);
            if(!otherUser) return;
            
            let conversation = getConversation(currentUserId, userId);
            
            document.getElementById('chatArea').innerHTML = `
                <div class="chat-header">
                    <div class="chat-avatar" style="width:40px; height:40px; font-size:16px;">${otherUser.name.charAt(0)}</div>
                    <div>
                        <div style="font-weight:600;">${otherUser.name}</div>
                        <div style="font-size:12px; color:#64748b;">@${otherUser.username}</div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages">
                    ${conversation.map(msg => `
                        <div class="message ${msg.from === currentUserId ? 'sent' : 'received'}">
                            ${msg.text}
                            <div class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="اكتب رسالتك...">
                    <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            `;
            
            let messagesDiv = document.getElementById('chatMessages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            document.getElementById('sendBtn').onclick = () => {
                let input = document.getElementById('messageInput');
                let text = input.value.trim();
                if(text) {
                    sendMessage(userId, text);
                    input.value = '';
                    openChat(userId);
                }
            };
            
            document.getElementById('messageInput').onkeypress = (e) => {
                if(e.key === 'Enter') document.getElementById('sendBtn').click();
            };
            
            renderChatList();
        }
        
        window.openChat = openChat;
        
        renderChatList();
        
        setInterval(() => {
            if(activeChatUserId) openChat(activeChatUserId);
            renderChatList();
        }, 3000);
        
        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
    </script>
</body>
</html>
