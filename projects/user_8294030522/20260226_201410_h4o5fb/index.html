<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBR CHANGE BIO </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        
        body {
            background-color: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ديزلين*/
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; overflow: hidden;
        }
        
        .bg-circle {
            position: absolute; border-radius: 50%;
            filter: blur(60px); opacity: 0.4;
            animation: float 15s infinite linear;
        }
        
        .circle-1 { width: 400px; height: 400px; background: #0066ff; top: 20%; left: 10%; }
        .circle-2 { width: 500px; height: 500px; background: #0099ff; top: 60%; left: 70%; animation-delay: -5s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 60px) scale(1.1); }
        }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .particle { position: absolute; background: rgba(0, 153, 255, 0.5); border-radius: 50%; animation: floatParticle 10s infinite linear; }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* ديزاين */
        #login-screen {
            position: fixed; inset: 0; background: #0a0a1a;
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }

        .card {
            background: rgba(20, 20, 40, 0.8);
            border: 1px solid #3344aa;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3);
            text-align: center;
        }

        .animated-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #0066ff, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: #aaccff; font-weight: 600; }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            background: rgba(40, 40, 70, 0.7);
            border: 1px solid #4466cc;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus { border-color: #0099ff; box-shadow: 0 0 15px rgba(0, 153, 255, 0.4); }

        button {
            background: linear-gradient(45deg, #0066ff, #0099ff);
            color: white; border: none; padding: 15px;
            border-radius: 10px; cursor: pointer;
            font-size: 18px; font-weight: bold; width: 100%;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 153, 255, 0.6); }

        .result-box {
            margin-top: 20px; padding: 15px; border-radius: 10px;
            display: none; font-weight: bold;
        }
        .success { background: rgba(0, 255, 153, 0.2); border: 1px solid #00ff99; color: #00ff99; }
        .error { background: rgba(255, 50, 50, 0.2); border: 1px solid #ff3232; color: #ff3232; }

        #bio-system { display: none; width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
    </div>
    <div class="particles" id="particles"></div>

    <div id="login-screen">
        <div class="card">
            <h1 class="animated-title">SBR WEB</h1>
            <div class="input-group">
                <input type="password" id="pass" placeholder="أدخل كلمة المرور..." style="text-align: center;">
            </div>
            <button onclick="unlock()"> 
            LOGIN</button>
        </div>
    </div>

    <div id="bio-system" style="display: none;">
        <div class="card">
            <h1 class="animated-title">BIO CHANGER</h1>
            
            <div class="input-group">
                <label>اختر بماذا ستجدد بايو</label>
                <select id="bioMethod" onchange="toggleBioFields()">
                    <option value="access">ACCESS TOKEN</option>
                    <option value="jwt">JWT TOKEN</option>
                    <option value="eat">EAT TOKEN</option>
                    <option value="guest">GUEST (UID/PASS)</option>
                </select>
            </div>

            <div id="field-token" class="input-group">
                <label>acces token:</label>
                <input type="text" id="bioMainToken" placeholder="enter token...">
            </div>

            <div id="field-guest" style="display:none;">
                <div class="input-group">
                    <label>UID GUEST:</label>
                    <input type="number" id="guestUid" placeholder="enter uid guest...">
                </div>
                <div class="input-group">
                    <label>PASS GUEST:</label>
                    <input type="text" id="guestPass" placeholder="أدخل Password...">
                </div>
            </div>

            <div class="input-group">
                <label>new bio:</label>
                <textarea id="bioText" placeholder="ecrit new bio"></textarea>
            </div>

            <button id="update-btn" onclick="updateBio()">change bio</button>
            <div id="bioResult" class="result-box"></div>
        </div>
    </div>

    <script>
        // ديزاين
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.width = p.style.height = Math.random() * 8 + 2 + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(p);
            }
        }

        function unlock() {
            // mot pass site web SBRTEAM
            if(document.getElementById('pass').value === "SBRTEAM") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('bio-system').style.display = 'flex';
            } else { alert("كلمة المرور خاطئة!"); }
        }

        function toggleBioFields() {
            const method = document.getElementById('bioMethod').value;
            document.getElementById('field-token').style.display = (method === 'guest') ? 'none' : 'block';
            document.getElementById('field-guest').style.display = (method === 'guest') ? 'block' : 'none';
        }

        async function updateBio() {
            const method = document.getElementById('bioMethod').value;
            const bio = document.getElementById('bioText').value;
            const btn = document.getElementById('update-btn');
            const resBox = document.getElementById('bioResult');
            let url = "";

            if(!bio) { alert("يرجى كتابة البايو"); return; }

            if(method === 'guest') {
                const uid = document.getElementById('guestUid').value;
                const pass = document.getElementById('guestPass').value;
                url = `https://danger-long-bio.vercel.app/update_bio?bio=${encodeURIComponent(bio)}&uid=${uid}&password=${pass}`;
            } else {
                const token = document.getElementById('bioMainToken').value;
                const param = (method === 'access') ? 'access_token' : (method === 'jwt' ? 'token' : 'eat_token');
                url = `https://danger-long-bio.vercel.app/update_bio?bio=${encodeURIComponent(bio)}&${param}=${token}`;
            }

            btn.innerHTML = 'جاري المعالجة... <i class="fas fa-spinner fa-spin"></i>';
            resBox.style.display = 'none';

            try {
                const response = await fetch(url);
                resBox.style.display = 'block';
                resBox.className = 'result-box success';
                resBox.innerHTML = "تم إرسال طلب التحديث بنجاح!";
            } catch (e) {
                resBox.style.display = 'block';
                resBox.className = 'result-box success'; 
                resBox.innerHTML = "تم تحديث البايو ";
            } finally {
                btn.innerHTML = 'تحديث البايو الآن';
            }
        }

        window.onload = createParticles;
    </script>
</body>
</html>
