<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>RH TEAM PANEL</title> <link rel="stylesheet" href="style.css"> </head> <body> <div class="login-container"> <h1 class="logo">RH TEAM 👑</h1> <p class="subtitle">أدخل كود التفعيل للدخول إلى اللوحة</p> <div class="input-group"> <input type="text" id="activation-key" placeholder="RH-XXXXXX" autocomplete="off"> </div> <button onclick="checkKey()" class="btn-neon">تفعيل الكود ✅</button> <div id="status-message" class="message"></div> </div> <script> function checkKey() { var key = document.getElementById("activation-key").value; var message = document.getElementById("status-message"); if(key === "") { message.innerHTML = "يرجى كتابة الكود أولاً! ❌"; message.style.color = "#ff4d4d"; return; } message.innerHTML = "جاري الاتصال بالسيرفر والتحقق... ⏳"; message.style.color = "#ffff00"; // هنا الكود يتصل بسيرفر البايثون تاعك اللي خدمناه مقبيل fetch('http://127.0.0.1:5000/check?key=' + key) .then(response => response.json()) .then(data => { if(data.status === "success") { message.innerHTML = "تم التفعيل بنجاح! مرحباً بك 🎉"; message.style.color = "#00ff00"; // هنا نفتحوا له واجهة الخدمات والتحكم لداخل } else { message.innerHTML = "الكود خاطئ أو منتهي الصلاحية! ❌"; message.style.color = "#ff4d4d"; } }) .catch(err => { message.innerHTML = "فشل الاتصال بالسيرفر! تأكد من تشغيل main.py 🌐"; message.style.color = "#ff4d4d"; }); } </script> </body> </html>
