<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>مكتبة أفلام شانكس</title> <style> :root { --primary-red: #e50914; --bg-dark: #141414; --text-white: #ffffff; } body { background-color: var(--bg-dark); color: var(--text-white); font-family: sans-serif; margin: 0; padding: 20px; } /* زر الدخول الدائري */ #login-btn { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; background: var(--primary-red); border-radius: 50%; border: none; cursor: pointer; color: white; font-weight: bold; z-index: 100; } /* البحث */ #search-bar { width: 90%; max-width: 500px; padding: 12px; margin: 20px auto; display: block; border-radius: 25px; border: none; text-align: center; } h1 { text-align: center; color: var(--primary-red); } .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; } .movie-card { background: #222; border-radius: 10px; overflow: hidden; border: 1px solid #333; } .movie-card img { width: 100%; height: 300px; object-fit: cover; } .movie-info { padding: 15px; } .movie-info a { display: block; background: var(--primary-red); color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; margin-top: 10px; } /* صفحة تسجيل الدخول */ #login-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); text-align: center; padding-top: 100px; z-index: 200; } #admin-panel { display: none; background: #1f1f1f; padding: 20px; border-top: 4px solid var(--primary-red); margin-top: 50px; } </style> </head> <body> <button id="login-btn" onclick="showLogin()">م</button> <h1>🎬 مكتبة أفلام شانكس 🎬</h1> <input type="text" id="search-bar" placeholder="🔍 ابحث عن فيلم..." onkeyup="filterMovies()"> <div id="movies-container" class="movies-grid">جاري تحميل الأفلام...</div> <!-- صفحة تسجيل الدخول --> <div id="login-page"> <h2 style="color:white">دخول المطور</h2> <input type="email" id="email" placeholder="البريد"><br> <input type="password" id="pass" placeholder="كلمة السر"><br><br> <button onclick="login()">دخول</button> <button onclick="document.getElementById('login-page').style.display='none'">إغلاق</button> </div> <!-- لوحة التحكم --> <div id="admin-panel"> <h2 style="color: var(--primary-red);">⚙️ لوحة تحكم المطور</h2> <input type="text" id="mTitle" placeholder="اسم الفيلم"><br> <input type="text" id="mImg" placeholder="رابط الصورة"><br> <input type="text" id="mLink" placeholder="رابط المشاهدة"><br> <textarea id="mDesc" placeholder="الوصف"></textarea><br> <button onclick="saveMovie()">إضافة الفيلم</button> </div> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"; import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyBSr3dQ-nSVBdVerwM45MlJz_4UIYJROQk", authDomain: "shanks-551a9.firebaseapp.com", projectId: "shanks-551a9", storageBucket: "shanks-551a9.firebasestorage.app", messagingSenderId: "288428556881", appId: "1:288428556881:web:4ce0f053a9830741a9ee70" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); let allMovies = []; // لحفظ الأفلام في الذاكرة للبحث onSnapshot(collection(db, "movies"), (snapshot) => { allMovies = []; snapshot.forEach((doc) => { allMovies.push(doc.data()); }); renderMovies(allMovies); }); function renderMovies(list) { const container = document.getElementById('movies-container'); container.innerHTML = list.map(m => ` <div class="movie-card"> <img src="${m.img}"> <div class="movie-info"> <h3>${m.title}</h3> <p>${m.desc}</p> <a href="${m.link}" target="_blank">مشاهدة الآن</a> </div> </div>`).join(''); } window.filterMovies = () => { const query = document.getElementById('search-bar').value.toLowerCase(); const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query)); renderMovies(filtered); }; window.showLogin = () => document.getElementById('login-page').style.display = 'block'; window.login = () => { if(document.getElementById('email').value === 'mhamd011250@gmail.com' && document.getElementById('pass').value === 'Shanks_8090') { document.getElementById('login-page').style.display = 'none'; document.getElementById('admin-panel').style.display = 'block'; } else { alert('بيانات خاطئة!'); } }; window.saveMovie = async () => { await addDoc(collection(db, "movies"), { title: document.getElementById('mTitle').value, img: document.getElementById('mImg').value, link: document.getElementById('mLink').value, desc: document.getElementById('mDesc').value }); alert("تمت الإضافة!"); }; </script> </body> </html>
