URL.value) txt+="<LI><a href="+form.Fav2URL.value+">"+form.Fav2Title.value+"</a><BR>\r\n"; if(form.Fav3URL.value) txt+="<LI><a href="+form.Fav3URL.value+">"+form.Fav3Title.value+"</a><BR>\r\n"; if(form.Fav4URL.value) txt+="<LI><a href="+form.Fav4URL.value+">"+form.Fav4Title.value+"</a><BR>\r\n"; if(form.Fav5URL.value) txt+="<LI><a href="+form.Fav5URL.value+">"+form.Fav5Title.value+"</a><BR>\r\n"; if(form.Fav6URL.value) txt+="<LI><a href="+form.Fav6URL.value+">"+form.Fav6Title.value+"</a><BR>\r\n"; txt+="</ul></font>"; } if(form.EMail.value){ txt+="<hr>للأسئلة و الإستفسارات التواصل على البريد الإلكتروني:\r\n"; txt+="<address><a href=mailto:"+form.EMail.value+">"+form.EMail.value+"</address>\r\n"; } txt+="</font></body></html>"; form.Text2.value=txt; } function AddText(form, Action){ var AddTxt=""; var txt=""; if(Action==1){ txt=prompt("النص هو عنوان رئيسي.","ادخل النص هنا"); if(txt!=null) AddTxt="<h1>"+txt+"</h1>\r\n"; } if(Action==2){ txt=prompt("النص هو عنوان فرعي h2","النص"); if(txt!=null) AddTxt="<h2>"+txt+"</h2>\r\n"; } if(Action==3){ txt=prompt("النص هو عنوان فرعي h3","النص"); if(txt!=null) AddTxt="<h3>"+txt+"</h3>\r\n"; } if(Action==4) { txt=prompt("النص سوف يكتب بالخط العريض","ادخل النص هنا"); if(txt!=null) AddTxt="<b>"+txt+"</b>"; } if(Action==5) { txt=prompt("النص هنا سوف يظهر مائل","النص"); if(txt!=null) AddTxt="<i>"+txt+"</i>"; } if(Action==6) AddTxt="\r\n<p>"; if(Action==7) AddTxt="<BR>\r\n"; if(Action==8) AddTxt="<hr>\r\n"; if(Action==9) { txt=prompt("ضع اسم الرابط إن كان الرابط في نفس الخادم. أو ضع الرابط كامل إن كان في خادم بعيد. ","http://"); if(txt!=null){ AddTxt='\r\n<a href="'+txt+'">'; txt=prompt("ضع نص ليكون عرض للرابط و في حال الضغط على النص يتم فتح الرابط","اضغط هنا للحصول على الرابط"); AddTxt+=txt+"</a>\r\n"; } } //فادي حجار fadihajar.sf if(Action==10) { txt=prompt("ضع اسم الصورة إن كانت في نفس الخادم أو ضع رابط الصورة الكامل إن كانت في خادم بعيد.","ضع رابط الصورة"); if(txt!=null) AddTxt='\r\n<img src="'+txt+'">\r\n'; } if(Action==11) { txt=prompt("ضع اسم الفيديو إن كان في الخادم نفسه. أو ضع رابط الفيديو إن كان بالخادم البعيد.","اسم/رابط الفيديو"); if(txt!=null){ AddTxt='\r\n<video poster="images/puppy.jpg" width="400" height="320" preload controls loop>\r\n<source src="'+txt+'"/>'; txt=prompt("ادخل نص ليتم عرضه إن لم يعمل الفيديو أو كان المستخدم قد حظر مقاطع الفيديو لتوفير البيانات","ادخل النص هنا"); AddTxt+="\r\n<p>"+txt+"</p></video>\r\n"; } } if(Action==12) { txt=prompt("اسم المقطع الصوتي إن كان في الخادم نفسه.أو ضع رابط المقطع الصوتي إن كان في الخادم البعيد.","رابط أو مسار المقطع الصوتي"); if(txt!=null){ AddTxt='\r\n<audio controls autoplay>\r\n<source src="'+txt+'"/>\r\n'; AddTxt+="</audio>\r\n"; } } if(Action==13) { txt=prompt("ادخل اسم اللون بالإنكليزية أو كود اللون الثلاثي أو السداسي مثال:\r\n red أو #f00 أو #ff0000","#ff0022"); if(txt!=null){ AddTxt='\r\n\r\n<font COLOR="'+txt+'">'; txt=prompt("أدخل النص المراد عرضه بالألوان.","ادخل النص هنا"); AddTxt+=txt+"</font>\r\n"; } } if(Action==14) { txt=prompt("ضع رابط أو اسم الصورة","ادخل الرابط"); if(txt!=null){ AddTxt='\r\n<img SRC="'+txt+'" '; txt=prompt("ادخل النص التعريفي للصورة و هو يمثل شرح مبسط عن مضمون الصورة في حال لم يتم تحميل الصورة","ادخل النص هنا"); AddTxt+='ALT="'+txt+'"'; txt=prompt("ادخل عرض الصورة.","400"); AddTxt+='width="'+txt+'"'; txt=prompt("ادخل طول الصورة","400"); AddTxt+='height="'+txt+'">\r\n'; } } if(Action==15){ txt=prompt("ادخل رابط الصفحة المضمنة.","index.html"); if(txt!=null){ AddTxt='\r\n<iframe src="'+txt+'" '; txt=prompt("ضع طول الإطار","400"); AddTxt+='height="'+txt+'px" '; txt=prompt("ضع عرض الإطار","100"); AddTxt+='width="'+txt+'px"></iframe>'; } } form.Text1.value+=AddTxt; } function ResetPage(form) { if(confirm("إعادة تعيين الصفحة.?")) { form.Text1.value=""; form.Text2.value=""; form.Name.value=""; form.EMail.value=""; form.Fav1URL.value=""; form.Fav1Title.value=""; form.Fav2URL.value=""; form.Fav2Title.value=""; form.Fav3URL.value=""; form.Fav3Title.value=""; form.Fav4URL.value=""; form.Fav4Title.value=""; form
