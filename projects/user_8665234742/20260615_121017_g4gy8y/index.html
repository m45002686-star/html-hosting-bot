<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>مترجم الجو الحاكم</title> <style> * { box-sizing: border-box; } body { background-color: #050505; color: #00f2ff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; } .container { background: #0a0a0a; padding: 30px; border: 2px solid #00f2ff; border-radius: 15px; box-shadow: 0 0 20px #00f2ff55; width: 100%; max-width: 500px; text-align: center; } h1 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; text-shadow: 0 0 10px #00f2ff; } textarea { width: 100%; height: 120px; background: #000; border: 1px solid #00f2ff; color: #fff; padding: 10px; border-radius: 8px; font-size: 1.1rem; resize: none; outline: none; margin-bottom: 15px; } button { background: #00f2ff; color: #000; border: none; padding: 12px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; } button:hover { background: #fff; box-shadow: 0 0 15px #fff; } #result { margin-top: 20px; padding: 15px; border: 1px dashed #00f2ff; color: #fff; font-size: 1.2rem; min-height: 60px; word-wrap: break-word; } .footer { margin-top: auto; padding: 20px; text-align: center; color: #00f2ff; font-weight: bold; border-top: 1px solid #333; width: 100%; } </style> </head> <body> <div class="container"> <h1>نظام ترجمة الجو الحاكم</h1> <textarea id="textInput" placeholder="اكتب النص هنا..."></textarea> <button onclick="translateText()">ترجمة ⚡</button> <div id="result">النتيجة ستظهر هنا...</div> </div> <div class="footer"> للتواصل مع المطور: 01143317801 </div> <script> async function translateText() { let text = document.getElementById("textInput").value; let resultDiv = document.getElementById("result"); if (!text) { resultDiv.innerText = "اكتب حاجة الأول يا زميلي!"; return; } resultDiv.innerText = "جاري المعالجة..."; // رابط مباشر للترجمة let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURI(text)}`; try { let response = await fetch(url); let data = await response.json(); resultDiv.innerText = data[0][0][0]; } catch (error) { resultDiv.innerText = "حدث خطأ، تأكد من اتصال الإنترنت."; } } </script> </body> </html>
