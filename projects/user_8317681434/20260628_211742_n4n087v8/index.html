<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>🎨 محرر الصور</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; } .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border-radius: 30px; padding: 30px; max-width: 1400px; width: 100%; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); } h1 { color: #fff; text-align: center; font-size: 2.5rem; margin-bottom: 30px; text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); } h1 span { color: #f7971e; } .main-layout { display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: start; } .canvas-wrapper { background: rgba(0, 0, 0, 0.3); border-radius: 20px; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 500px; border: 2px dashed rgba(255, 255, 255, 0.2); position: relative; } canvas { max-width: 100%; max-height: 650px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); background: #1a1a2e; display: none; } .placeholder { color: rgba(255, 255, 255, 0.5); text-align: center; font-size: 1.2rem; } .placeholder .icon { font-size: 4rem; display: block; margin-bottom: 15px; } .controls { background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 12px 10px; border: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; gap: 8px; } .controls .btn { width: 100%; padding: 6px 4px; border: none; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; color: #fff; text-align: center; white-space: nowrap; } .btn-primary { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; } .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(247, 151, 30, 0.4); } .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); } .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4); } .btn-success { background: linear-gradient(135deg, #2ecc71, #27ae60); } .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4); } .btn-info { background: linear-gradient(135deg, #3498db, #2980b9); } .btn-info:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4); } .btn-purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); } .btn-purple:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4); } .btn-pink { background: linear-gradient(135deg, #e84393, #fd79a8); } .btn-pink:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(232, 67, 147, 0.4); } .btn-teal { background: linear-gradient(135deg, #00b894, #00cec9); } .btn-teal:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 184, 148, 0.4); } .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; } .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; } .filter-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } .filter-btn { padding: 4px 3px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; background: rgba(255, 255, 255, 0.05); color: #fff; cursor: pointer; transition: all 0.3s ease; font-size: 0.6rem; text-align: center; white-space: nowrap; } .filter-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #f7971e; } .filter-btn.active { border-color: #f7971e; background: rgba(247, 151, 30, 0.2); } .slider-group { display: flex; flex-direction: column; gap: 1px; } .slider-group label { color: rgba(255, 255, 255, 0.6); font-size: 0.55rem; display: flex; justify-content: space-between; } input[type="range"] { width: 100%; height: 4px; border-radius: 5px; background: linear-gradient(to right, #f7971e, #ffd200); outline: none; -webkit-appearance: none; } input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); } .value-display { color: rgba(255, 255, 255, 0.4); font-size: 0.5rem; text-align: left; } .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } .divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 3px 0; } .transform-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; } .transform-group .btn { font-size: 0.6rem; padding: 4px 2px; } .border-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } .border-controls .btn { font-size: 0.55rem; padding: 3px 2px; } @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } .controls { flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 12px; } .controls .btn, .filter-btn { font-size: 0.65rem; padding: 5px 8px; } .filter-presets { grid-template-columns: repeat(3, 1fr); } .slider-group { min-width: 100px; flex: 1; } .transform-group { grid-template-columns: 1fr 1fr 1fr; } .border-controls { grid-template-columns: 1fr 1fr; } } </style> </head> <body> <div class="container"> <h1>🎨 <span>محرر</span> الصور</h1> <div class="main-layout"> <div class="canvas-wrapper"> <canvas id="imageCanvas"></canvas> <div class="placeholder" id="placeholder"> <span class="icon">🖼️</span> <p>ارفع صورة للبدء</p> </div> </div> <div class="controls"> <div class="file-input-wrapper"> <button class="btn btn-primary" id="uploadBtn">📤 رفع</button> <input type="file" id="imageUpload" accept="image/*" /> </div> <hr class="divider" /> <div class="slider-group"> <label>السطوع <span id="brightnessValue">0%</span></label> <input type="range" id="brightness" min="-100" max="100" value="0" /> </div> <div class="slider-group"> <label>التباين <span id="contrastValue">0%</span></label> <input type="range" id="contrast" min="-100" max="100" value="0" /> </div> <div class="slider-group"> <label>التشبع <span id="saturateValue">0%</span></label> <input type="range" id="saturate" min="-100" max="100" value="0" /> </div> <div class="slider-group"> <label>الحرارة <span id="hueValue">0°</span></label> <input type="range" id="hue" min="-180" max="180" value="0" /> </div> <div class="slider-group"> <label>التمويه <span id="blurValue">0px</span></label> <input type="range" id="blur" min="0" max="10" value="0" step="0.5" /> </div> <div class="slider-group"> <label>الإطار <span id="borderValue">0px</span></label> <input type="range" id="borderSize" min="0" max="20" value="0" step="1" /> </div> <hr class="divider" /> <div class="transform-group"> <button class="btn btn-info" id="rotateLeft">↺</button> <button class="btn btn-info" id="rotateRight">↻</button> <button class="btn btn-purple" id="flipHorizontal">⇔</button> </div> <div class="border-controls"> <button class="btn btn-pink" data-border="#e84393">🌸</button> <button class="btn btn-teal" data-border="#00b894">🌿</button> <button class="btn btn-primary" data-border="#f7971e">🔥</button> <button class="btn btn-info" data-border="#3498db">💎</button> </div> <hr class="divider" /> <div class="filter-presets"> <button class="filter-btn" data-filter="none">طبيعي</button> <button class="filter-btn" data-filter="grayscale">أ&amp;w</button> <button class="filter-btn" data-filter="sepia">سيبيا</button> <button class="filter-btn" data-filter="invert">معكوس</button> <button class="filter-btn" data-filter="vintage">قديم</button> <button class="filter-btn" data-filter="cool">بارد</button> </div> <hr class="divider" /> <div class="btn-group"> <button class="btn btn-danger" id="resetBtn">إعادة</button> <button class="btn btn-success" id="downloadBtn">تحميل</button> </div> </div> </div> </div> <script> const canvas = document.getElementById('imageCanvas'); const ctx = canvas.getContext('2d'); const placeholder = document.getElementById('placeholder'); const upload = document.getElementById('imageUpload'); const uploadBtn = document.getElementById('uploadBtn'); let originalImage = null; let currentImageData = null; let rotation = 0; let flipped = false; let borderColor = 'transparent'; let borderSize = 0; const brightnessSlider = document.getElementById('brightness'); const contrastSlider = document.getElementById('contrast'); const saturateSlider = document.getElementById('saturate'); const hueSlider = document.getElementById('hue'); const blurSlider = document.getElementById('blur'); const borderSlider = document.getElementById('borderSize'); const brightnessValue = document.getElementById('brightnessValue'); const contrastValue = document.getElementById('contrastValue'); const saturateValue = document.getElementById('saturateValue'); const hueValue = document.getElementById('hueValue'); const blurValue = document.getElementById('blurValue'); const borderValue = document.getElementById('borderValue'); function loadImage(file) { if (!file) return; const reader = new FileReader(); reader.onload = function(event) { const img = new Image(); img.onload = function() { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0); originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height); currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height); canvas.style.display = 'block'; placeholder.style.display = 'none'; rotation = 0; flipped = false; applyFilters(); }; img.onerror = function() { alert('خطأ في تحميل الصورة. حاول مرة أخرى.'); }; img.src = event.target.result; }; reader.onerror = function() { alert('خطأ في قراءة الملف. حاول مرة أخرى.'); }; reader.readAsDataURL(file); } upload.addEventListener('change', function(e) { const file = e.target.files[0]; if (file) { loadImage(file); } this.value = ''; }); uploadBtn.addEventListener('click', function(e) { e.preventDefault(); upload.click(); }); function applyFilters() { if (!originalImage) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); let imageData = new ImageData( new Uint8ClampedArray(originalImage.data), originalImage.width, originalImage.height ); const brightness = parseInt(brightnessSlider.value); const contrast = parseInt(contrastSlider.value); const saturate = parseInt(saturateSlider.value); const hue = parseInt(hueSlider.value); const blur = parseFloat(blurSlider.value); borderSize = parseInt(borderSlider.value); brightnessValue.textContent = brightness + '%'; contrastValue.textContent = contrast + '%'; saturateValue.textContent = saturate + '%'; hueValue.textContent = hue + '°'; blurValue.textContent = blur + 'px'; borderValue.textContent = borderSize + 'px'; let data = imageData.data; for (let i = 0; i < data.length; i += 4) { let r = data[i]; let g = data[i + 1]; let b = data[i + 2]; let contrastFactor = (contrast + 100) / 100; r = ((r / 255 - 0.5) * contrastFactor + 0.5) * 255; g = ((g / 255 - 0.5) * contrastFactor + 0.5) * 255; b = ((b / 255 - 0.5) * contrastFactor + 0.5) * 255; r += brightness * 2.55; g += brightness * 2.55; b += brightness * 2.55; if (saturate !== 0) { const gray = 0.299 * r + 0.587 * g + 0.114 * b; const saturateFactor = (saturate + 100) / 100; r = gray + (r - gray) * saturateFactor; g = gray + (g - gray) * saturateFactor; b = gray + (b - gray) * saturateFactor; } if (hue !== 0) { const angle = hue * Math.PI / 180; const cos = Math.cos(angle); const sin = Math.sin(angle); const r1 = r * (0.299 + 0.701 * cos + 0.168 * sin) + g * (0.587 - 0.587 * cos + 0.330 * sin) + b * (0.114 - 0.114 * cos - 0.497 * sin); const g1 = r * (0.299 - 0.299 * cos - 0.328 * sin) + g * (0.587 + 0.413 * cos + 0.035 * sin) + b * (0.114 - 0.114 * cos + 0.292 * sin); const b1 = r * (0.299 - 0.299 * cos + 1.250 * sin) + g * (0.587 - 0.587 * cos - 1.050 * sin) + b * (0.114 + 0.886 * cos - 0.203 * sin); r = r1; g = g1; b = b1; } data[i] = Math.min(255, Math.max(0, r)); data[i + 1] = Math.min(255, Math.max(0, g)); data[i + 2] = Math.min(255, Math.max(0, b)); } ctx.putImageData(imageData, 0, 0); if (blur > 0) { ctx.filter = `blur(${blur}px)`; ctx.drawImage(canvas, 0, 0); ctx.filter = 'none'; } if (rotation !== 0 || flipped) { const tempCanvas = document.createElement('canvas'); const tempCtx = tempCanvas.getContext('2d'); tempCanvas.width = canvas.width; tempCanvas.height = canvas.height; tempCtx.drawImage(canvas, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); if (rotation !== 0) { ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate(rotation * Math.PI / 180); ctx.translate(-canvas.width / 2, -canvas.height / 2); } if (flipped) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); } ctx.drawImage(tempCanvas, 0, 0); ctx.restore(); } if (borderSize > 0 && borderColor !== 'transparent') { ctx.save(); ctx.strokeStyle = borderColor; ctx.lineWidth = borderSize; ctx.strokeRect(borderSize/2, borderSize/2, canvas.width - borderSize, canvas.height - borderSize); ctx.restore(); } currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height); } function applyFilterPreset(filter) { resetSliders(); switch(filter) { case 'grayscale': brightnessSlider.value = 0; contrastSlider.value = 20; saturateSlider.value = -100; hueSlider.value = 0; break; case 'sepia': brightnessSlider.value = 0; contrastSlider.value = 10; saturateSlider.value = 30; hueSlider.value = -20; break; case 'invert': brightnessSlider.value = 0; contrastSlider.value = 0; saturateSlider.value = 0; hueSlider.value = 180; break; case 'vintage': brightnessSlider.value = -10; contrastSlider.value = 30; saturateSlider.value = -20; hueSlider.value = -15; break; case 'cool': brightnessSlider.value = 5; contrastSlider.value = 10; saturateSlider.value = 20; hueSlider.value = 30; break; default: break; } applyFilters(); } function resetSliders() { brightnessSlider.value = 0; contrastSlider.value = 0; saturateSlider.value = 0; hueSlider.value = 0; blurSlider.value = 0; borderSlider.value = 0; borderColor = 'transparent'; rotation = 0; flipped = false; } brightnessSlider.addEventListener('input', applyFilters); contrastSlider.addEventListener('input', applyFilters); saturateSlider.addEventListener('input', applyFilters); hueSlider.addEventListener('input', applyFilters); blurSlider.addEventListener('input', applyFilters); borderSlider.addEventListener('input', applyFilters); document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', function() { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); this.classList.add('active'); applyFilterPreset(this.dataset.filter); }); }); document.getElementById('rotateLeft').addEventListener('click', function() { if (!originalImage) return; rotation -= 90; applyFilters(); }); document.getElementById('rotateRight').addEventListener('click', function() { if (!originalImage) return; rotation += 90; applyFilters(); }); document.getElementById('flipHorizontal').addEventListener('click', function() { if (!originalImage) return; flipped = !flipped; applyFilters(); }); document.querySelectorAll('[data-border]').forEach(btn => { btn.addEventListener('click', function() { borderColor = this.dataset.border; if (borderSlider.value == 0) borderSlider.value = 5; applyFilters(); }); }); document.getElementById('resetBtn').addEventListener('click', function() { if (!originalImage) return; resetSliders(); document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); ctx.putImageData(originalImage, 0, 0); currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height); applyFilters(); }); document.getElementById('downloadBtn').addEventListener('click', function() { if (!originalImage) return; const link = document.createElement('a'); link.download = 'edited-image.png'; link.href = canvas.toDataURL('image/png'); link.click(); }); </script> </body> </html>
