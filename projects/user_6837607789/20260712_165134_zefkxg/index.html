<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>عجلة الحظ - فزوعي</title> <style> * { box-sizing: border-box; margin: 0; } body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(145deg, #1a1a2e, #16213e); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; } .container { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(4px); border-radius: 60px 60px 40px 40px; padding: 30px 30px 20px; max-width: 750px; width: 100%; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 215, 0, 0.2); text-align: center; } h1 { color: #f5c842; font-weight: 700; font-size: 2.4rem; letter-spacing: 2px; text-shadow: 0 0 15px #f5c84255; margin-top: -10px; margin-bottom: 12px; } h1 small { font-size: 1rem; color: #aaa; display: block; font-weight: 300; letter-spacing: 3px; } .wheel-wrapper { position: relative; width: 100%; max-width: 420px; margin: 0 auto 20px; } canvas { width: 100% !important; height: auto !important; aspect-ratio: 1/1; display: block; border-radius: 50%; box-shadow: 0 0 0 6px #222, 0 0 0 12px #f5c84233, 0 20px 40px black; transition: box-shadow 0.2s; background: #2b2b3a; cursor: grab; } .pointer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12%; height: 12%; background: radial-gradient(circle, #ffd966, #b8860b); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); filter: drop-shadow(0 0 12px gold); pointer-events: none; z-index: 10; rotate: 180deg; } .controls { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 20px 0 16px; } .input-group { display: flex; flex: 2 1 240px; gap: 6px; background: #0f0f1f; padding: 6px; border-radius: 60px; border: 1px solid #f5c84255; } .input-group input { flex: 1; border: none; padding: 12px 18px; border-radius: 60px; font-size: 1rem; background: transparent; color: #fff; outline: none; min-width: 100px; } .input-group input::placeholder { color: #8888aa; font-weight: 300; } .input-group button { background: #f5c842; border: none; padding: 8px 24px; border-radius: 60px; font-weight: 700; color: #111; font-size: 1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px #f5c84266; } .input-group button:hover { background: #ffd966; transform: scale(1.02); box-shadow: 0 0 25px #f5c842aa; } .action-buttons { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin: 10px 0 14px; } .btn { border: none; padding: 14px 38px; border-radius: 60px; font-weight: 700; font-size: 1.2rem; background: #2e2e4a; color: #ddd; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 0 #0b0b14; flex: 1 0 140px; letter-spacing: 1px; } .btn-spin { background: #f5c842; color: #1a1a2e; box-shadow: 0 6px 0 #b38b2a; } .btn-spin:hover { background: #ffe066; transform: translateY(-2px); box-shadow: 0 8px 0 #b38b2a; } .btn-spin:active { transform: translateY(4px); box-shadow: 0 2px 0 #b38b2a; } .btn-edit { background: #3d3d6b; box-shadow: 0 6px 0 #232340; } .btn-edit:hover { background: #5a5a8f; transform: translateY(-2px); } .btn-edit:active { transform: translateY(4px); box-shadow: 0 2px 0 #232340; } .slider-box { background: #0f0f1fcc; padding: 10px 20px; border-radius: 80px; display: inline-flex; align-items: center; gap: 20px; margin: 6px 0 12px; border: 1px solid #f5c84244; backdrop-filter: blur(2px); } .slider-box label { color: #ccd; font-weight: 500; } .slider-box input[type="range"] { width: 180px; accent-color: #f5c842; height: 6px; border-radius: 10px; } .slider-box span { color: #f5c842; font-weight: 700; min-width: 40px; } .footer { margin-top: 20px; border-top: 1px solid #f5c84233; padding-top: 18px; color: #aaaacc; font-size: 1rem; letter-spacing: 1px; } .footer strong { color: #f5c842; font-size: 1.2rem; text-shadow: 0 0 12px #f5c84277; } .list-badge { color: #b8b8d0; font-size: 0.9rem; margin-top: 4px; } .list-badge span { display: inline-block; background: #262642; padding: 4px 16px; border-radius: 50px; margin: 3px 4px; border: 1px solid #f5c84233; color: #eee; } @media (max-width: 500px) { .container { padding: 20px 14px; } .input-group { flex-wrap: wrap; } .input-group input { min-width: 100%; } } </style> </head> <body> <div class="container"> <h1>🎡 فزوعي <small>عجلة الحظ</small></h1> <div class="wheel-wrapper"> <canvas id="wheelCanvas" width="600" height="600"></canvas> <div class="pointer"></div> </div> <div class="controls"> <div class="input-group"> <input type="text" id="nameInput" placeholder="اكتب اسم... (مثل: أحمد)" /> <button id="addBtn">➕ إضافة</button> </div> </div> <div class="action-buttons"> <button class="btn btn-spin" id="spinBtn">🌀 تدوير</button> <button class="btn btn-edit" id="editBtn">⚙️ تعديل السبين</button> </div> <div class="slider-box" id="speedSliderBox"> <label>السرعة</label> <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1.5" /> <span id="speedValue">1.5</span> </div> <div class="list-badge" id="namesDisplay"> <span>أحمد</span> <span>جعفر</span> <span>سارة</span> </div> <div class="footer"> <strong>فزوعي</strong> © جميع الحقوق محفوظة </div> </div> <script> (function(){ const canvas = document.getElementById('wheelCanvas'); const ctx = canvas.getContext('2d'); const nameInput = document.getElementById('nameInput'); const addBtn = document.getElementById('addBtn'); const spinBtn = document.getElementById('spinBtn'); const editBtn = document.getElementById('editBtn'); const speedSlider = document.getElementById('speedSlider'); const speedValue = document.getElementById('speedValue'); const namesDisplay = document.getElementById('namesDisplay'); // قائمة الأسماء الافتراضية let names = ['أحمد', 'جعفر', 'سارة']; let currentRotation = 0; // الراديان الحالي let isSpinning = false; let spinVelocity = 0; let spinDecay = 0.985; // معامل الاحتكاك (يتم ضبطه عبر السرعة) let animationFrame = null; // الألوان الثابتة const colors = [ '#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#4d908e', '#577590', '#277da1', '#6d597a', '#b56576', '#e56b6f', '#ffb3c6', '#a2d2ff', '#b8f2e6' ]; // عرض الأسماء كـ "شارات" function updateNamesDisplay() { namesDisplay.innerHTML = names.map(n => `<span>${n}</span>`).join(''); } // رسم العجلة function drawWheel(rotation = 0) { const count = names.length; if (count === 0) { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#444'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('أضف أسماء', canvas.width/2, canvas.height/2); return; } const centerX = canvas.width / 2; const centerY = canvas.height / 2; const radius = Math.min(canvas.width, canvas.height) * 0.42; const angleStep = (Math.PI * 2) / count; ctx.clearRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < count; i++) { const startAngle = i * angleStep + rotation; const endAngle = startAngle + angleStep; const color = colors[i % colors.length]; ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius, startAngle, endAngle); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2.5; ctx.stroke(); // كتابة النص const midAngle = startAngle + angleStep / 2; const textRadius = radius * 0.68; const x = centerX + Math.cos(midAngle) * textRadius; const y = centerY + Math.sin(midAngle) * textRadius; ctx.save(); ctx.translate(x, y); ctx.rotate(midAngle + (midAngle > Math.PI/2 ? Math.PI : 0)); ctx.font = 'bold 22px "Segoe UI", Tahoma, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#0f0f1f'; ctx.shadowColor = 'rgba(255,255,200,0.3)'; ctx.shadowBlur = 8; ctx.fillText(names[i], 0, 0); ctx.shadowBlur = 0; ctx.restore(); } // حلقة داخلية للزينة ctx.beginPath(); ctx.arc(centerX, centerY, radius * 0.14, 0, Math.PI * 2); ctx.fillStyle = '#1a1a2e'; ctx.fill(); ctx.strokeStyle = '#f5c842'; ctx.lineWidth = 4; ctx.stroke(); } // تدوير العجلة خطوة بخطوة (باستخدام requestAnimationFrame) function spinWheel() { if (isSpinning) return; if (names.length === 0) { alert('⚠️ أضف أسماء أولاً!'); return; } isSpinning = true; // سرعة ابتدائية عشوائية const baseSpeed = 0.8 + Math.random() * 1.0; const speedFactor = parseFloat(speedSlider.value) || 1.5; spinVelocity = baseSpeed * speedFactor * 0.4; function step() { if (!isSpinning) { return; } // تطبيق الاحتكاك spinVelocity *= spinDecay; // إذا أصبحت السرعة صغيرة جداً → توقف if (Math.abs(spinVelocity) < 0.0005) { spinVelocity = 0; isSpinning = false; if (animationFrame) cancelAnimationFrame(animationFrame); animationFrame = null; return; } currentRotation = (currentRotation + spinVelocity) % (Math.PI * 2); drawWheel(currentRotation); // استمرار animationFrame = requestAnimationFrame(step); } animationFrame = requestAnimationFrame(step); } // إعادة ضبط العجلة (بدون تدوير) function resetWheel() { if (isSpinning) { isSpinning = false; if (animationFrame) cancelAnimationFrame(animationFrame); animationFrame = null; spinVelocity = 0; } drawWheel(currentRotation); } // إضافة اسم جديد function addName() { const raw = nameInput.value.trim(); if (!raw) { alert('الرجاء كتابة اسم.'); return; } // منع التكرار (اختياري) if (names.includes(raw)) { alert(`الاسم "${raw}" موجود مسبقاً.`); nameInput.value = ''; return; } names.push(raw); nameInput.value = ''; updateNamesDisplay(); resetWheel(); } // تعديل السبين (فتح/إخفاء شريط السرعة) let speedVisible = true; function toggleSpeedSlider() { const box = document.getElementById('speedSliderBox'); if (speedVisible) { box.style.display = 'none'; speedVisible = false; editBtn.textContent = '⚙️ إظهار السبين'; } else { box.style.display = 'inline-flex'; speedVisible = true; editBtn.textContent = '⚙️ تعديل السبين'; } } // تحديث معامل الاحتكاك بناءً على شريط السرعة (القيمة الأعلى = دوران أطول) function updateDecay() { const val = parseFloat(speedSlider.value); speedValue.textContent = val.toFixed(1); // نربط السرعة بالاحتكاك: كلما زادت القيمة قل الاحتكاك (يدور لفترة أطول) // المدى: val 0.5 → 0.99 , val 3.0 → 0.92 const decay = 0.99 - (val - 0.5) * 0.035; spinDecay = Math.min(0.995, Math.max(0.88, decay)); } // حدث تغيير شريط السرعة speedSlider.addEventListener('input', function() { updateDecay(); }); // حدث النقر على زر الإضافة (بالزر أو Enter) addBtn.addEventListener('click', addName); nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addName(); }); // تدوير spinBtn.addEventListener('click', spinWheel); // تعديل السبين (إظهار/إخفاء) editBtn.addEventListener('click', toggleSpeedSlider); // تهيئة أولية updateDecay(); updateNamesDisplay(); drawWheel(0); // جعل العجلة قابلة للسحب اليدوي (للمتعة) let isDragging = false; let startX, startY, startRotation; canvas.addEventListener('mousedown', (e) => { if (isSpinning) return; const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height; const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY; const centerX = canvas.width/2, centerY = canvas.height/2; const dx = mouseX - centerX, dy = mouseY - centerY; if (dx*dx + dy*dy < (canvas.width*0.2)**2) return; isDragging = true; startX = mouseX; startY = mouseY; startRotation = currentRotation; canvas.style.cursor = 'grabbing'; }); window.addEventListener('mousemove', (e) => { if (!isDragging) return; const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height; const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY; const centerX = canvas.width/2, centerY = canvas.height/2; const dx1 = startX - centerX, dy1 = startY - centerY; const dx2 = mouseX - centerX, dy2 = mouseY - centerY; const angle1 = Math.atan2(dy1, dx1); const angle2 = Math.atan2(dy2, dx2); currentRotation = startRotation + (angle2 - angle1); drawWheel(currentRotation); }); window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; canvas.style.cursor = 'grab'; } }); // لمنع السحب خارج canvas canvas.style.cursor = 'grab'; // إعادة الرسم عند تغيير حجم النافذة (اختياري) window.addEventListener('resize', () => { drawWheel(currentRotation); }); })(); </script> </body> </html>
