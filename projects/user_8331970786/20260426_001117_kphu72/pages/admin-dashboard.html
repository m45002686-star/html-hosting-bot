<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدمن - BAMA TECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1c, #0f172a, #1e293b);
            font-family: 'Cairo', sans-serif;
        }
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 15px 30px;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: white;
        }
        .logo span { color: #00adb5; }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 40px;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: #00adb5;
        }
        .admin-container {
            max-width: 1400px;
            margin: 100px auto 30px;
            padding: 20px;
        }
        .admin-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 30px;
            border-radius: 25px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }
        .admin-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .admin-stat-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
        }
        .admin-stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .admin-stat-number {
            font-size: 32px;
            font-weight: 800;
            color: #00adb5;
        }
        .admin-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .admin-menu-item {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: #1e293b;
            display: block;
        }
        .admin-menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: #f8fafc;
        }
        .admin-menu-item i {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
            color: #00adb5;
        }
        .menu-toggle {
            display: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links {
                display: none;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                background: #0f172a;
                flex-direction: column;
                padding: 20px;
                text-align: center;
            }
            .nav-links.active { display: flex; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-crown"></i> BAMA <span>TECH</span></div>
            <div class="nav-links">
                <a href="feed.html"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="profile.html"><i class="fas fa-user"></i> ملفي</a>
                <a href="messages.html"><i class="fas fa-envelope"></i> الرسائل</a>
                <a href="admin-dashboard.html" class="active"><i class="fas fa-shield-alt"></i> لوحة التحكم</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </div>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <i class="fas fa-shield-alt" style="font-size: 48px; margin-bottom: 10px;"></i>
            <h2>لوحة تحكم الإدمن</h2>
            <p>مرحباً بك في لوحة التحكم، يمكنك إدارة الموقع بالكامل من هنا</p>
        </div>
        
        <div class="admin-stats-grid" id="statsGrid"></div>
        
        <h3 style="color: white; margin-bottom: 20px;"><i class="fas fa-cog"></i> أدوات الإدارة</h3>
        <div class="admin-menu">
            <a href="admin-users.html" class="admin-menu-item"><i class="fas fa-users"></i> إدارة المستخدمين</a>
            <a href="admin-posts.html" class="admin-menu-item"><i class="fas fa-newspaper"></i> إدارة المنشورات</a>
            <a href="admin-ads.html" class="admin-menu-item"><i class="fas fa-ad"></i> إدارة الإعلانات</a>
            <a href="admin-contests.html" class="admin-menu-item"><i class="fas fa-trophy"></i> إدارة المسابقات</a>
            <a href="admin-stats.html" class="admin-menu-item"><i class="fas fa-chart-line"></i> الإحصائيات</a>
            <a href="verified-plus.html" class="admin-menu-item"><i class="fas fa-gem"></i> شارات VERIFIED+</a>
            <div class="admin-menu-item" onclick="createNewAdmin()"><i class="fas fa-user-shield"></i> إضافة إدمن</div>
            <div class="admin-menu-item" onclick="broadcastMessage()"><i class="fas fa-bullhorn"></i> إعلان عام</div>
            <div class="admin-menu-item" onclick="exportData()"><i class="fas fa-download"></i> تصدير البيانات</div>
            <div class="admin-menu-item" onclick="clearAllData()"><i class="fas fa-trash-alt"></i> مسح الكل</div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('bamatech_users_final')) || [];
        let posts = JSON.parse(localStorage.getItem('bamatech_posts_final')) || [];
        let messages = JSON.parse(localStorage.getItem('bamatech_messages')) || [];
        let contests = JSON.parse(localStorage.getItem('bamatech_contests')) || [];
        
        let currentUserId = localStorage.getItem('currentUserId');
        let currentUser = users.find(u => u.id == currentUserId);
        
        if(!currentUser || (!currentUser.isAdmin && !currentUser.isOwner)) {
            window.location.href = 'login.html';
        }
        
        function getStats() {
            return {
                totalUsers: users.filter(u => !u.isAdmin && !u.isOwner && !u.banned).length,
                totalAdmins: users.filter(u => u.isAdmin && !u.isOwner).length,
                totalPosts: posts.length,
                totalLikes: posts.reduce((sum, p) => sum + (p.likes?.length || 0), 0),
                totalComments: posts.reduce((sum, p) => sum + (p.comments?.length || 0), 0),
                totalMessages: messages.length,
                totalContests: contests.length,
                bannedUsers: users.filter(u => u.banned).length,
                verifiedPlus: users.filter(u => u.verifiedPlus && !u.isAdmin && !u.isOwner).length
            };
        }
        
        function loadStats() {
            let stats = getStats();
            document.getElementById('statsGrid').innerHTML = `
                <div class="admin-stat-card"><div class="admin-stat-number">${stats.totalUsers}</div><div>المستخدمين</div></div>
                <div class="admin-stat-card"><div class="admin-stat-number">${stats.totalAdmins}</div><div>الإدمن</div></div>
                <div class="admin-stat-card"><div class="admin-stat-number">${stats.totalPosts}</div><div>المنشورات</div></div>
                <div class="admin-stat-card"><div class="admin-stat-number">${stats.totalLikes}</div><div>الإعجابات</div></div>
                <div class="admin-stat-card"><div class="admin-stat-number">${stats.totalComments}</div><div>التعليقات</div></div>
                <div class="admin-stat-card"><div class="admin-stat-number">${stats.bannedUsers}</div><div>محظورين</div></div>
                <div class="admin-stat-card"><div class="admin-stat-number">${stats.verifiedPlus}</div><div>VERIFIED+</div></div>
            `;
        }
        
        function createNewAdmin() {
            let username = prompt("اسم المستخدم للإدمن الجديد");
            let name = prompt("الاسم الظاهر");
            let password = prompt("كلمة المرور");
            if(username && name && password) {
                let newId = Date.now();
                users.push({
                    id: newId, username, name, password,
                    isOwner: false, isAdmin: true, verified: true, verifiedPlus: true,
                    bio: 'إدمن في BAMA TECH', avatar: '', banned: false, createdAt: Date.now()
                });
                localStorage.setItem('bamatech_users_final', JSON.stringify(users));
                alert("تم إضافة الإدمن بنجاح!");
                loadStats();
            }
        }
        
        function broadcastMessage() {
            let msg = prompt("أدخل الرسالة التي تريد إرسالها لجميع المستخدمين:");
            if(msg) {
                let notifications = JSON.parse(localStorage.getItem('bamatech_notifications')) || [];
                users.forEach(u => {
                    if(!u.isAdmin && !u.isOwner) {
                        notifications.unshift({
                            id: Date.now() + Math.random(),
                            userId: u.id,
                            message: `📢 إعلان عام من الإدارة: ${msg}`,
                            type: 'admin',
                            read: false,
                            timestamp: Date.now()
                        });
                    }
                });
                localStorage.setItem('bamatech_notifications', JSON.stringify(notifications));
                alert("تم إرسال الإعلان لجميع المستخدمين");
            }
        }
        
        function exportData() {
            let data = { users, posts, messages, contests };
            let dataStr = JSON.stringify(data);
            let blob = new Blob([dataStr], {type: "application/json"});
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `bamatech_backup_${Date.now()}.json`;
            a.click();
            alert("تم تصدير النسخة الاحتياطية");
        }
        
        function clearAllData() {
            if(confirm("⚠️ تحذير: هذا سيحذف جميع البيانات! هل أنت متأكد؟")) {
                localStorage.clear();
                alert("تم مسح جميع البيانات");
                window.location.href = '../index.html';
            }
        }
        
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('currentUserId');
            window.location.href = 'login.html';
        });
        
        document.querySelector('.menu-toggle').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('active');
        });
        
        loadStats();
        
        window.createNewAdmin = createNewAdmin;
        window.broadcastMessage = broadcastMessage;
        window.exportData = exportData;
        window.clearAllData = clearAllData;
    </script>
</body>
</html>
