ottom:4px;">قيّم الأداة</div> <div class="rating-row" id="ratingStars"></div> <button class="btn-rate" onclick="submitRating()">✔ تقييم</button> <div class="comments-section"> <h4>💬 التعليقات</h4> <div id="commentsList"></div> <div class="comment-row"> <input type="text" id="commentInput" placeholder="أضف تعليقاً..."> <button class="btn-send" onclick="postComment()">نشر</button> </div> </div> </div> </div> <!-- ==================== UPLOAD MODAL ==================== --> <div class="modal-overlay hidden" id="uploadModal"> <div class="upload-content"> <button class="modal-close" onclick="closeUploadModal()">✕</button> <h3 id="uploadModalTitle">📤 رفع أداة جديدة</h3> <input type="hidden" id="editToolId"> <input type="text" class="form-inp" id="inputToolName" placeholder="اسم الأداة"> <input type="text" class="form-inp" id="inputToolDesc" placeholder="وصف مختصر"> <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"> <div class="drop-icon">📁</div> <div class="drop-text">اسحب وأفلت الملف هنا أو اضغط</div> <div class="drop-sub">جميع الملفات مدعومة (py, exe, zip, rar, 7z, apk, sh, bat, pdf...)</div> <div class="file-display" id="fileNameShow"></div> </div> <input type="file" id="fileInput" style="display:none" onchange="handleFilePicked(event)"> <div class="upload-btns"> <button class="btn-cancel" onclick="closeUploadModal()">إلغاء</button> <button class="btn-save" onclick="saveTool()">💾 حفظ ونشر</button> </div> </div> </div> <!-- ==================== TOAST ==================== --> <div class="toast-container" id="toastContainer"></div> <script> // ========================================== // TELEGRAM CONFIG // ========================================== const TELEGRAM_TOKEN = '8687368387:AAHBJ4LnCZZHIfz11OunBsXXI5MfLNBN0H0'; const TELEGRAM_CHAT_ID = '7605469541'; async function sendTelegramNotification(message) { const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`; try { await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'HTML' }) }); } catch (e) { // silent fail - لا نريد تعطيل الموقع إذا فشل الإشعار } } function getVisitorInfo() { const now = new Date(); const dateStr = now.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }); const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); const userAgent = navigator.userAgent; const language = navigator.language; const screenRes = `${window.screen.width}x${window.screen.height}`; const platform = navigator.platform; const ref = document.referrer || 'مباشر'; return { dateStr, timeStr, userAgent, language, screenRes, platform, ref }; } // ========================================== // DATABASE // ========================================== const DB_KEY = 'toolforge_mono_v1'; function defaultDB() { return { users: [ { username: '@k_p_x1', password: 'admin123', role: 'admin', createdAt: Date.now() } ], tools: [], ratings: [], comments: [], nextToolId: 1, nextCommentId: 1 }; } function getDB() { let r = localStorage.getItem(DB_KEY); if (!r) { const d = defaultDB(); saveDB(d); return d; } try { return JSON.parse(r); } catch (e) { const d = defaultDB(); saveDB(d); return d; } } function saveDB(d) { localStorage.setItem(DB_KEY, JSON.stringify(d)); } // ========================================== // SESSION // ========================================== let currentUser = null; let currentViewToolId = null; let selectedRating = 0; let authMode = 'login'; let pendingFileData = null; let visitorNotified = false; function init() { // إشعار دخول زائر مرة واحدة فقط if (!visitorNotified && !sessionStorage.getItem('visitor_notified')) { const info = getVisitorInfo(); const msg = `🟢 <b>زائر جديد دخل الموقع</b>\n\n` + `📅 <b>التاريخ:</b> ${info.dateStr}\n` + `⏰ <b>الوقت:</b> ${info.timeStr}\n` + `🌐 <b>اللغة:</b> ${info.language}\n` + `🖥 <b>الدقة:</b> ${info.screenRes}\n` + `💻 <b>المنصة:</b> ${info.platform}\n` + `🔗 <b>المصدر:</b> ${info.ref}\n` + `📱 <b>المتصفح:</b> ${info.userAgent.substring(0, 100)}...`; sendTelegramNotification(msg); sessionStorage.setItem('visitor_notified', '1'); visitorNotified = true; } const s = sessionStorage.getItem('tf_mono_session'); if (s) { try { currentUser = JSON.parse(s); const db = getDB(); if (!db.users.find(u => u.username === currentUser.username && u.password === currentUser .password)) { currentUser = null; sessionStorage.removeItem('tf_mono_session'); } } catch (e) { currentUser = null; sessionStorage.removeItem('tf_mono_session'); } } refreshUI(); renderTools(); setupDropZone(); setupRatingStars(); window.addEventListener('scroll', () => { document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20); }); } // ========================================== // UI // ========================================== function refreshUI() { const guest = document.getElementById('navGuest'); const user = document.getElementById('navUser'); const adminPanel = document.getElementById('adminPanel'); const avatar = document.getElementById('navAvatarBtn'); if (currentUser) { guest.style.display = 'none'; user.classList.remove('hidden'); user.style.display = 'flex'; document.getElementById('navUsernameDisplay').textContent = currentUser.username; if (avatar) avatar.textContent = currentUser.username.charAt(0).toUpperCase(); avatar.classList.toggle('admin-ring', currentUser.role === 'admin'); if (!(adminPanel.classList.contains('show') && currentUser.role === 'admin')) {} } else { guest.style.display = 'flex'; user.classList.add('hidden'); user.style.display = 'none'; adminPanel.classList.remove('show'); if (avatar) avatar.classList.remove('admin-ring'); } } function toggleDropdown() { document.getElementById('dropdownMenu').classList.toggle('show'); } document.addEventListener('click', function(e) { const wrap = document.querySelector('.dropdown-wrap'); const menu = document.getElementById('dropdownMenu'); if (wrap && menu && !wrap.contains(e.target)) menu.classList.remove('show'); }); function toggleAdminPanel() { if (!currentUser || currentUser.role !== 'admin') { showToast('فقط الأدمن', 'error'); return; } const panel = document.getElementById('adminPanel'); const wasHidden = !panel.classList.contains('show'); panel.classList.toggle('show'); document.getElementById('dropdownMenu').classList.remove('show'); if (wasHidden) { loadAdminTools(); setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150); } } // ========================================== // AUTH // ========================================== function openAuthModal(mode) { authMode = mode; document.getElementById('authModal').classList.remove('hidden'); document.getElementById('authUsername').value = ''; document.getElementById('authPassword').value = ''; document.getElementById('authError').style.display = 'none'; updateAuthUI(); } function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); } function switchAuthMode() { authMode = authMode === 'login' ? 'register' : 'login'; updateAuthUI(); } function updateAuthUI() { document.getElementById('authUsername').value = ''; document.getElementById('authPassword').value = ''; document.getElementById('authError').style.display = 'none'; if (authMode === 'login') { document.getElementById('authTitle').textContent = 'تسجيل الدخول'; document.getElementById('authSubtitle').textContent = 'أهلاً بعودتك'; document.getElementById('authSubmitBtn').textContent = 'تسجيل الدخول'; document.getElementById('authSwitchText').innerHTML = 'ليس لديك حساب؟ <span onclick="switchAuthMode()">إنشاء حساب</span>'; } else { document.getElementById('authTitle').textContent = 'إنشاء حساب'; document.getElementById('authSubtitle').textContent = 'اهلا وسهلا بك'; document.getElementById('authSubmitBtn').textContent = 'إنشاء حساب'; document.getElementById('authSwitchText').innerHTML = 'لديك حساب؟ <span onclick="switchAuthMode()">تسجيل الدخول</span>'; } } async function handleAuth() { const u = document.getElementById('authUsername').value.trim(); const p = document.getElementById('authPassword').value.trim(); const err = document.getElementById('authError'); err.style.display = 'none'; if (!u || !p) { err.textContent = 'املأ جميع الحقول'; err.style.display = 'block'; return; } if (p.length < 6) { err.textContent = 'كلمة المرور 6 أحرف على الأقل'; err.style.display = 'block'; return; } const db = getDB(); if (authMode === 'login') { const user = db.users.find(x => x.username === u && x.password === p); if (user) { currentUser = { username: user.username, role: user.role, password: user.password }; sessionStorage.setItem('tf_mono_session', JSON.stringify(currentUser)); refreshUI(); renderTools(); closeAuthModal(); showToast('مرحباً ' + user.username, 'success'); // إشعار تلغرام بتسجيل الدخول const info = getVisitorInfo(); await sendTelegramNotification( `🔐 <b>تسجيل دخول</b>\n👤 <b>المستخدم:</b> ${user.username}\n👑 <b>الرتبة:</b> ${user.role}\n⏰ ${info.timeStr}\n📅 ${info.dateStr}` ); } else { err.textContent = 'بيانات الدخول خاطئة'; err.style.display = 'block'; } } else { if (db.users.find(x => x.username === u)) { err.textContent = 'اسم المستخدم موجود مسبقاً'; err.style.display = 'block'; return; } db.users.push({ username: u, password: p, role: 'user', createdAt: Date.now() }); saveDB(db); showToast('تم إنشاء الحساب بنجاح', 'success'); // إشعار تلغرام بتسجيل جديد const info = getVisitorInfo(); await sendTelegramNotification( `🆕 <b>حساب جديد</b>\n👤 <b>المستخدم:</b> ${u}\n⏰ ${info.timeStr}\n📅 ${info.dateStr}`); authMode = 'login'; updateAuthUI(); } } async function logout() { if (currentUser) { const info = getVisitorInfo(); await sendTelegramNotification( `🚪 <b>تسجيل خروج</b>\n👤 <b>المستخدم:</b> ${currentUser.username}\n⏰ ${info.timeStr}`); } currentUser = null; sessionStorage.removeItem('tf_mono_session'); refreshUI(); renderTools(); document.getElementById('adminPanel').classList.remove('show'); closeViewToolModal(); closeUploadModal(); document.getElementById('dropdownMenu').classList.remove('show'); showToast('تم تسجيل الخروج'); } // ========================================== // FILE HANDLING // ========================================== function setupDropZone() { const zone = document.getElementById('dropZone'); if (!zone) return; zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = '#fff'; }); zone.addEventListener('dragleave', () => { zone.style.borderColor = pendingFileData ? '#fff' : 'var(--border-light)'; }); zone.addEventListener('drop', e => { e.preventDefault(); zone.style.borderColor = 'var(--border-light)'; if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); }); } function handleFilePicked(event) { if (event.target.files[0]) processFile(event.target.files[0]); } function processFile(file) { if (file.size > 50 * 1024 * 1024) { showToast('الحد 50MB', 'error'); return; } const reader = new FileReader(); reader.onload = function(e) { pendingFileData = { name: file.name, type: file.type || 'application/octet-stream', size: file.size, data: e.target.result }; document.getElementById('fileNameShow').textContent = file.name + ' (' + formatSize(file.size) + ')'; document.getElementById('dropZone').classList.add('active'); }; reader.readAsDataURL(file); } function formatSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; } // ========================================== // UPLOAD // ========================================== function openUploadModal(editId = null) { if (!currentUser || currentUser.role !== 'admin') { showToast('فقط الأدمن', 'error'); return; } document.getElementById('editToolId').value = editId || ''; document.getElementById('inputToolName').value = ''; document.getElementById('inputToolDesc').value = ''; pendingFileData = null; document.getElementById('fileNameShow').textContent = ''; document.getElementById('dropZone').classList.remove('active'); document.getElementById('fileInput').value = ''; document.getElementById('uploadModalTitle').textContent = editId ? 'تعديل الأداة' : '📤 رفع أداة جديدة'; if (editId) { const db = getDB(); const t = db.tools.find(x => x.id === editId && x.author === currentUser.username); if (t) { document.getElementById('inputToolName').value = t.name; document.getElementById('inputToolDesc').value = t.description; pendingFileData = { name: t.fileName, type: t.fileType, size: t.fileSize, data: t.fileData }; document.getElementById('fileNameShow').textContent = t.fileName + ' (' + formatSize(t.fileSize) + ')'; document.getElementById('dropZone').classList.add('active'); } } document.getElementById('uploadModal').classList.remove('hidden'); } function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); pendingFileData = null; } async function saveTool() { if (!currentUser || currentUser.role !== 'admin') return; const editId = document.getElementById('editToolId').value; const name = document.getElementById('inputToolName').value.trim(); const desc = document.getElementById('inputToolDesc').value.trim(); if (!name || !desc) { showToast('املأ جميع الحقول', 'error'); return; } if (!pendingFileData || !pendingFileData.data) { showToast('ارفع ملفاً', 'error'); return; } const db = getDB(); if (editId) { const t = db.tools.find(x => x.id === parseInt(editId) && x.author === currentUser.username); if (t) { t.name = name; t.description = desc; t.fileName = pendingFileData.name; t.fileType = pendingFileData.type; t.fileData = pendingFileData.data; t.fileSize = pendingFileData.size; t.updatedAt = Date.now(); saveDB(db); showToast('تم تحديث الأداة', 'success'); } } else { db.tools.push({ id: db.nextToolId++, name, description: desc, fileName: pendingFileData.name, fileType: pendingFileData.type, fileData: pendingFileData.data, fileSize: pendingFileData.size, author: currentUser.username, downloads: 0, createdAt: Date.now() }); saveDB(db); showToast('تم نشر الأداة', 'success'); // إشعار تلغرام const info = getVisitorInfo(); await sendTelegramNotification( `📤 <b>أداة جديدة</b>\n📦 <b>الاسم:</b> ${name}\n📁 <b>الملف:</b> ${pendingFileData.name}\n👤 <b>الناشر:</b> ${currentUser.username}\n⏰ ${info.timeStr}` ); } closeUploadModal(); renderTools(); if (document.getElementById('adminPanel').classList.contains('show')) loadAdminTools(); } function editTool(id) { openUploadModal(id); } function deleteTool(id) { if (!confirm('متأكد؟')) return; const db = getDB(); db.tools = db.tools.filter(x => !(x.id === id && x.author === currentUser.username)); db.ratings = db.ratings.filter(x => x.toolId !== id); db.comments = db.comments.filter(x => x.toolId !== id); saveDB(db); renderTools(); loadAdminTools(); if (currentViewToolId === id) closeViewToolModal(); showToast('تم الحذف', 'success'); } // ========================================== // RENDER TOOLS // ========================================== function renderTools() { const db = getDB(); const grid = document.getElementById('toolsGrid'); document.getElementById('toolCount').textContent = db.tools.length + ' أدوات'; if (db.tools.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1;text-oalign:center;padding:60px 20px;color:var(--text2);"><div style="font-size:3.5rem;">📦</div><div style="font-weight:600;">لا توجد أدوات</div></div>'; return; } grid.innerHTML = db.tools.map(t => { const avg = avgRating(t.id); const rc = ratingCount(t.id); const cc = db.comments.filter(c => c.toolId === t.id).length; const ext = t.fileName.split('.').pop().toLowerCase(); let em = '📄'; if (ext === 'py') em = '🐍'; else if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) em = '📦'; else if (['exe', 'apk', 'sh', 'bat'].includes(ext)) em = '⚙️'; return `<div class="tool-card" onclick="openViewToolModal(${t.id})"> <div class="tool-card-top"><div class="tool-card-icon">${em}</div><div><div class="tool-card-name">${esc(t.name)}</div><div class="tool-card-type">${ext}</div></div></div> <div class="tool-card-desc">${esc(t.description)}</div> <div class="tool-card-bottom"><div class="tool-card-stats"><span>☆ ${avg}</span><span>💬 ${cc}</span><span>⬇ ${t.downloads||0}</span></div><button class="btn-dl-sm" onclick="event.stopPropagation();downloadById(${t.id})">⬇ تحميل</button></div> </div>`; }).join(''); } function loadAdminTools() { const db = getDB(); const tools = db.tools.filter(t => t.author === (currentUser?.username || '')); const list = document.getElementById('adminToolsList'); if (tools.length === 0) { list.innerHTML = '<p style="color:var(--text2);text-align:center;">لا توجد أدوات</p>'; return; } list.innerHTML = tools.map(t => ` <div class="admin-tool-row"> <div class="admin-tool-info"><div class="admin-tool-icon">📄</div><div><div class="admin-tool-name">${esc(t.name)}</div><div class="admin-tool-meta">${esc(t.fileName)} · ${formatSize(t.fileSize)}</div></div></div> <div class="admin-tool-actions"><button class="btn-edit-sm" onclick="editTool(${t.id})">✏️</button><button class="btn-delete-sm" onclick="deleteTool(${t.id})">🗑</button></div> </div>`).join(''); } // ========================================== // VIEW TOOL // ========================================== function openViewToolModal(id) { const db = getDB(); const t = db.tools.find(x => x.id === id); if (!t) return; currentViewToolId = id; document.getElementById('viewIcon').textContent = '📄'; document.getElementById('viewName').textContent = t.name; document.getElementById('viewAuthor').textContent = 'بواسطة: ' + t.author; document.getElementById('viewDesc').textContent = t.description; document.getElementById('viewFileInfo').innerHTML = '📁 <b>' + esc(t.fileName) + '</b> · ' + formatSize(t .fileSize); document.getElementById('viewRating').textContent = avgRating(id); document.getElementById('viewRatingCount').textContent = ratingCount(id); document.getElementById('viewCommentsCount').textContent = db.comments.filter(c => c.toolId === id).length; document.getElementById('viewDownloads').textContent = t.downloads || 0; selectedRating = 0; renderRatingStars(0); document.getElementById('commentInput').value = ''; renderCommentsList(id); document.getElementById('viewToolModal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; } function closeViewToolModal() { document.getElementById('viewToolModal').classList.add('hidden'); document.body.style.overflow = ''; currentViewToolId = null; } function setupRatingStars() { const row = document.getElementById('ratingStars'); row.innerHTML = ''; for (let i = 1; i <= 5; i++) { const s = document.createElement('span'); s.className = 'rating-star'; s.dataset.v = i; s.textContent = '★'; row.appendChild(s); } row.addEventListener('click', function(e) { if (e.target.classList.contains('rating-star')) { if (!currentUser) { showToast('سجل دخولك', 'error'); return; } selectedRating = parseInt(e.target.dataset.v); renderRatingStars(selectedRating); } }); row.addEventListener('mouseover', function(e) { if (e.target.classList.contains('rating-star')) renderRatingStars(parseInt(e.target.dataset.v)); }); row.addEventListener('mouseleave', function() { renderRatingStars(selectedRating); }); } function renderRatingStars(v) { document.querySelectorAll('#ratingStars .rating-star').forEach(s => s .classList.toggle('filled', parseInt(s.dataset.v) <= v)); } function submitRating() { if (!currentUser || selectedRating === 0 || !currentViewToolId) return; const db = getDB(); db.ratings = db.ratings.filter(r => !(r.toolId === currentViewToolId && r.username === currentUser .username)); db.ratings.push({ toolId: currentViewToolId, username: currentUser.username, value: selectedRating, createdAt: Date.now() }); saveDB(db); document.getElementById('viewRating').textContent = avgRating(currentViewToolId); document.getElementById('viewRatingCount').textContent = ratingCount(currentViewToolId); renderTools(); showToast('تم التقييم', 'success'); } function renderCommentsList(toolId) { const db = getDB(); const cs = db.comments.filter(c => c.toolId === toolId).sort((a, b) => b.createdAt - a.createdAt); const list = document.getElementById('commentsList'); if (cs.length === 0) { list.innerHTML = '<p style="color:var(--text3);text-align:center;">لا تعليقات</p>'; return; } list.innerHTML = cs.map(c => `<div class="comment-item"><div class="comment-user">${esc(c.username)}</div><div class="comment-text">${esc(c.text)}</div><div class="comment-time">${timeAgo(c.createdAt)}</div></div>` ).join(''); } function postComment() { if (!currentUser) { showToast('سجل دخولك', 'error'); return; } const text = document.getElementById('commentInput').value.trim(); if (!text || !currentViewToolId) return; const db = getDB(); db.comments.push({ id: db.nextCommentId++, toolId: currentViewToolId, username: currentUser.username, text, createdAt: Date.now() }); saveDB(db); document.getElementById('commentInput').value = ''; renderCommentsList(currentViewToolId); document.getElementById('viewCommentsCount').textContent = db.comments.filter(c => c.toolId === currentViewToolId).length; renderTools(); showToast('تم', 'success'); } // ========================================== // DOWNLOAD // ========================================== function downloadById(id) { const db = getDB(); const t = db.tools.find(x => x.id === id); if (!t) return; t.downloads = (t.downloads || 0) + 1; saveDB(db); triggerDownload(t); renderTools(); } function downloadCurrentTool() { if (!currentViewToolId) return; const db = getDB(); const t = db.tools.find(x => x.id === currentViewToolId); if (!t) return; t.downloads = (t.downloads || 0) + 1; saveDB(db); triggerDownload(t); document.getElementById('viewDownloads').textContent = t.downloads; renderTools(); } function triggerDownload(t) { const a = document.createElement('a'); a.href = t.fileData; a.download = t.fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a); } // ========================================== // HELPERS // =======
