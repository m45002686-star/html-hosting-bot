<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>الكابتشا - تأكد انك إنسان</title> <style> * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; } body { background: linear-gradient(135deg, #141e30 0%, #243b55 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; } .container { background-color: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); padding: 30px; width: 100%; max-width: 700px; } h2 { text-align: center; color: #1e293b; margin-bottom: 10px; font-size: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; } .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; } .challenge-box { background: linear-gradient(145deg, #f8fafc, #f1f5f9); border-radius: 15px; padding: 25px; margin-bottom: 25px; border: 2px solid #cbd5e1; } .challenge-text { text-align: center; font-size: 22px; font-weight: bold; color: #0f172a; margin-bottom: 15px; } .challenge-highlight { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 12px 25px; border-radius: 50px; display: inline-block; font-size: 24px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); } .instruction { display: flex; align-items: center; gap: 10px; background-color: #dbeafe; padding: 12px 20px; border-radius: 10px; color: #1e40af; font-weight: 500; margin: 15px 0; border-right: 5px solid #2563eb; } .instruction span { font-size: 24px; } .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; } .image-item { position: relative; cursor: pointer; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); transition: transform 0.2s, box-shadow 0.2s; aspect-ratio: 1; border: 3px solid transparent; } .image-item:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); } .image-item.selected { border: 4px solid #3b82f6; box-shadow: 0 0 0 2px white, 0 0 0 5px #3b82f6; } .image-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.6); color: white; padding: 5px; font-size: 12px; text-align: center; backdrop-filter: blur(3px); } .check-icon { position: absolute; top: 10px; right: 10px; background: #3b82f6; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); } .actions { display: flex; gap: 15px; margin: 25px 0 15px; } .btn { flex: 1; padding: 14px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; } .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); } .btn-primary:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4); } .btn-secondary { background: #e2e8f0; color: #334155; } .btn-secondary:hover { background: #cbd5e1; transform: translateY(-2px); } .btn:active { transform: translateY(0); } .message { margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 16px; display: none; } .success { background-color: #d1fae5; color: #065f46; border: 2px solid #10b981; } .error { background-color: #fee2e2; color: #991b1b; border: 2px solid #ef4444; } .progress { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; color: #64748b; font-size: 14px; } .dots { display: flex; gap: 8px; } .dot { width: 10px; height: 10px; background-color: #cbd5e1; border-radius: 50%; } .dot.active { background-color: #3b82f6; transform: scale(1.2); } .footer { text-align: center; margin-top: 25px; color: #94a3b8; font-size: 13px; border-top: 1px solid #e2e8f0; padding-top: 15px; } </style> </head> <body> <div class="container"> <h2> <span>🛡️</span> تحقق إنك إنسان <span>🔒</span> </h2> <div class="subtitle">عنا نتحقق شوي إنك مو روبوت</div> <div class="challenge-box"> <div class="challenge-text"> دوس على الصورة يلي فيها: </div> <div class="challenge-highlight" id="challengeText"> ممر مشاة </div> <div class="instruction"> <span>🖱️</span> <span>دوس على صورة وحدة بس يلي عليها المطلوب</span> </div> </div> <div class="image-grid" id="imageGrid"> </div> <div class="actions"> <button class="btn btn-primary" onclick="verifySelection()"> <span>✓</span> تحقق </button> <button class="btn btn-secondary" onclick="resetSelection()"> <span>🔄</span> فرغي </button> </div> <div id="message" class="message"></div> <div class="progress"> <span>🔍 دوس على الصورة الصح</span> <div class="dots"> <span class="dot active"></span> <span class="dot"></span> <span class="dot"></span> </div> </div> <div class="footer"> هالاختبار عشان ما يدخل عنا روبوتات </div> </div> <script> const imageCategories = { crosswalk: [ { id: 1, category: 'crosswalk', label: 'ممر مشاة 1', emoji: '🚶' }, { id: 2, category: 'crosswalk', label: 'ممر مشاة 2', emoji: '🚦' }, { id: 3, category: 'crosswalk', label: 'ممر مشاة 3', emoji: '🚸' } ], trafficLight: [ { id: 4, category: 'trafficLight', label: 'إشارة مرور 1', emoji: '🚥' }, { id: 5, category: 'trafficLight', label: 'إشارة مرور 2', emoji: '🚦' }, { id: 6, category: 'trafficLight', label: 'إشارة مرور 3', emoji: '🚥' } ], stopSign: [ { id: 7, category: 'stopSign', label: 'علامة قف 1', emoji: '🛑' }, { id: 8, category: 'stopSign', label: 'علامة قف 2', emoji: '⛔' }, { id: 9, category: 'stopSign', label: 'علامة قف 3', emoji: '🛑' } ], bus: [ { id: 10, category: 'bus', label: 'باص 1', emoji: '🚌' }, { id: 11, category: 'bus', label: 'باص 2', emoji: '🚍' }, { id: 12, category: 'bus', label: 'باص 3', emoji: '🚏' } ], bicycle: [ { id: 13, category: 'bicycle', label: 'دراجة 1', emoji: '🚲' }, { id: 14, category: 'bicycle', label: 'دراجة 2', emoji: '🚴' }, { id: 15, category: 'bicycle', label: 'دراجة 3', emoji: '🚵' } ], taxi: [ { id: 16, category: 'taxi', label: 'تاكسي 1', emoji: '🚕' }, { id: 17, category: 'taxi', label: 'تاكسي 2', emoji: '🚖' }, { id: 18, category: 'taxi', label: 'تاكسي 3', emoji: '🚗' } ] }; const challenges = [ { text: 'ممر مشاة', category: 'crosswalk' }, { text: 'إشارة مرور', category: 'trafficLight' }, { text: 'علامة قف', category: 'stopSign' }, { text: 'باص', category: 'bus' }, { text: 'دراجة', category: 'bicycle' }, { text: 'تاكسي', category: 'taxi' }, { text: 'إشارة ضوئية', category: 'trafficLight' }, { text: 'موقف باص', category: 'bus' }, { text: 'خطوط مشاة', category: 'crosswalk' } ]; let currentChallenge = null; let selectedImages = new Set(); let allImages = []; let correctImageId = null; function createImageElement(image) { const colors = { crosswalk: ['#4CAF50', '#45a049'], trafficLight: ['#f1c40f', '#f39c12'], stopSign: ['#e74c3c', '#c0392b'], bus: ['#3498db', '#2980b9'], bicycle: ['#e67e22', '#d35400'], taxi: ['#f1c40f', '#f39c12'] }; const color = colors[image.category] || ['#3498db', '#2980b9']; return ` <div class="image-item" onclick="toggleImage(${image.id})" data-id="${image.id}" data-category="${image.category}"> <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, ${color[0]}, ${color[1]}); color:white; font-size:60px;"> ${image.emoji} </div> <div class="image-label">${image.label}</div> </div> `; } function shuffleImages() { const allCategorized = [ ...imageCategories.crosswalk, ...imageCategories.trafficLight, ...imageCategories.stopSign, ...imageCategories.bus, ...imageCategories.bicycle, ...imageCategories.taxi ]; for (let i = allCategorized.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [allCategorized[i], allCategorized[j]] = [allCategorized[j], allCategorized[i]]; } return allCategorized; } function selectRandomChallenge() { const randomIndex = Math.floor(Math.random() * challenges.length); return challenges[randomIndex]; } function getRandomImageFromCategory(category) { const categoryImages = imageCategories[category]; const randomIndex = Math.floor(Math.random() * categoryImages.length); return categoryImages[randomIndex].id; } function displayImages() { allImages = shuffleImages(); const grid = document.getElementById('imageGrid'); grid.innerHTML = allImages.map(img => createImageElement(img)).join(''); currentChallenge = selectRandomChallenge(); document.getElementById('challengeText').textContent = currentChallenge.text; const imagesInCategory = allImages.filter(img => img.category === currentChallenge.category); if (imagesInCategory.length > 0) { const randomIndex = Math.floor(Math.random() * imagesInCategory.length); correctImageId = imagesInCategory[randomIndex].id; } selectedImages.clear(); updateSelectedStyles(); } window.toggleImage = function(imageId) { const imageItem = document.querySelector(`[data-id="${imageId}"]`); if (selectedImages.has(imageId)) { selectedImages.delete(imageId); imageItem.classList.remove('selected'); const checkMark = imageItem.querySelector('.check-icon'); if (checkMark) checkMark.remove(); } else { if (selectedImages.size > 0) { const previousId = Array.from(selectedImages)[0]; const previousItem = document.querySelector(`[data-id="${previousId}"]`); previousItem.classList.remove('selected'); const prevCheckMark = previousItem.querySelector('.check-icon'); if (prevCheckMark) prevCheckMark.remove(); selectedImages.clear(); } selectedImages.add(imageId); imageItem.classList.add('selected'); const checkMark = document.createElement('div'); checkMark.className = 'check-icon'; checkMark.innerHTML = '✓'; imageItem.appendChild(checkMark); } } function updateSelectedStyles() { document.querySelectorAll('.image-item').forEach(item => { const id = parseInt(item.dataset.id); if (selectedImages.has(id)) { item.classList.add('selected'); } else { item.classList.remove('selected'); } }); } window.verifySelection = function() { const messageDiv = document.getElementById('message'); if (selectedImages.size === 0) { showMessage('❌ يلا دوس على الصورة المطلوبة', 'error'); return; } const selectedId = Array.from(selectedImages)[0]; const selectedImage = allImages.find(img => img.id === selectedId); if (selectedImage.category === currentChallenge.category) { showMessage('✅ ماشي الحال! تأكدنا إنك إنسان.', 'success'); setTimeout(() => { displayImages(); }, 2000); } else { showMessage('❌ غلط! هالمرة دوس على الصورة الصح.', 'error'); setTimeout(() => { resetSelection(); }, 1500); } } window.resetSelection = function() { selectedImages.clear(); document.querySelectorAll('.image-item').forEach(item => { item.classList.remove('selected'); const checkMark = item.querySelector('.check-icon'); if (checkMark) checkMark.remove(); }); document.getElementById('message').style.display = 'none'; } function showMessage(text, type) { const messageDiv = document.getElementById('message'); messageDiv.textContent = text; messageDiv.className = `message ${type}`; messageDiv.style.display = 'block'; } window.onload = function() { displayImages(); }; </script> </body> </html>
