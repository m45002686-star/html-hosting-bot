<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت صديق</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        
        .message {
            color: #666;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .feature {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        
        .feature:hover {
            transform: translateY(-5px);
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ الموقع نشط!</h1>
        
        <div class="message">
            موقع "<strong>بوت صديق</strong>" تم استضافته بنجاح.
        </div>
        
        <div class="features">
            <div class="feature">
                <h3>استضافة سريعة</h3>
                <p>استضافة عالية السرعة مع شبكة توصيل محتوى عالمية</p>
            </div>
            
            <div class="feature">
                <h3>مجاني بالكامل</h3>
                <p>مشروع واحد مجاني للأبد</p>
            </div>
        </div>
        
        <div class="footer">
            <p>تمت الاستضافة عبر بوت استضافة المواقع</p>
            <p>2026-02-12 13:23:28</p>
        </div>
    </div>
</body>
</html>
