<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"> <title>🌍 المريخ والأرض - نظام متعدد المراكز</title> <style> body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; } .info-panel { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 8px 18px; border-radius: 30px; color: white; font-size: 14px; z-index: 20; pointer-events: none; font-weight: bold; direction: rtl; border: 1px solid rgba(255,200,100,0.3); } .info-panel span { color: #ffaa66; } .instruction { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 5px 12px; border-radius: 20px; font-size: 10px; color: rgba(255,255,255,0.6); pointer-events: none; z-index: 20; } @media (max-width: 600px) { .info-panel { font-size: 10px; padding: 5px 12px; bottom: 15px; left: 15px; } .instruction { font-size: 8px; bottom: 15px; right: 15px; } } </style> </head> <body> <div class="info-panel"> 🔴 <span id="currentTarget">الأرض</span> (مركز الاستعراض) </div> <div class="instruction"> 🌟 اضغط على كوكب ليصير مركز الدوران </div> <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } } </script> <script type="module"> import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; const scene = new THREE.Scene(); scene.background = new THREE.Color(0x010518); const starGeometry = new THREE.BufferGeometry(); const starCount = 7000; const starPositions = new Float32Array(starCount * 3); for (let i = 0; i < starCount; i++) { starPositions[i*3] = (Math.random() - 0.5) * 3500; starPositions[i*3+1] = (Math.random() - 0.5) * 1800; starPositions[i*3+2] = (Math.random() - 0.5) * 1500 - 600; } starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3)); const stars1 = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.8 })); scene.add(stars1); const starGeometry2 = new THREE.BufferGeometry(); const starCount2 = 4500; const starPositions2 = new Float32Array(starCount2 * 3); for (let i = 0; i < starCount2; i++) { starPositions2[i*3] = (Math.random() - 0.5) * 2500; starPositions2[i*3+1] = (Math.random() - 0.5) * 1300; starPositions2[i*3+2] = (Math.random() - 0.5) * 1000 - 400; } starGeometry2.setAttribute('position', new THREE.BufferAttribute(starPositions2, 3)); const stars2 = new THREE.Points(starGeometry2, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12, transparent: true, opacity: 0.6 })); scene.add(stars2); const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 1, 6); const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio); document.body.appendChild(renderer.domElement); const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.05; controls.rotateSpeed = 1.0; controls.enableZoom = true; controls.zoomSpeed = 0.8; controls.enablePan = false; const textureLoader = new THREE.TextureLoader(); const earthMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'); const earthSpecularMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'); const earthNormalMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'); const cloudMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'); const moonCanvas = document.createElement('canvas'); moonCanvas.width = 1024; moonCanvas.height = 1024; const moonCtx = moonCanvas.getContext('2d'); moonCtx.fillStyle = '#c8c8c8'; moonCtx.fillRect(0, 0, moonCanvas.width, moonCanvas.height); for (let i = 0; i < 600; i++) { const x = Math.random() * moonCanvas.width; const y = Math.random() * moonCanvas.height; const radius = 10 + Math.random() * 45; const grad = moonCtx.createRadialGradient(x, y, 0, x, y, radius); grad.addColorStop(0, '#888888'); grad.addColorStop(1, '#b0b0b0'); moonCtx.fillStyle = grad; moonCtx.beginPath(); moonCtx.arc(x, y, radius, 0, Math.PI * 2); moonCtx.fill(); } for (let i = 0; i < 2000; i++) { const x = Math.random() * moonCanvas.width; const y = Math.random() * moonCanvas.height; const radius = 2 + Math.random() * 8; moonCtx.fillStyle = `rgba(100, 100, 100, ${0.4 + Math.random() * 0.5})`; moonCtx.beginPath(); moonCtx.arc(x, y, radius, 0, Math.PI * 2); moonCtx.fill(); } const moonMap = new THREE.CanvasTexture(moonCanvas); const earthGeometry = new THREE.SphereGeometry(1, 128, 128); const earthMaterial = new THREE.MeshPhongMaterial({ map: earthMap, specularMap: earthSpecularMap, specular: new THREE.Color('grey'), shininess: 5, normalMap: earthNormalMap }); const earth = new THREE.Mesh(earthGeometry, earthMaterial); scene.add(earth); const cloudGeometry = new THREE.SphereGeometry(1.008, 128, 128); const cloudMaterial = new THREE.MeshPhongMaterial({ map: cloudMap, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending }); const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial); scene.add(clouds); const moonGeometry = new THREE.SphereGeometry(0.27, 128, 128); const moonMaterial = new THREE.MeshPhongMaterial({ map: moonMap, color: 0xcccccc, shininess: 4 }); const moon = new THREE.Mesh(moonGeometry, moonMaterial); scene.add(moon); const marsGeometry = new THREE.SphereGeometry(0.65, 128, 128); const marsMaterial = new THREE.MeshPhongMaterial({ color: 0xc0713b, emissive: 0x331100, emissiveIntensity: 0.15, shininess: 6 }); const mars = new THREE.Mesh(marsGeometry, marsMaterial); scene.add(mars); mars.position.set(4.5, -0.5, 2.2); const marsGlowGeometry = new THREE.SphereGeometry(0.72, 64, 64); const marsGlowMaterial = new THREE.MeshBasicMaterial({ color: 0xc0713b, transparent: true, opacity: 0.1, side: THREE.BackSide }); const marsAtmosphere = new THREE.Mesh(marsGlowGeometry, marsGlowMaterial); scene.add(marsAtmosphere); marsAtmosphere.position.copy(mars.position); const sunLight = new THREE.DirectionalLight(0xffffff, 1.2); sunLight.position.set(5, 3, 5); scene.add(sunLight); const backLight = new THREE.DirectionalLight(0x88aaff, 0.25); backLight.position.set(-2, -1, -3); scene.add(backLight); const ambientLight = new THREE.AmbientLight(0x333333, 0.45); scene.add(ambientLight); const marsLight = new THREE.PointLight(0xc0713b, 0.35); marsLight.position.set(4.8, 0, 2.5); scene.add(marsLight); const glowGeometry = new THREE.SphereGeometry(1.03, 64, 64); const glowMaterial = new THREE.MeshBasicMaterial({ color: 0x2a6f8f, transparent: true, opacity: 0.07, side: THREE.BackSide }); const atmosphere = new THREE.Mesh(glowGeometry, glowMaterial); scene.add(atmosphere); let currentTarget = 'earth'; const targetText = document.getElementById('currentTarget'); const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2(); function setTarget(target) { if (target === 'earth') { controls.target.set(0, 0, 0); currentTarget = 'earth'; targetText.innerHTML = 'الأرض'; targetText.style.color = '#88aaff'; } else if (target === 'mars') { controls.target.copy(mars.position); currentTarget = 'mars'; targetText.innerHTML = 'المريخ'; targetText.style.color = '#ffaa66'; } } function onTouchOrClick(event) { event.preventDefault(); const rect = renderer.domElement.getBoundingClientRect(); let clientX, clientY; if (event.touches) { clientX = event.touches[0].clientX; clientY = event.touches[0].clientY; } else { clientX = event.clientX; clientY = event.clientY; } mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1; mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1; raycaster.setFromCamera(mouse, camera); const marsIntersects = raycaster.intersectObject(mars); if (marsIntersects.length > 0) { setTarget('mars'); mars.material.emissiveIntensity = 0.4; setTimeout(() => { mars.material.emissiveIntensity = 0.15; }, 200); return; } const earthIntersects = raycaster.intersectObject(earth); if (earthIntersects.length > 0) { setTarget('earth'); earth.material.emissiveIntensity = 0.2; setTimeout(() => { earth.material.emissiveIntensity = 0; }, 200); return; } } renderer.domElement.addEventListener('click', onTouchOrClick); renderer.domElement.addEventListener('touchstart', onTouchOrClick); let moonAngle = 0; const moonOrbitRadius = 2.2; const moonSpeed = 0.003; function animate() { requestAnimationFrame(animate); moonAngle += moonSpeed; const moonX = Math.cos(moonAngle) * moonOrbitRadius; const moonZ = Math.sin(moonAngle) * moonOrbitRadius; moon.position.set(moonX, 0, moonZ); clouds.rotation.y += 0.0006; mars.rotation.y += 0.0008; marsAtmosphere.rotation.y += 0.0008; marsAtmosphere.position.copy(mars.position); marsLight.position.set(mars.position.x + 0.4, mars.position.y + 0.2, mars.position.z + 0.4); if (currentTarget === 'mars') { controls.target.copy(mars.position); } else { controls.target.set(0, 0, 0); } controls.update(); renderer.render(scene, camera); } animate(); window.addEventListener('resize', onWindowResize, false); function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } console.log('🚀 جاهز - اضغط على المريخ ليصير مركز الدوران، اضغط على الأرض للرجوع'); </script> </body> </html>
