s="app-card"> <img src="https://yourdomain.com/icons/ksign.png" alt="KSign" class="app-icon"> <div class="app-info"> <p class="app-title">ksign 👉 Armaco</p> <p class="app-subtitle">Service Company</p> </div> </a> <!-- زر تطبيق سكارليت --> <a href="itms-services://?action=download-manifest&url=https://yourdomain.com/plists/scarlet.plist" class="app-card"> <img src="https://yourdomain.com/icons/scarlet.png" alt="Scarlet" class="app-icon"> <div class="app-info"> <p class="app-title">سكارليت</p> <p class="app-subtitle">تثبيت مباشر وتوقيع ذكي</p> </div> </a> <!-- زر تطبيق GBox --> <a href="itms-services://?action=download-manifest&url=https://yourdomain.com/plists/gbox.plist" class="app-card"> <img src="https://yourdomain.com/icons/gbox.png" alt="GBox" class="app-icon"> <div class="app-info"> <p class="app-title">GBox</p> <p class="app-subtitle">متجر توقيع التطبيقات</p> </div> </a> </div> </body> </html>
