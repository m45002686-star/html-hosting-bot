er" type="button" id="navbarToggler" data-bs-toggle="collapse" data-bs-target="#navLinks"> <span class="navbar-toggler-icon"></span> </button> <div class="collapse navbar-collapse" id="navLinks"> <ul class="navbar-nav me-auto"> <li class="nav-item"><a class="nav-link" href="#" onclick="switchView('public')">الرئيسية</a></li> </ul> </div> </div> </nav> <!-- العرض العام --> <div id="publicView" class="container mt-4"> <ul class="nav nav-pills mb-4 justify-content-center" id="publicTabs"> <li class="nav-item"><button class="nav-link active tab-btn" onclick="switchPublicTab('properties')">🏠 العقارات المتاحة</button></li> <li class="nav-item"><button class="nav-link tab-btn" onclick="switchPublicTab('requests')">📋 طلبات الزبائن</button></li> </ul> <div id="publicPropertiesTab"> <div id="propertiesGrid" class="row g-4"></div> <div id="emptyProperties" class="text-center mt-5 d-none" style="color: #c9d1d9;">لا توجد عقارات حالياً.</div> </div> <div id="publicRequestsTab" class="d-none"> <div id="requestsGrid" class="row g-4"></div> <div id="emptyRequests" class="text-center mt-5 d-none" style="color: #c9d1d9;">لا توجد طلبات حالياً.</div> </div> </div> <!-- شاشة تسجيل الدخول --> <div id="loginView" class="container d-none"> <div class="col-md-5 mx-auto mt-5"> <div class="admin-panel-card"> <h4 class="text-center mb-4">🔐 دخول المشرف</h4> <div class="mb-3"><input type="text" id="adminUser" class="form-control" placeholder="اسم المستخدم"></div> <div class="mb-3"><input type="password" id="adminPass" class="form-control" placeholder="كلمة المرور"></div> <button class="btn btn-primary w-100" onclick="adminLogin()">دخول</button> <p id="loginError" class="text-danger text-center mt-2 d-none">بيانات الدخول غير صحيحة</p> <button class="btn btn-link w-100 mt-2 text-light" onclick="switchView('public')">العودة للرئيسية</button> </div> </div> </div> <!-- لوحة الإدارة --> <div id="adminView" class="container d-none mt-3"> <div class="admin-panel-card"> <div class="d-flex justify-content- cess w-100" onclick="addRequest()">حفظ الطلب</button> </div> </div> <div class="col-lg-7"> <h5>📋 طلبات الزبائن المسجلة</h5> <div id="requestsList" class="list-group"></div> </div> </div> </div> </div> </div> <!-- نافذة الخريطة المنبثقة --> <div class="modal fade" id="mapModal" tabindex="-1"> <div class="modal-dialog modal-lg"> <div class="modal-content bg-dark text-light"> <div class="modal-header"><h5>📍 موقع العقار</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div> <div class="modal-body"><div id="modalMap" style="height:400px; border-radius:8px;"></div></div> </div> </div> </div> <!-- السكربتات --> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" /> <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script> <script> const STORAGE_PROPS = "alrahma_props_v14"; const STORAGE_REQS = "alrahma_requests_v12"; const ADMIN_CRED = { user: "admin", pass: "12345" }; function loadProps() { return JSON.parse(localStorage.getItem(STORAGE_PROPS) || "[]"); } function saveProps(d) { localStorage.setItem(STORAGE_PROPS, JSON.stringify(d)); } function loadRequests() { return JSON.parse(localStorage.getItem(STORAGE_REQS) || "[]"); } function saveRequests(d) { localStorage.setItem(STORAGE_REQS, JSON.stringify(d)); } function switchView(v) { document.getElementById("publicView").classList.add("d-none"); document.getElementById("loginView").classList.add("d-none"); document.getElementById("adminView").classList.add("d-none"); if (v === "public") { document.getElementById("publicView").classList.remove("d-none"); renderPublicProperties(); renderPublicRequests(); switchPublicTab('properties'); } else if (v === "login") document.getElementById("loginView").classList.remove("d-none"); else if (v === "admin") { document.getElementById("adminView").classList.remove("d-none"); initAdminMap(); renderAdminProperties(); renderAdminRequests(); switchAdminTab('properties'); } } function isAdmin() { return sessionStorage.getItem("alrahma_admin_v14") === "true"; } function adminLogin() { if (document.getElementById("adminUser").value.trim() === ADMIN_CRED.user && document.getElementById("adminPass").value.trim() === ADMIN_CRED.pass) { sessionStorage.setItem("alrahma_admin_v14", "true"); document.getElementById("loginError").classList.add("d-none"); switchView("admin"); } else document.getElementById("loginError").classList.remove("d-none"); } function logout() { sessionStorage.removeItem("alrahma_admin_v14"); switchView("public"); } let clickCount = 0, clickTimer; document.getElementById("navbarToggler").addEventListener("click", function(e) { clickCount++; if (clickCount >= 3) { clickCount = 0; if (!isAdmin()) switchView("login"); else switchView("admin"); clearTimeout(clickTimer); } else { clearTimeout(clickTimer); clickTimer = setTimeout(() => { clickCount = 0; }, 1000); } }); function switchAdminTab(tab) { document.querySelectorAll('#adminTabs .tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('adminPropertiesTab').classList.add('d-none'); document.getElementById('adminRequestsTab').classList.add('d-none'); if (tab === 'properties') { document.getElementById('adminPropertiesTab').classList.remove('d-none'); document.querySelector('#adminTabs button:first-child').classList.add('active'); } else { document.getElementById('adminRequestsTab').classList.remove('d-none'); document.querySelector('#adminTabs button:last-child').classList.add('active'); } } function switchPublicTab(tab) { document.querySelectorAll('#publicTabs .tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('publicPropertiesTab').classList.add('d-none'); document.getElementById('publicRequestsTab').classList.add('d-none'); if (tab === 'properties') { document.getElementById('publicPropertiesTab').classList.remove('d-none'); document.querySelector('#publicTabs button:first-child').classList.add('active'); } else { document.getElementById('publicRequestsTab').classList.remove('d-none'); document.querySelector('#publicTabs button:last-child').classList.add('active'); } } let map, marker; function initAdminMap() { if (map) { map.invalidateSize(); return; } map = L.map("map", { zoom: 17, center: [30.0444, 31.2357] }); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map); const geocoder = L.Control.geocoder({ defaultMarkGeocode: false }) .on('markgeocode', e => { map.setView(e.geocode.center, 18); marker.setLatLng(e.geocode.center); document.getElementById("propLat").value = e.geocode.center.lat; document.getElementById("propLng").value = e.geocode.center.lng; }).addTo(map); marker = L.marker([30.0444, 31.2357], { draggable: true }).addTo(map); marker.on("dragend", () => { const p = marker.getLatLng(); document.getElementById("propLat").value = p.lat; document.getElementById("propLng").value = p.lng; }); map.on("click", e => { marker.setLatLng(e.latlng); document.getElementById("propLat").value = e.latlng.lat; document.getElementById("propLng").value = e.latlng.lng; map.setView(e.latlng, 18); }); } function addProperty() { const address = document.getElementById("propAddress").value.trim(); if (!address) return alert("العنوان مطلوب"); const fields = { type: document.getElementById("propType").value, address, houseNum: document.getElementById("propHouseNum").value.trim(), floor: document.getElementById("propFloor").value.trim(), area: document.getElementById("propArea").value, price: document.getElementById("propPrice").value, contract: document.getElementById("propContract").value, payment: document.getElementById("propPayment").value, rooms: document.getElementById("propRooms").value, bathrooms: document.getElementById("propBathrooms").value, finishing: document.getElementById("propFinishing").value, furnished: document.getElementById("propFurnished").value, videoLink: document.getElementById("propVideoLink").value.trim(), specs: document.getElementById("propSpecs").value.trim(), lat: document.getElementById("propLat").value, lng: document.getElementById("propLng").value }; const newProp = { id: Date.now(), ...fields, createdAt: new Date().toLocaleString("ar-EG") }; const props = loadProps(); props.unshift(newProp); saveProps(props); ["propAddress","propHouseNum","propFloor","propArea","propPrice","propRooms","propBathrooms","propVideoLink","propSpecs","propLat","propLng"] .forEach(id => document.getElementById(id).value = ""); if (marker) marker.setLatLng([30.0444, 31.2357]); map.setView([30.0444, 31.2357], 17); renderAdminProperties(); renderPublicProperties(); } function renderAdminProperties() { const list = document.getElementById("adminPropertyList"); const props = loadProps(); list.innerHTML = props.length ? "" : '<div class="text-muted">لا توجد عقارات</div>'; props.forEach(p => { const div = document.createElement("div"); div.className = "list-group-item d-flex justify-content-between align-items-start"; div.innerHTML = ` <div class="w-100"> <strong>${p.type}</strong> – ${p.address} (عقار ${p.houseNum || '?'}، دور ${p.floor || '?'}) <div class="small"> ${p.area || 0}م² | ${p.price ? Number(p.price).toLocaleString()+' ج' : ''} | ${p.contract || ''} | ${p.payment || ''} | غرف ${p.rooms || 0} | حمامات ${p.bathrooms || 0} | ${p.finishing || ''} | ${p.furnished === 'نعم' ? 'مفروش' : 'غير مفروش'} </div> ${p.videoLink ? `<a href="${p.videoLink}" target="_blank" class="btn btn-sm btn-outline-info mt-1"><i class="fab fa-facebook"></i> فيديو</a>` : ''} </div> <button class="btn btn-sm btn-outline-danger ms-2" onclick="deleteProp(${p.id})"><i class="fas fa-trash"></i></button> `; list.appendChild(div); }); } function deleteProp(id) { if (!confirm("حذف؟")) return; saveProps(loadProps().filter(p => p.id !== id)); renderAdminProperties(); renderPublicProperties(); } function renderPublicProperties() { const grid = document.getElementById("propertiesGrid"); const empty = document.getElementById("emptyProperties"); const props = loadProps(); grid.innerHTML = ""; if (props.length === 0) { empty.classList.remove("d-none"); return; } empty.classList.add("d-none"); props.forEach(p => { const col = document.createElement("div"); col.className = "col-md-6 col-lg-4"; const card = document.createElement("div"); card.className = "card property-card h-100"; card.innerHTML = ` <div class="card-body d-flex flex-column"> <div class="property-type-address">${p.type} – ${p.address}</div> ${p.specs ? `<p class="specs-text">${p.specs}</p>` : ''} <div class="detail-grid"> <span class="detail-badge-new"><i class="fas fa-home"></i> عقار ${p.houseNum || '?'}</span> <span class="detail-badge-new"><i class="fas fa-layer-group"></i> دور ${p.floor || '?'}</span> <span class="detail-badge-new"><i class="fas fa-vector-square"></i> ${p.area || 0}م²</span> <span class="detail-badge-new"><i class="fas fa-tag"></i> ${p.price ? Number(p.price).toLocaleString()+' ج' : '—'}</span> <span class="detail-badge-new"><span class="contract-badge-new">${p.contract || '—'}</span></span> </div> <div class="detail-grid"> <span class="detail-badge-new"><i class="fas fa-bed"></i> ${p.rooms || 0} غرف</span> <span class="detail-badge-new"><i class="fas fa-bath"></i> ${p.bathrooms || 0} حمام</span> <span class="detail-badge-new"><i class="fas fa-paint-roller"></i> ${p.finishing || '—'}</span> <span class="detail-badge-new"><i class="fas fa-couch"></i> ${p.furnished === 'نعم' ? 'مفروش' : 'غير مفروش'}</span> <span class="detail-badge-new"><i class="fas fa-money-bill-wave"></i> ${p.payment || '—'}</span> </div> <div class="mt-auto pt-3 d-flex gap-2 flex-wrap"> ${p.videoLink ? `<a href="${p.videoLink}" target="_blank" class="btn btn-sm btn-outline-info"><i class="fab fa-facebook"></i> مشاهدة الفيديو</a>` : ''} ${p.lat && p.lng ? `<button class="btn btn-sm btn-outline-primary" onclick="openMapModal(${p.lat},${p.lng})"><i class="fas fa-map-marker-alt"></i> الموقع</button>` : ''} </div> </div>`; grid.appendChild(col); col.appendChild(card); }); } function addRequest() { const name = document.getElementById("reqName").value.trim(); const phone = document.getElementById("reqPhone").value.trim(); if (!name || !phone) return alert("الاسم والهاتف مطلوبان"); const newReq = { id: Date.now(), name, phone, type: document.getElementById("reqType").value, areaMin: document.getElementById("reqAreaMin").value, areaMax: document.getElementById("reqAreaMax").value, roomsMin: document.getElementById("reqRoomsMin").value, roomsMax: document.getElementById("reqRoomsMax").value, bathrooms: document.getElementById("reqBathrooms").value, finishing: document.getElementById("reqFinishing").value, furnished: document.getElementById("reqFurnished").value, budget: document.getElementById("reqBudget").value, areas: document.getElementById("reqAreas").value.trim(), details: document.getElementById("reqDetails").value.trim(), createdAt: new Date().toLocaleString("ar-EG") }; const reqs = loadRequests(); reqs.unshift(newReq); saveRequests(reqs); document.querySelectorAll("#reqName, #reqPhone, #reqAreaMin, #reqAreaMax, #reqRoomsMin, #reqRoomsMax, #reqBathrooms, #reqBudget, #reqAreas, #reqDetails") .forEach(el => el.value = ""); renderAdminRequests(); renderPublicRequests(); } function renderAdminRequests() { const list = document.getElementById("requestsList"); const reqs = loadRequests(); list.innerHTML = reqs.length ? "" : '<div class="text-muted">لا توجد طلبات</div>'; reqs.forEach(r => { const div = document.createElement("div"); div.className = "list-group-item d-flex justify-content-between align-items-start"; div.innerHTML = ` <div> <strong>${r.name}</strong> (${r.phone}) – يبحث عن ${r.type} <div class="small">المساحة ${r.areaMin || '?'}-${r.areaMax || '?'}م² | الأوض ${r.roomsMin || '?'}-${r.roomsMax || '?'} | حمامات ${r.bathrooms || '?'}</div> <div class="small">الميزانية: ${r.budget ? Number(r.budget).toLocaleString() + ' ج' : 'غير محدد'} | المناطق: ${r.areas || 'غير محدد'}</div> </div> <button class="btn btn-sm btn-outline-danger" onclick="deleteRequest(${r.id})"><i class="fas fa-trash"></i></button> `; list.appendChild(div); }); } function deleteRequest(id) { if (!confirm("حذف؟")) return; saveRequests(loadRequests().filter(r => r.id !== id)); renderAdminRequests(); renderPublicRequests(); } function renderPublicRequests() { const grid = document.getElementById("requestsGrid"); const empty = document.getElementById("emptyRequests"); const reqs = loadRequests(); grid.innerHTML = ""; if (reqs.length === 0) { empty.classList.remove("d-none"); return; } empty.classList.add("d-none"); reqs.forEach(r => { const col = document.createElement("div"); col.className = "col-md-6 col-lg-4"; col.innerHTML = ` <div class="card request-card h-100"> <div class="card-body"> <h5 class="card-title" style="color: #ffffff;">${r.type} مطلوب</h5> <div class="detail-grid"> <span class="detail-badge-new"><i class="fas fa-vector-square"></i> ${r.areaMin || '?'} – ${r.areaMax || '?'} م²</span> <span class="detail-badge-new"><i class="fas fa-bed"></i> ${r.roomsMin || '?'} – ${r.roomsMax || '?'} غرف</span> ${r.bathrooms ? `<span class="detail-badge-new"><i class="fas fa-bath"></i> ${r.bathrooms} حمام</span>` : ''} </div> <div class="detail-grid"> <span class="detail-badge-new"><i class="fas fa-paint-roller"></i> ${r.finishing !== 'لا يهم' ? r.finishing : 'التشطيب لا يهم'}</span> <span class="detail-badge-new"><i class="fas fa-couch"></i> ${r.furnished !== 'لا يهم' ? r.furnished : 'المفروش لا يهم'}</span> ${r.budget ? `<span class="detail-badge-new"><i class="fas fa-tag"></i> ${Number(r.budget).toLocaleString()} ج</span>` : ''} </div> ${r.areas ? `<p class="mt-2" style="color: #e6edf3;"><strong>المناطق:</strong> ${r.areas}</p>` : ''} ${r.details ? `<p class="card-text" style="color: #e6edf3;">${r.details}</p>` : ''} <div class="mt-3 d-flex justify-content-between align-items-center"> <span style="color: #e6edf3;"><strong>${r.name}</strong></span> <a href="tel:${r.phone}" class="btn btn-sm call-btn"><i class="fas fa-phone-alt"></i> ${r.phone}</a> </div> </div> </div>`; grid.appendChild(col); }); } function openMapModal(lat, lng) { const modalEl = document.getElementById("mapModal"); const modal = new bootstrap.Modal(modalEl); modal.show(); modalEl.addEventListener("shown.bs.modal", () => { const m = L.map("modalMap").setView([lat, lng], 18); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(m); L.marker([lat, lng]).addTo(m); setTimeout(() => m.invalidateSize(), 100); }, { once: true }); modalEl.addEventListener("hidden.bs.modal", () => document.getElementById("modalMap").innerHTML = ""); } window.addEventListener("load", () => { if (isAdmin()) switchView("admin"); else switchView("public"); }); new MutationObserver(() => { if (map && !document.getElementById("adminView").classList.contains("d-none")) { setTimeout(() => map.invalidateSize(), 150); } }).observe(document.getElementById("adminView"), { attributes: true, attributeFilter: ["class"] }); </script> </body> </html>
