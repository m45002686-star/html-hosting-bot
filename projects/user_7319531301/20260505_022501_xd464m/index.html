<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم - بوت الاستضافة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;padding:20px}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:40px;width:100%;max-width:460px;text-align:center}
.logo{width:80px;height:80px;border-radius:50%;margin:0 auto 20px;background:linear-gradient(135deg,#6c63ff,#4e45d1);display:flex;align-items:center;justify-content:center;font-size:2em}
h1{margin-bottom:6px;font-size:1.7em;font-weight:700}
.sub{color:rgba(255,255,255,0.5);margin-bottom:28px;font-size:.88em}
label{display:block;text-align:right;font-size:.82em;color:rgba(255,255,255,.5);margin-bottom:5px}
input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;font-size:.95em;margin-bottom:14px;outline:none;transition:border .2s}
input:focus{border-color:#6c63ff}
input::placeholder{color:rgba(255,255,255,.3)}
input.mono{font-family:monospace;letter-spacing:.5px}
button{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg,#6c63ff,#4e45d1);color:#fff;font-size:1em;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:4px}
button:hover{opacity:.88}button:active{transform:scale(.98)}
.err{color:#ff6b6b;margin-top:12px;font-size:.86em;background:rgba(255,107,107,.1);padding:10px;border-radius:8px;display:none}
.help{color:rgba(255,255,255,.38);font-size:.78em;margin-top:18px;line-height:1.6}
.divider{border:none;border-top:1px solid rgba(255,255,255,.1);margin:20px 0}
.setup-toggle{color:#6c63ff;font-size:.82em;cursor:pointer;margin-bottom:14px;display:block}
.setup-toggle:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌐</div>
  <h1>لوحة التحكم</h1>
  <p class="sub">بوت استضافة المواقع</p>

  <span class="setup-toggle" id="setupToggle" onclick="toggleSetup()">⚙️ تغيير رابط البوت</span>
  <div id="setupBox" style="display:none">
    <label>🔗 رابط البوت (Replit URL)</label>
    <input id="botUrl" type="url" placeholder="https://mybotname.replit.app" autocomplete="off">
    <button onclick="saveUrl()" style="background:rgba(108,99,255,.4);margin-bottom:14px">💾 حفظ الرابط</button>
    <hr class="divider">
  </div>

  <label>🔑 أكسس توكن حسابك</label>
  <input id="tokenInput" class="mono" type="text" placeholder="الصق توكنك هنا..." autocomplete="off" spellcheck="false">
  <button onclick="doLogin()">🚀 دخول</button>
  <div class="err" id="errMsg">❌ خطأ في التوكن أو رابط البوت</div>

  <p class="help">احصل على توكنك من البوت → قسم الويب → 🔑 الاكسس توكن<br>
  رابط البوت الافتراضي: <span id="currentUrl" style="color:#a5b4fc"></span></p>
</div>

<script>
function getBotUrl(){
  return (localStorage.getItem('bot_url') || '').replace(/\/$/,'');
}
function setBotUrl(u){
  localStorage.setItem('bot_url', u.replace(/\/$/,''));
}

function updateUrlDisplay(){
  const u = getBotUrl();
  document.getElementById('currentUrl').textContent = u || 'غير محدد';
  document.getElementById('botUrl').value = u;
}

function toggleSetup(){
  const box = document.getElementById('setupBox');
  box.style.display = box.style.display==='none' ? 'block' : 'none';
}

function saveUrl(){
  const u = document.getElementById('botUrl').value.trim();
  if(!u){ alert('أدخل الرابط'); return; }
  setBotUrl(u);
  updateUrlDisplay();
  document.getElementById('setupBox').style.display = 'none';
  showErr('✅ تم حفظ رابط البوت', '#4ade80');
}

async function doLogin(){
  const token = document.getElementById('tokenInput').value.trim();
  const botUrl = getBotUrl();
  if(!token){ showErr('أدخل التوكن أولاً'); return; }
  if(!botUrl){ showErr('⚙️ حدد رابط البوت أولاً'); toggleSetup(); return; }

  const btn = document.querySelector('button[onclick="doLogin()"]');
  btn.textContent = '⏳ جاري التحقق...'; btn.disabled = true;
  try {
    const r = await fetch(`${botUrl}/web/api/me?token=${encodeURIComponent(token)}`, {signal: AbortSignal.timeout(8000)});
    if(r.ok){
      localStorage.setItem('access_token', token);
      window.location.href = 'dashboard.html';
    } else {
      showErr('❌ التوكن غير صحيح');
    }
  } catch(e){
    showErr('❌ تعذر الاتصال. تأكد من رابط البوت وأن البوت يعمل');
  }
  btn.textContent = '🚀 دخول'; btn.disabled = false;
}

function showErr(msg, color){
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.color = color || '#ff6b6b';
  el.style.background = color ? 'rgba(74,222,128,.08)' : 'rgba(255,107,107,.1)';
  el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 3500);
}

document.getElementById('tokenInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
updateUrlDisplay();
if(localStorage.getItem('access_token') && getBotUrl()) window.location.href='dashboard.html';
</script>
</body>
</html>
