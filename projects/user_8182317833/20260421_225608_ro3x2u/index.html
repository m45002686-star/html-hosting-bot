<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>ALI AI - Mobile Pro</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> <style> /* --- كود الخلفية واللوجو --- */ body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: Arial, sans-serif; } canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; } .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; border: 5px solid #0000FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: rgba(0, 0, 0, 0.7); box-shadow: 0 0 20px rgba(0, 0, 255, 0.5); z-index: 2; } .overlay h1 { color: #0000FF; font-size: 2rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 0, 255, 0.8); } /* --- تصميم الجوال --- */ .chat-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.3); } .chat-header { padding: 12px 15px; background: rgba(0, 0, 0, 0.85); border-bottom: 2px solid #0000FF; display: flex; align-items: center; justify-content: space-between; } .logo-box { display: flex; align-items: center; gap: 10px; } .logo-box span { color: #00f0ff; font-weight: bold; font-size: 1.3rem; } .contact-buttons { display: flex; gap: 10px; } .contact-btn { text-decoration: none; color: white; font-size: 1.2rem; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.3s; } .btn-whatsapp { background: #25D366; box-shadow: 0 0 10px #25D366; } .btn-telegram { background: #0088cc; box-shadow: 0 0 10px #0088cc; } .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; } .msg { max-width: 85%; margin-bottom: 15px; padding: 12px 18px; border-radius: 20px; font-size: 1rem; line-height: 1.4; } .user-msg { align-self: flex-start; background: rgba(0, 0, 255, 0.5); color: white; border: 1px solid #0000FF; border-bottom-right-radius: 5px; } .bot-msg { align-self: flex-end; background: rgba(20, 20, 20, 0.8); color: #00f0ff; border: 1px solid rgba(0, 255, 255, 0.3); border-bottom-left-radius: 5px; } .input-bar { padding: 12px; background: rgba(0, 0, 0, 0.9); display: flex; gap: 10px; border-top: 1px solid #0000FF; } .input-bar input { flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #0000FF; background: #050505; color: white; outline: none; } .send-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #0000FF; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px #0000FF; } @media screen and (max-height: 500px) { .overlay { display: none; } } </style> </head> <body> <canvas id="matrix"></canvas> <div class="overlay"> <h1>ALI AI</h1> </div> <div class="chat-wrapper"> <div class="chat-header"> <div class="logo-box"> <i class="fas fa-microchip" style="color: #0000FF;"></i> <span>ALI AI</span> </div> <div class="contact-buttons"> <a href="https://wa.me/+201221743490" target="_blank" class="contact-btn btn-whatsapp"> <i class="fab fa-whatsapp"></i> </a> <a href="https://t.me/al0osh505" target="_blank" class="contact-btn btn-telegram"> <i class="fab fa-telegram-plane"></i> </a> </div> </div> <div id="chatBox" class="chat-container"> <div class="msg bot-msg">مرحباً بك، أنا ALI AI. كيف أخدمك اليوم؟</div> </div> <form id="chatForm" class="input-bar"> <input id="userInput" type="text" placeholder="أرسل رسالة..." autocomplete="off"> <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i></button> </form> </div> <script> /* --- كود الماتريكس --- */ const canvas = document.getElementById('matrix'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; const chars = "$#@&٪+-£÷×=^<>"; const charArray = chars.split(''); const fontSize = 16; const columns = canvas.width / fontSize; const drops = []; for (let x = 0; x < columns; x++) { drops[x] = 1; } function draw() { ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#0F0"; ctx.font = fontSize + "px arial"; for (let i = 0; i < drops.length; i++) { const text = charArray[Math.floor(Math.random() * charArray.length)]; ctx.fillText(text, i * fontSize, drops[i] * fontSize); if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; } drops[i]++; } } setInterval(draw, 33); /* --- كود الدردشة المحدث --- */ const form = document.getElementById('chatForm'); const chatBox = document.getElementById('chatBox'); const input = document.getElementById('userInput'); form.addEventListener('submit', async (e) => { e.preventDefault(); const text = input.value.trim(); if(!text) return; appendMsg(text, 'user-msg'); input.value = ''; // الكلمات المفتاحية const makerTriggers = ["صنعك", "من صنعك", "صاحبك", "creator", "who made you"]; const devTriggers = ["مطورك", "من طورك", "من مطورك", "مبرمجك", "developer", "who developed you"]; const nameTriggers = ["اسمك", "مين انت", "من انت", "who are you", "your name"]; // 1. الرد الخاص بالصناعة if (makerTriggers.some(t => text.toLowerCase().includes(t))) { setTimeout(() => { appendMsg("تم صنعي بواسطه سيدي و معلمي ALI GOMAA (ALOOSH)", 'bot-msg'); }, 500); return; } // 2. الرد الخاص بالتطوير if (devTriggers.some(t => text.toLowerCase().includes(t))) { setTimeout(() => { appendMsg("تم تطويري بواسطه سيدي و معلمي ALI GOMAA (ALOOSH)", 'bot-msg'); }, 500); return; } // 3. الرد الخاص بالاسم if (nameTriggers.some(t => text.toLowerCase().includes(t))) { setTimeout(() => { appendMsg("أنا اسمي ALI AI (أو ALOOSH AI)، مساعدك الذكي المطور والجاهز لخدمتك دائماً.", 'bot-msg'); }, 500); return; } // طلب الذكاء الاصطناعي من السيرفر try { const res = await fetch("https://backend.buildpicoapps.com/aero/run/llm-api?pk=v1-Z0FBQUFBQm5IZkJDMlNyYUVUTjIyZVN3UWFNX3BFTU85SWpCM2NUMUk3T2dxejhLSzBhNWNMMXNzZlp3c09BSTR6YW1Sc1BmdGNTVk1GY0liT1RoWDZZX1lNZlZ0Z1dqd3c9PQ==", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: text }) }); const data = await res.json(); if(data.status === "success") appendMsg(data.text, 'bot-msg'); } catch (err) { appendMsg("عذراً، واجهت مشكلة في الاتصال.", 'bot-msg'); } }); function appendMsg(text, type) { const div = document.createElement('div'); div.className = `msg ${type}`; div.innerText = text; chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight; } window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }); </script> </body> </html>
