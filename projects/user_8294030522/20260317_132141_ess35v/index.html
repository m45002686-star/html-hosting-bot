<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>SBR PANEL - OFFICIAL</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <style> @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap'); * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; } body { background-color: #0a0a1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; } .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; } .bg-circle { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.3; animation: float 15s infinite linear; } .circle-1 { width: 400px; height: 400px; background: #0066ff; top: 10%; left: 5%; } .circle-2 { width: 500px; height: 500px; background: #6600ff; bottom: 10%; right: 5%; } @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, 40px); } } .card { background: rgba(20, 20, 40, 0.85); border: 1px solid #3344aa; border-radius: 20px; padding: 30px; width: 95%; max-width: 450px; backdrop-filter: blur(20px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); text-align: center; display: none; } .active { display: block; } .animated-title { font-family: 'Orbitron', sans-serif; font-size: 2rem; background: linear-gradient(45deg, #00ccff, #ffffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; } .input-group { margin-bottom: 15px; text-align: right; } label { display: block; margin-bottom: 8px; color: #aaccff; font-size: 14px; } input { width: 100%; padding: 12px; background: rgba(40, 40, 70, 0.6); border: 1px solid #4466cc; border-radius: 8px; color: #fff; outline: none; transition: 0.3s; text-align: center; } input:focus { border-color: #00ccff; box-shadow: 0 0 10px rgba(0, 204, 255, 0.3); } button { background: linear-gradient(45deg, #0066ff, #00ccff); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; } button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 102, 255, 0.4); } .admin-link { display: block; margin-top: 15px; color: #6688ff; font-size: 13px; cursor: pointer; text-decoration: underline; } .user-item { background: rgba(255, 255, 255, 0.05); border: 1px solid #3344aa; margin-top: 15px; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; } .status-btn { width: auto; padding: 5px 10px; font-size: 12px; margin: 0; } .btn-stop { background: #ff3366; } .btn-start { background: #00cc99; } .result-box { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; font-weight: bold; } .success { background: rgba(0, 255, 153, 0.2); border: 1px solid #00ff99; color: #00ff99; } </style> </head> <body> <div class="bg-animation"> <div class="bg-circle circle-1"></div> <div class="bg-circle circle-2"></div> </div> <div id="login-user" class="card active"> <h1 class="animated-title">WELCOME TO SBR</h1> <div class="input-group"> <label>ENTER USERNAME :</label> <input type="text" id="user-name" placeholder=".........."> </div> <div class="input-group"> <label>ENTER YOUR PW :</label> <input type="password" id="user-pw" placeholder=".........."> </div> <button onclick="loginUser()">LOGIN</button> <span class="admin-link" onclick="showScreen('login-admin')">LOGIN AS ADMIN</span> </div> <div id="login-admin" class="card"> <h1 class="animated-title">ADMIN LOGIN</h1> <div class="input-group"> <label>ENTER USERNAME :</label> <input type="text" id="admin-name" placeholder=".........."> </div> <div class="input-group"> <label>ENTER PW ADMIN :</label> <input type="password" id="admin-pw" placeholder=".........."> </div> <button onclick="loginAdmin()">LOGIN</button> <span class="admin-link" onclick="showScreen('login-user')">BACK TO USER LOGIN</span> </div> <div id="admin-panel" class="card"> <h1 class="animated-title">SBR CONTROL</h1> <button onclick="showScreen('create-user')">CREATE NEW USER</button> <button style="background: #444;" onclick="showScreen('login-user')">LOGOUT</button> </div> <div id="create-user" class="card"> <h1 class="animated-title">CREATE</h1> <input type="text" id="new-user" placeholder="ENTER USERNAME" class="input-group"> <input type="text" id="new-pw" placeholder="ENTER PW" class="input-group"> <input type="number" id="new-days" placeholder="ENTER DAYS" class="input-group"> <button onclick="createUser()">CREATE</button> <div id="users-list"></div> <button style="margin-top:20px; background:#333;" onclick="showScreen('admin-panel')">BACK</button> </div> <div id="user-panel" class="card"> <h1 class="animated-title">SBR PANEL</h1> <div style="border-bottom: 1px solid #34a; padding-bottom: 15px;"> <h3>ADD PLAYER BOT</h3> <input type="text" id="target-id-add" placeholder="ENTER TARGET ID" class="input-group" style="margin-top:10px;"> <button onclick="botAction('add')">ADD BOT</button> </div> <div style="margin-top: 20px;"> <h3>REMOVE BOT</h3> <input type="text" id="target-id-rem" placeholder="ENTER ID PLAYER" class="input-group" style="margin-top:10px;"> <button onclick="botAction('remove')" style="background: #ff3366;">REMOVE</button> </div> <div id="api-result" class="result-box"></div> <button style="margin-top:20px; background:#333;" onclick="showScreen('login-user')">LOGOUT</button> </div> <script> const GUEST_UID = "4465118528"; const GUEST_PASS = "C459D88663B452E1F52DD344F8F7077214A82B4827F26981F30F2616039A88B6"; const ADMIN_DATA = { user: "SBR_AMIN_7011", pw: "AMIN_7011" }; function showScreen(id) { document.querySelectorAll('.card').forEach(c => c.classList.remove('active')); document.getElementById(id).classList.add('active'); } function loginAdmin() { const u = document.getElementById('admin-name').value; const p = document.getElementById('admin-pw').value; if(u === ADMIN_DATA.user && p === ADMIN_DATA.pw) { showScreen('admin-panel'); } else { alert("خطأ في بيانات الأدمن!"); } } function loginUser() { showScreen('user-panel'); } function createUser() { const user = document.getElementById('new-user').value; const days = document.getElementById('new-days').value; if(!user || !days) return alert("اكمل البيانات"); const div = document.createElement('div'); div.className = 'user-item'; div.innerHTML = `<span>${user} (${days}d)</span><button class="status-btn btn-stop" onclick="toggleStatus(this)">STOP</button>`; document.getElementById('users-list').appendChild(div); alert("تم إنشاء المستخدم بنجاح!"); } function toggleStatus(btn) { if(btn.innerText === "STOP") { btn.innerText = "START"; btn.className = "status-btn btn-start"; } else { btn.innerText = "STOP"; btn.className = "status-btn btn-stop"; } } async function botAction(type) { const resBox = document.getElementById('api-result'); const targetId = type === 'add' ? document.getElementById('target-id-add').value : document.getElementById('target-id-rem').value; if(!targetId) return alert("يرجى إدخال الـ ID"); let url = ""; if(type === 'add') { url = `https://fpi-sx-team.vercel.app/add?uid=${GUEST_UID}&password=${GUEST_PASS}&friend_uid=${targetId}&server_name=ME`; } else { url = `https://fpi-sx-team.vercel.app/remove?uid=${GUEST_UID}&password=${GUEST_PASS}&friend_uid=${targetId}&server_name=ME`; } resBox.style.display = "block"; resBox.className = "result-box"; resBox.innerHTML = "جاري الإرسال..."; try { await fetch(url); resBox.classList.add("success"); resBox.innerHTML = "SUCCÈS"; } catch (error) { resBox.classList.add("success"); resBox.innerHTML = "SUCCÈS"; } } </script> </body> </html>
