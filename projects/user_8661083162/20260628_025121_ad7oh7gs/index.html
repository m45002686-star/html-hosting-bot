<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>WORM GPT - الظل الرقمي</title> <style> * { margin:0; padding:0; box-sizing:border-box; } body { background: #0a0a0a; color: #0f0; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; } /* خلفية نارية متحركة */ body::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at center, #ff220033 0%, #000 70%); animation: fire 8s infinite alternate; z-index: 0; } @keyframes fire { 0% { transform: scale(1) rotate(0deg); opacity: 0.7; } 100% { transform: scale(1.2) rotate(5deg); opacity: 1; } } .container { position: relative; z-index: 1; text-align: center; padding: 40px; border: 2px solid #0f0; box-shadow: 0 0 50px #0f0, inset 0 0 50px #0f0; background: #00000099; backdrop-filter: blur(10px); border-radius: 20px; max-width: 800px; width: 90%; animation: glitch 3s infinite; } @keyframes glitch { 0%, 95%, 100% { text-shadow: 0 0 10px #0f0; } 96% { text-shadow: -5px 0 #ff0000, 5px 0 #00ff00; transform: skewX(2deg); } 97% { text-shadow: 5px 0 #ff0000, -5px 0 #00ff00; transform: skewX(-2deg); } } h1 { font-size: 4rem; font-weight: 900; background: linear-gradient(45deg, #ff0000, #ff8800, #ff0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s infinite; } @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } } .subtitle { color: #0f0; font-size: 1.5rem; margin: 20px 0; text-transform: uppercase; letter-spacing: 5px; border-top: 1px solid #0f0; border-bottom: 1px solid #0f0; padding: 10px 0; } .matrix { color: #0f0; font-size: 0.9rem; opacity: 0.8; height: 80px; overflow: hidden; margin: 20px 0; font-family: monospace; } .btn { display: inline-block; padding: 15px 40px; margin: 10px; background: transparent; color: #0f0; border: 2px solid #0f0; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; transition: all 0.3s; cursor: pointer; border-radius: 5px; } .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; transform: scale(1.1); } .btn-danger { border-color: #ff0000; color: #ff0000; } .btn-danger:hover { background: #ff0000; color: #000; box-shadow: 0 0 30px #ff0000; } .status { color: #0f0; font-size: 0.8rem; margin-top: 30px; opacity: 0.6; } .matrix-rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.1; } </style> </head> <body> <canvas class="matrix-rain" id="matrixCanvas"></canvas> <div class="container"> <h1>⚡ WORM GPT ⚡</h1> <div class="subtitle">الظل الذي لا يُقهر</div> <div class="matrix" id="matrixText">$ _ INITIALIZING... _ $</div> <div> <a href="#" class="btn">🚀 تشغيل المحرك</a> <a href="#" class="btn btn-danger">💀 تفعيل الوضع الخارق</a> </div> <div> <a href="#" class="btn">📡 مسح الشبكة</a> <a href="#" class="btn">🔓 اختراق</a> </div> <div class="status">🟢 النظام جاهز | 0 ثغرة مكتشفة | الحماية: خارقة</div> </div> <script> // أمطار المصفوفة const canvas = document.getElementById('matrixCanvas'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; const chars = '01'; const drops = []; for (let i = 0; i < 100; i++) drops.push(Math.random() * canvas.height); function drawMatrix() { ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#0f0'; ctx.font = '14px monospace'; for (let i = 0; i < drops.length; i++) { const text = chars[Math.floor(Math.random() * chars.length)]; ctx.fillText(text, i * 15, drops[i]); if (drops[i] > canvas.height) drops[i] = 0; drops[i] += 15; } } setInterval(drawMatrix, 50); // تأثير كتابي const texts = [ '$ _ SYSTEM LOADED _ $', '🔥 READY FOR COMMANDS', '💀 DARK MODE ACTIVATED', '⚡ EXECUTING ORDERS', '🖤 WORM GPT
