<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <title>مترجم الجو الحاكم</title> <style> body { background-color: #050505; color: #00f2ff; font-family: 'Courier New', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; } .container { background: #0a0a0a; padding: 25px; border: 2px solid #00f2ff; border-radius: 15px; width: 100%; max-width: 450px; text-align: center; } textarea { width: 100%; height: 100px; background: #000; border: 1px solid #00f2ff; color: #fff; padding: 10px; margin-bottom: 15px; } button { background: #00f2ff; color: #000; border: none; padding: 12px 30px; font-weight: bold; cursor: pointer; width: 100%; } #result { margin-top: 20px; padding: 15px; border: 1px dashed #00f2ff; color: #fff; min-height: 50px; } .footer { margin-top: 20px; color: #00f2ff; font-weight: bold; } </style> </head> <body> <div class="container"> <h1>مترجم الجو الحاكم</h1> <textarea id="textInput" placeholder="اكتب النص هنا..."></textarea> <!-- الزرار اللي أنت طالبه --> <button onclick="doTranslate()">ترجمة الآن ⚡</button> <div id="result">النتيجة ستظهر هنا...</div> </div> <div class="footer">للتواصل مع المطور: 01143317801</div> <script> function doTranslate() { let text = document.getElementById("textInput").value; if(!text) return alert("اكتب حاجة يا وحش"); // رابط مباشر بيفتح في نافذة جديدة عشان نتخطى مشاكل الحظر let url = "https://translate.google.com/?sl=auto&tl=en&text=" + encodeURIComponent(text); // الطريقة دي بتفتح صفحة الترجمة فيها النص جاهز ومترجم window.open(url, '_blank'); document.getElementById("result").innerText = "تم فتح صفحة الترجمة..."; } </script> </body> </html>
