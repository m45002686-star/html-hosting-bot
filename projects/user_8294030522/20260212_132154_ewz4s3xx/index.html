<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sbr  Hosting - site web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0000 0%, #00001a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .mega-container {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 4px solid;
            border-image: linear-gradient(to right, #ff4500, #00eeff) 1;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #ff4500, #00eeff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="number"] {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1.1rem;
            text-align: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            background: linear-gradient(45deg, #ff4500, #00eeff);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 20px;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); }

        #upload-section { display: none; }

        .drop-zone {
            width: 100%;
            height: 150px;
            border: 2px dashed #00eeff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            cursor: pointer;
            transition: 0.3s;
        }

        .drop-zone:hover { background: rgba(0, 238, 255, 0.1); }

        .loading-bar-container {
            width: 100%;
            background: #333;
            height: 10px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #ff4500, #00eeff);
            border-radius: 5px;
            transition: width 0.3s;
        }

        #link-result {
            margin-top: 20px;
            word-break: break-all;
            padding: 10px;
            background: rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="mega-container">
        <div id="setup-section">
            <h1>SBR HOST SITE WEB</h1>
            <label>اسم المشروع</label><br>
            <input type="text" id="proj-name" placeholder="مثلاً: My Awesome Site">
            
            <div style="margin-top: 20px;">
                <p>أثبت أنك إنسان: <span id="num1"></span> + <span id="num2"></span> = ؟</p>
                <input type="number" id="captcha-answer">
            </div>
            
            <button onclick="goToUpload()">دخول لمنصة الرفع</button>
        </div>

        <div id="upload-section">
            <h1>رفع ملف HTML</h1>
            <p>المشروع: <span id="display-name" style="color: #00eeff;"></span></p>
            
            <div class="drop-zone" onclick="document.getElementById('file-input').click()">
                اضغط هنا لاختيار ملف الـ HTML
                <input type="file" id="file-input" style="display:none" accept=".html" onchange="startRealUpload()">
            </div>

            <div id="status-msg">انتظار الملف...</div>
            <div class="loading-bar-container" id="bar-container">
                <div class="loading-bar" id="progress"></div>
            </div>
            <div id="link-result"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>

    <script>
        // --- إعدادات Firebase ---
        // يجب أن تضع بيانات مشروعك هنا من موقع Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-app",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcdef"
        };

        // تشغيل Firebase
        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();

        // نظام الكابتشا
        const n1 = Math.floor(Math.random() * 10) + 1;
        const n2 = Math.floor(Math.random() * 10) + 1;
        document.getElementById('num1').innerText = n1;
        document.getElementById('num2').innerText = n2;

        function goToUpload() {
            const name = document.getElementById('proj-name').value;
            const answer = document.getElementById('captcha-answer').value;

            if (name === "" || answer === "") {
                alert("اكمل البيانات أولاً"); return;
            }

            if (parseInt(answer) === (n1 + n2)) {
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('upload-section').style.display = 'block';
                document.getElementById('display-name').innerText = name;
            } else {
                alert("خطأ في العملية الحسابية!");
            }
        }

        // raf3 doussier
        function startRealUpload() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return;

            const status = document.getElementById('status-msg');
            const progress = document.getElementById('progress');
            const barContainer = document.getElementById('bar-container');
            const linkResult = document.getElementById('link-result');

            barContainer.style.display = 'block';
            status.innerText = " wait...";

            // إنشاء مسار فريد للملف
            const storageRef = storage.ref('sites/' + Date.now() + "_" + file.name);
            const uploadTask = storageRef.put(file);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const pct = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progress.style.width = pct + '%';
                }, 
                (error) => {
                    status.innerText = "فشل الرفع: " + error.message;
                }, 
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((url) => {
                        status.innerText = "تم الرفع بنجاح!";
                        linkResult.innerHTML = `
                            <p style="color: #adff2f;">موقعك الآن حي على الإنترنت:</p>
                            <a href="${url}" target="_blank" style="color:yellow; text-decoration: underline;">اضغط هنا لفتح الرابط</a>
                            <br><br>
                            <small style="color:#ccc">تفضل هاذا رابط موقعك.</small>
                        `;
                    });
                }
            );
        }
    </script>
</body>
</html>
