<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>مترجم الجو الحاكم - السريع</title> <style> body { background-color: #050505; color: #00f2ff; font-family: 'Courier New', Courier, monospace; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; } .container { background: #0a0a0a; padding: 25px; border: 2px solid #00f2ff; border-radius: 15px; box-shadow: 0 0 15px #00f2ff; width: 100%; max-width: 450px; text-align: center; } h1 { color: #fff; font-size: 1.4rem; margin-bottom: 20px; text-shadow: 0 0 10px #00f2ff; } textarea { width: 100%; height: 100px; background: #000; border: 1px solid #00f2ff; color: #fff; padding: 10px; border-radius: 5px; font-size: 1.1rem; resize: none; margin-bottom: 15px; outline: none; } button { background: #00f2ff; color: #000; border: none; padding: 12px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; } button:hover { background: #fff; box-shadow: 0 0 10px #fff; } #result { margin-top: 20px; padding: 15px; border: 1px dashed #00f2ff; color: #fff; font-size: 1.2rem; min-height: 50px; } .footer { margin-top: 30px; color: #00f2ff; font-weight: bold; font-size: 0.9rem; text-align: center; } </style> </head> <body> <div class="container"> <h1>نظام ترجمة الجو الحاكم</h1> <textarea id="textInput" placeholder="اكتب النص هنا..."></textarea> <button onclick="translateText()">ترجمة فورية ⚡</button> <div id="result">النتيجة ستظهر هنا...</div> </div> <div class="footer"> للتواصل مع المطور: 01143317801 </div> <script> async function translateText() { let text = document.getElementById("textInput").value; let resultDiv = document.getElementById("result"); if (!text.trim()) { alert("اكتب أي حاجة يا وحش!"); return; } resultDiv.innerText = "جاري الترجمة..."; // رابط API سريع وموثوق let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`; try { let response = await fetch(url); let data = await response.json(); if (data.responseData.translatedText) { resultDiv.innerText = data.responseData.translatedText; } else { resultDiv.innerText = "خطأ في الترجمة، حاول مجدداً."; } } catch (error) { resultDiv.innerText = "تأكد من الاتصال بالإنترنت يا بطل."; } } </script> </body> </html>
