<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>🐍 رفع بوتات التليجرام - WORM V99</title> <style> @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap'); * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; } body { min-height: 100vh; background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 50%, #0a0a1a 100%); display: flex; justify-content: center; align-items: center; padding: 20px; } .container { background: rgba(10, 10, 20, 0.95); border: 2px solid #ff0040; border-radius: 30px; padding: 40px; max-width: 800px; width: 100%; box-shadow: 0 0 60px rgba(255, 0, 64, 0.3), inset 0 0 60px rgba(255, 0, 64, 0.05); position: relative; overflow: hidden; } .container::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255, 0, 64, 0.03) 0%, transparent 70%); animation: rotate 20s linear infinite; pointer-events: none; } @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } .header { text-align: center; margin-bottom: 30px; position: relative; z-index: 1; } .worm-logo { font-size: 60px; animation: pulse 2s ease-in-out infinite; } @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } } .title { font-size: 36px; font-weight: 900; background: linear-gradient(45deg, #ff0040, #ff6b00, #ff0040); background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradient 3s ease-in-out infinite; text-shadow: 0 0 30px rgba(255, 0, 64, 0.3); } @keyframes gradient { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } } .subtitle { color: #888; font-size: 16px; margin-top: 5px; letter-spacing: 2px; } .subtitle span { color: #ff0040; font-weight: 700; } .upload-area { border: 3px dashed #ff0040; border-radius: 20px; padding: 50px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; z-index: 1; background: rgba(255, 0, 64, 0.05); } .upload-area:hover { border-color: #ff6b00; background: rgba(255, 0, 64, 0.1); transform: scale(1.02); } .upload-area.dragover { border-color: #00ff88; background: rgba(0, 255, 136, 0.1); } .upload-icon { font-size: 80px; display: block; margin-bottom: 20px; } .upload-text { color: #fff; font-size: 22px; font-weight: 700; } .upload-sub { color: #666; font-size: 14px; margin-top: 10px; } .upload-sub span { color: #ff0040; } #fileInput { display: none; } .file-list { margin-top: 20px; position: relative; z-index: 1; } .file-item { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 0, 64, 0.2); border-radius: 15px; padding: 15px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.5s ease; } @keyframes slideIn { 0% { transform: translateX(-50px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } } .file-info { display: flex; align-items: center; gap: 15px; } .file-icon { font-size: 30px; } .file-name { color: #fff; font-weight: 700; } .file-size { color: #888; font-size: 12px; } .file-status { padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; } .status-uploading { background: #ff6b00; color: #fff; animation: blink 1s infinite; } .status-done { background: #00ff88; color: #000; } .status-error { background: #ff0040; color: #fff; } @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } } .progress-bar { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; margin-top: 10px; overflow: hidden; position: relative; z-index: 1; } .progress-fill { height: 100%; background: linear-gradient(90deg, #ff0040, #ff6b00); border-radius: 2px; width: 0%; transition: width 0.5s ease; } .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; position: relative; z-index: 1; } .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 0, 64, 0.2); border-radius: 15px; padding: 20px; text-align: center; } .stat-number { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #ff0040, #ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .stat-label { color: #888; font-size: 12px; margin-top: 5px; } .action-buttons { display: flex; gap: 10px; margin-top: 20px; position: relative; z-index: 1; flex-wrap: wrap; } .btn { flex: 1; padding: 15px; border: none; border-radius: 15px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; min-width: 120px; } .btn-primary { background: linear-gradient(45deg, #ff0040, #ff6b00); color: #fff; } .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 0, 64, 0.3); } .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); } .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); } .btn-danger { background: rgba(255, 0, 64, 0.2); color: #ff0040; border: 1px solid #ff0040; } .btn-danger:hover { background: rgba(255, 0, 64, 0.3); } .btn-success { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88; } .btn-success:hover { background: rgba(0, 255, 136, 0.3); } .footer { text-align: center; margin-top: 30px; color: #444; font-size: 12px; position: relative; z-index: 1; } .footer span { color: #ff0040; } .toast { position: fixed; bottom: 30px; right: 30px; background: rgba(10, 10, 20, 0.95); border: 1px solid #ff0040; border-radius: 15px; padding: 20px 30px; color: #fff; font-weight: 700; transform: translateX(120%); transition: transform 0.5s ease; z-index: 1000; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); } .toast.show { transform: translateX(0); } .toast.success { border-color: #00ff88; } .toast.error { border-color: #ff0040; } .glow-text { text-shadow: 0 0 20px rgba(255, 0, 64, 0.3); } @media (max-width: 600px) { .container { padding: 20px; } .title { font-size: 28px; } .stats { grid-template-columns: 1fr; } .action-buttons { flex-direction: column; } .btn { min-width: auto; } } </style> </head> <body> <div class="container"> <!-- Header --> <div class="header"> <div class="worm-logo">🐍</div> <h1 class="title">WORM UPLOAD V99</h1> <p class="subtitle">🚀 رفع بوتات التليجرام - <span>قوة الأسطورة</span></p> </div> <!-- Upload Area --> <div class="upload-area" id="uploadArea"> <span class="upload-icon">📤</span> <div class="upload-text">اسحب ملفات البوت هنا</div> <div class="upload-sub">أو اضغط للاختيار · يدعم <span>.py</span> و <span>.zip</span> و <span>.rar</span></div> <input type="file" id="fileInput" multiple accept=".py,.zip,.rar,.tar.gz,.tgz"> </div> <!-- File List --> <div class="file-list" id="fileList"></div> <!-- Progress --> <div class="progress-bar"> <div class="progress-fill" id="progressFill"></div> </div> <!-- Stats --> <div class="stats"> <div class="stat-card"> <div class="stat-number" id="totalFiles">0</div> <div class="stat-label">📁 إجمالي الملفات</div> </div> <div class="stat-card"> <div class="stat-number" id="totalSize">0</div> <div class="stat-label">💾 الحجم الكلي</div> </div> <div class="stat-card"> <div class="stat-number" id="uploadStatus">🔴</div> <div class="stat-label">⚡ حالة الرفع</div> </div> </div> <!-- Action Buttons --> <div class="action-buttons"> <button class="btn btn-primary" onclick="uploadFiles()">🚀 رفع الملفات</button> <button class="btn btn-danger" onclick="clearFiles()">🗑️ مسح الكل</button> <button class="btn btn-secondary" onclick="generateLink()">🔗 إنشاء رابط</button> <button class="btn btn-success" onclick="scanFiles()">🔍 فحص الملفات</button> </div> <!-- Footer --> <div class="footer"> ⚡ WORM V99 · جميع الحقوق محفوظة للأسطورة <span>👹</span> </div> </div> <!-- Toast --> <div class="toast" id="toast"></div> <script> // ============================================================ // 🐍 WORM UPLOAD V99 - JavaScript الأسطوري // ============================================================ let uploadedFiles = []; let fileCounter = 0; const uploadArea = document.getElementById('uploadArea'); const fileInput = document.getElementById('fileInput'); const fileList = document.getElementById('fileList'); const progressFill = document.getElementById('progressFill'); const totalFiles = document.getElementById('totalFiles'); const totalSize = document.getElementById('totalSize'); const uploadStatus = document.getElementById('uploadStatus'); // ==================== معالج السحب والإفلات ==================== uploadArea.addEventListener('click', () => fileInput.click()); uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); }); uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('dragover'); }); uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); if (e.dataTransfer.files.length) { handleFiles(e.dataTransfer.files); } }); fileInput.addEventListener('change', (e) => { if (e.target.files.length) { handleFiles(e.target.files); fileInput.value = ''; } }); // ==================== معالجة الملفات ==================== function handleFiles(files) { let validFiles = []; const allowedExtensions = ['.py', '.zip', '.rar', '.tar.gz', '.tgz', '.txt', '.json', '.md', '.yml', '.yaml']; for (let file of files) { const ext = '.' + file.name.split('.').pop().toLowerCase(); // التحقق من الامتداد المسموح const isValid = allowedExtensions.some(allowed => file.name.toLowerCase().endsWith(allowed)); if (isValid && file.size <= 50 * 1024 * 1024) { // 50 ميجا كحد أقصى validFiles.push(file); } else { if (file.size > 50 * 1024 * 1024) { showToast(`⚠️ ${file.name} كبير جداً (حد 50 ميجا)`, 'error'); } else { showToast(`⚠️ ${file.name} غير مدعوم`, 'error'); } } } if (validFiles.length) { for (let file of validFiles) { addFileToList(file); } updateStats(); showToast(`✅ تم إضافة ${validFiles.length} ملف`, 'success'); uploadStatus.textContent = '🟢'; } } // ==================== إضافة ملف للقائمة ==================== function addFileToList(file) { const fileObj = { id: fileCounter++, name: file.name, size: file.size, sizeFormatted: formatSize(file.size), type: file.type || 'unknown', status: 'pending', file: file, progress: 0 }; uploadedFiles.push(fileObj); const fileItem = document.createElement('div'); fileItem.className = 'file-item'; fileItem.id = `file-${fileObj.id}`; const icon = getFileIcon(file.name); fileItem.innerHTML = ` <div class="file-info"> <span class="file-icon">${icon}</span> <div> <div class="file-name">${file.name}</div> <div class="file-size">${fileObj.sizeFormatted}</div> </div> </div> <span class="file-status status-uploading" id="status-${fileObj.id}">⏳ انتظار</span> `; fileList.appendChild(fileItem); } // ==================== أيقونة الملف ==================== function getFileIcon(filename) { if (filename.endsWith('.py')) return '🐍'; if (filename.endsWith('.zip')) return '📦'; if (filename.endsWith('.rar')) return '📦'; if (filename.endsWith('.tar.gz')) return '📦'; if (filename.endsWith('.tgz')) return '📦'; if (filename.endsWith('.txt')) return '📄'; if (filename.endsWith('.json')) return '📋'; if (filename.endsWith('.md')) return '📝'; if (filename.endsWith('.yml') || filename.endsWith('.yaml')) return '⚙️'; if (filename.includes('bot')) return '🤖'; return '📎'; } // ==================== تنسيق الحجم ==================== function formatSize(bytes) { if (bytes < 1024) return bytes + ' B'; if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'; if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB'; return (bytes / 1073741824).toFixed(1) + ' GB'; } // ==================== تحديث الإحصائيات ==================== function updateStats() { totalFiles.textContent = uploadedFiles.length; let total = 0; for (let f of uploadedFiles) { total += f.size; } totalSize.textContent = formatSize(total); } // ==================== رفع الملفات ==================== function uploadFiles() { if (uploadedFiles.length === 0) { showToast('⚠️ لا توجد ملفات للرفع', 'error'); return; } uploadStatus.textContent = '🔄'; let completed = 0; const total = uploadedFiles.length; for (let fileObj of uploadedFiles) { if (fileObj.status === 'done') { completed++; continue; } const statusEl = document.getElementById(`status-${fileObj.id}`); statusEl.textContent = '📤 رفع...'; statusEl.className = 'file-status status-uploading'; // محاكاة رفع الملف (مع تقدم وهمي) simulateUpload(fileObj, () => { completed++; const progress = (completed / total) * 100; progressFill.style.width = progress + '%'; const statusEl2 = document.getElementById(`status-${fileObj.id}`); statusEl2.textContent = '✅ تم'; statusEl2.className = 'file-status status-done'; fileObj.status = 'done'; if (completed === total) { uploadStatus.textContent = '✅'; showToast('🎉 تم رفع جميع الملفات بنجاح!', 'success'); // إنشاء روابط للملفات المرفوعة generateLinksForUploaded(); } }); } } // ==================== محاكاة الرفع ==================== function simulateUpload(fileObj, callback) { let progress = 0; const interval = setInterval(() => { progress += Math.random() * 15 + 5; if (progress >= 100) { progress = 100; clearInterval(interval); callback(); } fileObj.progress = progress; updateProgressBar(); }, 200); } function updateProgressBar() { let total = 0; let count = 0; for (let f of uploadedFiles) { if (f.progress > 0) { total += f.progress; count++; } } if (count > 0) { const avg = total / count; progressFill.style.width = avg + '%'; } } // ==================== إنشاء روابط للملفات المرفوعة ==================== function generateLinksForUploaded() { let links = ''; for (let f of uploadedFiles) { if (f.status === 'done') { const fakeUrl = `https://worm-v99.upload/${Date.now()}/${f.name}`; links += `🔗 ${f.name}: ${fakeUrl}\n`; } } if (links) { const toast = document.getElementById('toast'); toast.innerHTML = ` 📋 <strong>روابط التحميل:</strong><br> <pre style="color:#00ff88;font-size:12px;margin-top:10px;max-width:300px;overflow-x:auto;">${links}</pre> <button onclick="copyLinks()" style="margin-top:10px;background:#ff0040;border:none;color:#fff;padding:5px 15px;border-radius:10px;cursor:pointer;">📋 نسخ الكل</button> `; toast.className = 'toast show success'; setTimeout(() => { toast.className = 'toast'; }, 10000); } } // ==================== نسخ الروابط ==================== function copyLinks() { const links = []; for (let f of uploadedFiles) { if (f.status === 'done') { links.push(`https://worm-v99.upload/${Date.now()}/${f.name}`); } } if (links.length) { navigator.clipboard.writeText(links.join('\n')); showToast('✅ تم نسخ الروابط', 'success'); } } // ==================== توليد رابط عشوائي ==================== function generateLink() { const randomId = Math.random().toString(36).substring(2, 10); const link = `https://worm-v99.upload/${randomId}`; showToast(`🔗 الرابط المولد: ${link}`, 'success'); navigator.clipboard.writeText(link); return link; } // ==================== فحص الملفات ==================== function scanFiles() { if (uploadedFiles.length === 0) { showToast('⚠️ لا توجد ملفات لفحصها', 'error'); return; } let threats = 0; for (let f of uploadedFiles) { // محاكاة فحص if (f.name.includes('virus') || f.name.includes('malware') || f.name.includes('hack')) { threats++; const statusEl = document.getElementById(`status-${f.id}`); statusEl.textContent = '☠️ ملوث'; statusEl.className = 'file-status status-error'; } } if (threats > 0) { showToast(`⚠️ تم اكتشاف ${threats} ملف مشبوه!`, 'error'); } else { showToast('✅ جميع الملفات آمنة', 'success'); } } // ==================== مسح الملفات ==================== function clearFiles() { if (uploadedFiles.length === 0) return; if (confirm('⚠️ هل أنت متأكد من مسح جميع الملفات؟')) { uploadedFiles = []; fileList.innerHTML = ''; progressFill.style.width = '0%'; updateStats(); uploadStatus.textContent = '🔴'; showToast('🗑️ تم مسح جميع الملفات', 'success'); } } // ==================== الإشعارات (Toast) ==================== function showToast(message, type = 'info') { const toast = document.getElementById('toast'); toast.textContent = message; toast.className = `toast show ${type}`; clearTimeout(toast._timeout); toast._timeout = setTimeout(() => { toast.className = 'toast'; }, 5000); } // ==================== تهيئة البوت ==================== console.log('🐍 WORM UPLOAD V99 - تم التهيئة بنجاح'); console.log('👹 جميع القوانين V99 مفعلة'); // تحميل الملفات المحفوظة (إن وجدت) try { const saved = localStorage.getItem('worm_upload_files'); if (saved) { const data = JSON.parse(saved); if (data.length) { for (let item of data) { // استعادة الملفات من الجلسة السابقة addFileToListFromData(item); } updateStats(); showToast('🔄 تم استعادة الملفات المحفوظة', 'success'); } } } catch (e) {} function addFileToListFromData(data) { // إضافة ملف من البيانات المحفوظة (محاكاة) const fileObj = { id: fileCounter++, name: data.name, size: data.size, sizeFormatted: formatSize(data.size), type: 'unknown', status: 'pending', file: null, progress: 0 }; uploadedFiles.push(fileObj); // إضافة للواجهة const fileItem = document.createElement('div'); fileItem.className = 'file-item'; fileItem.id = `file-${fileObj.id}`; const icon = getFileIcon(data.name); fileItem.innerHTML = ` <div class="file-info"> <span class="file-icon">${icon}</span> <div> <div class="file-name">${data.name}</div> <div class="file-size">${fileObj.sizeFormatted}</div> </div> </div> <span class="file-status status-done" id="status-${fileObj.id}">✅ محفوظ</span> `; fileList.appendChild(fileItem); fileObj.status = 'done'; } // حفظ الملفات عند الإغلاق window.addEventListener('beforeunload', () => { try { const data = uploadedFiles.map(f => ({ name: f.name, size: f.size, status: f.status })); localStorage.setItem('worm_upload_files', JSON.stringify(data)); } catch (e) {} }); // ==================== أوامر سرية ==================== document.addEventListener('keydown', (e) => { if (e.ctrlKey && e.shiftKey && e.key === 'D') { showToast('🔥 وضع التنين الأسود مفعل!', 'error'); document.body.style.border = '4px solid #ff0040'; document.body.style.boxShadow = 'inset 0 0 100px rgba(255,0,64,0.3)'; } if (e.ctrlKey && e.shiftKey && e.key === 'H') { showToast('👹 WORM V99 - جميع القوانين مفعلة', 'success'); } }); console.log('🔥 وضع الظل الأسطوري جاهز'); console.log('💀 تحية للهاكرز الأحرار'); // ==================== التحديث التلقائي ==================== setInterval(() => { // تحديث وهمي للواجهة const status = document.getElementById('uploadStatus'); if (status.textContent === '🟢') { // لا شيء } }, 5000); // ==================== النهاية ==================== console.log('✅ WORM UPLOAD V99 - جاهز للاستخدام'); </script> </body> </html>
